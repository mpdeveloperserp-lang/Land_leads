<style>
  :root{
    --navy:#1B2A4A; --navy-light:#28406e; --gold:#B8912F; --gold-light:#e6c874;
    --teal:#1F6F6B; --teal-light:#2c9a94;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#1F2430; --muted:#6B7280; --border:#E3E6EC;
    --danger:#C0392B; --danger-bg:#FBEAE8; --warn:#B8720A; --warn-bg:#FCF0DC; --ok:#22785A; --ok-bg:#E4F3EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{width:212px;flex:0 0 212px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-brand{padding:18px 20px 16px;border-bottom:1px solid var(--border);}
  .sidebar-brand .co{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:700;}
  .sidebar-brand .title{display:block;font-size:15.5px;font-weight:700;color:var(--navy);margin-top:3px;line-height:1.3;}
  .sidebar nav{display:flex;flex-direction:column;gap:1px;padding:10px 0;flex:1;}
  .sidebar nav button{background:none;border:none;text-align:left;padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-left:3px solid transparent;width:100%;}
  .sidebar nav button:hover{background:#F6F8FB;color:var(--navy);}
  .sidebar nav button.active{color:var(--navy);background:#EEF2F8;border-left-color:var(--gold);}
  .nav-sub{display:flex;flex-direction:column;}
  .nav-sub button{padding:8px 20px 8px 34px;font-size:12.5px;font-weight:500;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:5px;width:27px;height:27px;font-size:13px;line-height:1;cursor:pointer;margin-right:4px;color:var(--muted);}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-del:hover{border-color:var(--danger);color:var(--danger);}
  .icon-ok{color:var(--ok);border-color:#bfe3d1;}
  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid var(--border);}
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:15px 26px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .page-title{font-size:17px;font-weight:700;color:var(--navy);}
  main{padding:20px 26px 60px;max-width:1500px;width:100%;margin:0 auto;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-gold{background:var(--gold);color:#2b2200;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-light);}
  .btn-ghost{background:var(--border);color:var(--text);}
  .btn-ghost:hover{background:#d8dce4;}
  .btn-ghost:disabled{opacity:.45;cursor:default;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;}
  .banner{background:var(--warn-bg);border:1px solid #edd9ab;color:#6b4c05;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .banner b{color:var(--navy);}
  .banner button{background:none;border:none;color:#6b4c05;font-weight:700;cursor:pointer;font-size:16px;line-height:1;}
  .grid{display:grid;gap:14px;}
  .cards4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat{cursor:pointer;transition:.15s;}
  .stat:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .stat .value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .page-header h1{font-size:19px;color:var(--navy);margin:0;}
  h2.section-title{font-size:15px;color:var(--navy);margin:26px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;}
  h2.section-title .tag{background:var(--teal);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;background:#F8F9FB;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);}
  table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table tr.clickable-row:hover{background:#F6F8FB;cursor:pointer;}
  table.leads-table th:first-child, table.leads-table td:first-child{width:30px;text-align:center;padding-right:0;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-navy{background:#e7ecf5;color:var(--navy);}
  .badge-gold{background:#faf1da;color:#8a6a10;}
  .badge-muted{background:#eef0f3;color:var(--muted);}
  .conn-dot{display:inline-flex;align-items:center;gap:5px;}
  .funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;cursor:pointer;padding:3px;border-radius:6px;}
  .funnel-row:hover{background:#F6F8FB;}
  .funnel-row .flabel{width:170px;flex:0 0 170px;color:var(--navy);font-weight:600;}
  .funnel-row .fbar-wrap{flex:1;background:#eceff3;border-radius:6px;overflow:hidden;height:22px;position:relative;}
  .funnel-row .fbar{background:linear-gradient(90deg,var(--teal),var(--navy));height:100%;border-radius:6px;}
  .funnel-row .fcount{width:34px;text-align:right;font-weight:700;color:var(--navy);}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
  .col{background:#EAEDF2;border-radius:10px;padding:10px;min-width:250px;flex:0 0 250px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--navy);padding:4px 6px 10px;}
  .col-head .count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;}
  .lead-card{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;border:1px solid var(--border);border-left:4px solid var(--teal);cursor:pointer;font-size:12.5px;}
  .lead-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .lead-card .lid{font-weight:700;color:var(--navy);font-size:12px;}
  .lead-card .vil{font-weight:600;margin:2px 0;}
  .lead-card .meta{color:var(--muted);font-size:11.5px;}
  .lead-card .badges{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input, .toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .toolbar input[type=text]{min-width:220px;}
  .filter-panel{margin-bottom:14px;}
  .filter-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .index-nav{display:flex;gap:2px;flex-wrap:wrap;}
  .idx-btn{border:1px solid var(--border);background:#fff;padding:4px 7px;font-size:11px;border-radius:4px;cursor:pointer;color:var(--muted);font-weight:600;}
  .idx-btn:hover{border-color:var(--teal);color:var(--teal);}
  .idx-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pagination{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:8px;}
  .page-btns{display:flex;gap:6px;align-items:center;}
  .page-num{font-weight:700;color:var(--navy);padding:0 6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{background:var(--navy);color:#fff;padding:16px 22px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-head .x{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.8;}
  .modal-body{padding:20px 22px;max-height:75vh;overflow-y:auto;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  input[type=text],input[type=date],input[type=number],input[type=datetime-local],input[type=file],select,textarea{
    width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);
  }
  input[type=file]{padding:6px;font-size:12px;}
  textarea{resize:vertical;min-height:44px;}
  .field-pair{display:flex;gap:6px;}
  .field-pair input{flex:1;}
  .field-pair select{flex:0 0 100px;}
  .computed{font-size:11.5px;color:var(--teal);margin-top:3px;font-weight:600;}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 0 16px;}
  legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  .stage-track{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .stage-pill{padding:6px 12px;border-radius:16px;font-size:11.5px;font-weight:700;background:#eceff3;color:var(--muted);border:1px solid transparent;}
  .stage-pill.done{background:var(--ok-bg);color:var(--ok);}
  .stage-pill.now{background:var(--navy);color:#fff;}
  .modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;border-radius:0 0 12px 12px;}
  .history-item{border-left:2px solid var(--border);padding:2px 0 10px 14px;margin-left:4px;position:relative;font-size:12.5px;}
  .history-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .history-item .when{color:var(--muted);font-size:11px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row a{color:var(--teal);text-decoration:none;font-weight:600;}
  .inline-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .inline-add input, .inline-add select{flex:1;min-width:120px;}
  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0;}
  .setup-code{background:#111827;color:#d1e7ff;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre;}
  .callitem{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer;border-radius:4px;}
  .callitem:hover{background:#F6F8FB;}
  .callitem:last-child{border-bottom:none;}
  .clickable-row:hover{cursor:pointer;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} .app-shell{flex-direction:column;} .sidebar{position:static;height:auto;width:100%;flex:0 0 auto;}}
  .footer-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:40px;}
</style>
</head>

<script>
/* =========================================================================
   LAND LEADS ERP — WORKING MODEL
   MP Developers | Built to accompany "Land Leads ERP — Recommendations & Roadmap"

   This version is wired to real Firebase: Firestore for the leads and every
   master list (channel partners, villages, executives, land classifications,
   drop/on-hold reasons, lead sources), and Storage for document uploads.

   >>> TO GO LIVE: paste your Firebase project config into FIREBASE_CONFIG
   below. Until you do, or if the SDK can't load, the app runs on an
   in-memory demo (MemoryDB) automatically, so it's always usable. <<<
   ========================================================================= */

// ---- 1. YOUR FIREBASE CONFIG -------------------------------------------
// Replace with the config object from Firebase Console → Project Settings →
// General → Your apps → SDK setup and configuration. Client-side Firebase
// config is not a secret — access is controlled by your Firestore/Storage
// security rules (in the Firebase Console), not by hiding this.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAe_9Y00TN7NfggpYELdQulpXgCUW7CwZ0",
  authDomain: "mp-land-leads.firebaseapp.com",
  projectId: "mp-land-leads",
  storageBucket: "mp-land-leads.firebasestorage.app",
  messagingSenderId: "933967050983",
  appId: "1:933967050983:web:1d3c969ee547c9d92e0a42"
};

// ---- Pipeline stages ------------------------------------------------------
// The stage KEYS and their order are fixed by the process (the stage-gating
// rules below refer to specific keys), but each stage's Label and SLA (days)
// are admin-editable on the Masters page — see the "Stages / Pipeline"
// master. STAGES is recomputed from DB via refreshStagesFromDB() at boot and
// whenever the Stages master is saved.
const STAGE_KEYS = ['new','contacted','site_visited','under_eval','doc_legal','negotiation','closed'];
const DEFAULT_STAGE_CONFIG = [
  { key:'new',            label:'New',                    sla:2  },
  { key:'contacted',      label:'Contacted',               sla:7  },
  { key:'site_visited',   label:'Site Visited',            sla:5  },
  { key:'under_eval',     label:'Under Evaluation',        sla:14 },
  { key:'doc_legal',      label:'Documentation & Legal',   sla:10 },
  { key:'negotiation',    label:'Negotiation',             sla:14 },
  { key:'closed',         label:'Closed',                  sla:null },
];
let STAGES = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
let STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
const stageLabel = k => (STAGES.find(s=>s.key===k)||{}).label || k;
function refreshStagesFromDB(){
  const rows = (DB && DB.getStages) ? DB.getStages() : null;
  STAGES = STAGE_KEYS.map(k=>{
    const stored = rows && rows.find(r=>r.key===k);
    const def = DEFAULT_STAGE_CONFIG.find(d=>d.key===k);
    return { key:k, label: (stored && stored.label) || def.label, sla: stored && stored.sla!=null ? stored.sla : def.sla };
  });
  STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
}
const EXTENT_UNITS = { acre:{label:'Acre',sqft:43560}, ground:{label:'Ground',sqft:2400}, cent:{label:'Cent',sqft:435.6}, sqft:{label:'Sqft',sqft:1} };
const FEAS_STATUSES = ['Not Started','In Progress','Cleared','Failed'];
const PAGE_TITLES = { dashboard:'Dashboard', progress:'Progress Details', list:'All Leads', reports:'Reports', configure:'Configure — Lead Fields', masters:'Masters' };
const KNOWN_VIEWS = Object.keys(PAGE_TITLES);

// ---- Lead field configuration (drives the New Lead form + list filters) ----
// Admin-editable on the Configure page: Visible/Mandatory/Filter per field.
const DEFAULT_FIELD_CONFIG = [
  { field:'leadSourceDateTime', label:'Lead Source Date/Time', visible:true, mandatory:true,  filter:false },
  { field:'leadSource',         label:'Lead Source',            visible:true, mandatory:true,  filter:true  },
  { field:'channelPartnerCode', label:'Channel Partner',        visible:true, mandatory:false, filter:true  },
  { field:'assignedExecutive',  label:'Assigned Executive',     visible:true, mandatory:false, filter:true  },
  { field:'village',            label:'Village Name',           visible:true, mandatory:true,  filter:false },
  { field:'surveyNumber',       label:'Survey Number(s)',       visible:true, mandatory:false, filter:false },
  { field:'siteLocation',       label:'Site Location',          visible:true, mandatory:false, filter:false },
  { field:'googlePin',          label:'Google Pin / Coordinates', visible:true, mandatory:false, filter:false },
  { field:'landClassification', label:'Land Classification',    visible:true, mandatory:false, filter:false },
  { field:'extent',             label:'Total Land Extent',      visible:true, mandatory:true,  filter:false },
  { field:'price',              label:'Quoted Price',           visible:true, mandatory:true,  filter:false },
  { field:'landownerName',      label:'Landowner Name',         visible:true, mandatory:false, filter:false },
  { field:'landownerPhone',     label:'Landowner Phone',        visible:true, mandatory:false, filter:false },
  { field:'mediatorName',       label:'Mediator / Broker Name', visible:true, mandatory:false, filter:false },
  { field:'nextCallDate',       label:'Next Call Date',         visible:true, mandatory:false, filter:false },
];
// Maps each configurable field to the New Lead form input(s) it controls.
const FIELD_TO_INPUT = {
  leadSourceDateTime:['nl-datetime'], leadSource:['nl-source'], channelPartnerCode:['nl-cp'],
  assignedExecutive:['nl-exec'], village:['nl-village'], surveyNumber:['nl-survey'],
  siteLocation:['nl-loc'], googlePin:['nl-pin'], landClassification:['nl-class'],
  extent:['nl-extent-val'], price:['nl-price-val'],
  landownerName:['nl-owner-name'], landownerPhone:['nl-owner-phone'],
  mediatorName:['nl-med-name'], nextCallDate:['nl-nextcall'],
};

// ---- Master data definitions --------------------------------------------
// Every one of these is a real, admin-editable master (see the Masters tab),
// backed by its own Firestore collection when live. Dropdowns throughout the
// app read from these — nothing business-specific is hardcoded anymore.
const MASTER_DEFS = [
  { key:'leadSources',     label:'Lead Sources',          collection:'m_lead_sources',     fields:['label'] },
  { key:'channelPartners', label:'Channel Partners',      collection:'m_channel_partners', fields:['code','name','phone','commissionPct'] },
  { key:'villages',        label:'Villages / Locations',  collection:'m_villages',         fields:['name','taluk','district'] },
  { key:'executives',      label:'Executives / Users',    collection:'m_executives',       fields:['name','phone','role'] },
  { key:'landClasses',     label:'Land Classifications',  collection:'m_land_classes',     fields:['label'] },
  { key:'dropReasons',     label:'Dropped Reasons',       collection:'m_drop_reasons',     fields:['label'] },
  { key:'holdReasons',     label:'On-Hold Reasons',       collection:'m_hold_reasons',     fields:['label'] },
];
const FIELD_LABELS = { label:'Label', code:'Code', name:'Name', phone:'Phone', commissionPct:'Commission %', taluk:'Taluk', district:'District', role:'Role' };

function seedMaster(key){
  const data = {
    leadSources: ['Website Enquiry','Channel Partner','Direct / Walk-in','Referral','Field Survey','Cold Call','Other'].map(label=>({label})),
    channelPartners: [
      {code:'CP-007', name:'Anand Associates', phone:'9840012345', commissionPct:1.5},
      {code:'CP-014', name:'Elite Land Brokers', phone:'9884098840', commissionPct:2},
    ],
    villages: ['Oragadam','Guduvancheri','Thiruporur','Sriperumbudur','Mahabalipuram','Chengalpattu','Padappai','Vandalur'].map(name=>({name, taluk:'', district:'Chennai / Kancheepuram'})),
    executives: [
      {name:'Karthik R', phone:'', role:'Land Executive'},
      {name:'Divya S', phone:'', role:'Land Executive'},
    ],
    landClasses: ['Agricultural','DTCP Approved Layout','Patta Land','Government Land','Disputed / Litigation','Other'].map(label=>({label})),
    dropReasons: ['Price mismatch','Title / legal issue','Owner unwilling','Land unsuitable (technical)','Budget not approved','Lost to competitor','Other'].map(label=>({label})),
    holdReasons: ['Awaiting owner decision','Budget deferred','Litigation pending','Awaiting documents','Other'].map(label=>({label})),
  };
  return data[key] || [];

const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };

// =========================================================================
// DATA LAYER — two implementations behind the same interface:
//   getLeads(), getLead(id), addLead(lead), updateLead(id,patch)
//   getMasters(key) [active only], getAllMasters(key), addMaster(key,fields),
//   updateMaster(key,id,patch), toggleMaster(key,id)
//   isLive(), hasStorage(), storageRef(path) [Firestore version only]
// =========================================================================

class MemoryDB {
  constructor(){
    this.leads = seedLeads().map(l => Object.assign({ id: l.leadId }, l));
    this.masters = {};
    MASTER_DEFS.forEach(m => {
      this.masters[m.key] = seedMaster(m.key).map((f,i) => Object.assign({ id: 'seed-'+m.key+'-'+i, active:true }, f));
    });
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
  }
  async init(){ /* nothing to load — already seeded in memory */ }
  ready(){ return Promise.resolve(); }
  isLive(){ return false; }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){ const withId = Object.assign({}, lead, { id: lead.leadId }); this.leads.unshift(withId); }
  async updateLead(id, patch){ const i=this.leads.findIndex(l=>l.id===id); if(i>-1) this.leads[i]=Object.assign({}, this.leads[i], patch, {updatedAt:new Date().toISOString()}); }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }
  getAllMasters(key){ return this.masters[key]||[]; }
  async addMaster(key, fields){ this.masters[key].push(Object.assign({ id: uid('M'), active:true }, fields)); }
  async updateMaster(key, id, patch){ const arr=this.masters[key]; const i=arr.findIndex(m=>m.id===id); if(i>-1) arr[i]=Object.assign({}, arr[i], patch); }
  async toggleMaster(key, id){ const arr=this.masters[key]; const cur=arr.find(m=>m.id===id); if(cur) await this.updateMaster(key,id,{active: !(cur.active!==false)}); }
  async deleteMaster(key, id){ this.masters[key] = (this.masters[key]||[]).filter(m=>m.id!==id); }
  getFieldConfig(){ return this.fieldConfig; }
  async saveFieldConfig(rows){ this.fieldConfig = rows.map(r=>Object.assign({}, r)); }
  getStages(){ return this.stages; }
  async saveStages(rows){ this.stages = rows.map(r=>Object.assign({}, r)); }
}

class FirestoreDB {
  constructor(fsdb, storage){
    this.fsdb = fsdb;
    this.storage = storage;
    this.leads = [];
    this.masters = {};
    MASTER_DEFS.forEach(m => this.masters[m.key] = []);
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
    this._onChange = null;
    this._pending = new Set(['leads', 'fieldConfig', 'stages', ...MASTER_DEFS.map(m=>'master:'+m.key)]);
    this._readyResolvers = [];
  }
  onChange(cb){ this._onChange = cb; }
  _markReady(tag){
    this._pending.delete(tag);
    if(this._pending.size===0){ this._readyResolvers.forEach(r=>r()); this._readyResolvers = []; }
  }
  ready(){ return this._pending.size===0 ? Promise.resolve() : new Promise(res=>this._readyResolvers.push(res)); }
  isLive(){ return true; }
  hasStorage(){ return !!this.storage; }
  storageRef(path){ return this.storage.ref(path); }

  async init(){
    // One-time seed of each master collection if it's empty, so a freshly
    // connected project isn't blank.
    for(const m of MASTER_DEFS){
      const snap = await this.fsdb.collection(m.collection).limit(1).get();
      if(snap.empty){
        const seed = seedMaster(m.key);
        const batch = this.fsdb.batch();
        seed.forEach(f=>{
          const ref = this.fsdb.collection(m.collection).doc();
          batch.set(ref, Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, f));
        });
        await batch.commit();
      }
    }
    // One-time seed of sample leads if the leads collection is empty.
    const leadSnap = await this.fsdb.collection('leads').limit(1).get();
    if(leadSnap.empty){
      const seed = seedLeads();
      const batch = this.fsdb.batch();
      seed.forEach(lead=>{
        const ref = this.fsdb.collection('leads').doc();
        batch.set(ref, Object.assign({}, lead, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      });
      await batch.commit();
    }
    // One-time seed of the lead field configuration doc if it doesn't exist yet.
    const fcRef = this.fsdb.collection('settings').doc('leadFieldConfig');
    const fcSnap = await fcRef.get();
    if(!fcSnap.exists){ await fcRef.set({ rows: DEFAULT_FIELD_CONFIG }); }
    fcRef.onSnapshot(snap=>{
      this.fieldConfig = (snap.data() && snap.data().rows) || DEFAULT_FIELD_CONFIG;
      this._markReady('fieldConfig');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('fieldConfig listener error', err); this._markReady('fieldConfig'); });

    // One-time seed of the stages doc if it doesn't exist yet.
    const stRef = this.fsdb.collection('settings').doc('stages');
    const stSnap = await stRef.get();
    if(!stSnap.exists){ await stRef.set({ rows: DEFAULT_STAGE_CONFIG }); }
    stRef.onSnapshot(snap=>{
      this.stages = (snap.data() && snap.data().rows) || DEFAULT_STAGE_CONFIG;
      this._markReady('stages');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('stages listener error', err); this._markReady('stages'); });

    // Live listeners keep local caches (and the UI) in sync with Firestore.
    this.fsdb.collection('leads').orderBy('createdAt','desc').onSnapshot(snap=>{
      this.leads = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      this._markReady('leads');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('leads listener error', err); this._markReady('leads'); });

    MASTER_DEFS.forEach(m=>{
      this.fsdb.collection(m.collection).onSnapshot(snap=>{
        this.masters[m.key] = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
        this._markReady('master:'+m.key);
        if(this._onChange) this._onChange();
      }, err=>{ console.error(m.key+' listener error', err); this._markReady('master:'+m.key); });
    });
  }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){
    await this.fsdb.collection('leads').add(Object.assign({}, lead, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  async updateLead(id, patch){
    await this.fsdb.collection('leads').doc(id).update(Object.assign({}, patch, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }
  getAllMasters(key){ return this.masters[key]||[]; }
  async addMaster(key, fields){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, fields));
  }
  async updateMaster(key, id, patch){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).doc(id).update(patch);
  }
  async toggleMaster(key, id){
    const cur = this.masters[key].find(m=>m.id===id);
    await this.updateMaster(key, id, { active: !(cur && cur.active!==false) });
  }
  async deleteMaster(key, id){
    const def = MASTER_DEFS.find(m=>m.key===key);
    await this.fsdb.collection(def.collection).doc(id).delete();
  }
  getFieldConfig(){ return this.fieldConfig; }
  async saveFieldConfig(rows){ await this.fsdb.collection('settings').doc('leadFieldConfig').set({ rows }); }
  getStages(){ return this.stages; }
  async saveStages(rows){ await this.fsdb.collection('settings').doc('stages').set({ rows }); }
}

// ---- Boot: pick MemoryDB or FirestoreDB, then render --------------------
let DB = null;
let currentDetailLeadId = null;

function showConnectionBadge(live, note){
  const el = document.getElementById('conn-badge');
  if(!el) return;
  el.innerHTML = live
    ? '<span class="badge badge-ok conn-dot">● Firebase Connected</span>'
    : '<span class="badge badge-warn conn-dot" title="'+(note?String(note).replace(/"/g,'\''):'Add your Firebase config near the top of this file.')+'">● Demo Mode</span>';
}

function renderDemoBanner(show, note){
  const holder = document.getElementById('banner-holder');
  if(!show){ holder.innerHTML=''; return; }
  holder.innerHTML = `<div class="banner"><div><b>Running in demo mode</b> — data is in-memory and resets on refresh.${note?(' ('+note+')'):''} Check your FIREBASE_CONFIG and Firestore/Storage rules to make this persistent again.</div><button id="banner-x">&times;</button></div>`;
  const x = document.getElementById('banner-x');
  if(x) x.onclick = () => { holder.innerHTML=''; };
}

async function boot(){
  const cfg = FIREBASE_CONFIG;
  const isPlaceholder = !cfg || !cfg.apiKey || cfg.apiKey.indexOf('REPLACE_ME') !== -1;
  const sdkLoaded = typeof firebase !== 'undefined';

  if(!isPlaceholder && sdkLoaded){
    try{
      firebase.initializeApp(cfg);
      const fsdb = firebase.firestore();
      const storage = (typeof firebase.storage === 'function') ? firebase.storage() : null;
      DB = new FirestoreDB(fsdb, storage);
      DB.onChange(()=>{
        refreshStagesFromDB();
        render();
        if(currentDetailLeadId && document.getElementById('overlay')) renderDetailModal(currentDetailLeadId);
      });
      await DB.init();
      await DB.ready();
      showConnectionBadge(true);
      renderDemoBanner(false);
    }catch(err){
      console.error('Firebase init failed — falling back to demo mode.', err);
      DB = new MemoryDB();
      await DB.init();
      showConnectionBadge(false, err.message);
      renderDemoBanner(true, 'connection error: ' + err.message);
    }
  } else {
    DB = new MemoryDB();
    await DB.init();
    showConnectionBadge(false, isPlaceholder ? 'no Firebase config set yet' : 'SDK did not load');
    renderDemoBanner(true, isPlaceholder ? 'no Firebase config set yet' : 'the Firebase SDK did not load');
  }
  document.getElementById('footer-note').textContent = DB.isLive()
    ? 'Connected to Firebase — leads, masters, and documents are persisted live.'
    : 'Demo mode — check your FIREBASE_CONFIG to wire this to your own Firestore project.';
  refreshStagesFromDB();
  render();
}

// ---- Derived calculations ----------------------------------------------
function leadExtentSqft(l){ return extentSqft(l.extentValue, l.extentUnit); }
function leadPricePerSqft(l){ return pricePerSqft(l.priceValue, l.priceUnit); }
function leadValue(l){ return leadExtentSqft(l) * leadPricePerSqft(l); }
function isClosed(l){ return l.stage==='closed'; }
function isActive(l){ return !isClosed(l); }
function daysInStage(l){
  const last = l.stageHistory && l.stageHistory.length ? l.stageHistory[l.stageHistory.length-1] : null;
  const since = last ? new Date(last.at) : new Date(l.createdAt);
  return daysBetween(since, new Date());
}
function isOverdueStage(l){
  const st = STAGES.find(s=>s.key===l.stage);
  if(!st || st.sla==null) return false;
  return daysInStage(l) > st.sla;
}
function callBadgeInfo(l){
  if(!l.nextCallDate) return null;
  const d = new Date(l.nextCallDate); const t = new Date(todayStr());
  const diff = daysBetween(t, d);
  if(diff < 0) return {type:'danger', text:'Overdue ' + Math.abs(diff) + 'd'};
  if(diff === 0) return {type:'warn', text:'Due today'};
  return {type:'muted', text:'In ' + diff + 'd'};
}
function leadMatchesFilters(l, f){
  if(f.stage && l.stage !== f.stage) return false;
  if(f.excludeClosed && l.stage === 'closed') return false;
  if(f.source && l.leadSource !== f.source) return false;
  if(f.channelPartner && l.channelPartnerCode !== f.channelPartner) return false;
  if(f.exec && l.assignedExecutive !== f.exec) return false;
  if(f.dateFrom){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d < f.dateFrom) return false; }
  if(f.dateTo){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d > f.dateTo) return false; }
  if(f.onHold && !(l.onHold && l.onHold.active)) return false;
  if(f.callDueOrOverdue && !(l.nextCallDate && new Date(l.nextCallDate) <= new Date(todayStr()))) return false;
  if(f.letter){ const v=(l.village||'').trim().toUpperCase(); if(!v.startsWith(f.letter)) return false; }
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [l.leadId,l.village,l.siteLocation,l.landownerName,l.surveyNumber].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

  const overdueCalls = leads.filter(l=>isActive(l) && l.nextCallDate && new Date(l.nextCallDate) < new Date(todayStr()));
  const dueToday = leads.filter(l=>isActive(l) && l.nextCallDate === todayStr());
  const ageingAlerts = active.filter(isOverdueStage);

// ---- Export helpers -------------------------------------------------------
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(','))).join('\n');
}
// ---- Generic row exporters (used by the Reports page) --------------------
function exportRowsExcel(rows, filename, sheetName){
  if(!rows.length){ alert('Nothing to export.'); return; }
  if(typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName||'Sheet1');
    XLSX.writeFile(wb, filename);
  } else {
    downloadBlob(toCSV(rows), filename.replace(/\.xlsx$/,'.csv'), 'text/csv;charset=utf-8;');
    alert('The Excel library did not load (likely offline) — downloaded a CSV instead, which opens fine in Excel.');
  }
}
function exportRowsPDF(rows, filename, title){
  if(!rows.length){ alert('Nothing to export.'); return; }
  const columns = Object.keys(rows[0]);
  if(typeof window.jspdf !== 'undefined'){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14); doc.text(title, 14, 16);
    doc.setFontSize(9); doc.setTextColor(120); doc.text(new Date().toLocaleString('en-IN'), 14, 22); doc.setTextColor(0);
    doc.autoTable({ startY:28, head:[columns], body: rows.map(r=>columns.map(c=>r[c])), styles:{fontSize:8}, headStyles:{fillColor:[27,42,74]} });
    doc.save(filename);
  } else {
    alert("The PDF library did not load (likely offline) — using your browser's Print dialog instead. Choose \"Save as PDF\" as the destination.");
    window.print();
  }
}

// Stages is a special "master": the seven pipeline stages are structurally
// fixed (workflow rules refer to specific stage keys, and every lead's
// history refers to them), so this only lets Sara rename each stage and
// adjust its SLA (days) — no add/delete/reorder, unlike the other masters.
function renderStagesMaster(){
  const rows = STAGES.map((s,i)=>`<tr>
      <td>${s.key}</td>
      <td><input type="text" id="stg-label-${i}" value="${s.label}"></td>
      <td><input type="number" id="stg-sla-${i}" value="${s.sla==null?'':s.sla}" placeholder="none" style="max-width:100px;"></td>
    </tr>`).join('');
  return `
    <div class="page-header"><h1>Masters</h1></div>
    <div class="card filter-panel">
      <div class="form-grid">
        <div><label>Master Table</label><select id="master-select">
          ${MASTER_DEFS.map(m=>`<option value="${m.key}">${m.label}</option>`).join('')}
          <option value="${STAGES_MASTER_KEY}" selected>Stages / Pipeline</option>
        </select></div>
      </div>
      <div class="filter-actions"><button class="btn btn-sm btn-teal" id="master-go">Go</button></div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">The stage sequence itself is fixed by the workflow rules (approvals, SLA ageing, lead history all refer to it) — you can rename each stage and adjust its SLA, but stages can't be added, removed, or reordered here.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr><th>Key</th><th>Label</th><th>SLA (days)</th></tr>
        ${rows}
      </table>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="stages-save">Save Stages</button></div>
  `;
}

function wireMastersEvents(){
  const sel = document.getElementById('master-select');
  const switchMaster = () => { currentMasterKey = sel.value; editingMasterId=null; render(); };
  const goBtn = document.getElementById('master-go');
  if(goBtn) goBtn.onclick = switchMaster;
  if(sel) sel.addEventListener('change', switchMaster);

  if(currentMasterKey === STAGES_MASTER_KEY){
    const saveBtn = document.getElementById('stages-save');
    if(saveBtn) saveBtn.onclick = async () => {
      const rows = STAGES.map((s,i)=>({
        key: s.key,
        label: (document.getElementById('stg-label-'+i).value || s.label).trim(),
        sla: document.getElementById('stg-sla-'+i).value === '' ? null : parseInt(document.getElementById('stg-sla-'+i).value,10),
      }));
      await DB.saveStages(rows);
      refreshStagesFromDB();
      render();
    };
    return;
  }

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.edit; render(); });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleMaster(currentMasterKey, b.dataset.toggle); render(); });
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this entry permanently? This cannot be undone.')) return;
    await DB.deleteMaster(currentMasterKey, b.dataset.delete);
    if(editingMasterId===b.dataset.delete) editingMasterId=null;
    render();
  });
  const saveBtn = document.getElementById('master-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const fields = {};
    let ok = true;
    def.fields.forEach(f=>{
      const el = document.getElementById('mf-'+f);
      let v = el.value.trim();
      if(f==='commissionPct') v = v==='' ? null : parseFloat(v);
      if(f===def.fields[0] && v==='' ) ok = false;
      fields[f] = v;
    });
    if(!ok){ alert('The first field is required.'); return; }
    if(editingMasterId){ await DB.updateMaster(currentMasterKey, editingMasterId, fields); editingMasterId=null; }
    else { await DB.addMaster(currentMasterKey, fields); }
    render();
  };
  const cancelBtn = document.getElementById('master-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

function renderStageTab(l){
  const idx = STAGE_INDEX[l.stage];
  const next = STAGES[idx+1];
  const canGoBack = idx > 0;
  const holdReasons = DB.getMasters('holdReasons');
  const dropReasons = DB.getMasters('dropReasons');

  const holdBlock = `
    <fieldset>
      <legend>On Hold</legend>
      ${l.onHold && l.onHold.active ? `
        <p style="font-size:13px;">Currently on hold since ${fmtDate(l.onHold.since)} — <b>${l.onHold.reasonCode}</b>${l.onHold.notes?': '+l.onHold.notes:''}</p>
        <button class="btn btn-sm btn-teal" id="resume-btn">Resume (clear hold)</button>
      ` : `
        <div class="form-grid">
          <div><label>Reason</label><select id="hold-reason">${holdReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
          <div><label>Notes</label><input type="text" id="hold-notes"></div>
        </div>
        <button class="btn btn-sm btn-ghost" id="hold-btn" style="margin-top:8px;">Put On Hold</button>
      `}
    </fieldset>`;

  let gateBlock = '';
  if(next && next.key==='negotiation'){
    gateBlock = `<fieldset><legend>Gate: Approval to enter Negotiation</legend>
      <div class="form-grid">
        <div><label>Approved by</label><input type="text" id="gate-approver" placeholder="Manager name"></div>
        <div><label>Remarks</label><input type="text" id="gate-remarks"></div>
      </div>
      <button class="btn btn-sm btn-teal" id="advance-btn" style="margin-top:8px;">Move to ${next.label}</button>
    </fieldset>`;
  } else if(next && next.key==='closed'){
    gateBlock = `<fieldset><legend>Gate: Sign-off to close as Acquired</legend>
      <div class="form-grid">
        <div><label>Approved by</label><input type="text" id="gate-approver" placeholder="MD / Approver name"></div>
        <div><label>Final Price</label><input type="number" id="gate-final-price" step="0.01" value="${l.priceValue||''}"></div>
        <div><label>Final Date</label><input type="date" id="gate-final-date" value="${todayStr()}"></div>
        <div><label>Remarks</label><input type="text" id="gate-remarks"></div>
      </div>
      <button class="btn btn-sm btn-teal" id="advance-btn" style="margin-top:8px;">Close as Acquired</button>
    </fieldset>`;
  } else if(next){
    gateBlock = `<div style="margin-bottom:14px;"><button class="btn btn-sm btn-teal" id="advance-btn">Move to ${next.label}</button>
      ${canGoBack?`<button class="btn btn-sm btn-ghost" id="back-btn" style="margin-left:8px;">Move back a stage</button>`:''}</div>`;
  }

  const dropBlock = l.stage!=='closed' ? `
    <fieldset><legend>Drop this Lead</legend>
      <div class="form-grid">
        <div><label>Reason</label><select id="drop-reason">${dropReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
        <div><label>Notes</label><input type="text" id="drop-notes"></div>
      </div>

    </fieldset>` : '';

  const closedSummary = l.stage==='closed' ? `
    <fieldset><legend>Outcome</legend>
      ${l.outcome==='acquired'
        ? `<p style="font-size:13px;">Acquired on ${fmtDate(l.finalDate)} at ${fmtNum(l.finalPrice)} / ${EXTENT_UNITS[l.priceUnit]?.label}. Approved by ${l.approval && l.approval.approver||'—'}.</p>`
        : `<p style="font-size:13px;">Dropped — <b>${l.reasonCode||'—'}</b>${l.reasonNotes?': '+l.reasonNotes:''}</p>`}
    </fieldset>` : '';

  return `${gateBlock}${holdBlock}${dropBlock}${closedSummary}`;
}

        <button class="btn btn-sm btn-teal" id="doc-add">Add</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">${DB.isLive() ? 'Enable Firebase Storage on your project to turn this into real file uploads.' : 'Connect this app to Firebase (see FIREBASE_CONFIG near the top of this file) to enable real file uploads here.'}</p>
    `}
  `;
}

function renderNegotiationTab(l){
  const rows = (l.negotiationLog||[]).map(n=>`<tr><td>${fmtDate(n.date)}</td><td>${n.offerBy}</td><td>${fmtNum(n.amount)}</td><td>${n.notes||''}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No negotiation entries yet.</td></tr>';
  return `
    <table style="margin-bottom:10px;"><tr><th>Date</th><th>By</th><th>Amount</th><th>Notes</th></tr>${rows}</table>
    <div class="inline-add">
      <input type="date" id="neg-date" value="${todayStr()}">
      <select id="neg-by"><option>Us</option><option>Owner</option><option>Mediator</option></select>
      <input type="number" id="neg-amount" step="0.01" placeholder="Amount">
      <input type="text" id="neg-notes" placeholder="Notes">
      <button class="btn btn-sm btn-teal" id="neg-add">Add</button>
    </div>
  `;
}

function renderHistoryTab(l){
  const items = (l.stageHistory||[]).slice().reverse().map(h=>
    `<div class="history-item"><b>${stageLabel(h.stage)}</b> — ${h.note||''}<div class="when">${fmtDate(h.at)} · ${h.by||''}</div></div>`
  ).join('') || '<div class="empty">No history recorded.</div>';
  return items;
}

function wireDetailTabEvents(l){
  {
    const btn = document.getElementById('ov-save-call');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { nextCallDate: document.getElementById('ov-nextcall').value });
      renderDetailModal(l.id); render();
    };
  }
  {
    const advance = document.getElementById('advance-btn');
    if(advance) advance.onclick = async () => {
      const idx = STAGE_INDEX[l.stage];
      const next = STAGES[idx+1];
      const approver = document.getElementById('gate-approver')?.value.trim();
      if((next.key==='negotiation' || next.key==='closed') && !approver){
        alert('An approver name is required for this transition.'); return;
      }
      const patch = { stage: next.key };
      patch.stageHistory = (l.stageHistory||[]).concat([{stage: next.key, at:new Date().toISOString(), by: approver || l.assignedExecutive, note: next.key==='negotiation'?'Approved to enter Negotiation':(next.key==='closed'?'Closed as Acquired':'Advanced')}]);
      if(next.key==='negotiation'){
        patch.approval = { approver, date: todayStr(), remarks: document.getElementById('gate-remarks')?.value.trim()||'' };
      }
      if(next.key==='closed'){
        patch.outcome = 'acquired';
        patch.finalPrice = parseFloat(document.getElementById('gate-final-price')?.value)||l.priceValue;
        patch.finalDate = document.getElementById('gate-final-date')?.value || todayStr();
        patch.approval = { approver, date: todayStr(), remarks: document.getElementById('gate-remarks')?.value.trim()||'' };
      }
      await DB.updateLead(l.id, patch);
      renderDetailModal(l.id); render();
    };
    const back = document.getElementById('back-btn');
    if(back) back.onclick = async () => {
      const idx = STAGE_INDEX[l.stage];
      const prev = STAGES[idx-1];
      await DB.updateLead(l.id, { stage: prev.key, stageHistory: (l.stageHistory||[]).concat([{stage:prev.key, at:new Date().toISOString(), by:l.assignedExecutive, note:'Moved back a stage'}]) });
      renderDetailModal(l.id); render();
    };
    const holdBtn = document.getElementById('hold-btn');
    if(holdBtn) holdBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:true, reasonCode: document.getElementById('hold-reason').value, notes: document.getElementById('hold-notes').value.trim(), since:new Date().toISOString() } });
      renderDetailModal(l.id); render();
    };
    const resumeBtn = document.getElementById('resume-btn');
    if(resumeBtn) resumeBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:false, reasonCode:'', notes:'', since:'' } });
      renderDetailModal(l.id); render();
    };
    const dropBtn = document.getElementById('drop-btn');
    if(dropBtn) dropBtn.onclick = async () => {
      const reason = document.getElementById('drop-reason').value;
      const notes = document.getElementById('drop-notes').value.trim();
      await DB.updateLead(l.id, { stage:'closed', outcome:'dropped', reasonCode:reason, reasonNotes:notes,
        stageHistory: (l.stageHistory||[]).concat([{stage:'closed', at:new Date().toISOString(), by:l.assignedExecutive, note:'Dropped — '+reason}]) });
      renderDetailModal(l.id); render();
    };
  }
  {
    const btn = document.getElementById('save-feas');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { feasibility: {
        technical: { status: document.getElementById('feas-technical-status').value, notes: document.getElementById('feas-technical-notes').value },
        financial: { status: document.getElementById('feas-financial-status').value, notes: document.getElementById('feas-financial-notes').value },
      }});
      renderDetailModal(l.id);
    };
  }
  {
    const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
    const btn = document.getElementById('doc-add');
    if(btn) btn.onclick = async () => {
      const name = document.getElementById('doc-name').value.trim();
      if(!name){ alert('Enter a document name.'); return; }
      if(liveUpload){
        const fileInput = document.getElementById('doc-file');
        const file = fileInput.files[0];
        if(!file){ alert('Choose a file to upload.'); return; }
        const statusEl = document.getElementById('doc-upload-status');
        statusEl.textContent = 'Uploading…';
        try{
          const path = 'leads/'+l.id+'/'+Date.now()+'_'+file.name;
          const ref = DB.storageRef(path);
          await ref.put(file);
          const url = await ref.getDownloadURL();
          await DB.updateLead(l.id, { documents: (l.documents||[]).concat([{name, url, storagePath:path, addedAt:new Date().toISOString()}]) });
        }catch(err){
          statusEl.textContent = 'Upload failed: ' + err.message;
          return;
        }
      } else {
        const url = document.getElementById('doc-url').value.trim() || '(no reference given)';
        await DB.updateLead(l.id, { documents: (l.documents||[]).concat([{name, url, addedAt:new Date().toISOString()}]) });
      }
      renderDetailModal(l.id);
    };
  }
  {
    const btn = document.getElementById('neg-add');
    if(btn) btn.onclick = async () => {
      const amount = parseFloat(document.getElementById('neg-amount').value);
      if(isNaN(amount)) { alert('Enter an amount.'); return; }
      await DB.updateLead(l.id, { negotiationLog: (l.negotiationLog||[]).concat([{
        date: document.getElementById('neg-date').value, offerBy: document.getElementById('neg-by').value,
        amount, notes: document.getElementById('neg-notes').value.trim()
      }])});
      renderDetailModal(l.id);
    };
  }
}

// ---- shared modal / view wiring -----------------------------------------
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; currentDetailLeadId = null; }

function wireViewEvents(){
  if(currentView==='dashboard'){
    document.querySelectorAll('[data-drill]').forEach(el=>el.addEventListener('click', ()=>{
      const d = el.dataset.drill;
      if(d==='active') goToLeadsList({ excludeClosed:true });
      if(d==='onHold') goToLeadsList({ onHold:true });
      if(d==='calls') goToLeadsList({ excludeClosed:true, callDueOrOverdue:true });
    }));
    document.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click', ()=>goToProgress(el.dataset.stage)));
    document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ source: el.dataset.source })));
    document.querySelectorAll('[data-cp]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ channelPartner: el.dataset.cp })));
    document.querySelectorAll('[data-open-id]').forEach(el=>el.addEventListener('click', ()=>openLeadDetail(el.dataset.openId)));
  }

  if(currentView==='progress'){ wireProgressEvents(); }
  if(currentView==='list'){ wireListEvents(); }
  if(currentView==='reports'){ wireReportsEvents(); }
  if(currentView==='configure'){ wireConfigureEvents(); }
  if(currentView==='masters'){ wireMastersEvents(); }
}

// ---- Sidebar navigation ---------------------------------------------------
function wireSidebarNav(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view==='list'){
        // Always reset to the unfiltered All Leads view.
        goToLeadsList({});
      } else {
        currentView = b.dataset.view;
        render();
      }
    };
  });
}
wireSidebarNav();

// Restore whichever view is named in the URL hash on load/refresh (deep
// link / reload support), then normalize the history entry so the very
// first back-press doesn't feel like a no-op.
(function initHistory(){
  const initial = (location.hash || '').slice(1);
  if(KNOWN_VIEWS.includes(initial)) currentView = initial;
  history.replaceState({ view: currentView }, '', '#' + currentView);
  window.addEventListener('popstate', (e) => {
    if(document.getElementById('overlay')) closeModal(); // don't leave a stale modal over a different page
    const v = (e.state && e.state.view) || (location.hash || '').slice(1);
    currentView = KNOWN_VIEWS.includes(v) ? v : 'dashboard';
    suppressHistoryPush = true;
    render();
  });
})();

boot();
</script>
