<script>
/* =========================================================================
   LAND LEADS ERP — WORKING MODEL
   MP Developers | Built to accompany "Land Leads ERP — Recommendations & Roadmap"

   This version is wired to real Firebase: Firestore for the leads and every
   master list (channel partners, villages, executives, land classifications,
   drop/on-hold reasons, lead sources), and Storage for document uploads.

   >>> TO GO LIVE: paste your Firebase project config into FIREBASE_CONFIG
   below. Until you do, or if the SDK can't load, the app runs on an
   in-memory demo (MemoryDB) automatically, so it's always usable. <<<
   ========================================================================= */

// ---- 1. YOUR FIREBASE CONFIG -------------------------------------------
// Replace with the config object from Firebase Console → Project Settings →
// General → Your apps → SDK setup and configuration. Client-side Firebase
// config is not a secret — access is controlled by your Firestore/Storage
// security rules (in the Firebase Console), not by hiding this.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAe_9Y00TN7NfggpYELdQulpXgCUW7CwZ0",
  authDomain: "mp-land-leads.firebaseapp.com",
  projectId: "mp-land-leads",
  storageBucket: "mp-land-leads.firebasestorage.app",
  messagingSenderId: "933967050983",
  appId: "1:933967050983:web:1d3c969ee547c9d92e0a42"
};

// ---- Pipeline stages ------------------------------------------------------
// The pipeline's FIRST stage ('new' — every new lead starts here) and LAST
// stage ('closed' — terminal: no back-navigation out of it, unlocks Final
// Price/Date, etc.) are structurally pinned, since other code refers to
// those two keys specifically. Everything in between is admin-editable on
// Status Config: stages can be renamed, added, removed and reordered there,
// as long as New stays first and Closed stays last. STAGE_KEYS/STAGES are
// recomputed from DB via refreshStagesFromDB() at boot and whenever Status
// Config is saved.
let STAGE_KEYS = ['new','contacted','site_visited','under_eval','doc_legal','negotiation','closed'];
const DEFAULT_STAGE_CONFIG = [
  { key:'new',            label:'New',                    sla:2  },
  { key:'contacted',      label:'Contacted',               sla:7  },
  { key:'site_visited',   label:'Site Visited',            sla:5  },
  { key:'under_eval',     label:'Under Evaluation',        sla:14 },
  { key:'doc_legal',      label:'Documentation & Legal',   sla:10 },
  { key:'negotiation',    label:'Negotiation',             sla:14 },
  { key:'closed',         label:'Closed',                  sla:null },
];
let STAGES = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
let STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
const stageLabel = k => (STAGES.find(s=>s.key===k)||{}).label || k;
// Turns a new stage's Label into a stable, unique key (e.g. "Site Re-Visit"
// -> "site_re_visit"), avoiding collisions with existing keys.
function slugifyStageKey(label, existingKeys){
  let base = (label||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!base) base = 'stage';
  let key = base, n = 2;
  while(existingKeys.includes(key)){ key = base + '_' + n; n++; }
  return key;
}
function refreshStagesFromDB(){
  const rows = (DB && DB.getStages) ? DB.getStages() : null;
  // Stored rows are fully authoritative (Status Config always saves the
  // complete, ordered stage list — including any added/removed/reordered
  // rows), so their order and set of keys drive STAGE_KEYS directly. Only

// The live, in-effect page access map — recomputed from DB via
// refreshViewAccessFromDB() at boot, on every live DB change, and whenever
// Page Access is saved. Starts as a plain copy of the defaults so the app
// works before that first refresh runs.
let VIEW_ACCESS = Object.fromEntries(Object.entries(DEFAULT_VIEW_ACCESS).map(([k,v])=>[k, v.slice()]));
// Per-USER page-access overrides, layered on top of the per-role VIEW_ACCESS
// above. { [uid]: { [view]: true|false } } — only pages where a specific
// person's access was explicitly ticked/unticked away from their role's
// default appear here; everything else falls through to VIEW_ACCESS. See
// refreshUserPageOverridesFromDB() and the "Per-User Overrides" section of
// renderPageAccessView().
let USER_PAGE_OVERRIDES = {};
function canAccessView(view){
  if(!currentUser) return false;
  // Lead Details isn't a navigable "page" with its own role grid in Page
  // Access — it's a universal drill-through reached only from other pages
  // the user already had to pass this same check to reach, and real access
  // is enforced at the data layer by openLeadDetail()'s own visibleLeads()
  // guard. So it's deliberately left out of PAGE_TITLES/KNOWN_VIEWS (never
  // shows up as a configurable row on the Page Access screen) and always
  // allowed here.
  if(view==='leadDetail') return true;
  // Head ('admin') always has full access and can never be locked out — via
  // the role grid (force-included below) or an override, same "always
  // allowed" precedent as Workflow Config gates.
  if(currentUser.role==='admin') return true;
  const overrides = USER_PAGE_OVERRIDES[currentUser.uid];
  if(overrides && Object.prototype.hasOwnProperty.call(overrides, view)) return !!overrides[view];
  return !!(VIEW_ACCESS[view] && VIEW_ACCESS[view].includes(currentUser.role));
}
// Recomputes VIEW_ACCESS from whatever's saved on the Page Access master
// (falling back to the shipped defaults for any page never saved yet).
// Head ('admin') is force-included on every page no matter what was saved —
// same "always allowed" precedent as Workflow Config gates — so Head can
// never accidentally lock itself out of Page Access (or anything else).
function refreshViewAccessFromDB(){
  const rows = (DB && DB.getPageAccess) ? DB.getPageAccess() : null;
  const source = (rows && rows.length) ? rows : Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles}));
  const next = {};
  KNOWN_VIEWS.forEach(view=>{
    const row = source.find(r=>r.view===view);
    const roles = (row && row.roles && row.roles.length) ? row.roles.slice() : (DEFAULT_VIEW_ACCESS[view] || []).slice();
    if(!roles.includes('admin')) roles.push('admin');
    next[view] = roles;
  });

}
// Recomputes USER_PAGE_OVERRIDES from whatever's saved on the per-user page
// access overrides doc. Head accounts are skipped even if a stray row
// exists for one (defense in depth — canAccessView() already short-circuits
// true for Head regardless).
function refreshUserPageOverridesFromDB(){
  const rows = (DB && DB.getUserPageAccess) ? DB.getUserPageAccess() : null;
  const next = {};
  (rows||[]).forEach(r=>{
    if(!r || !r.uid || !r.view) return;
    const user = userByUid(r.uid);
    if(user && user.role==='admin') return;
    if(!next[r.uid]) next[r.uid] = {};
    next[r.uid][r.view] = !!r.allowed;
  });
  USER_PAGE_OVERRIDES = next;
}
// ---- Lead visibility tree -------------------------------------------------
// Leads >> Created & viewed by the Executive assigned to them >> viewed &
// edited by that Executive's Manager (via the Executive's "Reports To") >>
// viewed & edited by that Manager's Head (via the Manager's "Reports To").
// Each Manager/Head sees only their own branch, not the whole company —
// set each person's "Reports To" under Manage Users to place them in the
// tree. A lead's Assigned Executive is matched by name against a real user
// account (same convention the old flat executive-only filter already used).
function userByName(name){ return (DB.getUsers()||[]).find(u=>u.name===name); }
function userByUid(uidVal){ return (DB.getUsers()||[]).find(u=>u.uid===uidVal); }
// Manager-wise visibility: an Executive sees not just their own leads, but
// every OTHER Executive who reports to the SAME Manager too — teammates
// under one Manager share full visibility of each other's leads, while
// Executives under a different Manager (or not yet linked to one) stay
// isolated, exactly as before this round. Also covers a lead/account
// attached directly to the Manager rather than an Executive — not how this
// app's New Lead form assigns leads today, but the data model doesn't
// forbid it, and the request calls this out explicitly ("if applicable to
// the existing lead assignment structure"). This is a VIEW-only widening:
// it does not touch who an Executive can create/assign a new lead to — see
// wireNewLeadViewEvents(), which already hard-locks that to self regardless
// of what visibleExecutives() returns.
function isTeammateOf(currentExec, otherName){
  if(!currentExec || !otherName) return false;
  if(otherName === currentExec.name) return true;
  if(!currentExec.reportsTo) return false; // not linked to a Manager yet — no team to share visibility with
  const other = userByName(otherName);
  if(!other) return false;
  if(other.role==='executive') return other.reportsTo === currentExec.reportsTo;
  if(other.role==='manager') return other.uid === currentExec.reportsTo;
  return false;
}
function isDirectReport(managerUid, execName){
  const exec = userByName(execName);
  return !!(exec && exec.reportsTo === managerUid);
}
function isInHeadBranch(headUid, execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && mgr.reportsTo === headUid);
}
// Safety net for a MID-tree gap: the Executive's Manager account exists (so
// isInHeadBranch's own "manager missing entirely" case doesn't apply) but
// that Manager hasn't been given a "Reports To" yet, so their whole branch
// isn't linked under any Head. Without this, that branch would be invisible
// to every Head — not just the wrong one — until someone notices the gap.
// Every Head sees it as a safety net (matches the "nothing goes silently
// missing while the hierarchy is configured" note below); once the Manager
// gets a Reports To, normal isInHeadBranch scoping takes back over.
function hasOrphanedManagerChain(execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && !mgr.reportsTo);
}
function visibleLeads(){
  const all = DB.getLeads();
  if(!currentUser) return [];
  if(currentUser.role==='executive') return all.filter(l=>isTeammateOf(currentUser, l.assignedExecutive));
  if(currentUser.role==='manager') return all.filter(l=>isDirectReport(currentUser.uid, l.assignedExecutive));
  if(currentUser.role==='admin'){
    return all.filter(l => isInHeadBranch(currentUser.uid, l.assignedExecutive)
      || hasOrphanedManagerChain(l.assignedExecutive)
      // Safety net: a lead whose Assigned Executive doesn't match any real
      // user account (legacy data, unassigned, or the reporting tree not
      // set up yet) has nowhere else to surface — Head still sees these so
      // nothing goes silently missing while the hierarchy is configured.
      || !userByName(l.assignedExecutive));
  }
  return all;
}
// Same tree, applied to the Executive accounts themselves — used to scope
// the "Assigned Executive" dropdown/filter on New Lead and All Leads so a
// Manager/Head only sees executives in their own branch.
// For an Executive this now lists their whole team (same isTeammateOf()
// widening as visibleLeads(), so the filter dropdown offers exactly the
// people whose leads actually show up in the table) — the New Lead page's
// own assignment dropdown is unaffected, since it hard-locks to self for
// Executives separately (see wireNewLeadViewEvents()).
function visibleExecutives(){
  const all = DB.getUsers().filter(u=>u.role==='executive');
  if(!currentUser) return [];
  if(currentUser.role==='executive') return all.filter(u=>isTeammateOf(currentUser, u.name));
  if(currentUser.role==='manager') return all.filter(u=>isDirectReport(currentUser.uid, u.name));
  if(currentUser.role==='admin') return all.filter(u=>isInHeadBranch(currentUser.uid, u.name) || hasOrphanedManagerChain(u.name) || !u.reportsTo);
  return all;
}

// ---- Channel Partner visibility (manager-wise, mirrors visibleLeads()) ---
// Channel Partners are now stamped with who created them at creation time
// (createdByUid/createdByName — see addMaster()'s trackOwner handling), so
// the same Executive->Manager->Head reporting tree used for Leads can be
// reused here, exactly as requested, instead of inventing a separate model.
// Records created before this round (the two seeded partners, CP-007 and
// CP-014, and anything added earlier) carry neither field. Rather than
// hiding that pre-existing, already-in-use data from anyone — which would
// silently break New Lead / Edit Details for every role the moment this
// shipped — those untagged records are treated as shared, company-wide
// resources and stay visible to everyone, same as before this round. This
// is a deliberate default for the legacy-data gap the request didn't cover
// either way; it can be tightened later (e.g. Head/Admin-only) if preferred.
function cpCreator(cp){
  if(cp.createdByUid){ const u = userByUid(cp.createdByUid); if(u) return u; }
  if(cp.createdByName){ const u = userByName(cp.createdByName); if(u) return u; }
  return null;
}
// Resolves the acceptance table's own hedged row ("Renju / CP created by
// Gokul (her Manager) / follow existing manager-CP visibility rules"): a
// Manager's own Channel Partners ARE visible to the Executives who report
// to them, same as a Manager's own leads are already visible to their team
// in spirit — a manager's shared contacts belong to the whole team they run.
function canSeeCP(cp, user){
  if(!user) return false;
  if(user.role==='sysadmin') return true; // Admin — full visibility, same precedent as everywhere else
  const creator = cpCreator(cp);
  if(!creator) return true; // legacy/unowned — shared company resource, visible to all
  if(creator.uid === user.uid) return true; // always see your own
  if(user.role==='executive'){
    if(creator.role==='executive') return creator.reportsTo === user.reportsTo; // teammate under the same Manager
    if(creator.role==='manager')   return creator.uid === user.reportsTo;       // your own Manager
    return false;
  }
  if(user.role==='manager'){
    return creator.role==='executive' && creator.reportsTo === user.uid; // your reporting Executives
  }
  if(user.role==='admin'){ // Head — their whole reporting branch, same safety nets as isInHeadBranch/hasOrphanedManagerChain
    if(creator.role==='manager')   return creator.reportsTo === user.uid || !creator.reportsTo;
    if(creator.role==='executive'){
      const mgr = userByUid(creator.reportsTo);
      return !!(mgr && mgr.reportsTo === user.uid) || hasOrphanedManagerChain(creator.name);
    }
    return false;
  }
  return false;
}

// Shared mandatory/format validation for a Channel Partner's editable
// fields — used by both the Add form (bottom of the Channel Partners list)
// and the Modify form (Channel Partner Details page), so a record can never
// be saved half-filled or malformed from either entry point. Name is
// required; Phone is required and must be a plain 10-digit mobile number
// (matches every seed/demo CP); Commission % is optional, but when given
// must be a plain number from 0-100. Returns {ok, message}.
function validateCPFields(fields){
  if(!fields.name || !String(fields.name).trim()) return { ok:false, message:'Name is required.' };
  const phone = String(fields.phone||'').trim();
  if(!phone) return { ok:false, message:'Phone (mobile number) is required.' };
  if(!/^[0-9]{10}$/.test(phone)) return { ok:false, message:'Phone must be a 10-digit mobile number.' };
  if(fields.commissionPct !== '' && fields.commissionPct != null){
    const n = Number(fields.commissionPct);
    if(isNaN(n) || n < 0 || n > 100) return { ok:false, message:'Commission % must be a number between 0 and 100.' };
  }
  return { ok:true, message:'' };
}

// ---- Workflow config -------------------------------------------------------
// Role-wise From Status -> To Status mapping (like the "Entity Wise Role And
// Status Mapping" screen): each row grants ONE specific role permission to
// perform ONE specific From->To move (moving forward into a stage and
// moving back out of it are separate rows). A From status can branch to
// several To statuses — including non-adjacent jumps (e.g. Under Evaluation
// straight to Closed as a "drop"), same as the reference screen — and the
// same From->To move can have several rows, one per role allowed to perform
// it. Head can always approve every transition regardless of what's
// configured here (top-level sign-off), the same way it always could under
// the old rank-based rule.
//
// The app's built-in "Move to next stage" / "Move back" buttons on a lead
// (see renderStageTab) always cover the immediate adjacent pair and stay
// ungated by default — configuring one of those pairs here still just adds
// an approval gate to that same built-in move. Any OTHER row — a non-
// adjacent From->To pair — shows up as an EXTRA "Move to X" option on that
// lead's Stage & Actions tab, gated by whichever role(s) this table lists.
// From==='closed' rows are accepted here for full flexibility but never
// surface as an actual move (Closed stays terminal, see renderStageTab).
const DEFAULT_WORKFLOW_CONFIG = [
  { from:'doc_legal',   to:'negotiation', role:'manager', label:'Approve entry into Negotiation' },
  { from:'negotiation', to:'closed',      role:'admin',   label:'Approve Closing (Acquired)' },
];
let WORKFLOW_CONFIG = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
function defaultGateLabel(from, to){ return to==='closed' ? 'Approve Closing (Acquired)' : ('Approve ' + stageLabel(from) + ' → ' + stageLabel(to)); }
// Every distinct ordered (From, To) combination across the current stage
// list — any status can map to any other status, no adjacency requirement.
function allTransitionPairs(){
  const pairs = [];
  STAGE_KEYS.forEach(from => STAGE_KEYS.forEach(to => { if(from !== to) pairs.push({ from, to }); }));
  return pairs;
}
function refreshWorkflowFromDB(){
  const rows = (DB && DB.getWorkflow) ? DB.getWorkflow() : null;
  const source = (rows && rows.length) ? rows : DEFAULT_WORKFLOW_CONFIG;
  const validPairs = allTransitionPairs();
  WORKFLOW_CONFIG = source
    .map(r => {
      // Back-compat: rows saved before From/To pairs existed only carried
      // {key,label,minRole}, meaning "approval required to enter `key` from
      // whatever stage precedes it" — migrate those to an explicit pair, and
      // rows saved before the role-wise rework carried `minRole` instead of
      // `role` — same field, new name.
      let from = r.from, to = r.to || r.key;
      if(!from && to){
        const toIdx = STAGE_INDEX[to];
        from = (toIdx > 0) ? STAGE_KEYS[toIdx-1] : null;
      }
      return { from, to, label: r.label || (from && to ? defaultGateLabel(from, to) : ''), role: r.role || r.minRole || 'admin' };
    })
    .filter(r => r.from && r.to && validPairs.some(p => p.from===r.from && p.to===r.to));
}
// A From->To move can have several rows (one per permitted role) — this
// returns all of them for that exact directional pair.
function findGates(fromKey, toKey){ return WORKFLOW_CONFIG.filter(w => w.from===fromKey && w.to===toKey); }
function findGate(fromKey, toKey){ return findGates(fromKey, toKey)[0]; }
function isGatedTransition(fromKey, toKey){ return findGates(fromKey, toKey).length > 0; }
// Head ('admin') is always allowed, matching its old top-of-rank status;
// every other role must have an explicit row for this exact From->To move.
function roleAllowedForGate(role, fromKey, toKey){
  const gates = findGates(fromKey, toKey);
  if(!gates.length) return true;
  if(role === 'admin') return true;

const fmtINR = n => n==null||isNaN(n) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const fmtNum = n => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('en-IN', {maximumFractionDigits:1});
// Firestore's serverTimestamp() fields come back live as Firestore Timestamp
// objects (not a Date/ISO string) — those carry a toDate() method, so unwrap
// with it before parsing; otherwise `new Date(...)` fails and used to leak
// the raw object's toString() ("Timestamp(seconds=..., nanoseconds=...)")
// straight into the UI.
const fmtDate = d => {
  if(!d) return '—';
  const raw = (typeof d === 'object' && typeof d.toDate === 'function') ? d.toDate() : d;
  const dt = new Date(raw);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
};
const daysBetween = (a,b) => Math.floor((b-a)/86400000);
const todayStr = () => new Date().toISOString().slice(0,10);

// Validated categorical palette — 8 hues in a fixed order that clears every
// adjacent-pair CVD/contrast check (used by the Pipeline Funnel donut on the
// Dashboard). Assigned by stage position, not hand-picked per stage, so it
// stays correct as stages are renamed/reordered/added on Status Config.
const DONUT_PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
// Picks white or the app's ink color as a segment's label text, by the
// segment fill's relative luminance, so the value stays legible on both the
// darker slots (blue/violet/green) and the lighter ones (yellow/aqua).
function readableTextOn(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  return L > 0.5 ? '#1F2430' : '#ffffff';
}

function extentSqft(v,u){ return (Number(v)||0) * (EXTENT_UNITS[u]?.sqft || 1); }
function pricePerSqft(v,u){ return (Number(v)||0) / (EXTENT_UNITS[u]?.sqft || 1); }
// Converts a raw sqft figure back into any target unit — used to show a
// Land Parcel's computed Balance Extent in the same unit as its Total
// Recorded Extent, regardless of what units the other extent fields used.
function sqftToUnit(sqft,u){ return (Number(sqft)||0) / (EXTENT_UNITS[u]?.sqft || 1); }
// Last-10-digits comparison so "9840011111", "+91 98400 11111" and
// "091-98400-11111" are all recognized as the same number for landowner
// duplicate detection, without forcing one strict input format.
function normalizePhoneDigits(p){ return String(p||'').replace(/\D/g,'').slice(-10); }
// Same auto-numbering scheme as nextMasterCode() (see Masters), generalized
// to whichever field name holds the code on a given record type, since
// Landowners/Land Parcels aren't part of the generic MASTER_DEFS system.
function nextEntityCode(prefix, items, codeField, padLen){
  const re = new RegExp('^' + prefix + '-(\\d+)$');
  const maxNum = (items||[]).reduce((max, it) => {
    const m = re.exec(String(it[codeField]||'').trim());
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);
  return prefix + '-' + String(maxNum + 1).padStart(padLen||3, '0');
}

        });

    }

      seed.forEach(lead=>{
        const ref = this.fsdb.collection('leads').doc();
        batch.set(ref, Object.assign({}, lead, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      });
      await batch.commit();
    }

      await secondaryApp.auth().signOut();
      const doc = { name, email:(email||'').trim(), phone: phone||'', role, active:true, reportsTo: reportsTo||'', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      await this.fsdb.collection('m_users').doc(newUid).set(doc);
      return Object.assign({ uid:newUid, id:newUid }, doc);
    } finally {
      await secondaryApp.delete();
    }
  }
  async updateUser(userUid, patch){ await this.fsdb.collection('m_users').doc(userUid).update(patch); }
  async toggleUser(userUid){
    const u = this.users.find(x=>x.uid===userUid);
    await this.updateUser(userUid, { active: !(u && u.active!==false) });
  }
  async deleteUser(userUid){ await this.fsdb.collection('m_users').doc(userUid).delete(); }
  // Sets another user's real Firebase Auth sign-in password directly. The
  // client SDK can't do this on its own — only the signed-in user can change
  // their OWN password without a backend — so this calls the
  // adminSetUserPassword Cloud Function (deployed separately; see the
  // functions/ folder delivered alongside this file), which uses the Admin
  // SDK server-side and independently re-checks that the CALLER is a Head
  // or Admin before touching anything — never trust the client for this.
  async changeUserPassword(userUid, newPassword){
    if(!newPassword || newPassword.length < 6) throw new Error('Password must be at least 6 characters.');
    if(typeof firebase.functions !== 'function'){
      throw new Error('The Functions SDK didn\'t load, so this app can\'t reach the password-change function right now.');
    }
    try{
      await firebase.functions().httpsCallable('adminSetUserPassword')({ uid: userUid, newPassword });
    }catch(err){
      if(err && err.code === 'functions/not-found'){
        throw new Error('The adminSetUserPassword function isn\'t deployed yet on this Firebase project — see the functions/ folder delivered with this file for the deploy steps.');
      }
      throw new Error((err && err.message) || 'Could not change the password.');
    }
  }
  // ---- Landowner registry (Land Acquisition ERP, Module 3) ---------------
  getLandowners(){ return this.landowners.filter(o=>o.active!==false); }
  getAllLandowners(){ return this.landowners; }
  getLandowner(id){ return this.landowners.find(o=>o.id===id); }
  async addLandowner(fields){
    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    await this.fsdb.collection('landowners').add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, stamped));
  }
  async updateLandowner(id, patch){ await this.fsdb.collection('landowners').doc(id).update(Object.assign({}, patch, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() })); }
  async toggleLandowner(id){ const o=this.landowners.find(x=>x.id===id); await this.updateLandowner(id, { active: !(o && o.active!==false) }); }
  async deleteLandowner(id){ await this.fsdb.collection('landowners').doc(id).delete(); }
  // ---- Land Parcel & Survey registry (Land Acquisition ERP, Module 4) ----
  getLandParcels(){ return this.landParcels.filter(p=>p.active!==false); }
  getAllLandParcels(){ return this.landParcels; }
  getLandParcel(id){ return this.landParcels.find(p=>p.id===id); }
  async addLandParcel(fields){
    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    await this.fsdb.collection('landParcels').add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, stamped));
  }
  async updateLandParcel(id, patch){ await this.fsdb.collection('landParcels').doc(id).update(Object.assign({}, patch, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() })); }
  async toggleLandParcel(id){ const p=this.landParcels.find(x=>x.id===id); await this.updateLandParcel(id, { active: !(p && p.active!==false) }); }
  async deleteLandParcel(id){ await this.fsdb.collection('landParcels').doc(id).delete(); }
}

let currentDetailLeadId = null;
// Which currentView to return to when the Lead Details page's Back button

// reachable from several different pages (All Leads, Dashboard, Reports,

// Verification, Negotiation, Valuation, Acquisition Proposal, Payments,
// Registration) render as a collapsible accordion (Sara: "too much data in
// one page... whenever Status is changed to the particular option related

// hidden for good, but only the one(s) relevant to the lead's CURRENT stage

// the live set of which section keys are currently expanded; it's reset to
// that stage's default set — overriding any manual expand/collapse — only
// when `leadDetailOpenStage` no longer matches the lead's actual stage, i.e.
// right after opening a (possibly different) lead OR right after its stage
// actually changes. In between, the user's own manual toggles are left
// alone across re-renders triggered by unrelated saves elsewhere on the page.
let leadDetailOpenSections = new Set();
let leadDetailOpenStage = null;
// Whether the Lead Details page's Overview tab is showing its editable form
// right now. Reset to false whenever a (possibly different) lead is opened
// or the page is closed, so stale edit state never leaks from one lead to
// the next. Who can actually SEE the Edit option at all is gated separately
// by canModifyLeadDetails() below.
let leadEditMode = false;
// Lead-level "modify the details" capability (village, extent, price,
// landowner, etc. on the Overview tab) — separate from, and narrower than,
// page-level Page Access: Admin and Manager, same as Head (who already has
// blanket access everywhere else in this app), always have it. An
// Executive has it ONLY on a lead actually assigned to THEM — kept simple
// and narrow on purpose, not widened to teammates' leads (an earlier round
// did try that wider scope and it was then explicitly asked back down to
// just an Executive's own leads). Assigned Executive itself still stays
// fixed once a lead is created, for every role — this is a "modify the
// lead's details" capability, never a reassignment one (see
// renderOverviewTab()).
function canModifyLeadDetails(lead){
  if(!currentUser) return false;
  if(currentUser.role==='admin' || currentUser.role==='manager' || currentUser.role==='sysadmin') return true;
  if(currentUser.role==='executive') return !!(lead && lead.assignedExecutive === currentUser.name);
  return false;
}
// Whether the Stage & Actions tab's "Reassign Executive" form (Frozen-lead
// reassignment, below) is open right now. Same reset-on-open/close
// discipline as leadEditMode, for the same reason — stale form state must
// never leak from one lead to the next.
let reassignMode = false;
// ---- Lead Assignment / Reassignment ---------------------------------------
// Originally built "Frozen Lead Reassignment" — reassignment offered ONLY
// on a lead that's On Hold (l.onHold.active), the "Frozen" the original
// request meant since there's no separate Frozen pipeline stage. Later
// widened to a general "Assign to Executive" option, available on ANY
// lead regardless of On-Hold status — same eligibility rules below,
// unchanged, just no longer gated on l.onHold.active.
// Who may reassign reuses the exact same Reports-To tree as every other
// access rule in this app: Manager, within their own reporting Executives;
// Head, within their own reporting branch (not blanket, unlike most other
// Head overrides elsewhere — the original request specifically framed
// Head's permission as scoped to "the relevant Manager's team", so this
// mirrors visibleLeads()'s own branch-scoping instead of the usual Head-
// always-wins shortcut); Admin (sysadmin), unconditionally, same full-
// access precedent as everywhere else. An Executive IS now authorized too
// (Sara's explicit follow-up request: "reassign executives I want in
// executive level also"), but narrower than every role above it, matching
// this app's existing narrower-than-Executive-tiers-above precedent in
// reverse: an Executive may only reassign a lead currently assigned to
// THEMSELVES or to a teammate under the same Manager — the same
// isTeammateOf() reach visibleLeads() already grants an Executive on every
// other page, not a company-wide reach.
function canReassignLead(lead){
  if(!currentUser || !lead) return false;
  if(currentUser.role==='sysadmin') return true;
  if(currentUser.role==='admin') return isInHeadBranch(currentUser.uid, lead.assignedExecutive) || hasOrphanedManagerChain(lead.assignedExecutive);
  if(currentUser.role==='manager') return isDirectReport(currentUser.uid, lead.assignedExecutive);
  if(currentUser.role==='executive') return isTeammateOf(currentUser, lead.assignedExecutive);
  return false;
}
// Every ACTIVE Executive company-wide — never the current Executive
// themselves (nothing to reassign to otherwise). Widened from the original
// same-Manager-only pool (Sara's explicit request: "widen who can be
// assigned") so a lead can move across branches, e.g. a Manager loaning a
// lead to an Executive on another team. canReassignLead() above still
// gates WHICH LEADS a given user may touch at all (a Manager only their
// own reports' leads, a Head only their own branch's) — this only widens
// the destination pool once that gate has already passed.
// An Executive gets a DELIBERATELY NARROWER destination pool than every
// role above them (Sara's explicit choice when this was extended to
// Executives): same-Manager teammates only, not company-wide — scoped off
// the ACTING user's own Manager (currentUser.reportsTo), since the lead
// could already be the acting Executive's own (current===currentUser) or a
// teammate's, but either way "same Manager" means the same Manager as the
// person doing the reassigning.
// Enforced here (not just in whichever dropdown renders it) so this same
// check also guards the actual save in DB.reassignLead() below.
function eligibleReassignmentTargets(lead){
  const current = userByName(lead && lead.assignedExecutive);
  if(currentUser && currentUser.role==='executive'){
    if(!currentUser.reportsTo) return [];
    return DB.getUsers().filter(u => u.role==='executive' && u.active!==false && u.reportsTo===currentUser.reportsTo && (!current || u.name!==current.name));
  }
  return DB.getUsers().filter(u => u.role==='executive' && u.active!==false && (!current || u.name!==current.name));
}

// ---- Landowner & Land Parcel registries (Land Acquisition ERP spec,
//      Modules 3-4) -------------------------------------------------------
// Both are intentionally COMPANY-WIDE visible to anyone with Page Access to
// their two pages — unlike the Manager-wise Lead/Channel-Partner visibility
// elsewhere in this app. This is a deliberate, flagged difference: the
// spec's own duplicate-landowner and duplicate-parcel detection only works
// if every branch can see every other branch's entries; siloing these the
// same way Leads are siloed would silently defeat that requirement.
// Creating/editing either one needs only ordinary Page Access to the page
// (same as any Masters page); permanently deleting one is kept to Manager/
// Head/Admin, not Executive — matching this app's existing precedent of
// Executives having narrower rights than the roles above them (see
// canModifyLeadDetails()).
function canDeleteLandRegistry(){
  return !!(currentUser && currentUser.role !== 'executive');
}
function landownerById(id){ return (DB.getAllLandowners()||[]).find(o=>o.id===id); }
// Document verification (spec Module 7: "legal clearance must be issued by
// an authorized user", "must not be inferred merely because a document was
// uploaded") — same narrower-than-the-roles-above-it precedent as
// canDeleteLandRegistry(): any Executive can upload, only Manager/Head/
// Admin can mark a document Verified/Rejected/Deficient.
function canVerifyDocument(){
  return !!(currentUser && currentUser.role !== 'executive');
}
// Legal Verification (spec Module 8) and Valuation (spec Module 9) are the
// spec's "Legal Team" and "Accounts Team" roles' own work — this app's 4
// roles don't have separate Legal/Accounts logins, so (same precedent as
// canVerifyDocument()/canDeleteLandRegistry()) both are gated to the
// Manager/Head/Admin tier, keeping Executives able to view every record but
// not record a legal finding or a valuation themselves.
function canRecordLegalOrValuation(){
  return !!(currentUser && currentUser.role !== 'executive');
}
// Approvals (spec Module 11) — same Manager/Head/Admin tier as the two
// helpers above, PLUS the spec's explicit "no self-approval" rule: whoever
// proposed the version being decided on can neither approve NOR reject it
// themselves (see renderAcquisitionProposalTab()'s approvalBlock) — the
// decision, either way, has to come from a different Manager/Head/Admin.
// Checked by name (this app has no separate per-proposal submitter uid
// captured, only the recorded display name — consistent with every other
// "recordedBy"/"verifiedBy" field in this file).
function canApproveProposal(proposal){
  if(!currentUser || currentUser.role==='executive') return false;
  if(proposal && proposal.proposedBy && proposal.proposedBy===currentUser.name) return false;
  return true;
}
// Negotiation Management (spec Module 6) — a lead's negotiationLog entries
// are NEVER overwritten (each round is its own appended record, same
// append-only discipline as stageHistory/reassignmentHistory), so this
// summary is always DERIVED live from that history, never itself stored —
// there is no separate mutable "total" field for the browser to desync
// from the real entries. offerBy:'Owner' on an entry is read as the
// landowner's side of that round (their ask); 'Us'/'Mediator' is read as
// our side (an offer). Duration is first-entry-date to most-recent-entry-
// date (or today, if there's only one entry so far).
function negotiationSummary(l){
  const log = (l.negotiationLog||[]).slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(!log.length) return null;
  const asks = log.filter(n=>n.offerBy==='Owner' && n.amount!=null);
  const ourOffers = log.filter(n=>n.offerBy!=='Owner' && n.amount!=null);
  const initialAsk = asks.length ? asks[0].amount : null;
  const lowestOffer = ourOffers.length ? Math.min(...ourOffers.map(n=>n.amount)) : null;
  const latest = log[log.length-1];
  const currentProposed = ourOffers.length ? ourOffers[ourOffers.length-1].amount : latest.amount;
  const changeFromAsk = (initialAsk!=null && currentProposed!=null) ? (currentProposed - initialAsk) : null;
  const first = log[0];
  const durationDays = daysBetween(new Date(first.date), latest===first ? new Date() : new Date(latest.date));
  return { initialAsk, lowestOffer, latest, currentProposed, changeFromAsk, durationDays };
}
// Legal Verification (spec Module 8) — same append-only discipline as
// negotiationLog: a legal finding is never edited after the fact (a status
// can change — e.g. a litigation resolves — but that's recorded as a NEW
// entry, not a rewrite of the old one, so the full history of what was
// known and when is preserved). "Current status" is simply the most recent
// entry; nothing here is a separate mutable field.
function legalVerificationSummary(l){
  const log = (l.legalVerificationLog||[]).slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(!log.length) return null;
  return { latest: log[log.length-1], count: log.length };
}
// Valuation (spec Module 9) — same append-only history as above. The
// "Current Negotiated Value" line is read live from negotiationSummary()
// rather than re-entered here, so the two tabs can never disagree about
// what's actually been offered; Variance vs Guideline is derived from that
// plus the latest valuation entry's own guideline rate, never stored.
function valuationSummary(l){
  const log = (l.valuationLog||[]).slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(!log.length) return null;
  const latest = log[log.length-1];
  const neg = negotiationSummary(l);
  const negotiated = neg ? neg.currentProposed : null;
  const variancePct = (negotiated!=null && latest.guidelineRate) ? (((negotiated - latest.guidelineRate) / latest.guidelineRate) * 100) : null;
  return { latest, count: log.length, negotiated, variancePct };
}
// Acquisition Proposals (spec Module 10) — same append-only versioning as
// Negotiation/Legal/Valuation above: each draft/revision/decision is its
// own permanent entry (log.length at save time becomes that entry's
// version number), never an edit of an earlier one, so the full trail of
// what was proposed and when survives a later revision or rejection.
function proposalSummary(l){
  const log = (l.acquisitionProposalLog||[]).slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(!log.length) return null;
  return { latest: log[log.length-1], version: log.length };
}
// Payments (spec Module 12) and Registration (spec Module 13) are the
// spec's own "Accounts Team"/registration-desk work — this app's 4 roles
// have no separate Accounts/Registration login, so (same precedent as
// canRecordLegalOrValuation()/canApproveProposal()) both are gated to the
// Manager/Head/Admin tier; an Executive can view every entry but not
// record a payment or a registration themselves.
function canRecordFinancialEntry(){
  return !!(currentUser && currentUser.role !== 'executive');
}
// Payments — same append-only discipline as every other log in this file:
// a payment is a permanent entry, never edited after the fact. "Total
// Agreed Value" is read live from proposalSummary() (via
// proposalAmountValue(), defined alongside renderAcquisitionProposalTab())
// and ONLY once the latest proposal version is actually 'Approved' — before
// that there's no settled figure to measure payments against, so Balance
// Due intentionally shows '—' rather than a misleading number.
function paymentSummary(l){
  const log = (l.paymentLog||[]);
  const totalPaid = log.reduce((s,p)=> s + (Number(p.amount)||0), 0);
  const prop = proposalSummary(l);
  const agreedTotal = (prop && prop.latest.status==='Approved') ? proposalAmountValue(prop.latest) : null;
  const balanceDue = agreedTotal!=null ? (agreedTotal - totalPaid) : null;
  const sorted = log.slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  return { count: log.length, totalPaid, agreedTotal, balanceDue, lastPaymentDate: sorted.length ? sorted[sorted.length-1].date : null };
}
// Registration — same append-only history as Legal Verification/Valuation:
// a later correction or re-registration is a NEW entry, never a rewrite of
// an earlier one. "Current" is simply the most recent entry.
function registrationSummary(l){
  const log = (l.registrationLog||[]).slice().sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
  if(!log.length) return null;
  return { latest: log[log.length-1], count: log.length };
}
// Project Mapping — resolves a lead's stored projectCode against the
// Projects master for display, same "store the code, look up the label
// live" pattern as Channel Partner. Never stores the project's name on the
// lead itself, so a later project rename can't leave stale labels behind.
function projectLabel(code){
  if(!code) return '—';
  const p = DB.getMasters('projects').find(p=>p.code===code);
  return p ? (p.code+' — '+p.name) : code;
}
// ---- Audit Trail -----------------------------------------------------------
// One call site per system-configuration write (Masters, Users, Workflow
// Config, Status Config, Page Access incl. per-user overrides, Lead Field
// Configuration) — see DB.addAuditEntry()'s own comment for why this is
// scoped to configuration changes only, not a duplicate of each lead's own
// already-rich history. Never throws/blocks the action it's logging — a
// failed audit write is swallowed (logged to console only), same
// best-effort spirit as this app's other non-critical side effects.
// Prefers a human-readable name/label over an auto-generated code (Channel
// Partners/Projects) so an Audit Trail entry reads as "Added Project —
// ECR Gateway Phase 2", not just a bare "PRJ-01" — falling back to
// whichever field the master actually has if neither name/label exists.
function masterItemLabel(def, item){
  return item.name || item.label || item[def.fields[0]] || '';
}
async function logAudit(action, entityType, entityLabel, notes){
  if(!DB || typeof DB.addAuditEntry !== 'function') return;
  try{
    await DB.addAuditEntry({
      actor: currentUser ? currentUser.name : '',
      actorRole: currentUser ? (ROLE_LABELS[currentUser.role]||currentUser.role) : '',
      action, entityType, entityLabel: entityLabel||'', notes: notes||'',
    });
  }catch(err){ console.error('Audit log write failed', err); }
}
// A parcel's Balance Available Extent, in sqft: Total Recorded minus
// Previously Acquired minus Proposed Acquisition (all converted to a
// common unit first since the three fields can each use a different one).
// Negative means the parcel's own fields are internally inconsistent — more
// land has been claimed against it than it actually has.
function parcelBalanceSqft(p){
  return extentSqft(p.totalExtentValue, p.totalExtentUnit)
       - extentSqft(p.previouslyAcquiredValue, p.previouslyAcquiredUnit)
       - extentSqft(p.proposedExtentValue, p.proposedExtentUnit);
}
// Possible-duplicate landowners: same (normalized) contact number, or the
// same name in the same village — checked against EVERY landowner (active
// or not), excluding the record being edited. A non-blocking warning only
// (see wireLandownersEvents' save handler) — never auto-merged, per spec.
function findDuplicateLandowners(fields, excludeId){
  const phone = normalizePhoneDigits(fields.contactNumber);
  const name = (fields.fullName||'').trim().toLowerCase();
  const village = (fields.village||'').trim().toLowerCase();
  return (DB.getAllLandowners()||[]).filter(o=>{
    if(o.id===excludeId) return false;
    const samePhone = phone && normalizePhoneDigits(o.contactNumber)===phone;
    const sameNameVillage = name && village && (o.fullName||'').trim().toLowerCase()===name && (o.village||'').trim().toLowerCase()===village;
    return samePhone || sameNameVillage;
  });
}
// Possible-duplicate parcels: same Village + Survey Number + Subdivision
// Number among active parcels, excluding the one being edited. Per spec,
// survey number alone is never assumed unique — this only warns, it never
// blocks the save (a genuine phase/re-entry of the same survey number can
// be legitimate).
function findDuplicateParcels(fields, excludeId){
  const village = (fields.village||'').trim().toLowerCase();
  const survey = (fields.surveyNumber||'').trim().toLowerCase();
  const sub = (fields.subdivisionNumber||'').trim().toLowerCase();
  if(!village || !survey) return [];
  return (DB.getLandParcels()||[]).filter(p=>{
    if(p.id===excludeId) return false;
    return (p.village||'').trim().toLowerCase()===village && (p.surveyNumber||'').trim().toLowerCase()===survey && (p.subdivisionNumber||'').trim().toLowerCase()===sub;
  });
}

function showConnectionBadge(live, note){
  const el = document.getElementById('conn-badge');
  if(!el) return;
  el.innerHTML = live
    ? '<span class="badge badge-ok conn-dot">● Firebase Connected</span>'
    : '<span class="badge badge-warn conn-dot" title="'+(note?String(note).replace(/"/g,'\''):'Add your Firebase config near the top of this file.')+'">● Demo Mode</span>';
}

function renderDemoBanner(show, note){
  const holder = document.getElementById('banner-holder');
  if(!show){ holder.innerHTML=''; return; }
  holder.innerHTML = `<div class="banner"><div><b>Running in demo mode</b> — data is in-memory and resets on refresh.${note?(' ('+note+')'):''} Check your FIREBASE_CONFIG and Firestore/Storage rules to make this persistent again.</div><button id="banner-x">&times;</button></div>`;
  const x = document.getElementById('banner-x');
  if(x) x.onclick = () => { holder.innerHTML=''; };
}

async function boot(){
  const cfg = FIREBASE_CONFIG;
  const isPlaceholder = !cfg || !cfg.apiKey || cfg.apiKey.indexOf('REPLACE_ME') !== -1;
  const sdkLoaded = typeof firebase !== 'undefined';

  if(!isPlaceholder && sdkLoaded){
    try{
      firebase.initializeApp(cfg);
      // Explicit LOCAL persistence — the sign-in session survives a page
      // refresh (and a full browser restart). This is Firebase's default
      // anyway, but setting it explicitly avoids silently falling back to
      // an in-memory-only session in some private/incognito browser modes.
      if(typeof firebase.auth === 'function'){
        try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
        catch(persistErr){ console.warn('Could not set Firebase Auth persistence to LOCAL — sessions may not survive a refresh in this browser mode.', persistErr); }
      }
      const fsdb = firebase.firestore();
      const storage = (typeof firebase.storage === 'function') ? firebase.storage() : null;
      DB = new FirestoreDB(fsdb, storage);
      DB.onChange(()=>{
        refreshStagesFromDB();
        refreshWorkflowFromDB();
        refreshViewAccessFromDB();
        refreshUserPageOverridesFromDB();
        // Lead Details is a regular currentView page now (not a separate
        // modal root), so the render() call above already keeps it live —
        // no second, modal-specific re-render needed here any more.
        if(currentUser){ applyRoleVisibility(); render(); }
      });
      // DB.init() (seeding + Firestore listeners) is deliberately NOT called
      // here. Security rules that require request.auth != null (the live
      // setup guide's recommended rules) reject any Firestore read made
      // before someone has signed in — running init() this early would
      // always fail with "Missing or insufficient permissions" and
      // permanently fall back to demo mode for the rest of the page load,
      // even though the config and rules are actually fine. ensureDbInit()
      // runs it instead, once, right after sign-in succeeds — see
      // initAuth()'s onAuthStateChanged handler below.
      showConnectionBadge(true);
      renderDemoBanner(false);
    }catch(err){
      console.error('Firebase init failed — falling back to demo mode.', err);
      DB = new MemoryDB();
      await DB.init();
      showConnectionBadge(false, err.message);
      renderDemoBanner(true, 'connection error: ' + err.message);
    }
  } else {
    DB = new MemoryDB();
    await DB.init();
    showConnectionBadge(false, isPlaceholder ? 'no Firebase config set yet' : 'SDK did not load');
    renderDemoBanner(true, isPlaceholder ? 'no Firebase config set yet' : 'the Firebase SDK did not load');
  }
  refreshStagesFromDB();
  refreshWorkflowFromDB();
  refreshViewAccessFromDB();
  refreshUserPageOverridesFromDB();
  initAuth();
}

// =========================================================================
// AUTH / ACCESS — a real login gate in front of the whole app. Live mode
// uses Firebase Authentication; demo mode uses a lightweight in-memory
// mock (see DEFAULT_USERS_SEED) so the whole flow works the same offline.
// =========================================================================
let currentUser = null;

// Firestore reads/writes under the recommended live security rules require
// a signed-in user (request.auth != null), so FirestoreDB's init() — which
// seeds every collection and subscribes to it — can only safely run once
// someone has actually signed in. Called once, right after the first
// successful sign-in (see onAuthStateChanged below); harmless to call again.
let _dbInitPromise = null;
function ensureDbInit(){
  if(!DB.isLive()) return Promise.resolve();
  if(!_dbInitPromise) _dbInitPromise = DB.init().then(()=>DB.ready());
  return _dbInitPromise;
}

// ---- Auto sign-out after inactivity -------------------------------------
// Signs the user out after 20 minutes with no mouse/keyboard/touch/scroll
// activity, regardless of which page they're on. The listeners are wired
// once, globally, near boot(); resetIdleTimer() itself is a no-op whenever
// nobody's signed in, so it's harmless to leave them attached across
// sign-in/out cycles.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
const IDLE_ACTIVITY_EVENTS = ['mousemove','mousedown','keydown','scroll','touchstart','click'];
let idleTimer = null;
let pendingLoginMessage = null;
function resetIdleTimer(){
  if(!currentUser) return;
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
}
function stopIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
}
async function onIdleTimeout(){
  if(!currentUser) return;
  await doLogout('You were signed out after 20 minutes of inactivity.');
}
(function wireIdleTimerListeners(){
  IDLE_ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive:true }));
})();

// Shared sign-out path for both the manual "Log out" button and the idle
// timeout, so both behave identically (including in demo mode, where
// there's no auth listener to drive the login screen back up on its own).
async function doLogout(reason){
  stopIdleTimer();
  if(DB.isLive()){
    pendingLoginMessage = reason || null;
    await firebase.auth().signOut();
  } else {
    await DB.logout();
    currentUser = null;
    showLoginScreen(reason);
  }
}

// While true, onAuthStateChanged steps aside and lets whoever set it drive
// currentUser/enterApp() themselves — used by the "create admin account"
// flow below, which needs to write the new profile doc and read it back in
// a guaranteed order (see the comment at suppressAuthListener=true there).
let suppressAuthListener = false;

function initAuth(){
  if(DB.isLive() && typeof firebase.auth === 'function'){
    firebase.auth().onAuthStateChanged(async fbUser => {
      if(suppressAuthListener) return;
      if(!fbUser){
        currentUser = null;
        stopIdleTimer();
        const msg = pendingLoginMessage; pendingLoginMessage = null;
        showLoginScreen(msg);
        return;
      }
      try{
        await ensureDbInit();
        const doc = await DB.fsdb.collection('m_users').doc(fbUser.uid).get();
        if(doc.exists && doc.data().active !== false){
          currentUser = Object.assign({ uid: fbUser.uid }, doc.data());
          enterApp();
        } else {
          await firebase.auth().signOut();
          showLoginScreen('Your account isn\'t set up for access yet. Ask your admin to add you under Manage Users.');
        }
      }catch(err){
        console.error('Could not load your user profile.', err);
        await firebase.auth().signOut();
        showLoginScreen('Could not verify your account: ' + err.message);
      }
    });
  } else {
    showLoginScreen();
  }
}

function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(/user-not-found|wrong-password|invalid-credential|invalid-login-credentials/.test(code)) return 'Incorrect email or password.';
  if(/too-many-requests/.test(code)) return 'Too many attempts — try again in a few minutes.';
  if(/invalid-email/.test(code)) return 'That email address looks invalid.';
  if(/email-already-in-use/.test(code)) return 'A user with that email already exists.';
  if(/weak-password/.test(code)) return 'Password must be at least 6 characters.';
  return (err && err.message) || 'Sign-in failed.';
}

function enterApp(){
  document.getElementById('auth-root').style.display = 'none';
  document.getElementById('auth-root').innerHTML = '';
  document.getElementById('app-shell').style.display = 'flex';
  applyRoleVisibility();
  renderUserInfo();
  if(!canAccessView(currentView)) currentView = 'dashboard';
  render();
  resetIdleTimer();
}

function applyRoleVisibility(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    // Routed through canAccessView() so a per-user override (not just the
    // per-role grid) correctly shows/hides the sidebar nav button too.
    const allowed = KNOWN_VIEWS.includes(b.dataset.view) ? canAccessView(b.dataset.view) : true;
    b.style.display = allowed ? '' : 'none';
  });
  const adminLabel = document.getElementById('admin-nav-label');
  if(adminLabel){
    // Shared by Head and the new Admin role — show the "System" group
    // whenever the signed-in user can open at least one of the pages under
    // it, rather than hardcoding a single role.
    const systemViews = ['users','workflow','statusConfig','pageAccess','auditTrail'];
    const hasSystemAccess = systemViews.some(v => canAccessView(v));
    adminLabel.style.display = hasSystemAccess ? '' : 'none';
  }
}

function renderUserInfo(){
  const el = document.getElementById('user-info');
  if(!el || !currentUser) return;
  el.innerHTML = `

    <button class="btn btn-sm btn-ghost" id="logout-btn">Log out</button>`;

function showLoginScreen(errorMsg){
  currentUser = null;
  const shell = document.getElementById('app-shell');
  if(shell) shell.style.display = 'none';
  const root = document.getElementById('auth-root');
  root.style.display = 'block';
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Land Leads ERP</h1>
        <div class="sub">MP Developers — sign in to continue</div>
        <form id="auth-form">
        <label>Email</label><input type="email" id="auth-email" autocomplete="username">
        <label>Password</label><input type="password" id="auth-password" autocomplete="current-password">
        ${errorMsg ? `<div class="auth-error">${errorMsg}</div>` : ''}
        <button class="btn btn-teal" id="auth-login-btn" type="submit">Sign In</button>
        </form>
        <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="#" id="auth-forgot" style="color:var(--teal);">Forgot password?</a></div>
        <div style="text-align:center;margin-top:8px;font-size:12px;"><a href="#" id="auth-bootstrap-link" style="color:var(--muted);">Setting this up for the first time? Create the admin account</a></div>
        ${!DB.isLive() ? `<p style="font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6;">Demo mode — try <b>Saravanan@mpdevelopers.com</b> / 123456 (Admin), <b>manager@demo.local</b> / manager123 (Manager), or <b>karthik@demo.local</b> / exec123 (Executive).</p>` : ''}
      </div>
    </div>`;
  // A real <form> with a type="submit" button means both clicking Sign In
  // AND pressing Enter in either field submit the same way (native browser
  // behavior) — no separate keydown listener needed, and no risk of it
  // firing twice.
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ showLoginScreen('Enter both email and password.'); return; }
    try{
      if(DB.isLive()){
        await firebase.auth().signInWithEmailAndPassword(email, password);
        // onAuthStateChanged picks this up and calls enterApp().
      } else {
        currentUser = await DB.login(email, password);
        enterApp();
      }
    }catch(err){ showLoginScreen(friendlyAuthError(err)); }
  };
  document.getElementById('auth-forgot').onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    if(!email){ alert('Enter your email above first, then click "Forgot password?" again.'); return; }
    if(!DB.isLive()){ alert('Password reset isn\'t available in demo mode.'); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email); alert('Password reset email sent to ' + email + '.'); }
    catch(err){ alert('Could not send reset email: ' + friendlyAuthError(err)); }
  };
  document.getElementById('auth-bootstrap-link').onclick = (e) => { e.preventDefault(); showBootstrapScreen(); };
}

function showBootstrapScreen(){
  const root = document.getElementById('auth-root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Create the Admin Account</h1>
        <div class="sub">One-time setup — this becomes the first Admin login.</div>
        <label>Your Name</label><input type="text" id="bs-name">
        <label>Email</label><input type="email" id="bs-email" autocomplete="username">
        <label>Password</label><input type="password" id="bs-password" autocomplete="new-password" placeholder="At least 6 characters">
        <div id="bs-error"></div>
        <button class="btn btn-teal" id="bs-create-btn">Create Admin Account</button>
        <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="#" id="bs-back" style="color:var(--teal);">Back to sign in</a></div>
      </div>
    </div>`;
  document.getElementById('bs-back').onclick = (e) => { e.preventDefault(); showLoginScreen(); };
  document.getElementById('bs-create-btn').onclick = async () => {
    const name = document.getElementById('bs-name').value.trim();
    const email = document.getElementById('bs-email').value.trim();
    const password = document.getElementById('bs-password').value;
    const errEl = document.getElementById('bs-error');
    errEl.innerHTML = '';
    if(!name || !email || !password){ errEl.innerHTML = '<div class="auth-error">All fields are required.</div>'; return; }
    if(password.length < 6){ errEl.innerHTML = '<div class="auth-error">Password must be at least 6 characters.</div>'; return; }
    try{
      if(DB.isLive()){
        // createUserWithEmailAndPassword fires onAuthStateChanged the
        // moment it resolves — racing the profile-doc write below. If that
        // listener's read lands first, it finds no doc yet, signs the
        // brand-new account straight back out, and shows a confusing
        // "account isn't set up for access" error even though the account
        // (and its profile) end up created moments later. Suppress the
        // listener for this one flow and drive currentUser/enterApp()
        // ourselves, in the guaranteed order: create → write → enter.
        suppressAuthListener = true;
        try{
          const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
          const profile = { name, email, phone:'', role:'admin', active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
          await ensureDbInit();
          await DB.fsdb.collection('m_users').doc(cred.user.uid).set(profile);
          currentUser = Object.assign({ uid: cred.user.uid }, profile);
          enterApp();
        } finally {
          suppressAuthListener = false;
        }
      } else {
        currentUser = await DB.createUser({ name, email, phone:'', role:'admin', password });
        enterApp();
      }
    }catch(err){ errEl.innerHTML = '<div class="auth-error">' + friendlyAuthError(err) + '</div>'; }
  };
}

// ---- Derived calculations ----------------------------------------------
function leadExtentSqft(l){ return extentSqft(l.extentValue, l.extentUnit); }
function leadPricePerSqft(l){ return pricePerSqft(l.priceValue, l.priceUnit); }
function leadValue(l){ return leadExtentSqft(l) * leadPricePerSqft(l); }
// Final Price (set when a lead is closed as Acquired — see renderTransitionBlock()'s
// isClosing branch) is a per-unit rate in the SAME priceUnit as the lead's own
// Quoted Price, never a total — same unit-conversion pattern as leadValue()
// above, just reading finalPrice instead of priceValue, for MIS Analytics'
// "Acquired Value" (the actual closing rate, not the original ask).
function leadFinalValue(l){ return l.finalPrice==null ? null : leadExtentSqft(l) * pricePerSqft(l.finalPrice, l.priceUnit); }
function isClosed(l){ return l.stage==='closed'; }
function isActive(l){ return !isClosed(l); }
function daysInStage(l){
  const last = l.stageHistory && l.stageHistory.length ? l.stageHistory[l.stageHistory.length-1] : null;
  const since = last ? new Date(last.at) : new Date(l.createdAt);
  return daysBetween(since, new Date());
}
function isOverdueStage(l){
  const st = STAGES.find(s=>s.key===l.stage);
  if(!st || st.sla==null) return false;
  return daysInStage(l) > st.sla;
}
function callBadgeInfo(l){
  if(!l.nextCallDate) return null;
  const d = new Date(l.nextCallDate); const t = new Date(todayStr());
  const diff = daysBetween(t, d);
  if(diff < 0) return {type:'danger', text:'Overdue ' + Math.abs(diff) + 'd'};
  if(diff === 0) return {type:'warn', text:'Due today'};
  return {type:'muted', text:'In ' + diff + 'd'};
}
function leadMatchesFilters(l, f){
  if(f.stage && l.stage !== f.stage) return false;
  if(f.excludeClosed && l.stage === 'closed') return false;
  if(f.source && l.leadSource !== f.source) return false;
  if(f.channelPartner && l.channelPartnerCode !== f.channelPartner) return false;
  if(f.project && l.projectCode !== f.project) return false;
  if(f.exec && l.assignedExecutive !== f.exec) return false;
  if(f.dateFrom){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d < f.dateFrom) return false; }
  if(f.dateTo){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d > f.dateTo) return false; }
  if(f.onHold && !(l.onHold && l.onHold.active)) return false;
  if(f.callDueOrOverdue && !(l.nextCallDate && new Date(l.nextCallDate) <= new Date(todayStr()))) return false;
  if(f.letter){ const v=(l.village||'').trim().toUpperCase(); if(!v.startsWith(f.letter)) return false; }
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [l.leadId,l.village,l.siteLocation,l.landownerName,l.surveyNumber].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// ---- DASHBOARD -----------------------------------------------------------
function renderDashboard(){
  const leads = visibleLeads();
  const active = leads.filter(isActive);
  const overdueCalls = leads.filter(l=>isActive(l) && l.nextCallDate && new Date(l.nextCallDate) < new Date(todayStr()));
  const dueToday = leads.filter(l=>isActive(l) && l.nextCallDate === todayStr());
  const ageingAlerts = active.filter(isOverdueStage);
  const onHoldCount = active.filter(l=>l.onHold && l.onHold.active).length;

  // Pipeline Funnel — a donut chart (lead count by stage, a true part-to-
  // whole breakdown: every lead is in exactly one stage), matching the
  // "Stock Position" donut style from her Sales Dashboard: a colored ring
  // with a value on each big-enough segment, plus a swatch legend below.
  // Colors follow the current STAGES order (not hardcoded stage keys), so
  // this stays correct as stages are renamed/reordered/added on Status
  // Config; only wraps back to slot 1 in the unlikely case of >8 stages.
  const donutTotal = leads.length;
  const donutCX = 110, donutCY = 110, donutOuterR = 90, donutStroke = 36;
  const donutR = donutOuterR - donutStroke/2;
  const donutCircumference = 2 * Math.PI * donutR;
  let donutCumPct = 0;
  const donutSegs = STAGES.map((s,i)=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    const pct = donutTotal ? count/donutTotal : 0;
    const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
    const dashLen = pct * donutCircumference;
    const dashArray = `${dashLen} ${Math.max(0, donutCircumference - dashLen)}`;
    const dashOffset = -donutCumPct * donutCircumference;
    // Mid-angle of this segment, clockwise from 12 o'clock — matches the
    // rotate(-90) applied to every ring segment below, so labels land
    // centered in their own slice without needing to rotate the text itself.
    const midAngleRad = (-90 + (donutCumPct + pct/2) * 360) * Math.PI / 180;
    const labelX = donutCX + donutR * Math.cos(midAngleRad);
    const labelY = donutCY + donutR * Math.sin(midAngleRad);
    const showLabel = pct >= 0.04 && count > 0; // skip labeling slivers too thin to hold a number
    donutCumPct += pct;
    return { s, count, color, dashArray, dashOffset, labelX, labelY, showLabel };
  });
  const donutSegsSvg = donutSegs.map(d =>
    `<circle class="donut-seg" data-stage="${d.s.key}" cx="${donutCX}" cy="${donutCY}" r="${donutR}" fill="none" stroke="${d.color}" stroke-width="${donutStroke}" stroke-dasharray="${d.dashArray}" stroke-dashoffset="${d.dashOffset}" transform="rotate(-90 ${donutCX} ${donutCY})"><title>${d.s.label}: ${d.count} lead${d.count===1?'':'s'}</title></circle>`
  ).join('');
  const donutLabelsSvg = donutSegs.filter(d=>d.showLabel).map(d =>
    `<text class="donut-label" data-stage="${d.s.key}" x="${d.labelX.toFixed(1)}" y="${d.labelY.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${readableTextOn(d.color)}">${d.count}</text>`
  ).join('');
  const donutSvg = donutTotal
    ? `<svg viewBox="0 0 220 220" width="220" height="220">${donutSegsSvg}${donutLabelsSvg}</svg>`
    : `<svg viewBox="0 0 220 220" width="220" height="220"><circle cx="${donutCX}" cy="${donutCY}" r="${donutR}" fill="none" stroke="#eceff3" stroke-width="${donutStroke}"/></svg>`;
  const donutLegend = STAGES.map((s,i)=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    return `<span class="legend-item" data-stage="${s.key}"><span class="legend-swatch" style="background:${DONUT_PALETTE[i % DONUT_PALETTE.length]}"></span>${s.label} (${count})</span>`;
  }).join('');

  // "New Leads" — every lead still sitting in the very first stage, newest
  // first, with the date it was created. Clicking a row goes to the same
  // place as the dashboard's other drill-throughs — the All Leads page,
  // filtered to just these — rather than opening that one lead's detail.
  const newLeadsList = leads.filter(l=>l.stage==='new').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8).map(l=>
    `<div class="callitem" data-drill="newLeads" style="cursor:pointer;"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(${l.assignedExecutive})</span></span>
      <span class="badge badge-navy">${fmtDate(l.createdAt)}</span></div>`
  ).join('') || '<div class="empty">No new leads yet</div>';

  // "Yet to be Site Visited" — just the count of leads sitting in whichever
  // stage immediately precedes "Site Visited" (Contacted, by default), not a
  // per-lead list — click it to drill into that filtered list on All Leads.
  // Resolved by key so it keeps working if that stage gets renamed or
  // reordered on Status Config.
  const siteVisitedIdx = STAGE_KEYS.indexOf('site_visited');
  const preSiteVisitKey = siteVisitedIdx > 0 ? STAGE_KEYS[siteVisitedIdx-1] : null;

  const bySource = {};

    `<tr class="clickable-row" data-source="${src}"><td>${src}</td><td>${c}</td><td>${leads.length?Math.round(c/leads.length*100):0}%</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No leads yet</td></tr>';

  const byCP = {};

  const callList = leads.filter(l=>isActive(l) && l.nextCallDate).sort((a,b)=>new Date(a.nextCallDate)-new Date(b.nextCallDate)).slice(0,8).map(l=>{

  }).join('') || '<div class="empty">No upcoming calls scheduled</div>';

  const ageingList = ageingAlerts.slice(0,8).map(l=>{
    const st = STAGES.find(s=>s.key===l.stage);
    return `<div class="callitem" data-open-id="${l.id}"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(${st.label})</span></span>
      <span class="badge badge-danger">${daysInStage(l)}d in stage (SLA ${st.sla}d)</span></div>`;
  }).join('') || '<div class="empty">No leads currently past their stage SLA</div>';

  return `

    </div>

    <div class="grid cards4">
      <div class="card stat" data-drill="active"><div class="label">Active Leads</div><div class="value">${active.length}</div><div class="sub">${leads.length} total incl. closed — click to view</div></div>

// ---- Export helpers -------------------------------------------------------
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(','))).join('\n');
}
// ---- Generic row exporters (used by the Reports page) --------------------
function exportRowsExcel(rows, filename, sheetName){
  if(!rows.length){ alert('Nothing to export.'); return; }
  if(typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName||'Sheet1');
    XLSX.writeFile(wb, filename);
  } else {
    downloadBlob(toCSV(rows), filename.replace(/\.xlsx$/,'.csv'), 'text/csv;charset=utf-8;');
    alert('The Excel library did not load (likely offline) — downloaded a CSV instead, which opens fine in Excel.');
  }
}
function exportRowsPDF(rows, filename, title){
  if(!rows.length){ alert('Nothing to export.'); return; }
  const columns = Object.keys(rows[0]);
  if(typeof window.jspdf !== 'undefined'){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14); doc.text(title, 14, 16);
    doc.setFontSize(9); doc.setTextColor(120); doc.text(new Date().toLocaleString('en-IN'), 14, 22); doc.setTextColor(0);
    doc.autoTable({ startY:28, head:[columns], body: rows.map(r=>columns.map(c=>r[c])), styles:{fontSize:8}, headStyles:{fillColor:[27,42,74]} });
    doc.save(filename);
  } else {
    alert("The PDF library did not load (likely offline) — using your browser's Print dialog instead. Choose \"Save as PDF\" as the destination.");
    window.print();
  }
}
function leadsReportRows(){
  return visibleLeads().map(l=>({
    'Lead ID': l.leadId, Village: l.village||'', Project: l.projectCode||'', Stage: stageLabel(l.stage), Source: l.leadSource||'',
    'Channel Partner': l.channelPartnerCode||'', Executive: l.assignedExecutive||'',
    'Lead Date': (l.leadSourceDateTime||'').slice(0,10), 'On Hold': (l.onHold&&l.onHold.active)?'Yes':'No', Outcome: l.outcome||''
  }));
}
// Payments Report (spec Module 12) — one row per recorded payment, flattened
// across every lead this role can see (same visibleLeads() scoping as every
// other report here).
function paymentReportRows(){
  const rows = [];
  visibleLeads().forEach(l=>{
    (l.paymentLog||[]).forEach(p=>{
      rows.push({
        'Lead ID': l.leadId, Village: l.village||'', Project: l.projectCode||'',
        Date: (p.date||'').slice(0,10), Type: p.paymentType||'', Mode: p.mode||'',
        Amount: p.amount, 'Reference No.': p.referenceNumber||'', 'Paid To': p.paidTo||'',
        'Recorded By': p.recordedBy||'', Remarks: p.remarks||'',
      });
    });
  });
  rows.sort((a,b)=> (b.Date||'').localeCompare(a.Date||''));
  return rows;
}
// Registration Report (spec Module 13) — same flattening pattern as Payments.
function registrationReportRows(){
  const rows = [];
  visibleLeads().forEach(l=>{
    (l.registrationLog||[]).forEach(r=>{
      rows.push({
        'Lead ID': l.leadId, Village: l.village||'', Project: l.projectCode||'',

        'SRO Office': r.sroOffice||'', 'Document Type': r.documentType||'',
        'Stamp Duty': r.stampDuty, 'Registration Charges': r.registrationCharges,
        'Registered By': r.registeredBy||'',
      });
    });
  });
  rows.sort((a,b)=> (b['Registration Date']||'').localeCompare(a['Registration Date']||''));
  return rows;

// Project-wise Summary (Project Mapping) — one row per Project master entry
// plus a trailing "Unassigned" row for any visible lead with no (or an
// unknown) projectCode, so every visible lead is accounted for exactly
// once. Extent is normalized to Acres (via leadExtentSqft()/sqftToUnit(),
// the same unit-conversion helpers the Overview tab already uses) since
// leads can each quote their own extent in a different unit.
function projectSummaryRows(){
  const leads = visibleLeads();
  const projects = DB.getMasters('projects');
  const groups = projects.map(p=>({ label: p.code+' — '+p.name, leads: leads.filter(l=>l.projectCode===p.code) }));
  const knownCodes = new Set(projects.map(p=>p.code));
  const unassigned = leads.filter(l=>!l.projectCode || !knownCodes.has(l.projectCode));
  if(unassigned.length) groups.push({ label:'Unassigned / No Project', leads: unassigned });
  return groups.map(g=>{
    const acquired = g.leads.filter(l=>l.outcome==='acquired').length;
    const dropped = g.leads.filter(l=>l.outcome==='dropped').length;
    const activeCount = g.leads.length - acquired - dropped;
    const totalExtentSqft = g.leads.reduce((s,l)=> s + leadExtentSqft(l), 0);
    const totalPaid = g.leads.reduce((s,l)=> s + paymentSummary(l).totalPaid, 0);
    return {
      Project: g.label, 'Total Leads': g.leads.length, Active: activeCount, Acquired: acquired, Dropped: dropped,
      'Total Extent (Acres)': Number(sqftToUnit(totalExtentSqft,'acre').toFixed(2)),
      'Total Payments': Number(totalPaid.toFixed(2)),
    };
  });
}
function siteVisitReportRows(){
  const rows = [];
  visibleLeads().forEach(l=>{
    (l.stageHistory||[]).forEach(h=>{
      if(h.stage==='site_visited') rows.push({
        'Lead ID': l.leadId, Village: l.village||'', 'Visited On': (h.at||'').slice(0,10),
        'Logged By': h.by||'', Executive: l.assignedExecutive||'', Source: l.leadSource||''
      });
    });
  });
  rows.sort((a,b)=> (b['Visited On']||'').localeCompare(a['Visited On']||''));
  return rows;
}
