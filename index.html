<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Leads ERP — Prototype (Phase 1)</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-light:#28406e; --gold:#B8912F; --gold-light:#e6c874;
    --teal:#1F6F6B; --teal-light:#2c9a94;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#1F2430; --muted:#6B7280; --border:#E3E6EC;
    --danger:#C0392B; --danger-bg:#FBEAE8; --warn:#B8720A; --warn-bg:#FCF0DC; --ok:#22785A; --ok-bg:#E4F3EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header .brand{display:flex;flex-direction:column;}
  header .brand .co{font-size:11px;letter-spacing:1.5px;color:var(--gold-light);font-weight:700;}
  header .brand .title{font-size:19px;font-weight:700;}
  header .actions{display:flex;gap:10px;align-items:center;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-gold{background:var(--gold);color:#2b2200;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-light);}
  .btn-outline{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;}
  .btn-outline:hover{background:rgba(255,255,255,.12);}
  .btn-ghost{background:var(--border);color:var(--text);}
  .btn-ghost:hover{background:#d8dce4;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;}
  nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;}
  nav button{background:none;border:none;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;}
  nav button.active{color:var(--navy);border-bottom-color:var(--gold);}
  main{padding:20px 24px 60px;max-width:1400px;margin:0 auto;}
  .banner{background:var(--warn-bg);border:1px solid #edd9ab;color:#6b4c05;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .banner b{color:var(--navy);}
  .banner button{background:none;border:none;color:#6b4c05;font-weight:700;cursor:pointer;font-size:16px;line-height:1;}
  .grid{display:grid;gap:14px;}
  .cards4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .stat .value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  h2.section-title{font-size:15px;color:var(--navy);margin:26px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;}
  h2.section-title .tag{background:var(--teal);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;background:#F8F9FB;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);}
  table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table tr.clickable:hover{background:#F6F8FB;cursor:pointer;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-navy{background:#e7ecf5;color:var(--navy);}
  .badge-gold{background:#faf1da;color:#8a6a10;}
  .badge-muted{background:#eef0f3;color:var(--muted);}
  .funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
  .funnel-row .flabel{width:170px;flex:0 0 170px;color:var(--navy);font-weight:600;}
  .funnel-row .fbar-wrap{flex:1;background:#eceff3;border-radius:6px;overflow:hidden;height:22px;position:relative;}
  .funnel-row .fbar{background:linear-gradient(90deg,var(--teal),var(--navy));height:100%;border-radius:6px;}
  .funnel-row .fcount{width:34px;text-align:right;font-weight:700;color:var(--navy);}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
  .col{background:#EAEDF2;border-radius:10px;padding:10px;min-width:250px;flex:0 0 250px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--navy);padding:4px 6px 10px;}
  .col-head .count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;}
  .lead-card{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;border:1px solid var(--border);border-left:4px solid var(--teal);cursor:pointer;font-size:12.5px;}
  .lead-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .lead-card .lid{font-weight:700;color:var(--navy);font-size:12px;}
  .lead-card .vil{font-weight:600;margin:2px 0;}
  .lead-card .meta{color:var(--muted);font-size:11.5px;}
  .lead-card .badges{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input, .toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .toolbar input[type=text]{min-width:220px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{background:var(--navy);color:#fff;padding:16px 22px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-head .x{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.8;}
  .modal-body{padding:20px 22px;max-height:75vh;overflow-y:auto;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  input[type=text],input[type=date],input[type=number],input[type=datetime-local],select,textarea{
    width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);
  }
  textarea{resize:vertical;min-height:44px;}
  .field-pair{display:flex;gap:6px;}
  .field-pair input{flex:1;}
  .field-pair select{flex:0 0 100px;}
  .computed{font-size:11.5px;color:var(--teal);margin-top:3px;font-weight:600;}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 0 16px;}
  legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  .stage-track{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .stage-pill{padding:6px 12px;border-radius:16px;font-size:11.5px;font-weight:700;background:#eceff3;color:var(--muted);border:1px solid transparent;}
  .stage-pill.done{background:var(--ok-bg);color:var(--ok);}
  .stage-pill.now{background:var(--navy);color:#fff;}
  .modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;border-radius:0 0 12px 12px;}
  .history-item{border-left:2px solid var(--border);padding:2px 0 10px 14px;margin-left:4px;position:relative;font-size:12.5px;}
  .history-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .history-item .when{color:var(--muted);font-size:11px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .doc-row:last-child{border-bottom:none;}
  .inline-add{display:flex;gap:6px;margin-top:8px;}
  .inline-add input, .inline-add select{flex:1;}
  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0;}
  .setup-code{background:#111827;color:#d1e7ff;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre;}
  .callitem{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12.5px;}
  .callitem:last-child{border-bottom:none;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;}}
  .footer-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="co">MP DEVELOPERS</span>
    <span class="title">Land Leads ERP — Prototype (Phase 1)</span>
  </div>
  <div class="actions">
    <button class="btn btn-gold" id="btn-new-lead">+ New Lead</button>
  </div>
</header>

<nav id="tabs">
  <button data-view="dashboard" class="active">Dashboard</button>
  <button data-view="board">Pipeline Board</button>
  <button data-view="list">All Leads</button>
  <button data-view="setup">Connect to Firebase</button>
</nav>

<main>
  <div id="banner-holder"></div>
  <div id="view-root"></div>
  <div class="footer-note">Phase 1 prototype — running on in-memory sample data. See the "Connect to Firebase" tab to wire this up to your own Firestore project for real persistence.</div>
</main>

<div id="modal-root"></div>

<script>
/* =========================================================================
   LAND LEADS ERP — PHASE 1 PROTOTYPE
   MP Developers | Built to accompany "Land Leads ERP — Recommendations & Roadmap"

   DATA LAYER
   ----------
   This prototype runs on an in-memory data layer (the DB object below) so it
   is fully interactive right out of the box with no setup required. When you
   are ready to go live, see the "Connect to Firebase" tab in the app itself
   (and the FIREBASE WIRING block near the bottom of this script) for the
   drop-in Firestore + Storage implementation that replaces it — same pattern
   as your Sales Dashboard and Document Management System.
   ========================================================================= */

// ---- Reference data -------------------------------------------------
const STAGES = [
  { key:'new',            label:'New',                    sla:2  },
  { key:'contacted',      label:'Contacted',               sla:7  },
  { key:'site_visited',   label:'Site Visited',            sla:5  },
  { key:'under_eval',     label:'Under Evaluation',        sla:14 },
  { key:'doc_legal',      label:'Documentation & Legal',   sla:10 },
  { key:'negotiation',    label:'Negotiation',             sla:14 },
  { key:'closed',         label:'Closed',                  sla:null },
];
const STAGE_INDEX = Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
const stageLabel = k => (STAGES.find(s=>s.key===k)||{}).label || k;

const LEAD_SOURCES = ['Website Enquiry','Channel Partner','Direct / Walk-in','Referral','Field Survey','Cold Call','Other'];
const LAND_CLASSES = ['Agricultural','DTCP Approved Layout','Patta Land','Government Land','Disputed / Litigation','Other'];
const DROP_REASONS = ['Price mismatch','Title / legal issue','Owner unwilling','Land unsuitable (technical)','Budget not approved','Lost to competitor','Other'];
const HOLD_REASONS = ['Awaiting owner decision','Budget deferred','Litigation pending','Awaiting documents','Other'];
const EXTENT_UNITS = { acre:{label:'Acre',sqft:43560}, ground:{label:'Ground',sqft:2400}, cent:{label:'Cent',sqft:435.6}, sqft:{label:'Sqft',sqft:1} };
const FEAS_STATUSES = ['Not Started','In Progress','Cleared','Failed'];

const fmtINR = n => n==null||isNaN(n) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const fmtNum = n => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('en-IN', {maximumFractionDigits:1});
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const daysBetween = (a,b) => Math.floor((b-a)/86400000);
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = p => p + '-' + Math.random().toString(36).slice(2,7).toUpperCase();

function extentSqft(v,u){ return (v||0) * (EXTENT_UNITS[u]?.sqft || 1); }
function pricePerSqft(v,u){ return (v||0) / (EXTENT_UNITS[u]?.sqft || 1); }

// ---- Sample seed data (demo mode only) -------------------------------
function seedLeads(){
  const now = Date.now();
  const daysAgo = n => new Date(now - n*86400000).toISOString();
  const mk = (o) => Object.assign({
    id: uid('LL-2026'),
    createdAt: daysAgo(o.age||0),
    leadSourceDateTime: daysAgo(o.age||0),
    surveyNumber:'', googlePin:'', landClassification:'Agricultural',
    landownerName:'', landownerPhone:'', landownerJointOwners:1,
    mediatorName:'', mediatorPhone:'', mediatorCommission:'',
    assignedExecutive:'Karthik R', nextCallDate:'', reasonCode:'', reasonNotes:'',
    onHold:{active:false, reasonCode:'', notes:'', since:''},
    contactSubStatus:{ mediator:{contacted:false,date:''}, landowner:{contacted:false,date:''} },
    feasibility:{ technical:{status:'Not Started',notes:''}, financial:{status:'Not Started',notes:''} },
    documents:[], negotiationLog:[], approval:{approver:'',date:'',remarks:''},
    finalPrice:null, finalDate:'', outcome:'',
    stageHistory:[{stage:o.stage, at:daysAgo(o.stageAge!=null?o.stageAge:o.age||0), by:o.assignedExecutive||'Karthik R', note:'Lead created'}],
  }, o);

  return [
    mk({stage:'new', age:1, stageAge:1, village:'Oragadam', siteLocation:'Near NH48 service road', extentValue:2.5, extentUnit:'acre', priceValue:1.1, priceUnit:'acre', priceUnitLabel:'per Acre', leadSource:'Website Enquiry', assignedExecutive:'Karthik R'}),
    mk({stage:'contacted', age:9, stageAge:8, village:'Guduvancheri', siteLocation:'Behind bus depot', extentValue:60, extentUnit:'cent', priceValue:38, priceUnit:'cent', leadSource:'Channel Partner', channelPartnerCode:'CP-014', assignedExecutive:'Divya S', nextCallDate: todayStr(),
      contactSubStatus:{ mediator:{contacted:true,date:daysAgo(6)}, landowner:{contacted:false,date:''} }}),
    mk({stage:'site_visited', age:14, stageAge:4, village:'Thiruporur', siteLocation:'Off ECR link road', extentValue:1.8, extentUnit:'acre', priceValue:95, priceUnit:'ground', leadSource:'Field Survey', assignedExecutive:'Karthik R', landClassification:'DTCP Approved Layout'}),
    mk({stage:'under_eval', age:30, stageAge:22, village:'Sriperumbudur', siteLocation:'SIPCOT approach road', extentValue:4, extentUnit:'acre', priceValue:0.9, priceUnit:'acre', leadSource:'Direct / Walk-in', assignedExecutive:'Divya S', nextCallDate: daysAgo(-2).slice(0,10),
      feasibility:{ technical:{status:'In Progress',notes:'Awaiting soil test report'}, financial:{status:'Cleared',notes:'Within board-approved budget band'} },
      onHold:{active:true, reasonCode:'Awaiting documents', notes:'Owner arranging patta copy', since: daysAgo(5)}}),
    mk({stage:'doc_legal', age:40, stageAge:9, village:'Mahabalipuram', siteLocation:'ECR frontage', extentValue:1.2, extentUnit:'acre', priceValue:1.4, priceUnit:'acre', leadSource:'Channel Partner', channelPartnerCode:'CP-007', assignedExecutive:'Karthik R',
      documents:[{name:'FMB Drawing', url:'(pending upload)', addedAt:daysAgo(8)},{name:'Patta Copy', url:'(pending upload)', addedAt:daysAgo(6)}]}),
    mk({stage:'negotiation', age:55, stageAge:11, village:'Chengalpattu', siteLocation:'Near bypass junction', extentValue:3.2, extentUnit:'acre', priceValue:1.05, priceUnit:'acre', leadSource:'Referral', assignedExecutive:'Divya S',
      approval:{approver:'Land Manager', date:daysAgo(10), remarks:'Approved to proceed to negotiation'},
      negotiationLog:[{date:daysAgo(9), offerBy:'Us', amount:100, notes:'Opening offer per acre (lakh)'},{date:daysAgo(4), offerBy:'Owner', amount:112, notes:'Counter'}]}),
    mk({stage:'closed', age:70, stageAge:0, village:'Padappai', siteLocation:'Grand Southern Trunk Rd', extentValue:2, extentUnit:'acre', priceValue:0.85, priceUnit:'acre', leadSource:'Channel Partner', channelPartnerCode:'CP-014', assignedExecutive:'Karthik R',
      outcome:'acquired', finalPrice:0.88, finalDate:daysAgo(3),
      approval:{approver:'MD', date:daysAgo(4), remarks:'Approved'} }),
    mk({stage:'closed', age:48, stageAge:0, village:'Vandalur', siteLocation:'Near ATC road', extentValue:1.5, extentUnit:'acre', priceValue:1.3, priceUnit:'acre', leadSource:'Website Enquiry', assignedExecutive:'Divya S',
      outcome:'dropped', reasonCode:'Title / legal issue', reasonNotes:'Pending partition suit found during EC check'}),
  ];
}

// ---- In-memory data layer (Phase 1 demo) -----------------------------
const DB = {
  _leads: seedLeads(),
  getLeads(){ return this._leads; },
  addLead(lead){ this._leads.unshift(lead); },
  updateLead(id, patch){
    const i = this._leads.findIndex(l=>l.id===id);
    if(i>-1) this._leads[i] = Object.assign({}, this._leads[i], patch);
  },
  getLead(id){ return this._leads.find(l=>l.id===id); },
};

// ---- App state ---------------------------------------------------------
let currentView = 'dashboard';
let listFilters = { stage:'', source:'', exec:'', q:'' };

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));
  const root = document.getElementById('view-root');
  if(currentView==='dashboard') root.innerHTML = renderDashboard();
  else if(currentView==='board') root.innerHTML = renderBoard();
  else if(currentView==='list') root.innerHTML = renderList();
  else if(currentView==='setup') root.innerHTML = renderSetup();
  wireViewEvents();
}

// ---- Derived calculations ----------------------------------------------
function leadExtentSqft(l){ return extentSqft(l.extentValue, l.extentUnit); }
function leadPricePerSqft(l){ return pricePerSqft(l.priceValue, l.priceUnit); }
function leadValue(l){ return leadExtentSqft(l) * leadPricePerSqft(l); }
function isClosed(l){ return l.stage==='closed'; }
function isActive(l){ return !isClosed(l); }
function daysInStage(l){
  const last = l.stageHistory && l.stageHistory.length ? l.stageHistory[l.stageHistory.length-1] : null;
  const since = last ? new Date(last.at) : new Date(l.createdAt);
  return daysBetween(since, new Date());
}
function isOverdueStage(l){
  const st = STAGES.find(s=>s.key===l.stage);
  if(!st || st.sla==null) return false;
  return daysInStage(l) > st.sla;
}
function callBadgeInfo(l){
  if(!l.nextCallDate) return null;
  const d = new Date(l.nextCallDate); const t = new Date(todayStr());
  const diff = daysBetween(t, d);
  if(diff < 0) return {type:'danger', text:'Overdue ' + Math.abs(diff) + 'd'};
  if(diff === 0) return {type:'warn', text:'Due today'};
  return {type:'muted', text:'In ' + diff + 'd'};
}

// ---- DASHBOARD -----------------------------------------------------------
function renderDashboard(){
  const leads = DB.getLeads();
  const active = leads.filter(isActive);
  const totalExtentAcre = active.reduce((s,l)=>s+leadExtentSqft(l),0) / 43560;
  const totalValueApprox = active.reduce((s,l)=>s+leadValue(l),0); // priceValue is often in lakh in seed notes; treated as unit currency here
  const overdueCalls = leads.filter(l=>isActive(l) && l.nextCallDate && new Date(l.nextCallDate) < new Date(todayStr()));
  const dueToday = leads.filter(l=>isActive(l) && l.nextCallDate === todayStr());
  const ageingAlerts = active.filter(isOverdueStage);
  const onHoldCount = active.filter(l=>l.onHold && l.onHold.active).length;

  const funnelRows = STAGES.map(s=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    const max = Math.max(1, ...STAGES.map(st=>leads.filter(l=>l.stage===st.key).length));
    const pct = Math.round((count/max)*100);
    return `<div class="funnel-row"><div class="flabel">${s.label}</div><div class="fbar-wrap"><div class="fbar" style="width:${pct}%"></div></div><div class="fcount">${count}</div></div>`;
  }).join('');

  const bySource = {};
  leads.forEach(l=>{ bySource[l.leadSource]=(bySource[l.leadSource]||0)+1; });
  const sourceRows = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([src,c])=>
    `<tr><td>${src}</td><td>${c}</td><td>${Math.round(c/leads.length*100)}%</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No leads yet</td></tr>';

  const byCP = {};
  leads.filter(l=>l.channelPartnerCode).forEach(l=>{ byCP[l.channelPartnerCode]=(byCP[l.channelPartnerCode]||0)+1; });
  const cpRows = Object.entries(byCP).sort((a,b)=>b[1]-a[1]).map(([cp,c])=>
    `<tr><td>${cp}</td><td>${c}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No channel partner leads yet</td></tr>';

  const callList = leads.filter(l=>isActive(l) && l.nextCallDate).sort((a,b)=>new Date(a.nextCallDate)-new Date(b.nextCallDate)).slice(0,8).map(l=>{
    const info = callBadgeInfo(l);
    return `<div class="callitem"><span><b>${l.id}</b> — ${l.village} <span style="color:var(--muted)">(${l.assignedExecutive})</span></span>
      <span class="badge badge-${info.type==='danger'?'danger':info.type==='warn'?'warn':'muted'}">${info.text} · ${fmtDate(l.nextCallDate)}</span></div>`;
  }).join('') || '<div class="empty">No upcoming calls scheduled</div>';

  const ageingList = ageingAlerts.slice(0,8).map(l=>{
    const st = STAGES.find(s=>s.key===l.stage);
    return `<div class="callitem"><span><b>${l.id}</b> — ${l.village} <span style="color:var(--muted)">(${st.label})</span></span>
      <span class="badge badge-danger">${daysInStage(l)}d in stage (SLA ${st.sla}d)</span></div>`;
  }).join('') || '<div class="empty">No leads currently past their stage SLA</div>';

// ---- PIPELINE BOARD --------------------------------------------------
function leadCardHtml(l){
  const overdue = isOverdueStage(l);
  const call = callBadgeInfo(l);
  const badges = [];
  if(l.onHold && l.onHold.active) badges.push('<span class="badge badge-warn">On Hold</span>');
  if(overdue) badges.push(`<span class="badge badge-danger">${daysInStage(l)}d in stage</span>`);
  if(l.stage==='closed') badges.push(l.outcome==='acquired' ? '<span class="badge badge-ok">Acquired</span>' : '<span class="badge badge-danger">Dropped</span>');
  if(call && l.stage!=='closed') badges.push(`<span class="badge badge-${call.type==='danger'?'danger':call.type==='warn'?'warn':'muted'}">${call.text}</span>`);
  return `<div class="lead-card" data-id="${l.id}">
    <div class="lid">${l.id}</div>
    <div class="vil">${l.village || '—'}</div>
    <div class="meta">${fmtNum(l.extentValue)} ${EXTENT_UNITS[l.extentUnit]?.label} · ${l.assignedExecutive||'Unassigned'}</div>
    <div class="badges">${badges.join('')}</div>
  </div>`;
}

function renderBoard(){
  const leads = DB.getLeads();
  const cols = STAGES.map(s=>{
    const items = leads.filter(l=>l.stage===s.key);
    return `<div class="col">
      <div class="col-head"><span>${s.label}</span><span class="count">${items.length}</span></div>
      ${items.map(leadCardHtml).join('') || '<div class="empty">No leads</div>'}
    </div>`;
  }).join('');
  return `<div class="board">${cols}</div>`;
}

// ---- ALL LEADS LIST ----------------------------------------------------
function renderList(){
  const leads = DB.getLeads().filter(l=>{
    if(listFilters.stage && l.stage!==listFilters.stage) return false;
    if(listFilters.source && l.leadSource!==listFilters.source) return false;
    if(listFilters.exec && l.assignedExecutive!==listFilters.exec) return false;
    if(listFilters.q){
      const q = listFilters.q.toLowerCase();
      const hay = [l.id,l.village,l.siteLocation,l.landownerName,l.surveyNumber].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const execs = [...new Set(DB.getLeads().map(l=>l.assignedExecutive).filter(Boolean))];
  const rows = leads.map(l=>{
    const call = callBadgeInfo(l);
    return `<tr class="clickable" data-id="${l.id}">
      <td><b>${l.id}</b></td>
      <td>${l.village||'—'}</td>
      <td><span class="badge badge-navy">${stageLabel(l.stage)}</span>${l.onHold&&l.onHold.active?' <span class="badge badge-warn">Hold</span>':''}</td>
      <td>${fmtNum(l.extentValue)} ${EXTENT_UNITS[l.extentUnit]?.label}</td>
      <td>${fmtNum(l.priceValue)} / ${EXTENT_UNITS[l.priceUnit]?.label}</td>
      <td>${l.leadSource}</td>
      <td>${l.assignedExecutive||'—'}</td>
      <td>${call ? `<span class="badge badge-${call.type==='danger'?'danger':call.type==='warn'?'warn':'muted'}">${call.text}</span>` : '—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="8" class="empty">No leads match these filters</td></tr>';

  return `
    <div class="toolbar">
      <input type="text" id="f-q" placeholder="Search village, owner, survey no…" value="${listFilters.q}">
      <select id="f-stage"><option value="">All stages</option>${STAGES.map(s=>`<option value="${s.key}" ${listFilters.stage===s.key?'selected':''}>${s.label}</option>`).join('')}</select>
      <select id="f-source"><option value="">All sources</option>${LEAD_SOURCES.map(s=>`<option ${listFilters.source===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="f-exec"><option value="">All executives</option>${execs.map(e=>`<option ${listFilters.exec===e?'selected':''}>${e}</option>`).join('')}</select>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <tr><th>Lead ID</th><th>Village</th><th>Stage</th><th>Extent</th><th>Quoted Price</th><th>Source</th><th>Executive</th><th>Next Call</th></tr>
        ${rows}
      </table>
    </div>
  `;
}

  return `
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">Going live on Firebase</h2>
      <p style="font-size:13.5px;line-height:1.6;">This prototype currently stores everything in memory (the <code>DB</code> object in the script), so refreshing the page resets it to the sample leads below. To make it persistent — same pattern as your Sales Dashboard and Document Management System — wire it to a Firebase project:</p>
      <p style="font-size:13.5px;"><b>1. Add the SDK</b> to the <code>&lt;head&gt;</code>:</p>
      <div class="setup-code">&lt;script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"&gt;&lt;/script&gt;
&lt;script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"&gt;&lt;/script&gt;
&lt;script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"&gt;&lt;/script&gt;</div>
      <p style="font-size:13.5px;"><b>2. Initialize</b> with your project config, then replace the <code>DB</code> object near the top of the script with the Firestore-backed version — the exact drop-in code and field mapping is written out in comments right above the <code>DB</code> object in this file, so search for <code>FIREBASE WIRING</code>.</p>
      <p style="font-size:13.5px;"><b>3. Documents</b> — the "Documents" tab in each lead currently stores a name/note only. Swapping in Firebase Storage means the "Add Document" action uploads to <code>leads/{leadId}/{filename}</code> and stores the download URL instead.</p>
      <p style="font-size:13.5px;"><b>4. Security rules</b> — until Phase 2 login is built, restrict Firestore rules to your project's authorized domain, and consider a simple shared-password gate if this will be reachable outside your office network.</p>

let detailTab = 'overview';

  detailTab = 'overview';
  renderDetailModal(id);
}

function renderDetailModal(id){
  const l = DB.getLead(id);
  if(!l){ closeModal(); return; }
  const tabs = ['overview','stage','feasibility','documents','negotiation','history'];
  const tabLabels = {overview:'Overview', stage:'Stage & Actions', feasibility:'Feasibility', documents:'Documents', negotiation:'Negotiation', history:'History'};

  const stageTrack = STAGES.map(s=>{
    const cls = s.key===l.stage ? 'now' : (STAGE_INDEX[s.key] < STAGE_INDEX[l.stage] ? 'done' : '');
    return `<span class="stage-pill ${cls}">${s.label}</span>`;
  }).join('');

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:820px;">
        <div class="modal-head">
          <h3>${l.id} — ${l.village||'—'} ${l.onHold&&l.onHold.active?'<span class="badge badge-warn" style="margin-left:8px;">On Hold</span>':''}</h3>
          <button class="x" id="close-x">&times;</button>
        </div>
        <div class="modal-body">
          <div class="stage-track">${stageTrack}</div>
          <div class="toolbar" style="margin-bottom:10px;">
            ${tabs.map(t=>`<button class="btn btn-sm ${detailTab===t?'btn-teal':'btn-ghost'}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}
          </div>
          <div id="detail-tab-body"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="close-x2">Close</button>
        </div>
      </div>
    </div>`;

  document.getElementById('close-x').onclick = closeModal;
  document.getElementById('close-x2').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick = ()=>{ detailTab=b.dataset.tab; renderDetailModal(id); });

  document.getElementById('detail-tab-body').innerHTML = renderDetailTab(l);
  wireDetailTabEvents(l);
}

function renderDetailTab(l){
  if(detailTab==='overview') return renderOverviewTab(l);
  if(detailTab==='stage') return renderStageTab(l);
  if(detailTab==='feasibility') return renderFeasibilityTab(l);
  if(detailTab==='documents') return renderDocumentsTab(l);
  if(detailTab==='negotiation') return renderNegotiationTab(l);
  if(detailTab==='history') return renderHistoryTab(l);
}

function renderStageTab(l){
  const idx = STAGE_INDEX[l.stage];
  const next = STAGES[idx+1];
  const canGoBack = idx > 0;
  const holdBlock = `
    <fieldset>
      <legend>On Hold</legend>
      ${l.onHold && l.onHold.active ? `
        <p style="font-size:13px;">Currently on hold since ${fmtDate(l.onHold.since)} — <b>${l.onHold.reasonCode}</b>${l.onHold.notes?': '+l.onHold.notes:''}</p>
        <button class="btn btn-sm btn-teal" id="resume-btn">Resume (clear hold)</button>
      ` : `
        <div class="form-grid">
          <div><label>Reason</label><select id="hold-reason">${HOLD_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
          <div><label>Notes</label><input type="text" id="hold-notes"></div>
        </div>
        <button class="btn btn-sm btn-ghost" id="hold-btn" style="margin-top:8px;">Put On Hold</button>
      `}
    </fieldset>`;

  let gateBlock = '';
  if(next && next.key==='negotiation'){
    gateBlock = `<fieldset><legend>Gate: Approval to enter Negotiation</legend>
      <div class="form-grid">
        <div><label>Approved by</label><input type="text" id="gate-approver" placeholder="Manager name"></div>
        <div><label>Remarks</label><input type="text" id="gate-remarks"></div>
      </div>
      <button class="btn btn-sm btn-teal" id="advance-btn" style="margin-top:8px;">Move to ${next.label}</button>
    </fieldset>`;
  } else if(next && next.key==='closed'){
    gateBlock = `<fieldset><legend>Gate: Sign-off to close as Acquired</legend>
      <div class="form-grid">
        <div><label>Approved by</label><input type="text" id="gate-approver" placeholder="MD / Approver name"></div>
        <div><label>Final Price</label><input type="number" id="gate-final-price" step="0.01" value="${l.priceValue||''}"></div>
        <div><label>Final Date</label><input type="date" id="gate-final-date" value="${todayStr()}"></div>
        <div><label>Remarks</label><input type="text" id="gate-remarks"></div>
      </div>
      <button class="btn btn-sm btn-teal" id="advance-btn" style="margin-top:8px;">Close as Acquired</button>
    </fieldset>`;
  } else if(next){
    gateBlock = `<div style="margin-bottom:14px;"><button class="btn btn-sm btn-teal" id="advance-btn">Move to ${next.label}</button>
      ${canGoBack?`<button class="btn btn-sm btn-ghost" id="back-btn" style="margin-left:8px;">Move back a stage</button>`:''}</div>`;
  }

  const dropBlock = l.stage!=='closed' ? `
    <fieldset><legend>Drop this Lead</legend>
      <div class="form-grid">
        <div><label>Reason</label><select id="drop-reason">${DROP_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
        <div><label>Notes</label><input type="text" id="drop-notes"></div>
      </div>
      <button class="btn btn-sm btn-danger" id="drop-btn" style="margin-top:8px;">Close as Dropped</button>
    </fieldset>` : '';

  const closedSummary = l.stage==='closed' ? `
    <fieldset><legend>Outcome</legend>
      ${l.outcome==='acquired'
        ? `<p style="font-size:13px;">Acquired on ${fmtDate(l.finalDate)} at ${fmtNum(l.finalPrice)} / ${EXTENT_UNITS[l.priceUnit]?.label}. Approved by ${l.approval.approver||'—'}.</p>`
        : `<p style="font-size:13px;">Dropped — <b>${l.reasonCode||'—'}</b>${l.reasonNotes?': '+l.reasonNotes:''}</p>`}
    </fieldset>` : '';

  return `${gateBlock}${canGoBack && next && next.key!=='closed' && !gateBlock.includes('back-btn') ? '' : ''}${holdBlock}${dropBlock}${closedSummary}`;
}

  const rows = (l.negotiationLog||[]).map(n=>`<tr><td>${fmtDate(n.date)}</td><td>${n.offerBy}</td><td>${fmtNum(n.amount)}</td><td>${n.notes||''}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No negotiation entries yet.</td></tr>';
  return `
    <table style="margin-bottom:10px;"><tr><th>Date</th><th>By</th><th>Amount</th><th>Notes</th></tr>${rows}</table>
    <div class="inline-add">
      <input type="date" id="neg-date" value="${todayStr()}">
      <select id="neg-by"><option>Us</option><option>Owner</option><option>Mediator</option></select>
      <input type="number" id="neg-amount" step="0.01" placeholder="Amount">
      <input type="text" id="neg-notes" placeholder="Notes">
      <button class="btn btn-sm btn-teal" id="neg-add">Add</button>
    </div>
  `;
}

function renderHistoryTab(l){
  const items = (l.stageHistory||[]).slice().reverse().map(h=>
    `<div class="history-item"><b>${stageLabel(h.stage)}</b> — ${h.note||''}<div class="when">${fmtDate(h.at)} · ${h.by||''}</div></div>`
  ).join('') || '<div class="empty">No history recorded.</div>';
  return items;
}

function wireDetailTabEvents(l){
  if(detailTab==='overview'){
    const btn = document.getElementById('ov-save-call');
    if(btn) btn.onclick = () => {
      DB.updateLead(l.id, { nextCallDate: document.getElementById('ov-nextcall').value });
      renderDetailModal(l.id); render();
    };
  }
  if(detailTab==='stage'){
    const advance = document.getElementById('advance-btn');
    if(advance) advance.onclick = () => {
      const idx = STAGE_INDEX[l.stage];
      const next = STAGES[idx+1];
      const approver = document.getElementById('gate-approver')?.value.trim();
      if((next.key==='negotiation' || next.key==='closed') && !approver){
        alert('An approver name is required for this transition.'); return;
      }
      const patch = { stage: next.key };
      patch.stageHistory = l.stageHistory.concat([{stage: next.key, at:new Date().toISOString(), by: approver || l.assignedExecutive, note: next.key==='negotiation'?'Approved to enter Negotiation':(next.key==='closed'?'Closed as Acquired':'Advanced')}]);
      if(next.key==='negotiation'){
        patch.approval = { approver, date: todayStr(), remarks: document.getElementById('gate-remarks')?.value.trim()||'' };
      }
      if(next.key==='closed'){
        patch.outcome = 'acquired';
        patch.finalPrice = parseFloat(document.getElementById('gate-final-price')?.value)||l.priceValue;
        patch.finalDate = document.getElementById('gate-final-date')?.value || todayStr();
        patch.approval = { approver, date: todayStr(), remarks: document.getElementById('gate-remarks')?.value.trim()||'' };
      }
      DB.updateLead(l.id, patch);
      renderDetailModal(l.id); render();
    };
    const back = document.getElementById('back-btn');
    if(back) back.onclick = () => {
      const idx = STAGE_INDEX[l.stage];
      const prev = STAGES[idx-1];
      DB.updateLead(l.id, { stage: prev.key, stageHistory: l.stageHistory.concat([{stage:prev.key, at:new Date().toISOString(), by:l.assignedExecutive, note:'Moved back a stage'}]) });
      renderDetailModal(l.id); render();
    };
    const holdBtn = document.getElementById('hold-btn');
    if(holdBtn) holdBtn.onclick = () => {
      DB.updateLead(l.id, { onHold: { active:true, reasonCode: document.getElementById('hold-reason').value, notes: document.getElementById('hold-notes').value.trim(), since:new Date().toISOString() } });
      renderDetailModal(l.id); render();
    };
    const resumeBtn = document.getElementById('resume-btn');
    if(resumeBtn) resumeBtn.onclick = () => {
      DB.updateLead(l.id, { onHold: { active:false, reasonCode:'', notes:'', since:'' } });
      renderDetailModal(l.id); render();
    };
    const dropBtn = document.getElementById('drop-btn');
    if(dropBtn) dropBtn.onclick = () => {
      const reason = document.getElementById('drop-reason').value;
      const notes = document.getElementById('drop-notes').value.trim();
      DB.updateLead(l.id, { stage:'closed', outcome:'dropped', reasonCode:reason, reasonNotes:notes,
        stageHistory: l.stageHistory.concat([{stage:'closed', at:new Date().toISOString(), by:l.assignedExecutive, note:'Dropped — '+reason}]) });
      renderDetailModal(l.id); render();
    };
  }
  if(detailTab==='feasibility'){
    document.getElementById('save-feas').onclick = () => {
      DB.updateLead(l.id, { feasibility: {
        technical: { status: document.getElementById('feas-technical-status').value, notes: document.getElementById('feas-technical-notes').value },
        financial: { status: document.getElementById('feas-financial-status').value, notes: document.getElementById('feas-financial-notes').value },
      }});
      renderDetailModal(l.id);
    };
  }
  if(detailTab==='documents'){
    document.getElementById('doc-add').onclick = () => {
      const name = document.getElementById('doc-name').value.trim();
      const url = document.getElementById('doc-url').value.trim() || '(no reference given)';
      if(!name) return;
      DB.updateLead(l.id, { documents: (l.documents||[]).concat([{name, url, addedAt:new Date().toISOString()}]) });
      renderDetailModal(l.id);
    };
  }
  if(detailTab==='negotiation'){
    document.getElementById('neg-add').onclick = () => {
      const amount = parseFloat(document.getElementById('neg-amount').value);
      if(isNaN(amount)) { alert('Enter an amount.'); return; }
      DB.updateLead(l.id, { negotiationLog: (l.negotiationLog||[]).concat([{
        date: document.getElementById('neg-date').value, offerBy: document.getElementById('neg-by').value,
        amount, notes: document.getElementById('neg-notes').value.trim()
      }])});
      renderDetailModal(l.id);
    };
  }
}

// ---- shared modal / view wiring -----------------------------------------
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function wireViewEvents(){
  document.querySelectorAll('.lead-card, tr.clickable').forEach(el=>{
    el.addEventListener('click', () => openLeadDetail(el.dataset.id));
  });
  if(currentView==='list'){
    const bind = (id,key,evt='change') => { const el=document.getElementById(id); if(el) el.addEventListener(evt, ()=>{ listFilters[key]=el.value; render(); }); };
    bind('f-q','q','input'); bind('f-stage','stage'); bind('f-source','source'); bind('f-exec','exec');
  }
}

document.getElementById('btn-new-lead').addEventListener('click', openNewLeadModal);
document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click', () => { currentView = b.dataset.view; render(); });
});

render();
