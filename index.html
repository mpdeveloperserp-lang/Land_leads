// ---- MIS ANALYTICS ---------------------------------------------------------
// Distinct from Reports above: Reports exports raw per-record rows (one line
// per lead/payment/registration); this page is aggregated KPIs — per-
// Executive and per-source/per-Channel-Partner performance, stage aging,
// and a company-wide financial rollup. Same visibleLeads()/visibleExecutives()/
// visibleChannelPartners() scoping as everywhere else, so a Manager's
// numbers are their own branch's, never company-wide.
function executivePerformanceRows(){
  return visibleExecutives().map(e=>{
    const leads = visibleLeads().filter(l=>l.assignedExecutive===e.name);
    const acquired = leads.filter(l=>l.outcome==='acquired');
    const dropped = leads.filter(l=>l.outcome==='dropped').length;
    const activeCount = leads.length - acquired.length - dropped;
    const overdue = leads.filter(l=>isActive(l) && isOverdueStage(l)).length;
    const closeDurations = acquired.filter(l=>l.finalDate).map(l=>daysBetween(new Date(l.createdAt), new Date(l.finalDate)));
    const avgDaysToClose = closeDurations.length ? Math.round(closeDurations.reduce((s,d)=>s+d,0)/closeDurations.length) : null;
    return {
      Executive: e.name, 'Total Leads': leads.length, Active: activeCount, Acquired: acquired.length, Dropped: dropped,
      'Conversion %': leads.length ? Number((acquired.length/leads.length*100).toFixed(1)) : 0,
      'Avg Days to Close': avgDaysToClose!=null ? avgDaysToClose : '—',
      'Overdue (Past SLA)': overdue,
    };
  });
}
function sourcePerformanceRows(){
  const sources = DB.getMasters('leadSources');
  return sources.map(s=>{
    const leads = visibleLeads().filter(l=>l.leadSource===s.label);
    const acquired = leads.filter(l=>l.outcome==='acquired').length;
    return {
      Source: s.label, 'Total Leads': leads.length, Acquired: acquired,
      'Conversion %': leads.length ? Number((acquired/leads.length*100).toFixed(1)) : 0,
    };
  }).filter(r=>r['Total Leads']>0);
}
function channelPartnerPerformanceRows(){
  return visibleChannelPartners().map(c=>{
    const leads = visibleLeads().filter(l=>l.channelPartnerCode===c.code);
    const acquired = leads.filter(l=>l.outcome==='acquired').length;
    return {
      'Channel Partner': c.code+' — '+c.name, 'Leads Sourced': leads.length, Acquired: acquired,
      'Conversion %': leads.length ? Number((acquired/leads.length*100).toFixed(1)) : 0,
    };
  }).filter(r=>r['Leads Sourced']>0);
}
// Current dwell time, not a historical average across every lead that ever
// passed through a stage (stageHistory doesn't retain a per-visit exit
// timestamp for a stage a lead has since left) — same live-snapshot spirit
// as the Dashboard's own Ageing Alerts, just rolled up per stage instead of
// listed per lead.
function stageAgingRows(){
  const leads = visibleLeads().filter(isActive);
  return STAGES.filter(s=>s.key!=='closed').map(s=>{
    const inStage = leads.filter(l=>l.stage===s.key);
    const days = inStage.map(daysInStage);
    const avgDays = days.length ? Math.round(days.reduce((a,b)=>a+b,0)/days.length) : 0;
    const overdue = inStage.filter(isOverdueStage).length;
    return { Stage: s.label, 'Leads Currently In Stage': inStage.length, 'SLA (days)': s.sla!=null?s.sla:'—', 'Avg Days In Stage': days.length?avgDays:'—', 'Overdue (Past SLA)': overdue };
  });
}
// A single company/branch-wide financial rollup — kept as Metric/Value pairs
// (rather than one-row-per-lead like the other sections) since these are
// aggregate totals, not per-entity comparisons. Pipeline Value is the
// QUOTED value of everything still open (leadValue()); Acquired Value uses
// the actual closing rate (leadFinalValue()) rather than the original ask;
// Collected/Outstanding are summed straight from every visible lead's own
// paymentSummary() — never re-derived or stored separately, same
// "read live from the existing per-lead logs" discipline as Project-wise
// Summary on the Reports page.
function financialSummaryRows(){
  const leads = visibleLeads();
  const pipelineValue = leads.filter(isActive).reduce((s,l)=> s + leadValue(l), 0);
  const acquiredLeads = leads.filter(l=>l.outcome==='acquired');
  const acquiredValue = acquiredLeads.reduce((s,l)=> s + (leadFinalValue(l)||0), 0);
  const totalCollected = leads.reduce((s,l)=> s + paymentSummary(l).totalPaid, 0);
  const totalOutstanding = leads.reduce((s,l)=>{ const b = paymentSummary(l).balanceDue; return s + (b!=null && b>0 ? b : 0); }, 0);
  return [
    { Metric:'Pipeline Value (open leads, quoted)', Value: Number(pipelineValue.toFixed(2)) },
    { Metric:'Acquired Value (closing rate, '+acquiredLeads.length+' lead(s))', Value: Number(acquiredValue.toFixed(2)) },
    { Metric:'Total Collected (all payments)', Value: Number(totalCollected.toFixed(2)) },
    { Metric:'Total Outstanding (Approved proposals, unpaid balance)', Value: Number(totalOutstanding.toFixed(2)) },
  ];
}

    // Status + Follow-up columns, ported in from the old standalone
    // Progress Details page (now merged into this one — see the

        </select></div>` : ''}
        ${(!fcfg.channelPartnerCode || fcfg.channelPartnerCode.filter!==false) ? `<div><label>Channel Partner</label><select id="lf-cp">
          <option value="">All partners</option>${cps.map(c=>`<option value="${c.code}" ${listFilters.channelPartner===c.code?'selected':''}>${c.code} — ${c.name}</option>`).join('')}
        </select></div>` : ''}
        ${(!fcfg.assignedExecutive || fcfg.assignedExecutive.filter!==false) ? `<div><label>Assigned Executive</label><select id="lf-exec">
          <option value="">All executives</option>${execs.map(e=>`<option value="${e.name}" ${listFilters.exec===e.name?'selected':''}>${e.name}</option>`).join('')}
        </select></div>` : ''}
        ${(!fcfg.projectCode || fcfg.projectCode.filter!==false) ? `<div><label>Project</label><select id="lf-project">

        <div><label>Lead Date From</label><input type="date" id="lf-datefrom" value="${listFilters.dateFrom}"></div>
        <div><label>Lead Date To</label><input type="date" id="lf-dateto" value="${listFilters.dateTo}"></div>

      <div class="filter-actions">

        <div class="index-nav">${letters.map(L=>{
          const isAll = L==='ALL';
          const active = isAll ? !listFilters.letter : listFilters.letter===L;

        }).join('')}</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="btn-export-list">⬇ Export (CSV)</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="leads-table">
        <tr><th><input type="checkbox" id="check-all"></th><th>Lead ID</th><th>Village</th><th>Survey No.</th><th>Status</th><th>Extent</th><th>Quoted Price</th><th>Landowner</th><th>Source</th><th>Executive</th><th>Follow-up</th><th></th></tr>
        ${rows}

    <div class="pagination">
      <span>Displaying ${total?startIdx+1:0}–${Math.min(startIdx+PAGE_SIZE,total)} of ${total} record${total===1?'':'s'}</span>
      <div class="page-btns">
        <button class="btn btn-sm btn-ghost" id="pg-first" ${listPage<=1?'disabled':''}>«</button>
        <button class="btn btn-sm btn-ghost" id="pg-prev" ${listPage<=1?'disabled':''}>‹</button>
        <span class="page-num">${listPage} / ${totalPages}</span>
        <button class="btn btn-sm btn-ghost" id="pg-next" ${listPage>=totalPages?'disabled':''}>›</button>
        <button class="btn btn-sm btn-ghost" id="pg-last" ${listPage>=totalPages?'disabled':''}>»</button>
      </div>
    </div>
  `;
}

function wireListEvents(){
  const val = id => (document.getElementById(id)?.value || '').trim();
  const goBtn = document.getElementById('lf-go');
  if(goBtn) goBtn.onclick = () => {
    listFilters.stage = val('lf-stage');
    // Source/Channel Partner/Executive filters can be hidden via the Configure
    // page's Filter flag — only read them when actually rendered.
    if(document.getElementById('lf-source')) listFilters.source = val('lf-source');
    if(document.getElementById('lf-cp')) listFilters.channelPartner = val('lf-cp');
    if(document.getElementById('lf-exec')) listFilters.exec = val('lf-exec');
    if(document.getElementById('lf-project')) listFilters.project = val('lf-project');
    listFilters.dateFrom = val('lf-datefrom');
    listFilters.dateTo = val('lf-dateto');
    listPage = 1;
    render();
  };
  const clearBtn = document.getElementById('lf-clear');
  if(clearBtn) clearBtn.onclick = () => { listFilters = Object.assign({}, DEFAULT_FILTERS); listPage = 1; render(); };

  const q = document.getElementById('f-q');
  if(q) q.addEventListener('input', () => { listFilters.q = q.value; listPage = 1; render(); });

  document.querySelectorAll('[data-letter]').forEach(b=>b.onclick = () => { listFilters.letter = b.dataset.letter; listPage = 1; render(); });

  document.querySelectorAll('.row-check').forEach(c=>c.addEventListener('change', () => {
    if(c.checked) selectedLeadIds.add(c.dataset.id); else selectedLeadIds.delete(c.dataset.id);
  }));
  const checkAll = document.getElementById('check-all');
  if(checkAll) checkAll.addEventListener('change', () => {
    document.querySelectorAll('.row-check').forEach(c=>{
      c.checked = checkAll.checked;
      if(checkAll.checked) selectedLeadIds.add(c.dataset.id); else selectedLeadIds.delete(c.dataset.id);
    });
  });

  document.querySelectorAll('[data-view-id]').forEach(b=>b.onclick = (e) => { e.stopPropagation(); openLeadDetail(b.dataset.viewId); });
  document.querySelectorAll('td.clickable-row').forEach(td=>td.addEventListener('click', () => openLeadDetail(td.dataset.id)));

  const pgFirst = document.getElementById('pg-first'); if(pgFirst) pgFirst.onclick = () => { listPage = 1; render(); };
  const pgPrev = document.getElementById('pg-prev'); if(pgPrev) pgPrev.onclick = () => { listPage = Math.max(1, listPage-1); render(); };
  const pgNext = document.getElementById('pg-next'); if(pgNext) pgNext.onclick = () => { listPage = listPage+1; render(); };
  const pgLast = document.getElementById('pg-last'); if(pgLast) pgLast.onclick = () => {
    const total = visibleLeads().filter(l=>leadMatchesFilters(l, listFilters)).length;
    listPage = Math.max(1, Math.ceil(total/PAGE_SIZE)); render();
  };

  const exportBtn = document.getElementById('btn-export-list');
  if(exportBtn) exportBtn.onclick = () => {
    const filtered = visibleLeads().filter(l=>leadMatchesFilters(l, listFilters));
    const source = selectedLeadIds.size ? filtered.filter(l=>selectedLeadIds.has(l.id)) : filtered;
    if(!source.length){ alert('Nothing to export.'); return; }
    const rows = source.map(l=>({
      'Lead ID': l.leadId, Village: l.village||'', 'Survey No.': l.surveyNumber||'',
      Extent: l.extentValue, 'Extent Unit': EXTENT_UNITS[l.extentUnit]?.label||'',
      Price: l.priceValue, 'Price Unit': EXTENT_UNITS[l.priceUnit]?.label||'',
      Landowner: l.landownerName||'', Source: l.leadSource||'', Executive: l.assignedExecutive||''
    }));
    downloadBlob(toCSV(rows), 'Land_Leads_List.csv', 'text/csv;charset=utf-8;');
  };

  const newBtn = document.getElementById('btn-new-lead');
  if(newBtn) newBtn.addEventListener('click', goToNewLead);
}

// ---- MASTERS -------------------------------------------------------------
// Plain reference-data masters (lead sources, channel partners, villages,
// land classes, drop/hold reasons). Manage Users, Workflow Config and
// Status Config are their own standalone nav modules below, not tucked
// into this dropdown — simpler to find and less to scroll past.
// Auto-generates the next code for a master whose def declares `autoCode`
// (currently just Channel Partners, prefix 'CP') — scans every existing
// entry (active and inactive, so a deactivated/legacy one still reserves
// its number) for the highest "<prefix>-<number>" match and returns the
// next one, zero-padded to 3 digits (CP-007, CP-008, ... CP-999, CP-1000).
function nextMasterCode(prefix, items){
  const re = new RegExp('^' + prefix + '-(\\d+)$');
  const maxNum = (items||[]).reduce((max, it) => {
    const m = re.exec(String(it.code||'').trim());
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);
  return prefix + '-' + String(maxNum + 1).padStart(3, '0');
}
function renderMasters(){
  // Channel Partners moved out to its own standalone page (Sara: "like a
  // single page not in masters" — see renderChannelPartnersView()) — it's
  // no longer offered in this page's "Master Table" dropdown below. It
  // stays in MASTER_DEFS itself, though (the DB layer, Configure page, and
  // Audit Trail labeling all still key off that array), so if stale state
  // ever leaves currentMasterKey pointed at it, fall back to the first
  // selectable master instead of rendering a dead end.
  const selectableDefs = MASTER_DEFS.filter(m=>m.key!=='channelPartners');
  const def = selectableDefs.find(m=>m.key===currentMasterKey) || selectableDefs[0];
  const items = DB.getAllMasters(def.key);
  const rows = items.map(it=>`<tr>
      ${def.fields.map(f=>`<td>${it[f]!=null && it[f]!=='' ? it[f] : '—'}</td>`).join('')}
      <td>${it.active!==false ? '<span class="badge badge-ok">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</td>
      <td class="master-actions">
        <button class="icon-btn icon-ok" data-toggle="${it.id}" title="${it.active!==false?'Deactivate':'Activate'}">${it.active!==false?'✓':'○'}</button>
        <button class="icon-btn icon-edit" data-edit="${it.id}" title="Edit">✎</button>
        <button class="icon-btn icon-del" data-delete="${it.id}" title="Delete permanently">🗑</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="${def.fields.length+2}" class="empty">No entries yet.</td></tr>`;

  const editing = editingMasterId ? items.find(i=>i.id===editingMasterId) : null;
  const singular = def.label.replace(/ies$/,'y').replace(/s$/,'');

  return `
    <div class="page-header"><h1>Masters</h1></div>
    <div class="card filter-panel">
      <div class="form-grid">
        <div><label>Master Table</label><select id="master-select">
          ${selectableDefs.map(m=>`<option value="${m.key}" ${m.key===def.key?'selected':''}>${m.label}</option>`).join('')}
        </select></div>
      </div>
      <div class="filter-actions"><button class="btn btn-sm btn-teal" id="master-go">Go</button></div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr>${def.fields.map(f=>`<th>${FIELD_LABELS[f]||f}</th>`).join('')}<th>Status</th><th>Actions</th></tr>
        ${rows}
      </table>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">${editing?('Edit '+singular):('Add '+singular)}</h2>
      <div class="form-grid">
        ${def.fields.map(f=>{
          if(def.autoCode && f==='code'){
            // Generated, never typed — shown read-only so it's still visible
            // on the form. Editing an existing entry keeps ITS code as-is
            // (never regenerated out from under it); adding a new one shows
            // the next code it'll get once saved.
            const codeVal = editing ? (editing.code||'') : nextMasterCode(def.autoCode, items);
            return `<div><label>${FIELD_LABELS[f]||f}</label><input type="text" id="mf-${f}" value="${codeVal}" disabled title="Generated automatically — not editable"></div>`;
          }
          return `<div><label>${FIELD_LABELS[f]||f}</label><input type="${f==='commissionPct'?'number':'text'}" id="mf-${f}" ${f==='commissionPct'?'step="0.01"':''} value="${editing && editing[f]!=null ? editing[f] : ''}"></div>`;
        }).join('')}
      </div>
      ${def.autoCode ? `<p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Code is generated automatically — ${editing ? 'it stays as it was assigned and can\'t be changed here.' : 'the next one is shown above and is applied when you click Add.'}</p>` : ''}
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="master-save">${editing?'Update':'Add'}</button>
        ${editing?'<button class="btn btn-sm btn-ghost" id="master-cancel">Cancel</button>':''}
      </div>
    </div>
  `;
}

function wireMastersEvents(){
  const sel = document.getElementById('master-select');
  const switchMaster = () => { currentMasterKey = sel.value; editingMasterId=null; render(); };
  const goBtn = document.getElementById('master-go');
  if(goBtn) goBtn.onclick = switchMaster;
  if(sel) sel.addEventListener('change', switchMaster);

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.edit; render(); });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const it = DB.getAllMasters(currentMasterKey).find(x=>x.id===b.dataset.toggle);
    const wasActive = it && it.active!==false;
    await DB.toggleMaster(currentMasterKey, b.dataset.toggle);
    await logAudit(wasActive?'Deactivated':'Activated', def.label.replace(/ies$/,'y').replace(/s$/,''), it ? masterItemLabel(def, it) : '');
    render();
  });
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this entry permanently? This cannot be undone.')) return;
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const it = DB.getAllMasters(currentMasterKey).find(x=>x.id===b.dataset.delete);
    await DB.deleteMaster(currentMasterKey, b.dataset.delete);
    await logAudit('Deleted', def.label.replace(/ies$/,'y').replace(/s$/,''), it ? masterItemLabel(def, it) : '');
    if(editingMasterId===b.dataset.delete) editingMasterId=null;
    render();
  });
  const saveBtn = document.getElementById('master-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const fields = {};
    let ok = true;
    def.fields.forEach(f=>{
      const el = document.getElementById('mf-'+f);
      let v = el.value.trim();
      if(f==='commissionPct') v = v==='' ? null : parseFloat(v);
      if(f===def.fields[0] && v==='' ) ok = false;
      fields[f] = v;
    });
    if(!ok){ alert('The first field is required.'); return; }
    const singular = def.label.replace(/ies$/,'y').replace(/s$/,'');
    if(editingMasterId){
      await DB.updateMaster(currentMasterKey, editingMasterId, fields);
      await logAudit('Updated', singular, masterItemLabel(def, fields));
      editingMasterId=null;
    } else {
      await DB.addMaster(currentMasterKey, fields);
      await logAudit('Added', singular, masterItemLabel(def, fields));
    }
    render();
  };
  const cancelBtn = document.getElementById('master-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

// ---- CHANNEL PARTNERS (own page — was a Masters sub-table, now standalone,
//      same "pulled out of Masters" precedent as Manage Users above. Sara's
//      explicit request: "Channel partners i want like a single page not in
//      masters" — CPs are day-to-day lead-sourcing data Managers/Executives
//      touch constantly, not system configuration like Villages/Land
//      Classes/Drop Reasons, so it gets the same Manager/Head/Executive
//      default tier as Landowners/Land Parcels (her explicit choice) rather
//      than staying behind the Head/Admin-only Masters page. ------------
//
//      Redesign (later round, "select a Channel Partner using the CP
//      Code"): the list itself no longer carries any inline action icons —
//      its CP Code column is clickable instead and opens a dedicated,
//      full-page Channel Partner Details view (cpDetailId), with its own
//      Back button. Modify / Toggle Active / Link-Change Owner / Delete all
//      moved there, each still gated exactly as before (Link/Delete stay
//      off-limits to Executives; Modify/Toggle stay open to everyone who
//      can reach this page at all). See renderCPDetailPage().
const CP_DEF = MASTER_DEFS.find(m=>m.key==='channelPartners');

function openCPDetail(id){
  // Guards everyone uniformly against opening a CP outside what they can
  // access, not just via the row click — same belt-and-suspenders
  // precedent as openLeadDetail().
  if(!visibleAllChannelPartners().some(c=>c.id===id)){
    alert('This Channel Partner could not be found, or is outside what you can access.');
    return;
  }
  cpDetailId = id;
  editingCPId = null;
  linkingCPOwnerId = null;
  cpDetailLoading = true;
  render();
  // The lookup itself is an instant local read (Firestore already keeps
  // this cache live via DB.onChange() above) — this short, deliberate
  // pause is what "display a loading indicator while fetching the
  // details" asked for, not a real network wait.
  setTimeout(() => { cpDetailLoading = false; render(); }, 180);
}
function closeCPDetail(){
  cpDetailId = null;
  editingCPId = null;
  linkingCPOwnerId = null;
  cpDetailLoading = false;
  render();
}

function renderChannelPartnersView(){
  if(cpDetailId) return renderCPDetailPage();
  // Manager-wise visibility (canSeeCP()) is unchanged — this page just
  // moved WHERE that already-filtered list is shown, not how it's filtered.
  // Auto-code generation still scans the FULL, unfiltered list so two
  // different branches can never be handed the same "next" CP code just
  // because neither can see the other's entries.
  const items = visibleAllChannelPartners();
  const allItemsForCode = DB.getAllMasters('channelPartners');
  const search = (cpSearch||'').trim().toLowerCase();
  const displayItems = search
    ? items.filter(it => [(it.code||''),(it.name||''),(it.phone||'')].some(v => String(v).toLowerCase().includes(search)))
    : items;
  const rows = displayItems.map(it=>{
    const creator = cpCreator(it);
    return `<tr>
      <td class="clickable-row" data-id="${it.id}" title="Open Channel Partner Details"><b>${it.code||'—'}</b></td>
      ${CP_DEF.fields.slice(1).map(f=>`<td>${it[f]!=null && it[f]!=='' ? it[f] : '—'}</td>`).join('')}

      <td>${creator ? creator.name : '<span class="badge badge-muted">Shared / Legacy</span>'}</td>
      <td>${it.active!==false ? '<span class="badge badge-ok">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="empty">${search ? 'No Channel Partner matches that search.' : 'No Channel Partners yet.'}</td></tr>`;

  return `
    <div class="page-header"><h1>Channel Partners</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Visible per the same Manager-wise ownership as your Leads — a Channel Partner created before that rule existed shows as "Shared / Legacy" and stays visible to everyone until it's linked to a Manager or Executive. Click a CP Code to view its full details, modify it, or manage it.</p>
    <div class="card filter-panel">
      <div class="form-grid">
        <div><label>Search (Name / Code / Mobile)</label><input type="text" id="cp-search" value="${cpSearch||''}" placeholder="e.g. 9884022222"></div>
      </div>
      <div class="filter-actions"><button class="btn btn-sm btn-teal" id="cp-go">Go</button></div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr>${CP_DEF.fields.map(f=>`<th>${FIELD_LABELS[f]||f}</th>`).join('')}<th>Leads Sourced</th><th>Owner / Branch</th><th>Status</th></tr>
        ${rows}
      </table>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">Add Channel Partner</h2>
      <div class="form-grid">
        ${CP_DEF.fields.map(f=>{
          if(CP_DEF.autoCode && f==='code'){
            const codeVal = nextMasterCode(CP_DEF.autoCode, allItemsForCode);
            return `<div><label>${FIELD_LABELS[f]||f}</label><input type="text" id="cf-${f}" value="${codeVal}" disabled title="Generated automatically — not editable"></div>`;
          }
          return `<div><label>${FIELD_LABELS[f]||f}</label><input type="${f==='commissionPct'?'number':'text'}" id="cf-${f}" ${f==='commissionPct'?'step="0.01"':''} value=""></div>`;
        }).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Code is generated automatically — the next one is shown above and is applied when you click Add. Adding a new Channel Partner here stamps you as its owner. Name and Phone are required; Phone must be a 10-digit mobile number.</p>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="cp-save">Add</button>

    </div>
  `;
}

    return `
      <div class="page-header"><h1>Channel Partners</h1></div>

    return `
      <div class="page-header"><h1>Channel Partners</h1></div>
      <button class="btn btn-sm btn-ghost" id="cpd-back" style="margin-bottom:12px;">&larr; Back to Channel Partners</button>
      <div class="card"><p>This Channel Partner could not be found — it may have been deleted, or is outside what you can access.</p></div>`;

        }
        return `<div><label>${FIELD_LABELS[f]||f}</label><input type="${f==='commissionPct'?'number':'text'}" id="cfd-${f}" ${f==='commissionPct'?'step="0.01"':''} value="${cp[f]!=null?cp[f]:''}"></div>`;
      }).join('')}
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Code can't be changed here. Name and Phone are required; Phone must be a 10-digit mobile number. Saving never changes who owns this record — use Link/Change Owner for that.</p>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn btn-sm btn-teal" id="cpd-save">Save</button>
      <button class="btn btn-sm btn-ghost" id="cpd-cancel">Cancel</button>

  const linkForm = isLinking ? `
    <div class="card" style="background:var(--bg-soft,#f6f8fa);margin-top:12px;">
      <div class="form-grid" style="margin-bottom:0;">
        <div><label>${creator ? 'Re-link to' : 'Link to'} (Manager or Executive)</label>
          <select id="cp-link-target">

          </select>

      <div style="margin-top:8px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="cp-link-save" data-cp-link-save="${cp.id}">Save Owner</button>
        <button class="btn btn-sm btn-ghost" id="cp-link-cancel">Cancel</button>
      </div>
    </div>` : '';

  const readOnly = `
    <div class="form-grid">
      ${CP_DEF.fields.map(f=>`<div><label>${FIELD_LABELS[f]||f}</label><div>${cp[f]!=null && cp[f]!=='' ? cp[f] : '—'}</div></div>`).join('')}
      <div><label>Leads Sourced</label><div>${cpLeadCount(cp.code)}</div></div>
      <div><label>Owner / Branch</label><div>${creator ? `${creator.name} (${ROLE_LABELS[creator.role]})` : '<span class="badge badge-muted">Shared / Legacy</span>'}</div></div>
      <div><label>Status</label><div>${cp.active!==false ? '<span class="badge badge-ok">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</div></div>
    </div>

// Leads currently sourced by this Channel Partner — same branch-scoped
// visibleLeads() every other page already uses, so seeing the leads list

// show the leads details which the CP is involved" — each row opens that
// lead's own detail view, same click-through every other leads list in

function renderCPLeadsSection(cp){
  const leads = visibleLeads().filter(l=>l.channelPartnerCode===cp.code);

function wireCPDetailEvents(){
  const backBtn = document.getElementById('cpd-back');
  if(backBtn) backBtn.onclick = closeCPDetail;
  if(cpDetailLoading) return; // nothing else on the page yet to wire up

  const cp = DB.getAllMasters('channelPartners').find(c=>c.id===cpDetailId);
  if(!cp) return;

  // The "Leads Sourced by ..." table below the details card — wired
  // regardless of view/edit mode, same openLeadDetail() click-through every
  // other leads list in this app already uses.
  document.querySelectorAll('#view-root tr.clickable-row[data-id]').forEach(tr=>tr.addEventListener('click', ()=>openLeadDetail(tr.dataset.id)));

  const modifyBtn = document.getElementById('cpd-modify');
  if(modifyBtn) modifyBtn.onclick = () => { editingCPId = cp.id; linkingCPOwnerId = null; render(); };
  const cancelBtn = document.getElementById('cpd-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingCPId = null; render(); };
  const saveBtn = document.getElementById('cpd-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const fields = {};
    CP_DEF.fields.forEach(f=>{
      if(f==='code') return; // never editable here
      const el = document.getElementById('cfd-'+f);
      let v = el.value.trim();
      if(f==='commissionPct') v = v==='' ? null : parseFloat(v);
      fields[f] = v;
    });
    const check = validateCPFields(Object.assign({}, cp, fields));
    if(!check.ok){ alert(check.message); return; }
    await DB.updateMaster('channelPartners', cp.id, fields);
    await logAudit('Updated', 'Channel Partner', masterItemLabel(CP_DEF, Object.assign({}, cp, fields)));
    editingCPId = null;
    render();
  };

  const toggleBtn = document.getElementById('cpd-toggle');
  if(toggleBtn) toggleBtn.onclick = async () => {
    const wasActive = cp.active!==false;
    await DB.toggleMaster('channelPartners', cp.id);
    await logAudit(wasActive?'Deactivated':'Activated', 'Channel Partner', masterItemLabel(CP_DEF, cp));
    render();
  };

  if(canLinkCPOwner()){
    const linkOpenBtn = document.getElementById('cpd-link-open');
    if(linkOpenBtn) linkOpenBtn.onclick = () => { linkingCPOwnerId = cp.id; editingCPId = null; render(); };
    const linkCancelBtn = document.getElementById('cp-link-cancel');
    if(linkCancelBtn) linkCancelBtn.onclick = () => { linkingCPOwnerId = null; render(); };
    const linkSaveBtn = document.getElementById('cp-link-save');
    if(linkSaveBtn) linkSaveBtn.onclick = async () => {
      const targetUid = document.getElementById('cp-link-target').value;
      if(!targetUid){ alert('Select who to link this Channel Partner to.'); return; }
      const target = DB.getUsers().find(u=>u.uid===targetUid);
      if(!target) return;
      await DB.updateMaster('channelPartners', cp.id, { createdByUid: target.uid, createdByName: target.name });
      await logAudit('Linked to Owner', 'Channel Partner', masterItemLabel(CP_DEF, cp), 'Owner set to '+target.name);
      linkingCPOwnerId = null;
      render();
    };
  }

  if(canDeleteChannelPartner()){
    const deleteBtn = document.getElementById('cpd-delete');
    if(deleteBtn) deleteBtn.onclick = async () => {
      if(!confirm('Delete this Channel Partner permanently? This cannot be undone.')) return;
      await DB.deleteMaster('channelPartners', cp.id);
      await logAudit('Deleted', 'Channel Partner', masterItemLabel(CP_DEF, cp));
      closeCPDetail();
    };
  }
}

// ---- MANAGE USERS (own module — was folded into Masters, now standalone) --
// Real accounts (Firebase Authentication when live) replace the old
// free-text "Executives" master. Each user has a role — see ROLES above —
// that governs which pages they can see and, for Executives, which leads.
// A Manager's "Reports To" offers Heads; an Executive's offers Managers;
// a Head (role 'admin') has no Reports To — they're the top of their branch.
function reportsToCandidates(role){
  const items = DB.getAllUsers();
  if(role==='executive') return items.filter(u=>u.role==='manager' && u.active!==false);
  if(role==='manager') return items.filter(u=>u.role==='admin' && u.active!==false);
  return [];
}
function reportsToOptionsHtml(role, selectedUid){
  const list = reportsToCandidates(role);
  const empty = list.length ? '— unassigned —' : '— none available yet, add one first —';
  return `<option value="">${empty}</option>` + list.map(u=>`<option value="${u.uid}" ${selectedUid===u.uid?'selected':''}>${u.name}</option>`).join('');
}

      <h2 class="section-title" style="margin-top:0;">${editing ? 'Edit User' : 'Add User'}</h2>

        <div><label>Name</label><input type="text" id="uf-name" value="${editing?editing.name:''}"></div>
        <div><label>Email</label><input type="email" id="uf-email" value="${editing?editing.email:''}" ${editing?'disabled':''}></div>
        <div><label>Phone</label><input type="text" id="uf-phone" value="${editing?(editing.phone||''):''}"></div>

function wireUsersEvents(){
  document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.userEdit; render(); });
  document.querySelectorAll('[data-user-toggle]').forEach(b=>b.onclick = async () => {
    const u = DB.getAllUsers().find(x=>x.uid===b.dataset.userToggle);
    const wasActive = u && u.active!==false;
    await DB.toggleUser(b.dataset.userToggle);
    await logAudit(wasActive?'Deactivated':'Activated', 'User', u ? u.name : '');
    render();
  });
  document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick = async () => {
    const extra = DB.isLive() ? ' Their sign-in account itself must be removed separately in the Firebase Console if you want it fully deleted.' : '';
    if(!confirm('Remove this user\'s access record?' + extra + ' This cannot be undone.')) return;
    const u = DB.getAllUsers().find(x=>x.uid===b.dataset.userDelete);
    await DB.deleteUser(b.dataset.userDelete);
    await logAudit('Deleted', 'User', u ? u.name : '');
    if(editingMasterId===b.dataset.userDelete) editingMasterId=null;
    render();
  });
  const roleSelect = document.getElementById('uf-role');
  if(roleSelect) roleSelect.onchange = () => {
    const role = roleSelect.value;
    const wrap = document.getElementById('uf-reports-to-wrap');
    const sel = document.getElementById('uf-reports-to');
    if(role==='admin' || role==='sysadmin'){
      wrap.style.display = 'none';
    } else {
      wrap.style.display = '';
      sel.innerHTML = reportsToOptionsHtml(role, '');
    }
  };
  const saveBtn = document.getElementById('user-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const name = document.getElementById('uf-name').value.trim();
    const email = document.getElementById('uf-email').value.trim();
    const phone = document.getElementById('uf-phone').value.trim();
    const role = document.getElementById('uf-role').value;
    const reportsTo = (role==='admin' || role==='sysadmin') ? '' : (document.getElementById('uf-reports-to')?.value || '');
    if(!name){ alert('Name is required.'); return; }
    if(editingMasterId){
      const newPassword = document.getElementById('uf-password').value;
      if(newPassword && newPassword.length < 6){ alert('New password must be at least 6 characters, or leave it blank to keep the current one.'); return; }
      try{
        await DB.updateUser(editingMasterId, { name, phone, role, reportsTo });
        await logAudit('Updated', 'User', name, newPassword ? 'Profile updated; password also changed.' : 'Profile updated.');
        if(newPassword) await DB.changeUserPassword(editingMasterId, newPassword);
      }catch(err){
        alert('Saved the profile, but could not change the password: ' + ((err && err.message) || err));
        editingMasterId = null;
        render();
        return;
      }
      editingMasterId = null;
    } else {
      const password = document.getElementById('uf-password').value;
      if(!email){ alert('Email is required.'); return; }
      if(!password || password.length < 6){ alert('Password must be at least 6 characters.'); return; }
      try{
        await DB.createUser({ name, email, phone, role, password, reportsTo });
        await logAudit('Added', 'User', name, 'Role: ' + (ROLE_LABELS[role]||role));
      }catch(err){
        alert('Could not create user: ' + friendlyAuthError(err));
        return;
      }
    }
    render();
  };
  const cancelBtn = document.getElementById('user-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

function wireLandownersEvents(){
  document.querySelectorAll('[data-lo-edit],[data-lo-open]').forEach(b=>b.onclick = () => { editingLandownerId = b.dataset.loEdit || b.dataset.loOpen; render(); });
  document.querySelectorAll('[data-lo-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleLandowner(b.dataset.loToggle); render(); });
  document.querySelectorAll('[data-lo-delete]').forEach(b=>b.onclick = async () => {
    const linked = DB.getAllLandParcels().filter(p=>(p.landownerLinks||[]).some(l=>l.landownerId===b.dataset.loDelete));
    const warn = linked.length ? (' This landowner is linked to '+linked.length+' land parcel(s) — their name will remain on those records, but the link will no longer resolve to a live Landowner entry.') : '';
    if(!confirm('Delete this landowner permanently?' + warn + ' This cannot be undone.')) return;
    await DB.deleteLandowner(b.dataset.loDelete);
    if(editingLandownerId===b.dataset.loDelete) editingLandownerId=null;
    render();
  });
  const saveBtn = document.getElementById('lo-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const fields = {
      landownerCode: document.getElementById('lo-code').value,
      fullName: document.getElementById('lo-name').value.trim(),
      contactNumber: document.getElementById('lo-contact').value.trim(),
      altContactNumber: document.getElementById('lo-alt-contact').value.trim(),
      email: document.getElementById('lo-email').value.trim(),
      district: document.getElementById('lo-district').value.trim(),
      taluk: document.getElementById('lo-taluk').value.trim(),
      village: document.getElementById('lo-village').value.trim(),
      preferredContact: document.getElementById('lo-pref').value,
      idDocRef: document.getElementById('lo-iddoc').value.trim(),
      address: document.getElementById('lo-address').value.trim(),
      notes: document.getElementById('lo-notes').value.trim(),
    };
    if(!fields.fullName){ alert('Full Name is required.'); return; }
    if(!fields.contactNumber){ alert('Contact Number is required.'); return; }
    const dupes = findDuplicateLandowners(fields, editingLandownerId);
    if(dupes.length){
      const list = dupes.map(d=>`${d.fullName} (${d.contactNumber||'no phone'}, ${d.village||'no village'})`).join('; ');
      if(!confirm('This looks like it might be a duplicate of an existing landowner: ' + list + '. Save it anyway as a separate record?')) return;
    }
    if(editingLandownerId){ await DB.updateLandowner(editingLandownerId, fields); editingLandownerId=null; }
    else { await DB.addLandowner(fields); }
    render();
  };
  const cancelBtn = document.getElementById('lo-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingLandownerId=null; render(); };
}

// ---- LAND PARCEL & SURVEY REGISTRY (own module — Land Acquisition ERP,
//      Module 4) -----------------------------------------------------------
// Separate from a Lead on purpose (per spec): several leads, owners, or
// negotiation rounds can all end up pointing at the same physical survey
// number over time, so the parcel record outlives any one lead. A parcel
// may optionally reference the Lead it came from (leadId) and one or more
// Landowners with an ownership share each (landownerLinks) — both are
// plain references to the other two registries, not copies of their data.
function landownerOptionsHtml(selectedId){
  const list = DB.getLandowners();
  return `<option value="">— select a landowner —</option>` + list.map(o=>`<option value="${o.id}" ${selectedId===o.id?'selected':''}>${o.fullName} (${o.landownerCode||'no code'})</option>`).join('');
}
function leadOptionsHtml(selectedId){
  const list = visibleLeads();
  return `<option value="">— none / not linked to a lead —</option>` + list.map(l=>`<option value="${l.id}" ${selectedId===l.id?'selected':''}>${l.leadId} — ${l.village||'—'}${l.surveyNumber?(' — '+l.surveyNumber):''}</option>`).join('');
}
function extentUnitOptionsHtml(selectedUnit){
  return Object.entries(EXTENT_UNITS).map(([k,v])=>`<option value="${k}" ${k===selectedUnit?'selected':''}>${v.label}</option>`).join('');
}
// The linked-landowner rows and their share total are deliberately patched
// in place (see wireLandParcelsEvents' add/remove handlers) rather than
// triggering a full render() — a full re-render would rebuild every OTHER
// field on this long form from scratch (village, survey number, extents,
// …), discarding whatever the user had already typed into them, since only
// parcelLandownerLinksDraft — not the rest of the form — survives across
// renders. These two small helpers are shared by the initial render and by
// that in-place patch, so both build the exact same markup.
function pclLoRowsHtml(){
  const draftLinks = parcelLandownerLinksDraft || [];
  return draftLinks.map((l,i)=>`
    <div class="field-pair" style="margin-bottom:6px;">
      <span style="flex:1;">${l.landownerName} — ${l.ownershipSharePct!=null?l.ownershipSharePct:'?'}%</span>
      <button type="button" class="icon-btn icon-del" data-pcl-lo-remove="${i}" title="Remove">🗑</button>
    </div>`).join('') || '<p style="font-size:12px;color:var(--muted);">No landowners linked yet.</p>';
}
function pclShareTotal(){ return (parcelLandownerLinksDraft||[]).reduce((s,l)=>s+(Number(l.ownershipSharePct)||0),0); }
function pclShareTotalText(total){
  return `Share total: ${total}% ${total!==0 && total!==100 ? '— doesn\'t add up to 100% yet; fine if ownership shares aren\'t fully known yet, otherwise double-check.' : ''}`;
}
// Re-wires the remove button inside every landowner-link row — needed each
// time #pcl-lo-rows' innerHTML is replaced, since that destroys whatever
// listeners were attached to the old nodes.
function wirePclLoRowButtons(){
  document.querySelectorAll('[data-pcl-lo-remove]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.pclLoRemove, 10);
    parcelLandownerLinksDraft = (parcelLandownerLinksDraft||[]).filter((_,idx)=>idx!==i);
    document.getElementById('pcl-lo-rows').innerHTML = pclLoRowsHtml();
    document.getElementById('pcl-lo-share-total').textContent = pclShareTotalText(pclShareTotal());
    wirePclLoRowButtons();
  });
}

function wireLandParcelsEvents(){
  document.querySelectorAll('[data-pcl-edit],[data-pcl-open]').forEach(b=>b.onclick = () => { editingParcelId = b.dataset.pclEdit || b.dataset.pclOpen; parcelLandownerLinksDraft = null; render(); });
  document.querySelectorAll('[data-pcl-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleLandParcel(b.dataset.pclToggle); render(); });
  document.querySelectorAll('[data-pcl-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this land parcel permanently? This cannot be undone.')) return;
    await DB.deleteLandParcel(b.dataset.pclDelete);
    if(editingParcelId===b.dataset.pclDelete){ editingParcelId=null; parcelLandownerLinksDraft=null; }
    render();
  });
  const addLoBtn = document.getElementById('pcl-lo-add-btn');
  if(addLoBtn) addLoBtn.onclick = () => {
    const sel = document.getElementById('pcl-lo-add-select');
    const loId = sel.value;
    if(!loId){ alert('Select a landowner to add first.'); return; }
    if((parcelLandownerLinksDraft||[]).some(l=>l.landownerId===loId)){ alert('That landowner is already linked to this parcel.'); return; }
    const lo = landownerById(loId);
    const shareInput = document.getElementById('pcl-lo-add-share');
    const share = parseFloat(shareInput.value);
    parcelLandownerLinksDraft = (parcelLandownerLinksDraft||[]).concat([{ landownerId: loId, landownerName: lo?lo.fullName:'', ownershipSharePct: isNaN(share)?null:share }]);
    // Patch only the landowner-links block in place (see pclLoRowsHtml's own
    // comment) — never a full render() here, so every other field the user
    // has already typed into this long form stays exactly as they left it.
    document.getElementById('pcl-lo-rows').innerHTML = pclLoRowsHtml();
    document.getElementById('pcl-lo-share-total').textContent = pclShareTotalText(pclShareTotal());
    wirePclLoRowButtons();
    sel.value = ''; shareInput.value = '';
  };
  wirePclLoRowButtons();
  const saveBtn = document.getElementById('pcl-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const val = id => document.getElementById(id)?.value;
    const fields = {
      parcelCode: val('pcl-code'),
      leadId: val('pcl-lead') || '',
      projectRef: (val('pcl-project')||'').trim(),
      district: (val('pcl-district')||'').trim(),
      taluk: (val('pcl-taluk')||'').trim(),
      village: (val('pcl-village')||'').trim(),
      revenueVillageCode: (val('pcl-revcode')||'').trim(),
      surveyNumber: (val('pcl-survey')||'').trim(),
      subdivisionNumber: (val('pcl-sub')||'').trim(),
      pattaNumber: (val('pcl-patta')||'').trim(),
      landClassification: val('pcl-class') || '',
      parcelStatus: val('pcl-status') || 'Available',
      totalExtentValue: parseFloat(val('pcl-total-val')) || 0,
      totalExtentUnit: val('pcl-total-unit'),
      proposedExtentValue: parseFloat(val('pcl-proposed-val')) || 0,
      proposedExtentUnit: val('pcl-proposed-unit'),
      previouslyAcquiredValue: parseFloat(val('pcl-acquired-val')) || 0,
      previouslyAcquiredUnit: val('pcl-acquired-unit'),
      accessRoad: (val('pcl-access')||'').trim(),
      waterAvailability: val('pcl-water') || '',
      electricityAvailability: val('pcl-elec') || '',
      existingStructures: (val('pcl-structures')||'').trim(),
      encroachmentInfo: (val('pcl-encroach')||'').trim(),
      boundaryNorth: (val('pcl-b-north')||'').trim(),
      boundarySouth: (val('pcl-b-south')||'').trim(),
      boundaryEast: (val('pcl-b-east')||'').trim(),
      boundaryWest: (val('pcl-b-west')||'').trim(),
      remarks: (val('pcl-remarks')||'').trim(),
      landownerLinks: (parcelLandownerLinksDraft||[]).slice(),
    };
    if(!fields.surveyNumber){ alert('Survey Number is required.'); return; }
    if(!fields.totalExtentValue){ alert('Total Recorded Extent is required.'); return; }
    // Hard validation, not just a warning — per spec, this app must never
    // silently allocate more land against a parcel than it actually has.
    if(parcelBalanceSqft(fields) < -0.01){
      alert('Previously Acquired + Proposed Acquisition Extent exceeds the Total Recorded Extent for this parcel. Correct the figures before saving.');
      return;
    }
    const dupes = findDuplicateParcels(fields, editingParcelId);
    if(dupes.length){
      const list = dupes.map(d=>d.parcelCode+' ('+d.village+' '+d.surveyNumber+(d.subdivisionNumber?('/'+d.subdivisionNumber):'')+')').join('; ');
      if(!confirm('This Village + Survey Number + Subdivision Number matches an existing parcel: ' + list + '. Save this as a separate parcel anyway?')) return;
    }
    if(editingParcelId){ await DB.updateLandParcel(editingParcelId, fields); editingParcelId=null; }
    else { await DB.addLandParcel(fields); }
    parcelLandownerLinksDraft = null;
    render();
  };
  const cancelBtn = document.getElementById('pcl-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingParcelId=null; parcelLandownerLinksDraft=null; render(); };
}

// ---- WORKFLOW CONFIG (own module) -----------------------------------------
// Which role must approve a specific From Status -> To Status transition.
// Each gate applies only to that exact pair and direction — moving forward
// into a stage and moving back out of it are configured (and approved)
// separately. Only pairs one pipeline step apart are offered, since those
// are the only moves the app's Move-to/Move-back actions can perform. Pairs
// with no gate can be moved by anyone with edit access. Edits here are a
// local draft — nothing is saved until "Save Workflow Config" is clicked.
// Role-wise mapping table — same shape as the "Entity Wise Role And Status
// Mapping" reference: Delete | Application Role | From Status | To Status,
// with an "Add New" row and multiple rows allowed per From/To pair (one per
// role permitted to perform that move) or per role (branching to several
// To statuses from the same From status).
let workflowDraftRows = null;
function workflowDraft(){
  if(!workflowDraftRows) workflowDraftRows = WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
  return workflowDraftRows;
}
// "Application Role", "From Status" and "To Status" are three independent
// selects in the Add New row (matching the reference layout), with To's
// options depending on whichever From is currently picked. All three
// re-render the whole view on change (so To can recompute) — which would
// otherwise reset the other two back to their defaults, so all three
// selections are held here and restored as the `selected` option on every
// render, not left to the DOM to remember on its own.
let workflowAddRole = null;
let workflowAddFrom = null;
let workflowAddTo = null;
function renderWorkflowView(){
  const draft = workflowDraft();
  // Any status can be a From, and any OTHER status can be its To — no
  // adjacency restriction (matches the reference: e.g. "To be inspected"
  // branching straight to "Drop Land" or "Finalised", not just next-in-line).
  const fromOptions = STAGE_KEYS.slice();
  if(!workflowAddFrom || !fromOptions.includes(workflowAddFrom)) workflowAddFrom = fromOptions[0];
  if(!workflowAddRole || !ROLES.includes(workflowAddRole)) workflowAddRole = ROLES[0];
  const toOptions = STAGE_KEYS.filter(k=>k!==workflowAddFrom);
  if(!workflowAddTo || !toOptions.includes(workflowAddTo)) workflowAddTo = toOptions[0];
  const rows = draft.map((w,i)=>`<tr>
      <td><button class="btn btn-sm btn-ghost" data-wf-remove="${i}" title="Delete">🗑</button></td>
      <td><select id="wf-role-${i}">${ROLES.map(r=>`<option value="${r}" ${w.role===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></td>
      <td>${stageLabel(w.from)}</td>
      <td>${stageLabel(w.to)}</td>
    </tr>`).join('');
  return `
    <div class="page-header"><h1>Workflow Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Role-wise From Status → To Status mapping — pick any From and any To status, including non-adjacent jumps. Each row grants one role permission to perform one specific move (see a lead's Stage &amp; Actions section on its Lead Details page): the immediate next/back stage stays available to everyone by default unless gated here, while any OTHER mapping shows up as an extra "Move to" option gated to just the role(s) listed. Head can always approve any move regardless of what's configured here.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table><tr><th></th><th>Application Role</th><th>From Status</th><th>To Status</th></tr>${rows || '<tr><td colspan="4" style="color:var(--muted);padding:14px;">No mappings configured — anyone with edit access can move a lead to any adjacent stage.</td></tr>'}</table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>Application Role</label><select id="wf-add-role">${ROLES.map(r=>`<option value="${r}" ${r===workflowAddRole?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></div>
      <div><label>From Status</label><select id="wf-add-from">${fromOptions.map(f=>`<option value="${f}" ${f===workflowAddFrom?'selected':''}>${stageLabel(f)}</option>`).join('')}</select></div>
      <div><label>To Status</label><select id="wf-add-to">${toOptions.map(t=>`<option value="${t}" ${t===workflowAddTo?'selected':''}>${stageLabel(t)}</option>`).join('')}</select></div>
      <button class="btn btn-sm btn-teal" id="wf-add-btn">+ Add New</button>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="workflow-save">Update</button></div>
  `;
}

function wireWorkflowEvents(){
  document.querySelectorAll('[data-wf-remove]').forEach(b=>b.onclick = () => {
    workflowDraft().splice(parseInt(b.dataset.wfRemove, 10), 1);
    render();
  });
  const roleSel = document.getElementById('wf-add-role');
  if(roleSel) roleSel.onchange = () => { workflowAddRole = roleSel.value; render(); };
  const fromSel = document.getElementById('wf-add-from');
  if(fromSel) fromSel.onchange = () => {
    workflowAddFrom = fromSel.value;
    workflowAddTo = null; // stale for the new From — renderWorkflowView() picks a fresh default
    render(); // re-render so "To Status" recomputes its options for the new From
  };
  const toSel = document.getElementById('wf-add-to');
  if(toSel) toSel.onchange = () => { workflowAddTo = toSel.value; render(); };
  const addBtn = document.getElementById('wf-add-btn');
  if(addBtn) addBtn.onclick = () => {
    const from = document.getElementById('wf-add-from').value;
    const to = document.getElementById('wf-add-to').value;
    const role = document.getElementById('wf-add-role').value;
    const draft = workflowDraft();
    if(draft.some(w=>w.from===from && w.to===to && w.role===role)){
      alert(ROLE_LABELS[role] + ' already has a mapping for ' + stageLabel(from) + ' → ' + stageLabel(to) + '.');
      return;
    }
    draft.push({ from, to, label: defaultGateLabel(from, to), role });
    render();
  };
  const saveBtn = document.getElementById('workflow-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const rows = workflowDraft().map((w,i)=>({
      from: w.from, to: w.to, label: w.label, role: document.getElementById('wf-role-'+i).value,
    }));
    await DB.saveWorkflow(rows);
    await logAudit('Saved', 'Workflow Config', '', rows.length + ' mapping(s) saved.');
    workflowDraftRows = null;
    refreshWorkflowFromDB();
    render();
  };
}

// ---- STATUS CONFIG (own module) --------------------------------------------
// New (the starting stage for every lead) and Closed (terminal — unlocks
// Final Price/Date, blocks back-navigation) stay pinned first/last since
// other code refers to those two keys specifically. Everything between them
// can be renamed, added, removed and reordered. Changes are staged in a
// draft (mirroring the Workflow Config editor) and only take effect on Save.
let statusDraftRows = null;
function statusDraft(){
  if(!statusDraftRows) statusDraftRows = STAGES.map(s=>Object.assign({}, s));
  return statusDraftRows;
}
function renderStatusConfigView(){
  const draft = statusDraft();
  const rows = draft.map((s,i)=>{
    const pinned = i===0 || i===draft.length-1; // New (first) / Closed (last)
    return `<tr>
      <td>${s.key}</td>
      <td><input type="text" id="stg-label-${i}" value="${s.label}"></td>
      <td><input type="number" id="stg-sla-${i}" value="${s.sla==null?'':s.sla}" placeholder="none" style="max-width:100px;"></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm btn-ghost" data-stg-up="${i}" ${i<=1?'disabled':''} title="Move up">↑</button>
        <button class="btn btn-sm btn-ghost" data-stg-down="${i}" ${i>=draft.length-2?'disabled':''} title="Move down">↓</button>
      </td>
      <td>${pinned ? '' : `<button class="btn btn-sm btn-ghost" data-stg-remove="${i}">Remove</button>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-header"><h1>Status Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Rename any stage, adjust its SLA, add new stages, remove ones you don't need, or reorder them. "New" always stays the first stage and "Closed" always stays the last (the workflow rules and every lead's history rely on those two).</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr><th>Key</th><th>Label</th><th>SLA (days)</th><th>Reorder</th><th></th></tr>
        ${rows}
      </table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>New Status Label</label><input type="text" id="stg-new-label" placeholder="e.g. Site Re-Visit"></div>
      <button class="btn btn-sm btn-teal" id="stg-add-btn">+ Add Status</button>
      <span style="font-size:12px;color:var(--muted);">Inserted just before Closed.</span>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="stages-save">Save Status Config</button></div>
  `;
}

function wireStatusConfigEvents(){
  document.querySelectorAll('[data-stg-remove]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgRemove, 10);
    const draft = statusDraft();
    const key = draft[i].key;
    const inUse = (DB.getLeads()||[]).some(l=>l.stage===key);
    if(inUse){ alert('Some leads are currently in "' + draft[i].label + '". Move those leads to another stage before removing it.'); return; }
    if(!confirm('Remove the "' + draft[i].label + '" status? This can\'t be undone.')) return;
    draft.splice(i, 1);
    render();
  });
  document.querySelectorAll('[data-stg-up]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgUp, 10);
    if(i<=1) return;
    const draft = statusDraft();
    [draft[i-1], draft[i]] = [draft[i], draft[i-1]];
    render();
  });
  document.querySelectorAll('[data-stg-down]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgDown, 10);
    const draft = statusDraft();
    if(i>=draft.length-2) return;
    [draft[i+1], draft[i]] = [draft[i], draft[i+1]];
    render();
  });
  const addBtn = document.getElementById('stg-add-btn');
  if(addBtn) addBtn.onclick = () => {
    const label = (document.getElementById('stg-new-label').value || '').trim();
    if(!label){ alert('Enter a label for the new status.'); return; }
    const draft = statusDraft();
    const key = slugifyStageKey(label, draft.map(s=>s.key));
    draft.splice(draft.length-1, 0, { key, label, sla: null }); // just before Closed
    render();
  };
  const saveBtn = document.getElementById('stages-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const draft = statusDraft();
    const rows = draft.map((s,i)=>({
      key: s.key,
      label: (document.getElementById('stg-label-'+i).value || s.label).trim(),
      sla: document.getElementById('stg-sla-'+i).value === '' ? null : parseInt(document.getElementById('stg-sla-'+i).value,10),
    }));
    await DB.saveStages(rows);
    await logAudit('Saved', 'Status Config', '', rows.length + ' stage(s) saved.');
    statusDraftRows = null;
    refreshStagesFromDB();
    refreshWorkflowFromDB(); // drop any gates whose pair no longer exists
    render();
  };
}

// ---- PAGE ACCESS (own module) ----------------------------------------------
// One shared, per-role checklist of which pages/nav items each role can
// open — this is a separate, independent layer from the Executive->Manager->
// Head lead-visibility tree (see visibleLeads()/reportsToCandidates() above):
// Page Access decides which PAGES a role can see; "Reports To" still decides
// which LEADS a Manager/Head sees once they're on a lead page. Edits here
// are a local draft — nothing is saved until "Save Page Access" is clicked,
// same pattern as Workflow/Status Config. Head's ('admin') checkboxes are
// always checked and disabled so Head can never accidentally lock itself
// out of Page Access (or anything else) — mirrors the "Head always allowed"
// rule already used for Workflow Config gates.
let pageAccessDraftRows = null;
function pageAccessDraft(){
  if(!pageAccessDraftRows){
    pageAccessDraftRows = KNOWN_VIEWS.map(view => ({
      view,
      roles: (VIEW_ACCESS[view] || DEFAULT_VIEW_ACCESS[view] || []).slice(),
    }));
  }
  return pageAccessDraftRows;
}
// Per-user overrides sit below the per-role grid: pick one person, tick/
// untick specific pages for them alone, on top of whatever their role
// defaults to above. Same local-draft-then-Save pattern; the draft resets
// whenever the selected user changes (see wirePageAccessEvents()'s
// pa-user-select handler and the sidebar-nav reset near wireSidebarNav()).
// Head ('admin') accounts are excluded from the user dropdown entirely —
// they already always have full access (see canAccessView()) and can't be
// overridden.
let pageAccessSelectedUserUid = '';
let userOverrideDraftRows = null;
function userOverrideDraft(uidVal){
  if(!userOverrideDraftRows){
    const user = userByUid(uidVal);
    const overrides = USER_PAGE_OVERRIDES[uidVal] || {};
    userOverrideDraftRows = KNOWN_VIEWS.map(view => ({
      view,
      allowed: Object.prototype.hasOwnProperty.call(overrides, view)
        ? overrides[view]
        : !!(user && VIEW_ACCESS[view] && VIEW_ACCESS[view].includes(user.role)),
    }));
  }
  return userOverrideDraftRows;
}
function renderPageAccessView(){
  const draft = pageAccessDraft();
  const rows = draft.map((r,i)=>`<tr>
      <td>${PAGE_TITLES[r.view] || r.view}</td>
      ${ROLES.map(role=>`<td style="text-align:center;">
        <input type="checkbox" data-pa-idx="${i}" data-pa-role="${role}" ${r.roles.includes(role) ? 'checked' : ''} ${role==='admin' ? 'disabled title="Head always has access"' : ''}>
      </td>`).join('')}
    </tr>`).join('');

  const nonHeadUsers = (DB.getUsers()||[]).filter(u=>u.role!=='admin');
  const selUser = pageAccessSelectedUserUid ? userByUid(pageAccessSelectedUserUid) : null;
  let userTableHtml = '';
  if(selUser){
    const oDraft = userOverrideDraft(selUser.uid);
    const overrides = USER_PAGE_OVERRIDES[selUser.uid] || {};
    const userRows = oDraft.map((r,i)=>{
      const isOverridden = Object.prototype.hasOwnProperty.call(overrides, r.view);
      const roleDefault = !!(VIEW_ACCESS[r.view] && VIEW_ACCESS[r.view].includes(selUser.role));
      const status = isOverridden
        ? `Overridden: ${r.allowed ? 'allowed' : 'blocked'}`
        : `Default for ${ROLE_LABELS[selUser.role]} (${roleDefault ? 'allowed' : 'blocked'})`;
      return `<tr>
          <td>${PAGE_TITLES[r.view] || r.view}</td>
          <td style="text-align:center;"><input type="checkbox" data-pu-idx="${i}" ${r.allowed ? 'checked' : ''}></td>
          <td style="font-size:12px;color:var(--muted);">${status}</td>
        </tr>`;
    }).join('');
    userTableHtml = `
      <div style="overflow-x:auto;margin-top:10px;">
        <table><tr><th>Page</th><th>Allowed</th><th>Status</th></tr>${userRows}</table>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm btn-teal" id="page-access-user-save">Save Overrides for ${selUser.name}</button>
        <button class="btn btn-sm" id="page-access-user-clear">Clear All Overrides for ${selUser.name}</button>
      </div>`;
  }

  return `
    <div class="page-header"><h1>Page Access</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Tick which roles can open each page/nav item. This controls page access only — it does not change which leads a Manager or Head can see; that's still driven by "Reports To" under Manage Users. Head always has access to every page and can't be unchecked here, so Head can never get locked out.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table><tr><th>Page</th>${ROLES.map(role=>`<th>${ROLE_LABELS[role]}</th>`).join('')}</tr>${rows}</table>
    </div>
    <div style="margin-top:12px;margin-bottom:20px;"><button class="btn btn-sm btn-teal" id="page-access-save">Save Page Access</button></div>

    <div class="card" style="padding:14px;margin-bottom:14px;">
      <h3 style="margin:0 0 4px;">Per-User Overrides</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Override specific pages for one person, on top of their role's default above. Head accounts always have full access and aren't listed here.</p>
      <label style="font-size:13px;">User:
        <select id="pa-user-select">
          <option value="">— select a user —</option>
          ${nonHeadUsers.map(u=>`<option value="${u.uid}" ${u.uid===pageAccessSelectedUserUid ? 'selected' : ''}>${u.name} (${ROLE_LABELS[u.role]})</option>`).join('')}
        </select>
      </label>
      ${userTableHtml}
    </div>
  `;
}
function wirePageAccessEvents(){
  document.querySelectorAll('[data-pa-idx]').forEach(cb=>cb.addEventListener('change', () => {
    const i = parseInt(cb.dataset.paIdx, 10);
    const role = cb.dataset.paRole;
    const draft = pageAccessDraft();
    const set = new Set(draft[i].roles);
    if(cb.checked) set.add(role); else set.delete(role);
    set.add('admin'); // Head can never be unchecked, even by tampering with the DOM
    draft[i].roles = Array.from(set);
  }));
  const saveBtn = document.getElementById('page-access-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const rows = pageAccessDraft().map(r=>({ view:r.view, roles:r.roles.slice() }));
    await DB.savePageAccess(rows);
    await logAudit('Saved', 'Page Access', '', 'Role-level page access grid saved.');
    pageAccessDraftRows = null;
    refreshViewAccessFromDB();
    applyRoleVisibility();
    render();
  };

  const userSelect = document.getElementById('pa-user-select');
  if(userSelect) userSelect.onchange = () => {
    pageAccessSelectedUserUid = userSelect.value;
    userOverrideDraftRows = null;
    render();
  };

  document.querySelectorAll('[data-pu-idx]').forEach(cb=>cb.addEventListener('change', () => {
    const i = parseInt(cb.dataset.puIdx, 10);
    const draft = userOverrideDraft(pageAccessSelectedUserUid);
    draft[i].allowed = cb.checked;
  }));

  const userSaveBtn = document.getElementById('page-access-user-save');
  if(userSaveBtn) userSaveBtn.onclick = async () => {
    const uidSel = pageAccessSelectedUserUid;
    const user = userByUid(uidSel);
    if(!user) return;
    const draft = userOverrideDraft(uidSel);
    // Diff each checkbox against that user's live role default at save
    // time — only the pages that actually differ get stored as override
    // rows, so a checkbox that happens to match the role default self-
    // cleans instead of piling up as a redundant stored row.
    const diffRows = draft
      .filter(r => r.allowed !== !!(VIEW_ACCESS[r.view] && VIEW_ACCESS[r.view].includes(user.role)))
      .map(r => ({ uid: uidSel, view: r.view, allowed: r.allowed }));
    const existing = (DB.getUserPageAccess()||[]).filter(r=>r.uid!==uidSel);
    await DB.saveUserPageAccess(existing.concat(diffRows));
    await logAudit('Saved', 'Page Access', 'Per-user override: ' + user.name, diffRows.length + ' page(s) overridden.');
    userOverrideDraftRows = null;
    refreshUserPageOverridesFromDB();
    applyRoleVisibility();
    render();
  };

  const userClearBtn = document.getElementById('page-access-user-clear');
  if(userClearBtn) userClearBtn.onclick = async () => {
    const uidSel = pageAccessSelectedUserUid;
    const user = userByUid(uidSel);
    if(!confirm(`Clear all page-access overrides for ${user ? user.name : 'this user'}? They will go back to their role's default access.`)) return;
    const existing = (DB.getUserPageAccess()||[]).filter(r=>r.uid!==uidSel);
    await DB.saveUserPageAccess(existing);
    await logAudit('Updated', 'Page Access', 'Per-user override: ' + (user ? user.name : ''), 'Overrides cleared — back to role default.');
    userOverrideDraftRows = null;
    refreshUserPageOverridesFromDB();
    applyRoleVisibility();
    render();
  };
}

// ---- AUDIT TRAIL ------------------------------------------------------------
// Read-only — nothing here is ever edited or deleted, same append-only
// discipline as every other log in this file. Shows the most recent 500
// config-change entries (DB.getAuditLog() already caps it there), newest
// first, with a filter panel (Entity Type / Actor / Date range) and the
// same generic Excel/PDF export the Reports page uses.
// Shared by the on-screen table AND the Excel/PDF export, so an export
// taken while filters are active matches exactly what's on screen — unlike
// the Reports page's exports (which have no filters of their own to match).
function filteredAuditLog(){
  const log = (DB.getAuditLog()||[]).slice().reverse(); // newest first
  const f = auditTrailFilters;
  return log.filter(e=>{
    if(f.entityType && e.entityType!==f.entityType) return false;
    if(f.actor && e.actor!==f.actor) return false;
    if(f.dateFrom){ const d=(e.at||'').toString().slice(0,10); if(!d || d<f.dateFrom) return false; }
    if(f.dateTo){ const d=(e.at||'').toString().slice(0,10); if(!d || d>f.dateTo) return false; }
    return true;
  });
}
function auditTrailReportRows(){
  return filteredAuditLog().map(e=>({
    'Date/Time': fmtDate(e.at), Actor: e.actor||'', Role: e.actorRole||'',
    Action: e.action||'', 'Entity Type': e.entityType||'', Entity: e.entityLabel||'', Notes: e.notes||'',
  }));
}

// ---- Lead Details — its own dedicated page (not a popup — Sara's explicit
//      request: "When i click the leads it has to go to new dedicated page
//      not a pop up"). Reached from many different pages (All Leads,
//      Dashboard, Reports, Channel Partner Details, …), so it remembers
//      whichever one sent it here (previousView) and returns there on
//      Back, same "drill into a record, then come back" shape as every
//      other full-page detail view in this app (see Channel Partner
//      Details). Content and order are unchanged from the old popup — one
//      long page, same tabs top to bottom, per Sara's choice to keep this
//      a low-risk move rather than also redesigning it into tabs.
function openLeadDetail(id){
  const l = DB.getLead(id);
  // Guards every role uniformly against opening a lead outside their branch
  // of the visibility tree (not just Executives) — belt-and-suspenders in
  // case a lead is ever reachable outside an already-filtered list.
  if(currentUser && l && !visibleLeads().some(v=>v.id===id)){
    alert('This lead is outside the leads you can access.'); return;
  }
  leadEditMode = false; // opening a (possibly different) lead always starts in read-only view
  reassignMode = false;
  leadDetailOpenStage = null; // forces the accordion to recompute this lead's default-open sections on first render
  currentDetailLeadId = id;
  if(currentView !== 'leadDetail') previousView = currentView;
  currentView = 'leadDetail';
  render();
}

function closeLeadDetail(){
  currentDetailLeadId = null;
  leadEditMode = false;
  reassignMode = false;
  currentView = previousView || 'list';
  previousView = null;
  render();
}

function renderLeadDetailPage(){
  const l = DB.getLead(currentDetailLeadId);
  if(!l){
    return `
      <div class="page-header"><h1>Lead Details</h1></div>
      <button class="btn btn-sm btn-ghost" id="ld-back" style="margin-bottom:12px;">&larr; Back</button>
      <div class="card"><p>This lead could not be found — it may have been deleted, or is outside what you can access.</p></div>`;
  }
  // Accordion open-state resets to this stage's defaults only when the
  // stage has actually changed since we last computed it (first open of
  // this lead, or a real Stage & Actions move) — see leadDetailOpenSections
  // above. In between, her own manual expand/collapse clicks are preserved
  // across re-renders from unrelated saves elsewhere on the page.
  if(l.stage !== leadDetailOpenStage){
    leadDetailOpenStage = l.stage;
    leadDetailOpenSections = visibleStageGatedSections(l.stage);
  }
  const SECTION_TITLES = { feasibility:'Feasibility', documents:'Documents', legal:'Legal Verification', negotiation:'Negotiation', valuation:'Valuation', proposal:'Acquisition Proposal', payments:'Payments', registration:'Registration' };
  const SECTION_RENDERERS = { feasibility:renderFeasibilityTab, documents:renderDocumentsTab, legal:renderLegalVerificationTab, negotiation:renderNegotiationTab, valuation:renderValuationTab, proposal:renderAcquisitionProposalTab, payments:renderPaymentsTab, registration:renderRegistrationTab };
  const inStageSet = visibleStageGatedSections(l.stage); // which sections are relevant RIGHT NOW, for the teal "in stage" highlight
  const accordion = STAGE_GATED_SECTIONS.map(key => {
    const open = leadDetailOpenSections.has(key);
    const inStage = inStageSet.has(key);
    return `<div class="acc-section ${open?'open':''} ${inStage?'in-stage':''}">
      <button class="acc-header" data-acc-toggle="${key}" type="button">
        <span class="acc-header-left"><span class="acc-title">${SECTION_TITLES[key]}</span><span class="acc-hint">${sectionHint(key, l)}</span></span>
        <span class="acc-chevron">&#9654;</span>
      </button>
      ${open ? `<div class="acc-body">${SECTION_RENDERERS[key](l)}</div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="page-header"><h1>${l.leadId} — ${l.village||'—'} ${l.onHold&&l.onHold.active?'<span class="badge badge-warn" style="margin-left:8px;">On Hold</span>':''}</h1></div>

    <div class="acc-linkbar">Showing what's relevant for the <b>${stageLabel(l.stage)}</b> stage below — click any section to open it. <button id="ld-expand-all" type="button">Expand all</button><span class="sep">|</span><button id="ld-collapse-rest" type="button">Collapse the rest</button></div>
    <div class="card" id="detail-tab-body">
      <h2 class="section-title" style="margin-top:0;">Overview</h2>
      ${renderOverviewTab(l)}
      <h2 class="section-title">Land Parcels</h2>
      ${renderParcelsTab(l)}
      <h2 class="section-title">Stage &amp; Actions</h2>
      ${renderStageTab(l)}
      ${accordion}
      <h2 class="section-title">History</h2>
      ${renderHistoryTab(l)}
    </div>`;
}

function wireLeadDetailViewEvents(){
  const backBtn = document.getElementById('ld-back');
  if(backBtn) backBtn.onclick = closeLeadDetail;
  document.querySelectorAll('[data-acc-toggle]').forEach(btn => btn.addEventListener('click', () => {
    const key = btn.dataset.accToggle;
    if(leadDetailOpenSections.has(key)) leadDetailOpenSections.delete(key); else leadDetailOpenSections.add(key);
    render();
  }));
  const expandAllBtn = document.getElementById('ld-expand-all');
  if(expandAllBtn) expandAllBtn.onclick = () => { leadDetailOpenSections = new Set(STAGE_GATED_SECTIONS); render(); };
  const collapseRestBtn = document.getElementById('ld-collapse-rest');

    leadDetailOpenSections = l ? visibleStageGatedSections(l.stage) : new Set();

  };
  const l = DB.getLead(currentDetailLeadId);
  if(!l) return;
  wireDetailTabEvents(l);
}
