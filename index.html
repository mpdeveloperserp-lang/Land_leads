<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Leads ERP — Working Model</title>
<!--
  FIREBASE SDK — loaded here so the app is genuinely wired to Firestore/Storage,
  not just documented. If your Firebase config below is still the placeholder,
  or these scripts can't load (e.g. no network), the app falls back to an
  in-memory demo automatically — see FIREBASE_CONFIG and boot() further down.
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<!-- Functions SDK — only used for the Manage Users "set this user's password"
     action, which calls the adminSetUserPassword Cloud Function (see the
     functions/ folder delivered alongside this file). If this script or the
     deployed function isn't present, that one action fails gracefully with
     an error message; everything else in the app is unaffected. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<!-- Export libraries — used by the Reports page's Export Excel / Export PDF buttons.
     If these can't load (no network), exports fall back to CSV / browser print. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- Leaflet (OpenStreetMap) — the lead's Location Map: drop a pin to record the
     exact spot, and see it on the Lead Details page. If it can't load, the
     map area falls back to a plain "Open in Google Maps" link. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --navy:#1B2A4A; --navy-light:#28406e; --gold:#B8912F; --gold-light:#e6c874;
    --teal:#1F6F6B; --teal-light:#2c9a94;
    --bg:#F3F5F8; --card:#FFFFFF; --text:#1F2430; --muted:#6B7280; --border:#E3E6EC;
    --danger:#C0392B; --danger-bg:#FBEAE8; --warn:#B8720A; --warn-bg:#FCF0DC; --ok:#22785A; --ok-bg:#E4F3EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{width:212px;flex:0 0 212px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-brand{padding:18px 20px 16px;border-bottom:1px solid var(--border);}
  .sidebar-brand .co{display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:700;}
  .sidebar-brand .title{display:block;font-size:15.5px;font-weight:700;color:var(--navy);margin-top:3px;line-height:1.3;}
  .sidebar nav{display:flex;flex-direction:column;gap:1px;padding:10px 0;flex:1;}
  .sidebar nav button{background:none;border:none;text-align:left;padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-left:3px solid transparent;width:100%;}
  .sidebar nav button:hover{background:#F6F8FB;color:var(--navy);}
  .sidebar nav button.active{color:var(--navy);background:#EEF2F8;border-left-color:var(--gold);}
  .nav-sub{display:flex;flex-direction:column;}
  .nav-sub button{padding:8px 20px 8px 34px;font-size:12.5px;font-weight:500;}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:5px;width:27px;height:27px;font-size:13px;line-height:1;cursor:pointer;margin-right:4px;color:var(--muted);}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-del:hover{border-color:var(--danger);color:var(--danger);}
  .icon-ok{color:var(--ok);border-color:#bfe3d1;}
  .sidebar-foot{padding:14px 20px 18px;border-top:1px solid var(--border);}
  .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700;padding:14px 20px 4px;}
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:15px 26px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .page-title{font-size:17px;font-weight:700;color:var(--navy);}
  #user-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);}
  #user-info .who{text-align:right;line-height:1.3;}
  #user-info .who b{color:var(--navy);display:block;font-size:13px;}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px 32px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.08);}
  .auth-card h1{font-size:17px;color:var(--navy);margin:0 0 4px;}
  .auth-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;}
  .auth-card label{margin-top:12px;}
  .auth-card label:first-of-type{margin-top:0;}
  .auth-error{background:var(--danger-bg);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:6px;margin-top:14px;}
  .auth-card .btn{width:100%;margin-top:18px;}
  /* Full-width pages — no centred max-width box, so every module uses the
     whole screen beside the sidebar (Sara: "Website is have to like Full page
     module — we find multiple gaps in multiple pages"). */
  main{padding:20px 24px 60px;width:100%;}
  .req-star{color:var(--danger);font-weight:700;}
  .map-box{height:340px;border-radius:8px;border:1px solid var(--border);background:#eef1f5;z-index:0;}
  .map-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);}
  .cond-box{background:#F6F8FB;border:1px dashed #cfd6e2;border-radius:8px;padding:10px 12px;}
  .doc-group{margin-bottom:12px;}
  .doc-group h4{margin:0 0 4px;font-size:12.5px;color:var(--navy);}
  /* Lead Details — one outlined sheet with blue section bands (IN4Suite) */
  .erp-sheet{background:#fff;border:1px solid #cdd8e8;border-radius:8px;overflow:hidden;}
  .erp-band{background:#E2EBF7;color:var(--navy);font-weight:700;font-size:14px;padding:10px 16px;border-top:1px solid #cdd8e8;border-bottom:1px solid #cdd8e8;}
  .erp-sheet > .erp-band:first-child{border-top:none;}
  .erp-body{padding:14px 16px;}
  .erp-split{display:grid;grid-template-columns:1fr 1fr;}
  .erp-split > div + div{border-left:1px solid #cdd8e8;}
  .erp-split fieldset{margin-bottom:12px;}
  .erp-actions{display:flex;justify-content:center;gap:10px;margin:18px 0 6px;}
  .form-grid.one-col{grid-template-columns:1fr !important;}
  @media (max-width:820px){ .erp-split{grid-template-columns:1fr;} .erp-split > div + div{border-left:none;} }
  @media print{ .sidebar,.topbar,.erp-actions,#banner-holder,fieldset{display:none !important;} main{padding:0;} }
  /* Org tree (Manage Users) */
  .org-tree, .org-tree ul{list-style:none;margin:0;padding:0;}
  .org-tree ul{margin-left:22px;border-left:2px solid #d5dbe5;padding-left:14px;}
  .org-tree li{position:relative;margin:8px 0;}
  .org-tree ul > li::before{content:'';position:absolute;left:-14px;top:18px;width:12px;border-top:2px solid #d5dbe5;}
  .org-node{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:8px;padding:7px 12px;font-size:13px;}
  .org-node .nm{font-weight:700;color:var(--navy);}
  .org-node .meta{font-size:11.5px;color:var(--muted);}
  .org-node.inactive{opacity:.55;}
  .org-node.role-admin{border-left-color:var(--gold);}
  .org-node.role-manager{border-left-color:var(--navy);}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .btn-gold{background:var(--gold);color:#2b2200;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-light);}
  .btn-ghost{background:var(--border);color:var(--text);}
  .btn-ghost:hover{background:#d8dce4;}
  .btn-ghost:disabled{opacity:.45;cursor:default;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;}
  .banner{background:var(--warn-bg);border:1px solid #edd9ab;color:#6b4c05;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .banner b{color:var(--navy);}
  .banner button{background:none;border:none;color:#6b4c05;font-weight:700;cursor:pointer;font-size:16px;line-height:1;}
  .grid{display:grid;gap:14px;}
  .cards4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .stat{cursor:pointer;transition:.15s;}
  .stat:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;}
  .stat .value{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .page-header h1{font-size:19px;color:var(--navy);margin:0;}
  h2.section-title{font-size:15px;color:var(--navy);margin:26px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px;}
  h2.section-title .tag{background:var(--teal);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;letter-spacing:.4px;}
  .acc-section{border-top:1px solid var(--border);margin-top:14px;}
  .acc-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;padding:14px 0 10px;margin:0;cursor:pointer;text-align:left;font-family:inherit;}
  .acc-header:hover .acc-title{color:var(--teal);}
  .acc-header-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .acc-title{font-size:15px;color:var(--navy);font-weight:700;}
  .acc-hint{font-size:11.5px;color:var(--muted);font-weight:600;}
  .acc-chevron{font-size:11px;color:var(--muted);transition:transform .15s;flex:0 0 auto;}
  .acc-section.open .acc-chevron{transform:rotate(90deg);}
  .acc-section.in-stage .acc-title{color:var(--teal);}
  .acc-body{padding-bottom:4px;}
  .acc-linkbar{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .acc-linkbar button{background:none;border:none;padding:0;color:var(--teal);font-weight:700;font-size:11.5px;cursor:pointer;text-decoration:underline;}
  .acc-linkbar .sep{margin:0 6px;color:var(--border);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;background:#F8F9FB;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);}
  table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table tr.clickable-row:hover{background:#F6F8FB;cursor:pointer;}
  table.leads-table th:first-child, table.leads-table td:first-child{width:30px;text-align:center;padding-right:0;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-ok{background:var(--ok-bg);color:var(--ok);}
  .badge-warn{background:var(--warn-bg);color:var(--warn);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-navy{background:#e7ecf5;color:var(--navy);}
  .badge-gold{background:#faf1da;color:#8a6a10;}
  .badge-muted{background:#eef0f3;color:var(--muted);}
  .conn-dot{display:inline-flex;align-items:center;gap:5px;}
  .funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;cursor:pointer;padding:3px;border-radius:6px;}
  .funnel-row:hover{background:#F6F8FB;}
  .funnel-row .flabel{width:170px;flex:0 0 170px;color:var(--navy);font-weight:600;}
  .funnel-row .fbar-wrap{flex:1;background:#eceff3;border-radius:6px;overflow:hidden;height:22px;position:relative;}
  .funnel-row .fbar{background:linear-gradient(90deg,var(--teal),var(--navy));height:100%;border-radius:6px;}
  .funnel-row .fcount{width:34px;text-align:right;font-weight:700;color:var(--navy);}
  .donut-sub{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  .donutwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 6px 10px;}
  .donutwrap svg{max-width:100%;height:auto;}
  .donutwrap .donut-seg{cursor:pointer;transition:opacity .15s;}
  .donutwrap .donut-seg:hover{opacity:.82;}
  .donutwrap .donut-label{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none;}
  .donut-legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .donut-legend .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);cursor:pointer;}
  .donut-legend .legend-swatch{width:11px;height:11px;border-radius:2px;flex:0 0 auto;}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
  .col{background:#EAEDF2;border-radius:10px;padding:10px;min-width:250px;flex:0 0 250px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--navy);padding:4px 6px 10px;}
  .col-head .count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;}
  .lead-card{background:#fff;border-radius:8px;padding:10px 11px;margin-bottom:8px;border:1px solid var(--border);border-left:4px solid var(--teal);cursor:pointer;font-size:12.5px;}
  .lead-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .lead-card .lid{font-weight:700;color:var(--navy);font-size:12px;}
  .lead-card .vil{font-weight:600;margin:2px 0;}
  .lead-card .meta{color:var(--muted);font-size:11.5px;}
  .lead-card .badges{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input, .toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
  .toolbar input[type=text]{min-width:220px;}
  .filter-panel{margin-bottom:14px;}
  .filter-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
  .index-nav{display:flex;gap:2px;flex-wrap:wrap;}
  .idx-btn{border:1px solid var(--border);background:#fff;padding:4px 7px;font-size:11px;border-radius:4px;cursor:pointer;color:var(--muted);font-weight:600;}
  .idx-btn:hover{border-color:var(--teal);color:var(--teal);}
  .idx-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pagination{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:8px;}
  .page-btns{display:flex;gap:6px;align-items:center;}
  .page-num{font-weight:700;color:var(--navy);padding:0 6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{background:var(--navy);color:#fff;padding:16px 22px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-head .x{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;opacity:.8;}
  .modal-body{padding:20px 22px;max-height:75vh;overflow-y:auto;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=datetime-local],input[type=file],select,textarea{
    width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);
  }
  input[type=file]{padding:6px;font-size:12px;}
  textarea{resize:vertical;min-height:44px;}
  .field-pair{display:flex;gap:6px;}
  .field-pair input{flex:1;}
  .field-pair select{flex:0 0 100px;}
  .computed{font-size:11.5px;color:var(--teal);margin-top:3px;font-weight:600;}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:0 0 16px;}
  legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  .stage-track{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .stage-pill{padding:6px 12px;border-radius:16px;font-size:11.5px;font-weight:700;background:#eceff3;color:var(--muted);border:1px solid transparent;}
  .stage-pill.done{background:var(--ok-bg);color:var(--ok);}
  .stage-pill.now{background:var(--navy);color:#fff;}
  .modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;border-radius:0 0 12px 12px;}
  .history-item{border-left:2px solid var(--border);padding:2px 0 10px 14px;margin-left:4px;position:relative;font-size:12.5px;}
  .history-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--teal);}
  .history-item .when{color:var(--muted);font-size:11px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .doc-row:last-child{border-bottom:none;}
  .doc-row a{color:var(--teal);text-decoration:none;font-weight:600;}
  .inline-add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .inline-add input, .inline-add select{flex:1;min-width:120px;}
  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:6px 0;}
  .setup-code{background:#111827;color:#d1e7ff;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre;}
  .callitem{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer;border-radius:4px;}
  .callitem:hover{background:#F6F8FB;}
  .callitem:last-child{border-bottom:none;}
  .clickable-row:hover{cursor:pointer;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  /* IN4Suite-style forms on wide screens: three columns across the full
     page, each label sitting to the LEFT of its input (Sara's reference
     screenshots). Narrower screens fall back to stacked labels. */
  @media (min-width:1100px){
    .form-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 30px;}
    .form-grid > div:not(.full){display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr);align-items:center;column-gap:12px;}
    .form-grid > div:not(.full) > label{margin:0;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:#3d4554;}
    .form-grid > div:not(.full) > :not(label){grid-column:2;}
    .two-col .form-grid, .erp-split .form-grid:not(.one-col){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;}
    .two-col .form-grid > div:not(.full), .erp-split .form-grid:not(.one-col) > div:not(.full){display:block;}
    .two-col .form-grid > div:not(.full) > label, .erp-split .form-grid:not(.one-col) > div:not(.full) > label{margin-bottom:4px;text-transform:uppercase;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
  }
  @media (max-width:820px){.two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} .app-shell{flex-direction:column;} .sidebar{position:static;height:auto;width:100%;flex:0 0 auto;}}
</style>
</head>
<body>

<div id="auth-root" style="display:none;"></div>

<div class="app-shell" id="app-shell" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="co">MP DEVELOPERS</span>
      <span class="title">Land Leads ERP</span>
    </div>
    <nav id="tabs">

const DEFAULT_VIEW_ACCESS = {

function subtreeUids(rootUid, cmap){

    const id = stack.pop();
    if(!id || out.has(id)) continue;
    out.add(id);
    (cmap[id]||[]).forEach(c=>stack.push(c.uid));

// The top of someone's chain (follows Reports To upward, cycle-safe).

    const up = userByUid(cur.reportsTo);
    if(!up) break;
    cur = up;
  }
  return cur;
}

// Who a Manager/Head/Admin may link/re-link a Channel Partner's owner to.
// Manager: themselves or one of their own reporting Executives — same
// branch-scoping precedent as reassignment, so a Manager can "claim" a
// legacy CP into their own branch or hand it to one of their Executives,
// but never into a different branch. Head/Admin: any active Manager or
// Executive company-wide, same full-access precedent as everywhere else.
function cpOwnerLinkTargets(){
  if(!currentUser) return [];
  const all = treeUsers();
  if(currentUser.role==='manager'){
    const mine = subtreeUids(currentUser.uid);
    return all.filter(u => mine.has(u.uid));
  }
  return all; // admin/sysadmin — company-wide
}
// Shared mandatory/format validation for a Channel Partner's editable
// fields — used by both the Add form (bottom of the Channel Partners list)
// and the Modify form (Channel Partner Details page), so a record can never
// be saved half-filled or malformed from either entry point. Name is
// required; Phone is required and must be a plain 10-digit mobile number
// (matches every seed/demo CP); Commission % is optional, but when given
// must be a plain number from 0-100. Returns {ok, message}.
function validateCPFields(fields){
  if(!fields.name || !String(fields.name).trim()) return { ok:false, message:'Name is required.' };
  const phone = String(fields.phone||'').trim();
  if(!phone) return { ok:false, message:'Phone (mobile number) is required.' };
  if(!/^[0-9]{10}$/.test(phone)) return { ok:false, message:'Phone must be a 10-digit mobile number.' };
  if(fields.commissionPct !== '' && fields.commissionPct != null){
    const n = Number(fields.commissionPct);
    if(isNaN(n) || n < 0 || n > 100) return { ok:false, message:'Commission % must be a number between 0 and 100.' };
  }
  return { ok:true, message:'' };
}

// ---- Workflow config -------------------------------------------------------
// Role-wise From Status -> To Status mapping (like the "Entity Wise Role And
// Status Mapping" screen): each row grants ONE specific role permission to
// perform ONE specific From->To move (moving forward into a stage and
// moving back out of it are separate rows). A From status can branch to
// several To statuses — including non-adjacent jumps (e.g. Under Evaluation
// straight to Closed as a "drop"), same as the reference screen — and the
// same From->To move can have several rows, one per role allowed to perform
// it. Head can always approve every transition regardless of what's
// configured here (top-level sign-off), the same way it always could under
// the old rank-based rule.
//
// The app's built-in "Move to next stage" / "Move back" buttons on a lead
// (see renderStageTab) always cover the immediate adjacent pair and stay
// ungated by default — configuring one of those pairs here still just adds
// an approval gate to that same built-in move. Any OTHER row — a non-
// adjacent From->To pair — shows up as an EXTRA "Move to X" option on that
// lead's Stage & Actions tab, gated by whichever role(s) this table lists.
// From==='closed' rows are accepted here for full flexibility but never
// surface as an actual move (Closed stays terminal, see renderStageTab).
const DEFAULT_WORKFLOW_CONFIG = [
  { from:'doc_legal',   to:'negotiation', role:'manager', label:'Approve entry into Negotiation' },
  { from:'negotiation', to:'closed',      role:'admin',   label:'Approve Closing (Acquired)' },
];
let WORKFLOW_CONFIG = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
function defaultGateLabel(from, to){ return to==='closed' ? 'Approve Closing (Acquired)' : ('Approve ' + stageLabel(from) + ' → ' + stageLabel(to)); }
// Every distinct ordered (From, To) combination across the current stage
// list — any status can map to any other status, no adjacency requirement.
function allTransitionPairs(){
  const pairs = [];
  STAGE_KEYS.forEach(from => STAGE_KEYS.forEach(to => { if(from !== to) pairs.push({ from, to }); }));
  return pairs;
}
function refreshWorkflowFromDB(){
  const rows = (DB && DB.getWorkflow) ? DB.getWorkflow() : null;
  const source = (rows && rows.length) ? rows : DEFAULT_WORKFLOW_CONFIG;
  const validPairs = allTransitionPairs();
  WORKFLOW_CONFIG = source
    .map(r => {
      // Back-compat: rows saved before From/To pairs existed only carried
      // {key,label,minRole}, meaning "approval required to enter `key` from
      // whatever stage precedes it" — migrate those to an explicit pair, and
      // rows saved before the role-wise rework carried `minRole` instead of
      // `role` — same field, new name.
      let from = r.from, to = r.to || r.key;
      if(!from && to){
        const toIdx = STAGE_INDEX[to];
        from = (toIdx > 0) ? STAGE_KEYS[toIdx-1] : null;
      }
      return { from, to, label: r.label || (from && to ? defaultGateLabel(from, to) : ''), role: r.role || r.minRole || 'admin' };
    })
    .filter(r => r.from && r.to && validPairs.some(p => p.from===r.from && p.to===r.to));
}
// A From->To move can have several rows (one per permitted role) — this
// returns all of them for that exact directional pair.
function findGates(fromKey, toKey){ return WORKFLOW_CONFIG.filter(w => w.from===fromKey && w.to===toKey); }
function findGate(fromKey, toKey){ return findGates(fromKey, toKey)[0]; }
function isGatedTransition(fromKey, toKey){ return findGates(fromKey, toKey).length > 0; }
// Head ('admin') is always allowed, matching its old top-of-rank status;
// every other role must have an explicit row for this exact From->To move.
function roleAllowedForGate(role, fromKey, toKey){
  const gates = findGates(fromKey, toKey);
  if(!gates.length) return true;
  if(role === 'admin') return true;
  return gates.some(g => g.role === role);
}
function gateRoleLabels(fromKey, toKey){ return findGates(fromKey, toKey).map(g=>ROLE_LABELS[g.role]).join(', '); }

const fmtINR = n => n==null||isNaN(n) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const fmtNum = n => n==null||isNaN(n) ? '—' : Number(n).toLocaleString('en-IN', {maximumFractionDigits:1});
// Firestore's serverTimestamp() fields come back live as Firestore Timestamp
// objects (not a Date/ISO string) — those carry a toDate() method, so unwrap
// with it before parsing; otherwise `new Date(...)` fails and used to leak
// the raw object's toString() ("Timestamp(seconds=..., nanoseconds=...)")
// straight into the UI.
const fmtDate = d => {
  if(!d) return '—';
  const raw = (typeof d === 'object' && typeof d.toDate === 'function') ? d.toDate() : d;
  const dt = new Date(raw);
  return isNaN(dt) ? '—' : dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
};

// Validated categorical palette — 8 hues in a fixed order that clears every
// adjacent-pair CVD/contrast check (used by the Pipeline Funnel donut on the
// Dashboard). Assigned by stage position, not hand-picked per stage, so it
// stays correct as stages are renamed/reordered/added on Status Config.
const DONUT_PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
// Picks white or the app's ink color as a segment's label text, by the
// segment fill's relative luminance, so the value stays legible on both the
// darker slots (blue/violet/green) and the lighter ones (yellow/aqua).
function readableTextOn(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  return L > 0.5 ? '#1F2430' : '#ffffff';
}

function extentSqft(v,u){ return (Number(v)||0) * (EXTENT_UNITS[u]?.sqft || 1); }
function pricePerSqft(v,u){ return (Number(v)||0) / (EXTENT_UNITS[u]?.sqft || 1); }
// Converts a raw sqft figure back into any target unit — used to show a
// Land Parcel's computed Balance Extent in the same unit as its Total
// Recorded Extent, regardless of what units the other extent fields used.
function sqftToUnit(sqft,u){ return (Number(sqft)||0) / (EXTENT_UNITS[u]?.sqft || 1); }
// Last-10-digits comparison so "9840011111", "+91 98400 11111" and
// "091-98400-11111" are all recognized as the same number for landowner
// duplicate detection, without forcing one strict input format.
function normalizePhoneDigits(p){ return String(p||'').replace(/\D/g,'').slice(-10); }
// Same auto-numbering scheme as nextMasterCode() (see Masters), generalized
// to whichever field name holds the code on a given record type, since
// Landowners/Land Parcels aren't part of the generic MASTER_DEFS system.
function nextEntityCode(prefix, items, codeField, padLen){
  const re = new RegExp('^' + prefix + '-(\\d+)$');
  const maxNum = (items||[]).reduce((max, it) => {
    const m = re.exec(String(it[codeField]||'').trim());
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);
  return prefix + '-' + String(maxNum + 1).padStart(padLen||3, '0');
}

class MemoryDB {
  constructor(){
    this.leads = seedLeads().map(l => Object.assign({ id: l.leadId }, l));
    this.masters = {};
    MASTER_DEFS.forEach(m => {
      this.masters[m.key] = seedMaster(m.key).map((f,i) => Object.assign({ id: 'seed-'+m.key+'-'+i, active:true }, f));
    });
    this.landowners = seedLandowners().map((f,i) => Object.assign({ id: 'seed-lo-'+i, active:true }, f));
    this.landParcels = seedLandParcels(this.leads[0] ? this.leads[0].id : '', this.landowners).map((f,i) => Object.assign({ id: 'seed-pcl-'+i, active:true }, f));
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
    this.workflow = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
    this.pageAccess = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles: roles.slice()}));
    this.userPageAccess = [];
    this.users = DEFAULT_USERS_SEED.map(u=>Object.assign({ id:u.uid }, u));
    this.auditLog = [];
  }
  async init(){ /* nothing to load — already seeded in memory */ }
  ready(){ return Promise.resolve(); }
  isLive(){ return false; }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){ const withId = Object.assign({}, lead, { id: lead.leadId }); this.leads.unshift(withId); }
  async updateLead(id, patch){ const i=this.leads.findIndex(l=>l.id===id); if(i>-1) this.leads[i]=Object.assign({}, this.leads[i], patch, {updatedAt:new Date().toISOString()}); }
  // Reassignment — every check here is re-run regardless of what the UI
  // already filtered, so a direct call can never bypass role/active-user
  // enforcement (see canReassignLead()/eligibleReassignmentTargets()
  // above). A Manager/Head/Admin's destination Executive no longer has to
  // report to the same Manager as the current one (widened per Sara's
  // request — a lead can now cross branches), so the audit entry records
  // BOTH the old and new Manager rather than assuming they're the same.
  // An Executive actor, though, IS still restricted to a same-Manager
  // destination (Sara's explicit, narrower choice when reassignment was
  // extended down to Executives) — re-checked here, not just in
  // eligibleReassignmentTargets()'s dropdown filtering. Appends to
  // reassignmentHistory — never trims or overwrites it — and changes ONLY
  // assignedExecutive on the SAME lead document; nothing else about the
  // lead (status stays Frozen/On Hold, stageHistory/documents/etc.
  // untouched, no new lead created).
  async reassignLead(leadId, newExecutiveName, remarks){
    const lead = this.leads.find(l=>l.id===leadId);
    if(!lead) throw new Error('Lead not found.');
    const newExec = validateReassignTarget(lead, newExecutiveName);
    const currentExec = userByName(lead.assignedExecutive);
    const fromManager = currentExec ? userByUid(currentExec.reportsTo) : null;
    const toManager = userByUid(newExec.reportsTo);
    const statusLabel = (lead.onHold && lead.onHold.active) ? 'Frozen' : 'Active';
    const entry = {
      fromExecutive: lead.assignedExecutive, toExecutive: newExec.name,
      fromManager: fromManager ? fromManager.name : '', toManager: toManager ? toManager.name : '',
      reassignedBy: currentUser.name, reassignedAt: new Date().toISOString(), remarks: (remarks||'').trim(),
      previousStatus: statusLabel, currentStatus: statusLabel,
    };
    const i = this.leads.findIndex(l=>l.id===leadId);
    this.leads[i] = Object.assign({}, lead, {
      assignedExecutive: newExec.name,
      reassignmentHistory: (lead.reassignmentHistory||[]).concat([entry]),
      updatedAt: new Date().toISOString(),
    });
  }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }
  getAllMasters(key){ return this.masters[key]||[]; }
  async addMaster(key, fields){
    const def = MASTER_DEFS.find(m=>m.key===key);
    // Owner-tracked masters (Channel Partners — see trackOwner) are stamped
    // with WHO created them at the moment of creation, never touched again
    // afterwards (no updateMaster call below ever sets these) — this is the
    // uid-based creator record the Manager-wise CP visibility rules key off
    // of (see canSeeCP()), deliberately not relying on just a display name.
    const stamped = (def && def.trackOwner && currentUser)
      ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name })
      : fields;
    this.masters[key].push(Object.assign({ id: uid('M'), active:true }, stamped));
  }
  async updateMaster(key, id, patch){ const arr=this.masters[key]; const i=arr.findIndex(m=>m.id===id); if(i>-1) arr[i]=Object.assign({}, arr[i], patch); }
  async toggleMaster(key, id){ const arr=this.masters[key]; const cur=arr.find(m=>m.id===id); if(cur) await this.updateMaster(key,id,{active: !(cur.active!==false)}); }
  async deleteMaster(key, id){ this.masters[key] = (this.masters[key]||[]).filter(m=>m.id!==id); }
  getFieldConfig(){ return this.fieldConfig; }
  async saveFieldConfig(rows){ this.fieldConfig = rows.map(r=>Object.assign({}, r)); }
  // Audit Trail — a system-wide, append-only log of CONFIGURATION changes
  // (masters, users, Workflow/Status/Page-Access/Field config) — the one
  // category of change in this app that had NO history anywhere until now.
  // Deliberately does NOT duplicate what every lead already tracks in its
  // own rich append-only logs (stageHistory/negotiationLog/paymentLog/etc.)
  // — this is for "who changed the SYSTEM, not a lead" questions. Oldest-
  // first, same convention as every other array log in this file; the
  // Audit Trail page reverses it for display.
  getAuditLog(){ return this.auditLog; }
  async addAuditEntry(entry){ this.auditLog.push(Object.assign({ id: uid('AUD'), at: new Date().toISOString() }, entry)); }
  getStages(){ return this.stages; }
  async saveStages(rows){ this.stages = rows.map(r=>Object.assign({}, r)); }
  getWorkflow(){ return this.workflow; }
  async saveWorkflow(rows){ this.workflow = rows.map(r=>Object.assign({}, r)); }
  getPageAccess(){ return this.pageAccess; }
  async savePageAccess(rows){ this.pageAccess = rows.map(r=>({ view:r.view, roles:(r.roles||[]).slice() })); }
  getUserPageAccess(){ return this.userPageAccess; }
  async saveUserPageAccess(rows){ this.userPageAccess = rows.map(r=>({ uid:r.uid, view:r.view, allowed: !!r.allowed })); }
  // ---- Users & Access (demo-mode mock — plaintext password, memory-only) --
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  async login(email, password){
    const e = (email||'').trim().toLowerCase();
    const user = this.users.find(u=>u.email.toLowerCase()===e && u.active!==false);
    if(!user || user.password !== password) throw new Error('Incorrect email or password.');
    return Object.assign({}, user);
  }
  async logout(){ /* no-op — demo mode holds no session */ }
  async createUser({name, email, phone, role, password, reportsTo}){
    const e = (email||'').trim().toLowerCase();
    if(this.users.find(u=>u.email.toLowerCase()===e)) throw new Error('A user with that email already exists.');
    const newUid = uid('USR');
    const newUser = { id:newUid, uid:newUid, name, email:(email||'').trim(), phone: phone||'', role, password, active:true, reportsTo: reportsTo||'' };
    this.users.push(newUser);
    return Object.assign({}, newUser);
  }
  async updateUser(userUid, patch){ const i=this.users.findIndex(u=>u.uid===userUid); if(i>-1) this.users[i]=Object.assign({}, this.users[i], patch); }
  async toggleUser(userUid){ const u=this.users.find(x=>x.uid===userUid); if(u) await this.updateUser(userUid, {active: !(u.active!==false)}); }
  async deleteUser(userUid){ this.users = this.users.filter(u=>u.uid!==userUid); }
  // Demo mode stores passwords as plain in-memory strings (see login()
  // above), so setting one directly is trivial — no backend involved. Kept
  // as its own method (not folded into updateUser's generic patch) so both
  // DB implementations share one call shape from the UI.
  async changeUserPassword(userUid, newPassword){
    if(!newPassword || newPassword.length < 6) throw new Error('Password must be at least 6 characters.');
    const u = this.users.find(x=>x.uid===userUid);
    if(!u) throw new Error('User not found.');
    u.password = newPassword;
  }
  // ---- Landowner registry (Land Acquisition ERP, Module 3) ---------------
  getLandowners(){ return this.landowners.filter(o=>o.active!==false); }
  getAllLandowners(){ return this.landowners; }
  getLandowner(id){ return this.landowners.find(o=>o.id===id); }
  async addLandowner(fields){
    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    const rec = Object.assign({ id: uid('LO'), active:true, createdAt: new Date().toISOString() }, stamped);
    this.landowners.push(rec);
    return rec;
  }
  async updateLandowner(id, patch){ const i=this.landowners.findIndex(o=>o.id===id); if(i>-1) this.landowners[i]=Object.assign({}, this.landowners[i], patch, {updatedAt:new Date().toISOString()}); }
  async toggleLandowner(id){ const o=this.landowners.find(x=>x.id===id); if(o) await this.updateLandowner(id, {active: !(o.active!==false)}); }
  async deleteLandowner(id){ this.landowners = this.landowners.filter(o=>o.id!==id); }
  // ---- Land Parcel & Survey registry (Land Acquisition ERP, Module 4) ----
  getLandParcels(){ return this.landParcels.filter(p=>p.active!==false); }
  getAllLandParcels(){ return this.landParcels; }
  getLandParcel(id){ return this.landParcels.find(p=>p.id===id); }
  async addLandParcel(fields){
    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    const rec = Object.assign({ id: uid('PCL'), active:true, createdAt: new Date().toISOString() }, stamped);
    this.landParcels.push(rec);
    return rec;
  }
  async updateLandParcel(id, patch){ const i=this.landParcels.findIndex(p=>p.id===id); if(i>-1) this.landParcels[i]=Object.assign({}, this.landParcels[i], patch, {updatedAt:new Date().toISOString()}); }
  async toggleLandParcel(id){ const p=this.landParcels.find(x=>x.id===id); if(p) await this.updateLandParcel(id, {active: !(p.active!==false)}); }
  async deleteLandParcel(id){ this.landParcels = this.landParcels.filter(p=>p.id!==id); }
}

class FirestoreDB {
  constructor(fsdb, storage){
    this.fsdb = fsdb;
    this.storage = storage;
    this.leads = [];
    this.masters = {};
    MASTER_DEFS.forEach(m => this.masters[m.key] = []);
    this.fieldConfig = DEFAULT_FIELD_CONFIG.map(f=>Object.assign({}, f));
    this.stages = DEFAULT_STAGE_CONFIG.map(s=>Object.assign({}, s));
    this.workflow = DEFAULT_WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
    this.pageAccess = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles: roles.slice()}));
    this.userPageAccess = [];
    this.users = [];
    this.landowners = [];
    this.landParcels = [];
    this.auditLog = [];
    this._onChange = null;
    this._pending = new Set(['leads', 'fieldConfig', 'stages', 'workflow', 'pageAccess', 'userPageAccess', 'users', 'landowners', 'auditLog', ...MASTER_DEFS.map(m=>'master:'+m.key)]);
    this._readyResolvers = [];
  }
  onChange(cb){ this._onChange = cb; }
  _markReady(tag){
    this._pending.delete(tag);
    if(this._pending.size===0){ this._readyResolvers.forEach(r=>r()); this._readyResolvers = []; }
  }
  ready(){ return this._pending.size===0 ? Promise.resolve() : new Promise(res=>this._readyResolvers.push(res)); }
  isLive(){ return true; }
  hasStorage(){ return !!this.storage; }
  storageRef(path){ return this.storage.ref(path); }

  async init(){
    // One-time seed of each master collection if it's empty, so a freshly
    // connected project isn't blank.
    for(const m of MASTER_DEFS){
      const snap = await this.fsdb.collection(m.collection).limit(1).get();
      if(snap.empty){
        const seed = seedMaster(m.key);
        const batch = this.fsdb.batch();
        seed.forEach(f=>{
          const ref = this.fsdb.collection(m.collection).doc();
          batch.set(ref, Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, f));
        });
        await batch.commit();
      }
    }
    // One-time seed of sample leads if the leads collection is empty.
    const leadSnap = await this.fsdb.collection('leads').limit(1).get();
    if(leadSnap.empty){
      const seed = seedLeads();
      const batch = this.fsdb.batch();
      seed.forEach(lead=>{
        const ref = this.fsdb.collection('leads').doc();
        batch.set(ref, Object.assign({}, lead, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      });
      await batch.commit();
    }
    // One-time seed of sample landowners/land parcels if those collections
    // are empty. The seed parcel is left unlinked to a specific lead here
    // (leadId:'') since the just-seeded leads' real Firestore doc ids
    // aren't known at this point without extra bookkeeping for what's only
    // demo data — link it to a real lead from the Land Parcels page once
    // you're populating real records.
    const loSnap = await this.fsdb.collection('landowners').limit(1).get();
    if(loSnap.empty){
      const batch = this.fsdb.batch();
      seedLandowners().forEach(f=>{
        const ref = this.fsdb.collection('landowners').doc();
        batch.set(ref, Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, f));
      });
      await batch.commit();
    }
    // One-time seed of the lead field configuration doc if it doesn't exist yet.
    const fcRef = this.fsdb.collection('settings').doc('leadFieldConfig');
    const fcSnap = await fcRef.get();
    if(!fcSnap.exists){ await fcRef.set({ rows: DEFAULT_FIELD_CONFIG }); }
    fcRef.onSnapshot(snap=>{
      this.fieldConfig = (snap.data() && snap.data().rows) || DEFAULT_FIELD_CONFIG;
      this._markReady('fieldConfig');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('fieldConfig listener error', err); this._markReady('fieldConfig'); });

    // One-time seed of the stages doc if it doesn't exist yet.
    const stRef = this.fsdb.collection('settings').doc('stages');
    const stSnap = await stRef.get();
    if(!stSnap.exists){ await stRef.set({ rows: DEFAULT_STAGE_CONFIG }); }
    stRef.onSnapshot(snap=>{
      this.stages = (snap.data() && snap.data().rows) || DEFAULT_STAGE_CONFIG;
      this._markReady('stages');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('stages listener error', err); this._markReady('stages'); });

    // One-time seed of the workflow config doc if it doesn't exist yet.
    const wfRef = this.fsdb.collection('settings').doc('workflow');
    const wfSnap = await wfRef.get();
    if(!wfSnap.exists){ await wfRef.set({ rows: DEFAULT_WORKFLOW_CONFIG }); }
    wfRef.onSnapshot(snap=>{
      this.workflow = (snap.data() && snap.data().rows) || DEFAULT_WORKFLOW_CONFIG;
      this._markReady('workflow');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('workflow listener error', err); this._markReady('workflow'); });

    // One-time seed of the page access doc if it doesn't exist yet.
    const paRef = this.fsdb.collection('settings').doc('pageAccess');
    const paSnap = await paRef.get();
    const defaultPageAccessRows = Object.entries(DEFAULT_VIEW_ACCESS).map(([view,roles])=>({view, roles}));
    if(!paSnap.exists){ await paRef.set({ rows: defaultPageAccessRows }); }
    paRef.onSnapshot(snap=>{
      this.pageAccess = (snap.data() && snap.data().rows) || defaultPageAccessRows;
      this._markReady('pageAccess');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('pageAccess listener error', err); this._markReady('pageAccess'); });

    // One-time seed of the per-user page-access overrides doc if it doesn't
    // exist yet. Unlike pageAccess, there is no meaningful "default" here —
    // an empty array means every user simply follows their role's default
    // (see renderPageAccessView()'s "Per-User Overrides" section), so this
    // doc only ever holds explicit differences from that role default.
    const upaRef = this.fsdb.collection('settings').doc('userPageAccess');
    const upaSnap = await upaRef.get();
    if(!upaSnap.exists){ await upaRef.set({ rows: [] }); }
    upaRef.onSnapshot(snap=>{
      this.userPageAccess = (snap.data() && snap.data().rows) || [];
      this._markReady('userPageAccess');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('userPageAccess listener error', err); this._markReady('userPageAccess'); });

    // Users are NOT auto-seeded — real accounts are created from the Users
    // & Access master (or the one-time "create admin" screen on first run),
    // since a Firestore doc alone can't create a working login.
    this.fsdb.collection('m_users').onSnapshot(snap=>{
      this.users = snap.docs.map(d=>Object.assign({ uid:d.id, id:d.id }, d.data()));
      this._markReady('users');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('users listener error', err); this._markReady('users'); });

    // Live listeners keep local caches (and the UI) in sync with Firestore.
    this.fsdb.collection('leads').orderBy('createdAt','desc').onSnapshot(snap=>{
      this.leads = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      this._markReady('leads');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('leads listener error', err); this._markReady('leads'); });

    MASTER_DEFS.forEach(m=>{
      this.fsdb.collection(m.collection).onSnapshot(snap=>{
        this.masters[m.key] = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
        this._markReady('master:'+m.key);
        if(this._onChange) this._onChange();
      }, err=>{ console.error(m.key+' listener error', err); this._markReady('master:'+m.key); });
    });

    this.fsdb.collection('landowners').onSnapshot(snap=>{
      this.landowners = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      this._markReady('landowners');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('landowners listener error', err); this._markReady('landowners'); });


    // Audit Trail — newest 500 config-change entries, kept oldest-first in
    // local state (same convention as MemoryDB.auditLog and every other
    // array log in this file) by reversing the desc-ordered page right
    // after it's read.
    this.fsdb.collection('auditLog').orderBy('at','desc').limit(500).onSnapshot(snap=>{
      this.auditLog = snap.docs.map(d=>Object.assign({ id:d.id }, d.data())).reverse();
      this._markReady('auditLog');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('auditLog listener error', err); this._markReady('auditLog'); });
  }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){
    await this.fsdb.collection('leads').add(Object.assign({}, lead, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  async updateLead(id, patch){
    await this.fsdb.collection('leads').doc(id).update(Object.assign({}, patch, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  // Same validation as MemoryDB.reassignLead() (see its comment), run
  // inside a Firestore transaction so a concurrent change to this exact
  // lead — someone else resuming it from hold, or reassigning it, at the
  // same moment — can't race past the "still Frozen" / role checks. A
  // Manager/Head/Admin's destination Executive no longer has to report to
  // the same Manager as the current one (widened per Sara's request — a
  // lead can now cross branches), so the audit entry records BOTH the old
  // and new Manager. An Executive actor is still restricted to a
  // same-Manager destination (Sara's narrower choice when reassignment was
  // extended down to Executives) — re-checked here too. Note
  // serverTimestamp() isn't usable INSIDE an array element, so the audit
  // entry's own timestamp is a plain ISO string (same as every other
  // history entry already stored on a lead); only the document-level
  // updatedAt uses the real server clock.
  async reassignLead(leadId, newExecutiveName, remarks){
    if(!currentUser) throw new Error('You are not authorized to reassign this lead.');
    const ref = this.fsdb.collection('leads').doc(leadId);
    await this.fsdb.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if(!snap.exists) throw new Error('Lead not found.');
      const lead = Object.assign({ id: leadId }, snap.data());
      const newExec = validateReassignTarget(lead, newExecutiveName);
      const currentExec = userByName(lead.assignedExecutive);
      const fromManager = currentExec ? userByUid(currentExec.reportsTo) : null;
      const toManager = userByUid(newExec.reportsTo);
      const statusLabel = (lead.onHold && lead.onHold.active) ? 'Frozen' : 'Active';
      const entry = {
        fromExecutive: lead.assignedExecutive, toExecutive: newExec.name,
        fromManager: fromManager ? fromManager.name : '', toManager: toManager ? toManager.name : '',
        reassignedBy: currentUser.name, reassignedAt: new Date().toISOString(), remarks: (remarks||'').trim(),
        previousStatus: statusLabel, currentStatus: statusLabel,
      };
      tx.update(ref, {
        assignedExecutive: newExec.name,
        reassignmentHistory: (lead.reassignmentHistory||[]).concat([entry]),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
  }
  getMasters(key){ return (this.masters[key]||[]).filter(m=>m.active!==false); }

  async addMaster(key, fields){
    const def = MASTER_DEFS.find(m=>m.key===key);
    const stamped = (def && def.trackOwner && currentUser)
      ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name })
      : fields;
    await this.fsdb.collection(def.collection).add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, stamped));
  }
  async updateMaster(key, id, patch){

  }
  async toggleMaster(key, id){
    const cur = this.masters[key].find(m=>m.id===id);

  async deleteMaster(key, id){

  getAuditLog(){ return this.auditLog; }
  async addAuditEntry(entry){ await this.fsdb.collection('auditLog').add(Object.assign({ at: firebase.firestore.FieldValue.serverTimestamp() }, entry)); }

  // ---- Users & Access -------------------------------------------------
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  // Creates the new account on a SECONDARY Firebase app instance so the
  // admin creating it stays signed in on the primary app — the standard
  // client-side workaround for admin-created users without a backend.
  async createUser({name, email, phone, role, password, reportsTo}){
    const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'Secondary-' + Date.now());
    try{
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword((email||'').trim(), password);
      const newUid = cred.user.uid;
      await secondaryApp.auth().signOut();
      const doc = { name, email:(email||'').trim(), phone: phone||'', role, active:true, reportsTo: reportsTo||'', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      await this.fsdb.collection('m_users').doc(newUid).set(doc);
      return Object.assign({ uid:newUid, id:newUid }, doc);
    } finally {
      await secondaryApp.delete();
    }
  }
  async updateUser(userUid, patch){ await this.fsdb.collection('m_users').doc(userUid).update(patch); }
  async toggleUser(userUid){
    const u = this.users.find(x=>x.uid===userUid);

  // Sets another user's real Firebase Auth sign-in password directly. The
  // client SDK can't do this on its own — only the signed-in user can change
  // their OWN password without a backend — so this calls the
  // adminSetUserPassword Cloud Function (deployed separately; see the
  // functions/ folder delivered alongside this file), which uses the Admin
  // SDK server-side and independently re-checks that the CALLER is a Head
  // or Admin before touching anything — never trust the client for this.
  async changeUserPassword(userUid, newPassword){
    if(!newPassword || newPassword.length < 6) throw new Error('Password must be at least 6 characters.');
    if(typeof firebase.functions !== 'function'){
      throw new Error('The Functions SDK didn\'t load, so this app can\'t reach the password-change function right now.');
    }

      await firebase.functions().httpsCallable('adminSetUserPassword')({ uid: userUid, newPassword });
    }catch(err){
      if(err && err.code === 'functions/not-found'){
        throw new Error('The adminSetUserPassword function isn\'t deployed yet on this Firebase project — see the functions/ folder delivered with this file for the deploy steps.');
      }
      throw new Error((err && err.message) || 'Could not change the password.');
    }
  }
  // ---- Landowner registry (Land Acquisition ERP, Module 3) ---------------
  getLandowners(){ return this.landowners.filter(o=>o.active!==false); }
  getAllLandowners(){ return this.landowners; }
  getLandowner(id){ return this.landowners.find(o=>o.id===id); }

    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    await this.fsdb.collection('landowners').add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, stamped));
  }
  async updateLandowner(id, patch){ await this.fsdb.collection('landowners').doc(id).update(Object.assign({}, patch, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() })); }
  async toggleLandowner(id){ const o=this.landowners.find(x=>x.id===id); await this.updateLandowner(id, { active: !(o && o.active!==false) }); }
  async deleteLandowner(id){ await this.fsdb.collection('landowners').doc(id).delete(); }
  // ---- Land Parcel & Survey registry (Land Acquisition ERP, Module 4) ----
  getLandParcels(){ return this.landParcels.filter(p=>p.active!==false); }
  getAllLandParcels(){ return this.landParcels; }
  getLandParcel(id){ return this.landParcels.find(p=>p.id===id); }
  async addLandParcel(fields){
    const stamped = currentUser ? Object.assign({}, fields, { createdByUid: currentUser.uid, createdByName: currentUser.name }) : fields;
    await this.fsdb.collection('landParcels').add(Object.assign({ active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, stamped));
  }
  async updateLandParcel(id, patch){ await this.fsdb.collection('landParcels').doc(id).update(Object.assign({}, patch, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() })); }
  async toggleLandParcel(id){ const p=this.landParcels.find(x=>x.id===id); await this.updateLandParcel(id, { active: !(p && p.active!==false) }); }
  async deleteLandParcel(id){ await this.fsdb.collection('landParcels').doc(id).delete(); }
}

let DB = null;
let currentDetailLeadId = null;
// Which currentView to return to when the Lead Details page's Back button
// is clicked — Lead Details is its own dedicated page now (not a popup),
// reachable from several different pages (All Leads, Dashboard, Reports,
// Channel Partner Details, …), so it remembers whichever one sent it here.
// Set by openLeadDetail(), consumed and cleared by closeLeadDetail().
let previousView = null;
// Lead Details page's extra sections (Feasibility, Documents, Legal
// Verification, Negotiation, Valuation, Acquisition Proposal, Payments,
// Registration) render as a collapsible accordion (Sara: "too much data in
// one page... whenever Status is changed to the particular option related
// details will be shown") — every section stays reachable, nothing is ever
// hidden for good, but only the one(s) relevant to the lead's CURRENT stage
// (see SECTION_STAGE_MAP) auto-open by default. `leadDetailOpenSections` is
// the live set of which section keys are currently expanded; it's reset to
// that stage's default set — overriding any manual expand/collapse — only
// when `leadDetailOpenStage` no longer matches the lead's actual stage, i.e.
// right after opening a (possibly different) lead OR right after its stage
// actually changes. In between, the user's own manual toggles are left
// alone across re-renders triggered by unrelated saves elsewhere on the page.
let leadDetailOpenSections = new Set();
let leadDetailOpenStage = null;
// Whether the Lead Details page's Overview tab is showing its editable form
// right now. Reset to false whenever a (possibly different) lead is opened
// or the page is closed, so stale edit state never leaks from one lead to
// the next. Who can actually SEE the Edit option at all is gated separately
// by canModifyLeadDetails() below.
let leadEditMode = false;
// Lead-level "modify the details" capability (village, extent, price,
// landowner, etc. on the Overview tab) — separate from, and narrower than,
// page-level Page Access: Admin and Manager, same as Head (who already has
// blanket access everywhere else in this app), always have it. An
// Executive has it ONLY on a lead actually assigned to THEM — kept simple
// and narrow on purpose, not widened to teammates' leads (an earlier round
// did try that wider scope and it was then explicitly asked back down to
// just an Executive's own leads). Assigned Executive itself still stays
// fixed once a lead is created, for every role — this is a "modify the
// lead's details" capability, never a reassignment one (see
// renderOverviewTab()).
function canModifyLeadDetails(lead){
  if(!currentUser) return false;
  if(currentUser.role==='admin' || currentUser.role==='manager' || currentUser.role==='sysadmin') return true;
  if(currentUser.role==='executive') return !!(lead && lead.assignedExecutive === currentUser.name);
  return false;
}
// Whether the Stage & Actions tab's "Reassign Executive" form (Frozen-lead
// reassignment, below) is open right now. Same reset-on-open/close
// discipline as leadEditMode, for the same reason — stale form state must
// never leak from one lead to the next.
let reassignMode = false;
// ---- Lead Assignment / Reassignment ---------------------------------------
// Originally built "Frozen Lead Reassignment" — reassignment offered ONLY
// on a lead that's On Hold (l.onHold.active), the "Frozen" the original
// request meant since there's no separate Frozen pipeline stage. Later
// widened to a general "Assign to Executive" option, available on ANY
// lead regardless of On-Hold status — same eligibility rules below,
// unchanged, just no longer gated on l.onHold.active.
// Who may reassign reuses the exact same Reports-To tree as every other
// access rule in this app: Manager, within their own reporting Executives;
// Head, within their own reporting branch (not blanket, unlike most other
// Head overrides elsewhere — the original request specifically framed
// Head's permission as scoped to "the relevant Manager's team", so this
// mirrors visibleLeads()'s own branch-scoping instead of the usual Head-
// always-wins shortcut); Admin (sysadmin), unconditionally, same full-
// access precedent as everywhere else. An Executive IS now authorized too
// (Sara's explicit follow-up request: "reassign executives I want in
// executive level also"), but narrower than every role above it, matching
// this app's existing narrower-than-Executive-tiers-above precedent in
// reverse: an Executive may only reassign a lead currently assigned to
// THEMSELVES or to a teammate under the same Manager — the same
// isTeammateOf() reach visibleLeads() already grants an Executive on every
// other page, not a company-wide reach.
function canReassignLead(lead){
  if(!currentUser || !lead) return false;
  if(currentUser.role==='sysadmin') return true;
  // Org tree: anyone may reassign a lead they can see (their own sub-tree
  // and their team's). The assignment now lives in Edit Details.
  return ownerVisibleTo(currentUser, lead.assignedExecutive);
}
// Who a lead can be handed to. An Executive: only people in their own team
// scope (same people whose leads they can see). Manager/Head/Admin: any
// active person in the org tree, company-wide.
function eligibleReassignmentTargets(lead){
  const currentName = lead && lead.assignedExecutive;
  const pool = treeUsers().filter(u => u.active!==false && u.name!==currentName);
  if(currentUser && currentUser.role==='executive'){
    const scope = teamScopeUids(currentUser);
    return pool.filter(u => scope.has(u.uid));
  }
  return pool;
}
// Shared validation for DB.reassignLead() (both implementations).
function validateReassignTarget(lead, newExecutiveName){
  if(!currentUser || !canReassignLead(lead)) throw new Error('You are not authorized to reassign this lead.');
  const newExec = userByName(newExecutiveName);
  if(!newExec || newExec.role==='sysadmin' || newExec.active===false) throw new Error('That person is not an eligible, active user in the org tree.');
  if(!eligibleReassignmentTargets(lead).some(u=>u.uid===newExec.uid)) throw new Error('As an Executive you can only reassign within your own team.');
  return newExec;
}

// spec's own duplicate-landowner and duplicate-parcel detection only works
// if every branch can see every other branch's entries; siloing these the
// same way Leads are siloed would silently defeat that requirement.
// Creating/editing either one needs only ordinary Page Access to the page
// (same as any Masters page); permanently deleting one is kept to Manager/
// Head/Admin, not Executive — matching this app's existing precedent of
// Executives having narrower rights than the roles above them (see

function canDeleteLandRegistry(){

}
function landownerById(id){ return (DB.getAllLandowners()||[]).find(o=>o.id===id); }

// ---- Audit Trail -----------------------------------------------------------
// One call site per system-configuration write (Masters, Users, Workflow
// Config, Status Config, Page Access incl. per-user overrides, Lead Field
// Configuration) — see DB.addAuditEntry()'s own comment for why this is
// scoped to configuration changes only, not a duplicate of each lead's own
// already-rich history. Never throws/blocks the action it's logging — a
// failed audit write is swallowed (logged to console only), same
// best-effort spirit as this app's other non-critical side effects.
// Prefers a human-readable name/label over an auto-generated code (Channel
// Partners/Projects) so an Audit Trail entry reads as "Added Project —
// ECR Gateway Phase 2", not just a bare "PRJ-01" — falling back to
// whichever field the master actually has if neither name/label exists.
function masterItemLabel(def, item){
  return item.name || item.label || item[def.fields[0]] || '';
}
async function logAudit(action, entityType, entityLabel, notes){
  if(!DB || typeof DB.addAuditEntry !== 'function') return;

    });

// Possible-duplicate landowners: same (normalized) contact number, or the
// same name in the same village — checked against EVERY landowner (active
// or not), excluding the record being edited. A non-blocking warning only
// (see wireLandownersEvents' save handler) — never auto-merged, per spec.
function findDuplicateLandowners(fields, excludeId){
  const phone = normalizePhoneDigits(fields.contactNumber);
  const name = (fields.fullName||'').trim().toLowerCase();
  const village = (fields.village||'').trim().toLowerCase();
  return (DB.getAllLandowners()||[]).filter(o=>{
    if(o.id===excludeId) return false;
    const samePhone = phone && normalizePhoneDigits(o.contactNumber)===phone;
    const sameNameVillage = name && village && (o.fullName||'').trim().toLowerCase()===name && (o.village||'').trim().toLowerCase()===village;
    return samePhone || sameNameVillage;
  });
}

async function boot(){
  const cfg = FIREBASE_CONFIG;
  const isPlaceholder = !cfg || !cfg.apiKey || cfg.apiKey.indexOf('REPLACE_ME') !== -1;
  const sdkLoaded = typeof firebase !== 'undefined';

  if(!isPlaceholder && sdkLoaded){
    try{
      firebase.initializeApp(cfg);
      // Explicit LOCAL persistence — the sign-in session survives a page
      // refresh (and a full browser restart). This is Firebase's default
      // anyway, but setting it explicitly avoids silently falling back to
      // an in-memory-only session in some private/incognito browser modes.
      if(typeof firebase.auth === 'function'){
        try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
        catch(persistErr){ console.warn('Could not set Firebase Auth persistence to LOCAL — sessions may not survive a refresh in this browser mode.', persistErr); }
      }
      const fsdb = firebase.firestore();
      const storage = (typeof firebase.storage === 'function') ? firebase.storage() : null;
      DB = new FirestoreDB(fsdb, storage);
      DB.onChange(()=>{
        refreshStagesFromDB();
        refreshWorkflowFromDB();
        refreshViewAccessFromDB();
        refreshUserPageOverridesFromDB();
        // Lead Details is a regular currentView page now (not a separate
        // modal root), so the render() call above already keeps it live —
        // no second, modal-specific re-render needed here any more.
        if(currentUser){ applyRoleVisibility(); render(); }
      });
      // DB.init() (seeding + Firestore listeners) is deliberately NOT called
      // here. Security rules that require request.auth != null (the live
      // setup guide's recommended rules) reject any Firestore read made
      // before someone has signed in — running init() this early would
      // always fail with "Missing or insufficient permissions" and
      // permanently fall back to demo mode for the rest of the page load,
      // even though the config and rules are actually fine. ensureDbInit()
      // runs it instead, once, right after sign-in succeeds — see
      // initAuth()'s onAuthStateChanged handler below.
      showConnectionBadge(true);
      renderDemoBanner(false);
    }catch(err){
      console.error('Firebase init failed — falling back to demo mode.', err);
      DB = new MemoryDB();
      await DB.init();
      showConnectionBadge(false, err.message);
      renderDemoBanner(true, 'connection error: ' + err.message);
    }
  } else {
    DB = new MemoryDB();
    await DB.init();
    showConnectionBadge(false, isPlaceholder ? 'no Firebase config set yet' : 'SDK did not load');
    renderDemoBanner(true, isPlaceholder ? 'no Firebase config set yet' : 'the Firebase SDK did not load');
  }
  refreshStagesFromDB();
  refreshWorkflowFromDB();
  refreshViewAccessFromDB();
  refreshUserPageOverridesFromDB();
  initAuth();
}

// =========================================================================
// AUTH / ACCESS — a real login gate in front of the whole app. Live mode
// uses Firebase Authentication; demo mode uses a lightweight in-memory
// mock (see DEFAULT_USERS_SEED) so the whole flow works the same offline.
// =========================================================================
let currentUser = null;

// Firestore reads/writes under the recommended live security rules require
// a signed-in user (request.auth != null), so FirestoreDB's init() — which
// seeds every collection and subscribes to it — can only safely run once
// someone has actually signed in. Called once, right after the first
// successful sign-in (see onAuthStateChanged below); harmless to call again.
let _dbInitPromise = null;
function ensureDbInit(){
  if(!DB.isLive()) return Promise.resolve();
  if(!_dbInitPromise) _dbInitPromise = DB.init().then(()=>DB.ready());
  return _dbInitPromise;
}

// ---- Auto sign-out after inactivity -------------------------------------
// Signs the user out after 20 minutes with no mouse/keyboard/touch/scroll
// activity, regardless of which page they're on. The listeners are wired
// once, globally, near boot(); resetIdleTimer() itself is a no-op whenever
// nobody's signed in, so it's harmless to leave them attached across
// sign-in/out cycles.
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
const IDLE_ACTIVITY_EVENTS = ['mousemove','mousedown','keydown','scroll','touchstart','click'];
let idleTimer = null;
let pendingLoginMessage = null;
function resetIdleTimer(){
  if(!currentUser) return;
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
}
function stopIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
}
async function onIdleTimeout(){
  if(!currentUser) return;
  await doLogout('You were signed out after 20 minutes of inactivity.');
}
(function wireIdleTimerListeners(){
  IDLE_ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive:true }));
})();

// Shared sign-out path for both the manual "Log out" button and the idle
// timeout, so both behave identically (including in demo mode, where
// there's no auth listener to drive the login screen back up on its own).
async function doLogout(reason){
  stopIdleTimer();
  if(DB.isLive()){
    pendingLoginMessage = reason || null;
    await firebase.auth().signOut();
  } else {
    await DB.logout();
    currentUser = null;
    showLoginScreen(reason);
  }
}

// While true, onAuthStateChanged steps aside and lets whoever set it drive
// currentUser/enterApp() themselves — used by the "create admin account"
// flow below, which needs to write the new profile doc and read it back in
// a guaranteed order (see the comment at suppressAuthListener=true there).
let suppressAuthListener = false;

function initAuth(){
  if(DB.isLive() && typeof firebase.auth === 'function'){
    firebase.auth().onAuthStateChanged(async fbUser => {
      if(suppressAuthListener) return;
      if(!fbUser){
        currentUser = null;
        stopIdleTimer();
        const msg = pendingLoginMessage; pendingLoginMessage = null;
        showLoginScreen(msg);
        return;
      }
      try{
        await ensureDbInit();
        const doc = await DB.fsdb.collection('m_users').doc(fbUser.uid).get();
        if(doc.exists && doc.data().active !== false){
          currentUser = Object.assign({ uid: fbUser.uid }, doc.data());
          enterApp();
        } else {
          await firebase.auth().signOut();
          showLoginScreen('Your account isn\'t set up for access yet. Ask your admin to add you under Manage Users.');
        }
      }catch(err){
        console.error('Could not load your user profile.', err);
        await firebase.auth().signOut();
        showLoginScreen('Could not verify your account: ' + err.message);
      }
    });
  } else {
    showLoginScreen();
  }
}

function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(/user-not-found|wrong-password|invalid-credential|invalid-login-credentials/.test(code)) return 'Incorrect email or password.';
  if(/too-many-requests/.test(code)) return 'Too many attempts — try again in a few minutes.';
  if(/invalid-email/.test(code)) return 'That email address looks invalid.';
  if(/email-already-in-use/.test(code)) return 'A user with that email already exists.';
  if(/weak-password/.test(code)) return 'Password must be at least 6 characters.';
  return (err && err.message) || 'Sign-in failed.';
}

// Land Classification Types (Outright / Joint Venture / Staggered Payment)
// are added to the Land Classifications master automatically the first time
// a Head/Admin signs in after this update, if any are missing. Old values
// (Agricultural, Patta Land, …) are left alone — delete them under Masters.
let _landClassEnsured = false;
async function ensureLandClassTypes(){
  if(_landClassEnsured || !currentUser || !(currentUser.role==='admin' || currentUser.role==='sysadmin')) return;
  _landClassEnsured = true;
  try{
    const existing = DB.getAllMasters('landClasses') || [];
    for(const label of LAND_CLASS_TYPES){
      const kind = landClassKind(label);
      if(!existing.some(m=>landClassKind(m.label)===kind)) await DB.addMaster('landClasses', { label });
    }
  }catch(err){ console.warn('Could not add Land Classification Types', err); }
}
function enterApp(){
  ensureLandClassTypes();

function showLoginScreen(errorMsg){

  root.style.display = 'block';

        </form>

        ${!DB.isLive() ? `<p style="font-size:11px;color:var(--muted);margin-top:16px;line-height:1.6;">Demo mode — try <b>Saravanan@mpdevelopers.com</b> / 123456 (Admin), <b>manager@demo.local</b> / manager123 (Manager), or <b>karthik@demo.local</b> / exec123 (Executive).</p>` : ''}
      </div>
    </div>`;
  // A real <form> with a type="submit" button means both clicking Sign In
  // AND pressing Enter in either field submit the same way (native browser
  // behavior) — no separate keydown listener needed, and no risk of it
  // firing twice.
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ showLoginScreen('Enter both email and password.'); return; }
    try{
      if(DB.isLive()){
        await firebase.auth().signInWithEmailAndPassword(email, password);
        // onAuthStateChanged picks this up and calls enterApp().
      } else {
        currentUser = await DB.login(email, password);
        enterApp();
      }
    }catch(err){ showLoginScreen(friendlyAuthError(err)); }
  };
  document.getElementById('auth-forgot').onclick = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    if(!email){ alert('Enter your email above first, then click "Forgot password?" again.'); return; }
    if(!DB.isLive()){ alert('Password reset isn\'t available in demo mode.'); return; }
    try{ await firebase.auth().sendPasswordResetEmail(email); alert('Password reset email sent to ' + email + '.'); }
    catch(err){ alert('Could not send reset email: ' + friendlyAuthError(err)); }
  };
  document.getElementById('auth-bootstrap-link').onclick = (e) => { e.preventDefault(); showBootstrapScreen(); };
}

function showBootstrapScreen(){
  const root = document.getElementById('auth-root');
  root.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Create the Admin Account</h1>
        <div class="sub">One-time setup — this becomes the first Admin login.</div>
        <label>Your Name</label><input type="text" id="bs-name">
        <label>Email</label><input type="email" id="bs-email" autocomplete="username">
        <label>Password</label><input type="password" id="bs-password" autocomplete="new-password" placeholder="At least 6 characters">
        <div id="bs-error"></div>
        <button class="btn btn-teal" id="bs-create-btn">Create Admin Account</button>
        <div style="text-align:center;margin-top:14px;font-size:12px;"><a href="#" id="bs-back" style="color:var(--teal);">Back to sign in</a></div>
      </div>
    </div>`;
  document.getElementById('bs-back').onclick = (e) => { e.preventDefault(); showLoginScreen(); };
  document.getElementById('bs-create-btn').onclick = async () => {
    const name = document.getElementById('bs-name').value.trim();
    const email = document.getElementById('bs-email').value.trim();
    const password = document.getElementById('bs-password').value;
    const errEl = document.getElementById('bs-error');
    errEl.innerHTML = '';
    if(!name || !email || !password){ errEl.innerHTML = '<div class="auth-error">All fields are required.</div>'; return; }
    if(password.length < 6){ errEl.innerHTML = '<div class="auth-error">Password must be at least 6 characters.</div>'; return; }
    try{
      if(DB.isLive()){
        // createUserWithEmailAndPassword fires onAuthStateChanged the
        // moment it resolves — racing the profile-doc write below. If that
        // listener's read lands first, it finds no doc yet, signs the
        // brand-new account straight back out, and shows a confusing
        // "account isn't set up for access" error even though the account
        // (and its profile) end up created moments later. Suppress the
        // listener for this one flow and drive currentUser/enterApp()
        // ourselves, in the guaranteed order: create → write → enter.
        suppressAuthListener = true;
        try{
          const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
          const profile = { name, email, phone:'', role:'admin', active:true, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
          await ensureDbInit();
          await DB.fsdb.collection('m_users').doc(cred.user.uid).set(profile);
          currentUser = Object.assign({ uid: cred.user.uid }, profile);
          enterApp();
        } finally {
          suppressAuthListener = false;
        }
      } else {
        currentUser = await DB.createUser({ name, email, phone:'', role:'admin', password });
        enterApp();
      }
    }catch(err){ errEl.innerHTML = '<div class="auth-error">' + friendlyAuthError(err) + '</div>'; }
  };
}
