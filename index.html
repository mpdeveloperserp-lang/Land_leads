// Renders either the forward "Move to X" block or the backward "Move back
// to X" block for renderStageTab, honoring a from->to gate if one exists
// for that exact pair (see the Workflow Config module).
// slot identifies WHICH move block this is on the tab — 'fwd' (the built-in
// move into the next pipeline stage), 'back' (the built-in move into the
// previous stage), or 'extra-N' (an extra, non-adjacent destination that
// exists purely because Workflow Config has a row for it). Field ids for
// fwd/back are kept exactly as before (unchanged by this extra-destinations
// feature); extra slots get their own suffixed ids so several can coexist.
function transitionFieldIds(slot){
  if(slot==='fwd')  return { btnId:'advance-btn', approverId:'gate-approver-fwd',  remarksId:'gate-remarks-fwd',  priceId:'gate-final-price', dateId:'gate-final-date' };
  if(slot==='back') return { btnId:'back-btn',    approverId:'gate-approver-back', remarksId:'gate-remarks-back', priceId:'gate-final-price', dateId:'gate-final-date' };
  return { btnId:'move-btn-'+slot, approverId:'gate-approver-'+slot, remarksId:'gate-remarks-'+slot, priceId:'gate-final-price-'+slot, dateId:'gate-final-date-'+slot };
}
function renderTransitionBlock(fromKey, target, slot, l){
  if(!target) return '';
  const ids = transitionFieldIds(slot);
  const isBack = slot === 'back';
  const isExtra = slot.indexOf('extra') === 0;
  const gated = isGatedTransition(fromKey, target.key);
  const isClosing = target.key==='closed';
  const btnClass = isBack ? 'btn-ghost' : 'btn-teal';
  const btnLabel = isClosing ? 'Close as Acquired' : (isBack ? `Move back to ${target.label}` : `Move to ${target.label}`);
  if(!gated){
    // Only the built-in adjacent fwd/back moves can ever reach here ungated
    // — an extra slot only exists because Workflow Config has a row for it.
    return `<div style="margin-bottom:14px;"><button class="btn btn-sm ${btnClass}" id="${ids.btnId}">${btnLabel}</button></div>`;
  }
  const canApprove = !currentUser || roleAllowedForGate(currentUser.role, fromKey, target.key);
  const legend = isClosing ? 'Gate: Sign-off to close as Acquired' : `Gate: Approval to move ${isBack ? 'back to' : (isExtra ? 'to' : 'into')} ${target.label}`;
  return `<fieldset><legend>${legend}</legend>
    ${canApprove ? `
    <div class="form-grid">
      <div><label>Approved by</label><input type="text" id="${ids.approverId}" value="${(currentUser&&currentUser.name)||''}" placeholder="${isClosing ? 'MD / Approver name' : 'Approver name'}"></div>
      ${isClosing ? `
      <div><label>Final Price</label><input type="number" id="${ids.priceId}" step="0.01" value="${l.priceValue||''}"></div>
      <div><label>Final Date</label><input type="date" id="${ids.dateId}" value="${todayStr()}"></div>
      ` : ''}
      <div><label>Remarks</label><input type="text" id="${ids.remarksId}"></div>
    </div>
    <button class="btn btn-sm btn-teal" id="${ids.btnId}" style="margin-top:8px;">${btnLabel}</button>
    ` : `<p style="font-size:12.5px;color:var(--muted);">Only ${gateRoleLabels(fromKey, target.key)} (or Head) can approve this transition (see Workflow Config).</p>`}
  </fieldset>`;
}
// Any Workflow Config row whose From is this lead's current stage and whose
// To ISN'T the built-in next/prev stage is an extra, non-adjacent move (e.g.
// a straight "drop to Closed" from partway through the pipeline). Closed is
// terminal, so it never offers any move — including these extras.
function extraTransitionTargets(l, next, prev){
  if(l.stage==='closed') return [];
  const skip = new Set([l.stage, next && next.key, prev && prev.key].filter(Boolean));
  const tos = [...new Set(WORKFLOW_CONFIG.filter(w=>w.from===l.stage && !skip.has(w.to)).map(w=>w.to))];
  return tos.map(k=>STAGES.find(s=>s.key===k)).filter(Boolean);
}

function renderStageTab(l){
  const idx = STAGE_INDEX[l.stage];
  const next = STAGES[idx+1];
  // Closed is terminal — no move-back out of it, matching the outcome
  // (Acquired/Dropped) already being final.
  const canGoBack = idx > 0 && l.stage !== 'closed';
  const prev = canGoBack ? STAGES[idx-1] : null;
  const holdReasons = DB.getMasters('holdReasons');
  const dropReasons = DB.getMasters('dropReasons');

  // "Reassign Executive" — available on ANY lead (widened from the
  // original Frozen-On-Hold-only scope, see canReassignLead()'s own
  // comment), to whoever canReassignLead() allows (Manager/Head within
  // their own team, Admin always; an Executive too, but only on their own
  // or a teammate's lead). The dropdown is pre-scoped to
  // eligibleReassignmentTargets(), but DB.reassignLead() re-validates
  // everything itself too — the dropdown's filtering is a convenience, not
  // the actual enforcement. The target pool is company-wide for
  // Manager/Head/Admin (widened per Sara's request), so each option is
  // labeled with that Executive's own Manager, since it's no longer implied to be
  // the same Manager as the current assignee.
  const canReassign = canReassignLead(l);
  const reassignTargets = canReassign ? eligibleReassignmentTargets(l) : [];
  const currentExecForReassign = userByName(l.assignedExecutive);
  const managerForReassign = currentExecForReassign ? userByUid(currentExecForReassign.reportsTo) : null;
  const reassignBlock = !canReassign ? '' : `
    <button class="btn btn-sm btn-ghost" id="reassign-open-btn" style="margin-left:8px;">Reassign Executive</button>
    ${reassignMode ? `
      <div class="card" style="margin-top:10px;padding:12px;">
        <h4 style="margin:0 0 8px;">Reassign / Assign Executive</h4>
        <div class="form-grid">
          <div><label>Lead</label><div>${l.leadId}</div></div>
          <div><label>Current Executive</label><div>${l.assignedExecutive||'—'}</div></div>
          <div><label>Current Manager</label><div>${managerForReassign ? managerForReassign.name : '—'}</div></div>
          <div><label>New Executive</label><select id="reassign-new-exec">
            <option value="">— select —</option>
            ${reassignTargets.map(u=>{ const m=userByUid(u.reportsTo); return `<option value="${u.name}">${u.name}${m?' — '+m.name:''}</option>`; }).join('')}
          </select></div>
          <div class="full"><label>Reassignment Remarks</label><input type="text" id="reassign-remarks" placeholder="e.g. Executive workload balancing"></div>
        </div>
        ${!reassignTargets.length ? `<p style="font-size:12px;color:var(--muted);margin-top:6px;">No other eligible, active Executive exists yet.</p>` : ''}
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-sm btn-teal" id="reassign-confirm-btn">Confirm Reassignment</button>
          <button class="btn btn-sm btn-ghost" id="reassign-cancel-btn">Cancel</button>
        </div>
      </div>
    ` : ''}
  `;

  const holdBlock = `
    <fieldset>
      <legend>On Hold</legend>
      ${l.onHold && l.onHold.active ? `
        <p style="font-size:13px;">Currently on hold since ${fmtDate(l.onHold.since)} — <b>${l.onHold.reasonCode}</b>${l.onHold.notes?': '+l.onHold.notes:''}</p>
        <button class="btn btn-sm btn-teal" id="resume-btn">Resume (clear hold)</button>
      ` : `
        <div class="form-grid">
          <div><label>Reason</label><select id="hold-reason">${holdReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
          <div><label>Notes</label><input type="text" id="hold-notes"></div>
        </div>
        <button class="btn btn-sm btn-ghost" id="hold-btn" style="margin-top:8px;">Put On Hold</button>
      `}
    </fieldset>`;
  // Assignment (spec, later request) — its own fieldset now, independent
  // of On Hold status (was nested inside the "currently on hold" branch
  // above, back when this was Frozen-lead-only — see canReassignLead()'s
  // comment). Shown whenever canReassignLead() allows it, on any lead.
  const assignBlock = !canReassign ? '' : `<fieldset><legend>Executive Assignment</legend>${reassignBlock}</fieldset>`;

  const extraTargets = extraTransitionTargets(l, next, prev);
  const extraBlock = extraTargets.map((t,i)=>renderTransitionBlock(l.stage, t, 'extra-'+i, l)).join('');
  const gateBlock = renderTransitionBlock(l.stage, next, 'fwd', l) + renderTransitionBlock(l.stage, prev, 'back', l) + extraBlock;

  const dropBlock = l.stage!=='closed' ? `
    <fieldset><legend>Drop this Lead</legend>
      <div class="form-grid">
        <div><label>Reason</label><select id="drop-reason">${dropReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
        <div><label>Notes</label><input type="text" id="drop-notes"></div>
      </div>
      <button class="btn btn-sm btn-danger" id="drop-btn" style="margin-top:8px;">Close as Dropped</button>
    </fieldset>` : '';

  const closedSummary = l.stage==='closed' ? `
    <fieldset><legend>Outcome</legend>
      ${l.outcome==='acquired'
        ? `<p style="font-size:13px;">Acquired on ${fmtDate(l.finalDate)} at ${fmtNum(l.finalPrice)} / ${EXTENT_UNITS[l.priceUnit]?.label}. Approved by ${l.approval && l.approval.approver||'—'}.</p>`
        : `<p style="font-size:13px;">Dropped — <b>${l.reasonCode||'—'}</b>${l.reasonNotes?': '+l.reasonNotes:''}</p>`}
    </fieldset>` : '';

  return `${gateBlock}${holdBlock}${assignBlock}${dropBlock}${closedSummary}`;
}

function renderFeasibilityTab(l){
  const block = (key, label) => `
    <fieldset><legend>${label} Feasibility</legend>
      <div class="form-grid">
        <div><label>Status</label><select id="feas-${key}-status">${FEAS_STATUSES.map(s=>`<option ${l.feasibility[key].status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="full"><label>Notes</label><textarea id="feas-${key}-notes">${l.feasibility[key].notes||''}</textarea></div>

// Per spec Module 7: a category (from the new, admin-configurable Document
// Categories master), a reference number, issue/expiry dates, and a
// verification workflow (Pending/Verified/Rejected/Deficient — never
// inferred just because a file was uploaded; see canVerifyDocument()) on
// top of the existing name/url/upload mechanics, which are unchanged.
// Older entries (recorded before this round) simply show "—"/"Pending" for
// whichever of these fields they don't have.
function renderDocumentsTab(l){
  const docs = (l.documents||[]);
  const today = new Date();
  const rows = docs.map((d,i)=>{
    const expiry = d.expiryDate ? new Date(d.expiryDate) : null;
    const daysToExpiry = expiry ? daysBetween(today, expiry) : null;
    const expiryBadge = expiry
      ? (daysToExpiry < 0 ? '<span class="badge badge-warn">Expired</span>' : (daysToExpiry <= 30 ? '<span class="badge badge-warn">Expiring soon</span>' : ''))
      : '';
    const verStatus = d.verificationStatus || 'Pending';
    const verBadgeClass = verStatus==='Verified' ? 'badge-ok' : (verStatus==='Rejected' ? 'badge-warn' : 'badge-muted');
    return `<div class="doc-row" style="flex-wrap:wrap;gap:4px 10px;">
      <span><b>${d.name}</b> ${d.url && /^https?:/.test(d.url) ? `<a href="${d.url}" target="_blank" rel="noopener">(view)</a>` : (d.url?`<span style="color:var(--muted)">— ${d.url}</span>`:'')}</span>
      <span style="color:var(--muted)">${d.category||'Uncategorized'}${d.referenceNumber?(' · Ref '+d.referenceNumber):''}</span>
      <span style="color:var(--muted)">Uploaded ${fmtDate(d.addedAt)}${d.uploadedBy?(' by '+d.uploadedBy):''}</span>
      ${expiry?`<span style="color:var(--muted)">Expires ${fmtDate(d.expiryDate)} ${expiryBadge}</span>`:''}
      <span><span class="badge ${verBadgeClass}">${verStatus}</span>${d.verifiedBy?(' <span style="color:var(--muted)">by '+d.verifiedBy+'</span>'):''}</span>
      ${canVerifyDocument() && verStatus==='Pending' ? `
        <span>
          <button class="btn btn-sm btn-ghost" data-doc-verify="${i}" data-doc-status="Verified">Verify</button>
          <button class="btn btn-sm btn-ghost" data-doc-verify="${i}" data-doc-status="Rejected">Reject</button>
          <button class="btn btn-sm btn-ghost" data-doc-verify="${i}" data-doc-status="Deficient">Mark Deficient</button>
        </span>` : ''}
    </div>`;
  }).join('') || '<div class="empty">No documents recorded yet.</div>';
  const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
  const categories = DB.getMasters('docCategories');
  const metaFields = `
    <div class="form-grid" style="margin-top:8px;">
      <div><label>Category</label><select id="doc-category">${categories.map(c=>`<option value="${c.label}">${c.label}</option>`).join('')}</select></div>
      <div><label>Reference Number</label><input type="text" id="doc-refnum"></div>
      <div><label>Issue Date</label><input type="date" id="doc-issue"></div>
      <div><label>Expiry Date</label><input type="date" id="doc-expiry"></div>
      <div class="full"><label>Remarks</label><input type="text" id="doc-remarks"></div>
    </div>`;
  return `
    ${rows}
    ${liveUpload ? `
      <div class="inline-add">
        <input type="text" id="doc-name" placeholder="Document name (e.g. FMB Drawing, Patta, EC)">
        <input type="file" id="doc-file">
        <button class="btn btn-sm btn-teal" id="doc-add">Upload</button>
      </div>
      ${metaFields}
      <div id="doc-upload-status" style="font-size:11.5px;color:var(--muted);margin-top:6px;"></div>
    ` : `
      <div class="inline-add">
        <input type="text" id="doc-name" placeholder="Document name (e.g. FMB Drawing, Patta, EC)">
        <input type="text" id="doc-url" placeholder="Reference / URL">
        <button class="btn btn-sm btn-teal" id="doc-add">Add</button>
      </div>
      ${metaFields}
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">${DB.isLive() ? 'Enable Firebase Storage on your project to turn this into real file uploads.' : 'Connect this app to Firebase (see FIREBASE_CONFIG near the top of this file) to enable real file uploads here.'}</p>
    `}
  `;
}

// Legal Verification (spec Module 8) — reads as a structured checklist on
// top of whatever's been uploaded in the Documents tab above (EC, Patta,
// any Legal Opinion document), but is its own append-only history, same
// discipline as Negotiation: a later finding is a NEW entry, not an edit of
// an earlier one, so "what did we believe on date X" is never lost. Adding

// an Executive can see the full history but not record a finding.
function renderLegalVerificationTab(l){
  const log = (l.legalVerificationLog||[]);
  const summary = legalVerificationSummary(l);

      <div><label>Encumbrance Status</label><div>${summary.latest.encumbranceStatus||'—'}${summary.latest.encumbrancePeriod?(' <span style="color:var(--muted)">('+summary.latest.encumbrancePeriod+')</span>'):''}</div></div>
      <div><label>Litigation Status</label><div>${summary.latest.litigationStatus||'—'}</div></div>
      <div><label>Patta/Chitta Verified</label><div>${summary.latest.pattaChittaVerified||'—'}</div></div>
      <div><label>Legal Risk Rating</label><div><span class="badge ${riskBadgeClass(summary.latest.legalRiskRating)}">${summary.latest.legalRiskRating||'—'}</span></div></div>
      <div><label>Last Verified</label><div>${fmtDate(summary.latest.date)} <span style="color:var(--muted)">by ${summary.latest.verifiedBy||'—'}</span></div></div>

      <td>${n.verifiedBy||'—'}</td><td>${n.remarks||''}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="empty">No legal verification entries yet.</td></tr>';
  const canAdd = canRecordLegalOrValuation();
  return `
    ${summaryBlock}
    <div style="overflow-x:auto;">
      <table style="margin-bottom:10px;"><tr><th>Date</th><th>Title</th><th>Encumbrance</th><th>Litigation</th><th>Patta/Chitta</th><th>Risk</th><th>Verified By</th><th>Remarks</th></tr>${rows}</table>
    </div>
    ${canAdd ? `
    <div class="form-grid">
      <div><label>Date</label><input type="date" id="legal-date" value="${todayStr()}"></div>
      <div><label>Title Status</label><select id="legal-title">${LEGAL_TITLE_STATUSES.map(s=>`<option ${s==='Not Started'?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Encumbrance Status</label><select id="legal-enc">${ENCUMBRANCE_STATUSES.map(s=>`<option ${s==='Not Checked'?'selected':''}>${s}</option>`).join('')}</select></div>

      <div><label>Litigation Status</label><select id="legal-litigation">${LITIGATION_STATUSES.map(s=>`<option ${s==='None'?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Litigation Details</label><input type="text" id="legal-litigation-details"></div>
      <div><label>Patta/Chitta Verified</label><select id="legal-patta">${YES_NO_PARTIAL.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div><label>Legal Risk Rating</label><select id="legal-risk">${LEGAL_RISK_RATINGS.map(s=>`<option ${s==='Low'?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="full"><label>Remarks</label><input type="text" id="legal-remarks"></div>
    </div>
    <div style="margin-top:8px;"><button class="btn btn-sm btn-teal" id="legal-add">Record Legal Verification</button></div>
    ` : ''}
  `;
}

// Acquisition Proposals (spec Module 10) — the formal, versioned ask built
// from everything above (Negotiation's current figure, Valuation's
// recommendation, Legal Verification's status), submitted for sign-off.
// This log is distinct from the single stage-gate `approval` field a lead
// already has (see this file's PROPOSAL_STATUSES comment) — that gate
// controls moving the lead's STAGE; this is the actual proposal document.
// Adding a new draft/revision is NOT role-gated the same way Legal/
// Valuation are — any role that can open this lead can draft or revise a
// proposal, same as Negotiation, since drafting the ask is normally the
// Executive's own job; a later Approvals module is where sign-off rights
// (and "no self-approval") actually get enforced.
// A proposal's figure is captured differently per mode — Outright carries
// a Price (proposedPurchasePrice), Joint Venture carries an Advance paid
// to the landowner (advanceAmount) instead, never both. amountLabel/
// amountValue read whichever one actually applies to a given entry, so
// older entries recorded before this split (seed data, or a version saved
// under the old generic mode list) still display sensibly.
function proposalAmountLabel(n){ return n.modeOfAcquisition==='Joint Venture' ? 'Advance' : 'Price'; }
function proposalAmountValue(n){ return n.modeOfAcquisition==='Joint Venture' ? n.advanceAmount : n.proposedPurchasePrice; }
function renderAcquisitionProposalTab(l){
  const log = (l.acquisitionProposalLog||[]);
  const summary = proposalSummary(l);
  const statusBadgeClass = s => s==='Approved' ? 'badge-ok' : (s==='Rejected' ? 'badge-warn' : (s==='Draft' ? 'badge-muted' : 'badge-navy'));
  const summaryBlock = summary ? `
    <div class="form-grid" style="margin-bottom:12px;">
      <div><label>Current Status</label><div><span class="badge ${statusBadgeClass(summary.latest.status)}">${summary.latest.status}</span></div></div>
      <div><label>${proposalAmountLabel(summary.latest)}</label><div>${fmtNum(proposalAmountValue(summary.latest))}</div></div>
      <div><label>Mode of Acquisition</label><div>${summary.latest.modeOfAcquisition||'—'}</div></div>
      <div><label>Version</label><div>v${summary.version}</div></div>
      <div><label>Last Updated</label><div>${fmtDate(summary.latest.date)} <span style="color:var(--muted)">by ${summary.latest.proposedBy||'—'}</span></div></div>
      <div><label>Payment Schedule</label><div>${summary.latest.paymentSchedule||'—'}</div></div>
    </div>` : '<p class="empty">No acquisition proposal recorded yet.</p>';
  const rows = log.slice().reverse().map((n,ri)=>`<tr>
      <td>v${log.length-ri}</td><td>${fmtDate(n.date)}</td>
      <td><span class="badge ${statusBadgeClass(n.status)}">${n.status}</span></td>
      <td>${proposalAmountLabel(n)}: ${fmtNum(proposalAmountValue(n))}</td><td>${n.modeOfAcquisition||'—'}</td>
      <td>${n.proposedBy||'—'}</td><td>${n.remarks||''}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty">No proposal versions yet.</td></tr>';
  // Approvals (spec Module 11) — only offered while the LATEST version is
  // still awaiting a decision ('Submitted'/'Under Review'); once it's
  // Approved/Rejected the only way forward is a brand new version (via the
  // form below), same as every other append-only log in this app.
  const pending = summary && (summary.latest.status==='Submitted' || summary.latest.status==='Under Review');
  let approvalBlock = '';
  if(pending){
    if(canApproveProposal(summary.latest)){
      approvalBlock = `
        <fieldset style="margin-bottom:12px;">
          <legend>Approval Decision — v${summary.version} (${summary.latest.status})</legend>
          <div class="form-grid">
            <div class="full"><label>Decision Remarks</label><input type="text" id="appr-remarks" placeholder="Reason for this decision"></div>
          </div>
          <div style="margin-top:8px;">
            <button class="btn btn-sm btn-teal" id="appr-approve">Approve Proposal</button>
            <button class="btn btn-sm btn-ghost" id="appr-reject">Reject Proposal</button>
          </div>
        </fieldset>`;
    } else if(canRecordLegalOrValuation()){
      approvalBlock = `<p class="empty" style="margin-bottom:12px;">Awaiting a decision from another Manager/Head/Admin — you proposed v${summary.version} yourself, so you can't approve or reject it.</p>`;
    }
  }
  return `
    ${summaryBlock}
    <div style="overflow-x:auto;">
      <table style="margin-bottom:10px;"><tr><th>Ver.</th><th>Date</th><th>Status</th><th>Price / Advance</th><th>Mode</th><th>Proposed By</th><th>Remarks</th></tr>${rows}</table>
    </div>
    ${approvalBlock}
    <div class="form-grid">
      <div><label>Date</label><input type="date" id="prop-date" value="${todayStr()}"></div>
      <div><label>Status</label><select id="prop-status">${PROPOSAL_DRAFT_STATUSES.map(s=>`<option ${s==='Draft'?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Mode of Acquisition</label><select id="prop-mode">${MODE_OF_ACQUISITION.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div id="prop-price-wrap"><label>Price (Outright)</label><input type="number" id="prop-price" step="0.01" placeholder="Total purchase price"></div>
      <div id="prop-advance-wrap" style="display:none;"><label>Advance (Joint Venture)</label><input type="number" id="prop-advance" step="0.01" placeholder="Advance paid to landowner"></div>
      <div class="full"><label>Payment Schedule / Terms</label><input type="text" id="prop-schedule" placeholder="e.g. 25% advance, 75% on registration"></div>
      <div class="full"><label>Remarks</label><input type="text" id="prop-remarks"></div>
    </div>
    <div style="margin-top:8px;"><button class="btn btn-sm btn-teal" id="prop-add">Save Proposal Version</button></div>
  `;
}

function renderHistoryTab(l){
  const items = (l.stageHistory||[]).slice().reverse().map(h=>
    `<div class="history-item"><b>${stageLabel(h.stage)}</b> — ${h.note||''}<div class="when">${fmtDate(h.at)} · ${h.by||''}</div></div>`
  ).join('') || '<div class="empty">No history recorded.</div>';
  // Reassignment audit trail — every entry DB.reassignLead() has ever
  // appended, oldest-last, same as the stage history above. Never trimmed
  // or overwritten (see reassignLead()), so a lead reassigned several
  // times keeps every prior entry here.
  // fromManager/toManager are the current fields (reassignment can now
  // cross branches); older entries only have a single `manager` field from
  // back when the target pool was same-Manager-only — fall back to that so
  // pre-existing seed/history entries still render correctly.
  const reassignItems = (l.reassignmentHistory||[]).slice().reverse().map(r=>{
    const fromMgr = r.fromManager || r.manager || '—';
    const toMgr = r.toManager || r.manager || '—';
    const mgrLabel = fromMgr===toMgr ? `Manager: ${fromMgr}` : `Manager: ${fromMgr} → ${toMgr}`;
    return `<div class="history-item"><b>Reassigned</b> — ${r.fromExecutive} → ${r.toExecutive} (${mgrLabel})${r.remarks?': '+r.remarks:''}<div class="when">${fmtDate(r.reassignedAt)} · by ${r.reassignedBy||''} · status stayed ${r.currentStatus||'Frozen'}</div></div>`;
  }).join('');
  return items + reassignItems;
}

function wireDetailTabEvents(l){
  {
    const btn = document.getElementById('ov-save-call');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { nextCallDate: document.getElementById('ov-nextcall').value });
      render();
    };
  }
  {
    const addParcelBtn = document.getElementById('parcels-tab-add-btn');
    if(addParcelBtn) addParcelBtn.onclick = () => {
      pendingParcelPrefill = {
        leadId: l.id, village: l.village, surveyNumber: l.surveyNumber,
        landClassification: l.landClassification,
        totalExtentValue: l.extentValue, totalExtentUnit: l.extentUnit,
      };
      editingParcelId = null; parcelLandownerLinksDraft = null;
      currentDetailLeadId = null; leadEditMode = false; reassignMode = false;
      currentView = 'landParcels';
      render();
    };
  }
  {
    const editBtn = document.getElementById('ov-edit-details');
    if(editBtn) editBtn.onclick = () => { leadEditMode = true; render(); };
    const cancelBtn = document.getElementById('ov-cancel-details');
    if(cancelBtn) cancelBtn.onclick = () => { leadEditMode = false; render(); };
    const saveBtn = document.getElementById('ov-save-details');
    if(saveBtn) saveBtn.onclick = async () => {
      const val = id => document.getElementById(id)?.value;
      const patch = {
        leadSource: (val('ov-e-source')||'').trim(),
        leadSourceDateTime: val('ov-e-datetime') || l.leadSourceDateTime,
        channelPartnerCode: (val('ov-e-cp')||'').trim(),
        projectCode: (val('ov-e-project')||'').trim(),
        village: (val('ov-e-village')||'').trim(),
        siteLocation: (val('ov-e-loc')||'').trim(),
        surveyNumber: (val('ov-e-survey')||'').trim(),
        googlePin: (val('ov-e-pin')||'').trim(),
        landClassification: (val('ov-e-class')||'').trim(),
        extentValue: parseFloat(val('ov-e-extent-val')) || 0,
        extentUnit: val('ov-e-extent-unit') || l.extentUnit,
        priceValue: parseFloat(val('ov-e-price-val')) || 0,
        priceUnit: val('ov-e-price-unit') || l.priceUnit,
        landownerName: (val('ov-e-owner-name')||'').trim(),
        landownerPhone: (val('ov-e-owner-phone')||'').trim(),
        mediatorName: (val('ov-e-med-name')||'').trim(),
        mediatorPhone: (val('ov-e-med-phone')||'').trim(),
      };
      await DB.updateLead(l.id, patch);
      leadEditMode = false;
      render();
    };
  }
  {
    // Shared by the built-in fwd/back moves AND every extra (non-adjacent)
    // destination Workflow Config adds — slot picks which field ids to read
    // (see transitionFieldIds) and noteVerb only affects the stageHistory
    // wording for the two built-in directions.
    function wireMove(slot, targetKey, noteVerb){
      const ids = transitionFieldIds(slot);
      const btn = document.getElementById(ids.btnId);
      if(!btn) return;
      btn.onclick = async () => {
        const targetLabel = stageLabel(targetKey);
        const gated = isGatedTransition(l.stage, targetKey);
        if(gated && currentUser && !roleAllowedForGate(currentUser.role, l.stage, targetKey)){
          alert('Only ' + gateRoleLabels(l.stage, targetKey) + ' (or Head) can approve this transition.'); return;
        }
        const approver = document.getElementById(ids.approverId)?.value.trim();
        if(gated && !approver){
          alert('An approver name is required for this transition.'); return;
        }
        const patch = { stage: targetKey };
        const note = targetKey==='closed' ? 'Closed as Acquired' : (gated ? ('Approved move to '+targetLabel) : (noteVerb || 'Advanced'));
        patch.stageHistory = (l.stageHistory||[]).concat([{stage: targetKey, at:new Date().toISOString(), by: approver || l.assignedExecutive, note}]);
        if(gated){
          patch.approval = { approver, date: todayStr(), remarks: document.getElementById(ids.remarksId)?.value.trim()||'' };
        }
        if(targetKey==='closed'){
          patch.outcome = 'acquired';
          patch.finalPrice = parseFloat(document.getElementById(ids.priceId)?.value)||l.priceValue;
          patch.finalDate = document.getElementById(ids.dateId)?.value || todayStr();
        }
        await DB.updateLead(l.id, patch);
        render();
      };
    }
    const idx = STAGE_INDEX[l.stage];
    const next = STAGES[idx+1];
    const prev = idx > 0 && l.stage !== 'closed' ? STAGES[idx-1] : null;
    if(next) wireMove('fwd', next.key, 'Advanced');
    if(prev) wireMove('back', prev.key, 'Moved back a stage');
    extraTransitionTargets(l, next, prev).forEach((t,i) => wireMove('extra-'+i, t.key));
    const holdBtn = document.getElementById('hold-btn');
    if(holdBtn) holdBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:true, reasonCode: document.getElementById('hold-reason').value, notes: document.getElementById('hold-notes').value.trim(), since:new Date().toISOString() } });
      render();
    };
    const resumeBtn = document.getElementById('resume-btn');
    if(resumeBtn) resumeBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:false, reasonCode:'', notes:'', since:'' } });
      render();
    };
    const reassignOpenBtn = document.getElementById('reassign-open-btn');
    if(reassignOpenBtn) reassignOpenBtn.onclick = () => { reassignMode = true; render(); };
    const reassignCancelBtn = document.getElementById('reassign-cancel-btn');
    if(reassignCancelBtn) reassignCancelBtn.onclick = () => { reassignMode = false; render(); };
    const reassignConfirmBtn = document.getElementById('reassign-confirm-btn');
    if(reassignConfirmBtn) reassignConfirmBtn.onclick = async () => {
      const newExec = document.getElementById('reassign-new-exec').value;
      const remarks = document.getElementById('reassign-remarks').value.trim();
      if(!newExec){ alert('Select the new Executive to reassign this lead to.'); return; }
      try {
        await DB.reassignLead(l.id, newExec, remarks);
        reassignMode = false;
        render();
      } catch(err){
        alert(err.message || 'Could not reassign this lead.');
      }
    };
    const dropBtn = document.getElementById('drop-btn');
    if(dropBtn) dropBtn.onclick = async () => {
      const reason = document.getElementById('drop-reason').value;
      const notes = document.getElementById('drop-notes').value.trim();
      await DB.updateLead(l.id, { stage:'closed', outcome:'dropped', reasonCode:reason, reasonNotes:notes,
        stageHistory: (l.stageHistory||[]).concat([{stage:'closed', at:new Date().toISOString(), by:l.assignedExecutive, note:'Dropped — '+reason}]) });
      render();
    };
  }
  {
    const btn = document.getElementById('save-feas');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { feasibility: {
        technical: { status: document.getElementById('feas-technical-status').value, notes: document.getElementById('feas-technical-notes').value },
        financial: { status: document.getElementById('feas-financial-status').value, notes: document.getElementById('feas-financial-notes').value },
      }});
      render();
    };
  }
  {
    const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
    const btn = document.getElementById('doc-add');
    if(btn) btn.onclick = async () => {
      const name = document.getElementById('doc-name').value.trim();
      if(!name){ alert('Enter a document name.'); return; }
      const docMeta = {
        category: document.getElementById('doc-category')?.value || '',
        referenceNumber: document.getElementById('doc-refnum')?.value.trim() || '',
        issueDate: document.getElementById('doc-issue')?.value || '',
        expiryDate: document.getElementById('doc-expiry')?.value || '',
        remarks: document.getElementById('doc-remarks')?.value.trim() || '',
        verificationStatus: 'Pending', verifiedBy: '', verificationDate: '',
        uploadedBy: currentUser ? currentUser.name : '',
      };
      if(liveUpload){
        const fileInput = document.getElementById('doc-file');
        const file = fileInput.files[0];
        if(!file){ alert('Choose a file to upload.'); return; }
        const statusEl = document.getElementById('doc-upload-status');
        statusEl.textContent = 'Uploading…';
        try{
          const path = 'leads/'+l.id+'/'+Date.now()+'_'+file.name;
          const ref = DB.storageRef(path);
          await ref.put(file);
          const url = await ref.getDownloadURL();
          await DB.updateLead(l.id, { documents: (l.documents||[]).concat([Object.assign({name, url, storagePath:path, addedAt:new Date().toISOString()}, docMeta)]) });
        }catch(err){
          statusEl.textContent = 'Upload failed: ' + err.message;
          return;
        }
      } else {
        const url = document.getElementById('doc-url').value.trim() || '(no reference given)';
        await DB.updateLead(l.id, { documents: (l.documents||[]).concat([Object.assign({name, url, addedAt:new Date().toISOString()}, docMeta)]) });
      }
      render();
    };
  }
  {
    // Verification can never be inferred just from uploading (per spec) —
    // this is the only thing that sets verificationStatus away from
    // 'Pending', and canVerifyDocument() already hides these buttons from
    // Executives in renderDocumentsTab().
    document.querySelectorAll('[data-doc-verify]').forEach(b=>b.onclick = async () => {
      const i = parseInt(b.dataset.docVerify, 10);
      const docs = (l.documents||[]).slice();
      if(!docs[i]) return;
      docs[i] = Object.assign({}, docs[i], {
        verificationStatus: b.dataset.docStatus,
        verifiedBy: currentUser ? currentUser.name : '',
        verificationDate: todayStr(),
      });
      await DB.updateLead(l.id, { documents: docs });
      render();
    });
  }
  {
    const btn = document.getElementById('neg-add');
    if(btn) btn.onclick = async () => {
      const amount = parseFloat(document.getElementById('neg-amount').value);
      if(isNaN(amount)) { alert('Enter an amount.'); return; }
      const num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
      // Appended, never overwritten — each negotiation round is its own
      // permanent record (see negotiationSummary()'s own comment).
      await DB.updateLead(l.id, { negotiationLog: (l.negotiationLog||[]).concat([{
        date: document.getElementById('neg-date').value, offerBy: document.getElementById('neg-by').value,
        negotiatedWith: document.getElementById('neg-with').value.trim(),
        amount,
        pricePerAcre: num('neg-ppa'), pricePerCent: num('neg-ppc'),
        otherCharges: num('neg-other'), brokerCommission: num('neg-commission'),
        paymentTerms: document.getElementById('neg-terms').value.trim(),
        status: document.getElementById('neg-status').value,
        notes: document.getElementById('neg-notes').value.trim(),
        recordedBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
  {
    const btn = document.getElementById('legal-add');
    if(btn) btn.onclick = async () => {
      // Appended, never overwritten — same discipline as negotiationLog
      // (see legalVerificationSummary()'s own comment). Button only renders
      // for canRecordLegalOrValuation(), but the guard is repeated here too
      // in case this ever gets wired from somewhere else.
      if(!canRecordLegalOrValuation()) return;
      await DB.updateLead(l.id, { legalVerificationLog: (l.legalVerificationLog||[]).concat([{
        date: document.getElementById('legal-date').value,
        titleStatus: document.getElementById('legal-title').value,
        encumbranceStatus: document.getElementById('legal-enc').value,
        encumbrancePeriod: document.getElementById('legal-enc-period').value.trim(),
        litigationStatus: document.getElementById('legal-litigation').value,
        litigationDetails: document.getElementById('legal-litigation-details').value.trim(),
        pattaChittaVerified: document.getElementById('legal-patta').value,
        legalRiskRating: document.getElementById('legal-risk').value,
        remarks: document.getElementById('legal-remarks').value.trim(),
        verifiedBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
  {
    const btn = document.getElementById('val-add');
    if(btn) btn.onclick = async () => {
      const guidelineRate = parseFloat(document.getElementById('val-guideline').value);
      if(isNaN(guidelineRate)) { alert('Enter a guideline rate.'); return; }
      if(!canRecordLegalOrValuation()) return;
      const num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
      // Appended, never overwritten — same discipline as negotiationLog
      // (see valuationSummary()'s own comment).
      await DB.updateLead(l.id, { valuationLog: (l.valuationLog||[]).concat([{
        date: document.getElementById('val-date').value,
        method: document.getElementById('val-method').value,
        guidelineRate, marketRate: num('val-market'), agreedRate: num('val-agreed'), totalValuation: num('val-total'),
        remarks: document.getElementById('val-remarks').value.trim(),
        valuedBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
  {
    // Price (Outright) / Advance (Joint Venture) are mutually exclusive —
    // toggled by mode, same idea as the live Days/₹ recompute elsewhere in
    // this file. Wired on every render so switching mode while the form is
    // already open updates immediately, without needing a full re-render.
    const modeSel = document.getElementById('prop-mode');
    const priceWrap = document.getElementById('prop-price-wrap');
    const advanceWrap = document.getElementById('prop-advance-wrap');
    const syncModeFields = () => {
      if(!modeSel) return;
      const isJV = modeSel.value === 'Joint Venture';
      if(priceWrap) priceWrap.style.display = isJV ? 'none' : '';
      if(advanceWrap) advanceWrap.style.display = isJV ? '' : 'none';
    };
    if(modeSel) modeSel.addEventListener('change', syncModeFields);
    syncModeFields();
  }
  {
    const btn = document.getElementById('prop-add');
    if(btn) btn.onclick = async () => {
      const mode = document.getElementById('prop-mode').value;
      const isJV = mode === 'Joint Venture';
      const price = parseFloat(document.getElementById('prop-price').value);
      const advance = parseFloat(document.getElementById('prop-advance').value);
      if(isJV && isNaN(advance)) { alert('Enter the Advance amount for this Joint Venture proposal.'); return; }
      if(!isJV && isNaN(price)) { alert('Enter the Price for this Outright proposal.'); return; }
      // Appended, never overwritten — each draft/revision/decision is its
      // own permanent version (see proposalSummary()'s own comment). Not
      // role-gated the same way Legal/Valuation are — see
      // renderAcquisitionProposalTab()'s comment for why.
      await DB.updateLead(l.id, { acquisitionProposalLog: (l.acquisitionProposalLog||[]).concat([{
        date: document.getElementById('prop-date').value,
        status: document.getElementById('prop-status').value,
        proposedPurchasePrice: isJV ? null : price,
        advanceAmount: isJV ? advance : null,
        modeOfAcquisition: mode,
        paymentSchedule: document.getElementById('prop-schedule').value.trim(),
        remarks: document.getElementById('prop-remarks').value.trim(),
        proposedBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
  {
    // Approvals (spec Module 11) — a decision is itself a NEW appended
    // version (never an edit of the version being decided on), carrying
    // forward that version's own price/advance/mode/schedule so the
    // history row still shows the full proposal context, not just a bare
    // status change. canApproveProposal() re-checks role + no-self-approval
    // here too, in case this ever gets wired from somewhere the UI guard
    // already hid the button from (belt-and-suspenders, same pattern as
    // the other action buttons in this file).
    function wireDecision(btnId, status){
      const btn = document.getElementById(btnId);
      if(!btn) return;
      btn.onclick = async () => {
        const log = l.acquisitionProposalLog || [];
        const latest = log[log.length-1];
        if(!latest) return;
        if(!canApproveProposal(latest)){ alert('You can’t approve or reject your own proposal — ask another Manager/Head/Admin to decide.'); return; }
        await DB.updateLead(l.id, { acquisitionProposalLog: log.concat([{
          date: todayStr(), status,
          proposedPurchasePrice: latest.proposedPurchasePrice,
          advanceAmount: latest.advanceAmount,
          modeOfAcquisition: latest.modeOfAcquisition,
          paymentSchedule: latest.paymentSchedule,
          remarks: document.getElementById('appr-remarks')?.value.trim() || '',
          proposedBy: currentUser ? currentUser.name : '',
        }])});
        render();
      };
    }
    wireDecision('appr-approve', 'Approved');
    wireDecision('appr-reject', 'Rejected');
  }
  {
    const btn = document.getElementById('pay-add');
    if(btn) btn.onclick = async () => {
      const amount = parseFloat(document.getElementById('pay-amount').value);
      if(isNaN(amount)){ alert('Enter the payment amount.'); return; }
      if(!canRecordFinancialEntry()) return;
      // Appended, never overwritten — same discipline as every other log in
      // this file (see paymentSummary()'s own comment).
      await DB.updateLead(l.id, { paymentLog: (l.paymentLog||[]).concat([{
        date: document.getElementById('pay-date').value,
        paymentType: document.getElementById('pay-type').value,
        mode: document.getElementById('pay-mode').value,
        amount,
        referenceNumber: document.getElementById('pay-ref').value.trim(),
        paidTo: document.getElementById('pay-to').value.trim(),
        remarks: document.getElementById('pay-remarks').value.trim(),
        recordedBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
  {
    const btn = document.getElementById('reg-add');
    if(btn) btn.onclick = async () => {
      const regNumber = document.getElementById('reg-number').value.trim();
      if(!regNumber){ alert('Enter the Registration Number.'); return; }
      if(!canRecordFinancialEntry()) return;
      const num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
      // Appended, never overwritten — same discipline as every other log in
      // this file (see registrationSummary()'s own comment).
      await DB.updateLead(l.id, { registrationLog: (l.registrationLog||[]).concat([{
        date: document.getElementById('reg-date').value,
        registrationNumber: regNumber,
        sroOffice: document.getElementById('reg-sro').value.trim(),
        documentType: document.getElementById('reg-doctype').value,
        stampDuty: num('reg-stamp'), registrationCharges: num('reg-charges'),
        remarks: document.getElementById('reg-remarks').value.trim(),
        registeredBy: currentUser ? currentUser.name : '',
      }])});
      render();
    };
  }
}

// ---- shared view wiring ---------------------------------------------------
function wireViewEvents(){
  if(currentView==='leadDetail'){ wireLeadDetailViewEvents(); }
  if(currentView==='dashboard'){
    document.querySelectorAll('[data-drill]').forEach(el=>el.addEventListener('click', ()=>{
      const d = el.dataset.drill;
      if(d==='active') goToLeadsList({ excludeClosed:true });
      if(d==='onHold') goToLeadsList({ onHold:true });
      if(d==='calls') goToLeadsList({ excludeClosed:true, callDueOrOverdue:true });
      if(d==='newLeads') goToLeadsList({ stage:'new' });
      if(d==='yetToSiteVisit') goToLeadsList({ stage: el.dataset.stageKey });
    }));
    document.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click', ()=>goToProgress(el.dataset.stage)));
    document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ source: el.dataset.source })));
    document.querySelectorAll('[data-cp]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ channelPartner: el.dataset.cp })));
    document.querySelectorAll('[data-open-id]').forEach(el=>el.addEventListener('click', ()=>openLeadDetail(el.dataset.openId)));
  }

  if(currentView==='list'){ wireListEvents(); }
  if(currentView==='newLead'){ wireNewLeadViewEvents(); }
  if(currentView==='reports'){ wireReportsEvents(); }
  if(currentView==='analytics'){ wireAnalyticsEvents(); }
  if(currentView==='configure'){ wireConfigureEvents(); }
  if(currentView==='masters'){ wireMastersEvents(); }
  if(currentView==='channelPartners'){ wireChannelPartnersEvents(); }
  if(currentView==='landowners'){ wireLandownersEvents(); }
  if(currentView==='landParcels'){ wireLandParcelsEvents(); }
  if(currentView==='users'){ wireUsersEvents(); }
  if(currentView==='workflow'){ wireWorkflowEvents(); }
  if(currentView==='statusConfig'){ wireStatusConfigEvents(); }
  if(currentView==='pageAccess'){ wirePageAccessEvents(); }
  if(currentView==='auditTrail'){ wireAuditTrailEvents(); }
}

// ---- Sidebar navigation ---------------------------------------------------
function wireSidebarNav(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view==='list'){
        // Always reset to the unfiltered All Leads view.
        goToLeadsList({});
      } else {
        if(b.dataset.view==='workflow'){ workflowDraftRows = null; workflowAddRole = null; workflowAddFrom = null; workflowAddTo = null; } // discard any unsaved draft on fresh entry
        if(b.dataset.view==='statusConfig') statusDraftRows = null;
        if(b.dataset.view==='pageAccess'){ pageAccessDraftRows = null; pageAccessSelectedUserUid = ''; userOverrideDraftRows = null; }
        if(b.dataset.view==='landowners'){ editingLandownerId = null; }
        if(b.dataset.view==='landParcels'){ editingParcelId = null; parcelLandownerLinksDraft = null; pendingParcelPrefill = null; }
        currentView = b.dataset.view;
        render();
      }
    };
  });
}
wireSidebarNav();

// Restore whichever view is named in the URL hash on load/refresh (deep
// link / reload support), then normalize the history entry so the very
// first back-press doesn't feel like a no-op.
(function initHistory(){
  const initial = (location.hash || '').slice(1);
  if(KNOWN_VIEWS.includes(initial)) currentView = initial;
  history.replaceState({ view: currentView }, '', '#' + currentView);
  window.addEventListener('popstate', (e) => {
    // Lead Details isn't in KNOWN_VIEWS (it's a universal drill-through, not
    // a navigable page — see canAccessView()), so Back/Forward landing on
    // its old hash falls through to Dashboard below, same as any other
    // unrecognized hash already does.
    const v = (e.state && e.state.view) || (location.hash || '').slice(1);
    currentView = KNOWN_VIEWS.includes(v) ? v : 'dashboard';
    suppressHistoryPush = true;
    render();
  });
})();

boot();
</script>
