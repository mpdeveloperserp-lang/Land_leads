   Made, Site Visited, Legal, Owner Meeting, Technical Opinion, Negotiation,
   Purchased and Dropped Reason as information becomes available, in any
   order. Deliberately NOT a full land-acquisition ERP: no stage pipeline,
   no approval gates, no acquisition proposals/payments/registration.

   This version is wired to real Firebase (Firestore for leads/users,
   Firebase Authentication for sign-in).

   >>> TO GO LIVE: paste your Firebase project config into FIREBASE_CONFIG
   below. Until you do, or if the SDK can't load, the app runs on an
   in-memory demo (MemoryDB) automatically, so it's always usable. <<<
   ========================================================================= */

// ---- Roles & navigation -------------------------------------------------
const ROLES = ['admin','manager','executive','sysadmin'];
const ROLE_LABELS = { admin:'Head', manager:'Manager', executive:'Executive', sysadmin:'Admin' };

const PAGE_TITLES = { dashboard:'Dashboard', list:'Land Leads', newLead:'New Land Lead', users:'Manage Users' };
const KNOWN_VIEWS = Object.keys(PAGE_TITLES);

// Simplified, static role→page access map (no admin-editable Page Access
// screen any more — Manage Users is restricted to Head/Admin; every signed-in
// role can use Dashboard, Land Leads and New Land Lead).
const DEFAULT_VIEW_ACCESS = {
  dashboard: ['admin','manager','executive','sysadmin'],
  list:      ['admin','manager','executive','sysadmin'],
  newLead:   ['admin','manager','executive','sysadmin'],
  users:     ['admin','sysadmin'],
};
const VIEW_ACCESS = DEFAULT_VIEW_ACCESS;
function canAccessView(view){
  if(!currentUser) return false;
  // Lead Details isn't a navigable sidebar page — it's a drill-through
  // reached only from Land Leads, which the user already had to pass this
  // same check to reach. Real access is enforced at the data layer by
  // openLeadDetail()'s own visibleLeads() guard below.
  if(view==='leadDetail') return true;
  // Head ('admin') always has full access and can never be locked out.
  if(currentUser.role==='admin') return true;
  return !!(VIEW_ACCESS[view] && VIEW_ACCESS[view].includes(currentUser.role));
}

// ---- Lead visibility tree -------------------------------------------------
// Leads >> Created & viewed by the Executive assigned to them >> viewed &
// edited by that Executive's Manager (via the Executive's "Reports To") >>
// viewed & edited by that Manager's Head (via the Manager's "Reports To").
// Unchanged from the prior version of this app — this is existing,
// already-working access control being preserved, not re-designed.
function userByName(name){ return (DB.getUsers()||[]).find(u=>u.name===name); }
function userByUid(uidVal){ return (DB.getUsers()||[]).find(u=>u.uid===uidVal); }
function isTeammateOf(currentExec, otherName){
  if(!currentExec || !otherName) return false;
  if(otherName === currentExec.name) return true;
  if(!currentExec.reportsTo) return false;
  const other = userByName(otherName);
  if(!other) return false;
  if(other.role==='executive') return other.reportsTo === currentExec.reportsTo;
  if(other.role==='manager') return other.uid === currentExec.reportsTo;
  return false;
}
function isDirectReport(managerUid, execName){
  const exec = userByName(execName);
  return !!(exec && exec.reportsTo === managerUid);
}
function isInHeadBranch(headUid, execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && mgr.reportsTo === headUid);
}
function hasOrphanedManagerChain(execName){
  const exec = userByName(execName);
  if(!exec || !exec.reportsTo) return false;
  const mgr = userByUid(exec.reportsTo);
  return !!(mgr && !mgr.reportsTo);
}
function visibleLeads(){
  const all = DB.getLeads();
  if(!currentUser) return [];
  if(currentUser.role==='executive') return all.filter(l=>isTeammateOf(currentUser, l.assignedExecutive));
  if(currentUser.role==='manager') return all.filter(l=>isDirectReport(currentUser.uid, l.assignedExecutive));
  if(currentUser.role==='admin'){
    return all.filter(l => isInHeadBranch(currentUser.uid, l.assignedExecutive)
      || hasOrphanedManagerChain(l.assignedExecutive)
      || !userByName(l.assignedExecutive));
  }
  return all; // sysadmin: full access across every lead
}
function visibleExecutives(){
  const items = (DB.getUsers()||[]).filter(u=>u.role==='executive');
  if(!currentUser) return [];
  if(currentUser.role==='executive') return items.filter(u=>isTeammateOf(currentUser, u.name));
  if(currentUser.role==='manager') return items.filter(u=>u.reportsTo===currentUser.uid);
  if(currentUser.role==='admin') return items.filter(u=>isInHeadBranch(currentUser.uid, u.name) || hasOrphanedManagerChain(u.name));
  return items; // sysadmin
}
// A lead can be opened/modified by anyone who can currently SEE it — Actions
// (View/Modify) are "subject to existing permissions" per spec, i.e. the
// same branch-scoped visibility above, not a separate permission layer.
function canModifyLeadDetails(lead){
  return !!(currentUser && lead && visibleLeads().some(l=>l.id===lead.id));
}

function droppedText(l){

// =========================================================================
// DATA LAYER — two implementations behind the same interface:
//   getLeads(), getLead(id), addLead(lead), updateLead(id,patch)
//   getUsers(), getAllUsers(), createUser(), updateUser(), toggleUser(),
//   deleteUser(), changeUserPassword()
//   isLive(), ready()
// Only `leads` and `m_users` are read/written now — every other collection
// this app previously used (masters, landowners, landParcels, settings/*,
// auditLog) is simply never touched by this simplified version. Nothing is
// deleted from Firestore — those collections are left exactly as they were,
// should this app ever need them again.
// =========================================================================

class MemoryDB {
  constructor(){
    this.leads = seedLeads().map(l => Object.assign({ id: uid('LD') }, l));
    this.users = DEFAULT_USERS_SEED.map(u=>Object.assign({ id:u.uid }, u));
  }
  async init(){ /* nothing to load — already seeded in memory */ }
  ready(){ return Promise.resolve(); }
  isLive(){ return false; }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){
    this.leads.unshift(Object.assign({ id: uid('LD'), createdAt: new Date().toISOString() }, lead));
  }
  async updateLead(id, patch){
    const i=this.leads.findIndex(l=>l.id===id);
    if(i>-1) this.leads[i]=Object.assign({}, this.leads[i], patch, {updatedAt:new Date().toISOString()});
  }
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  async login(email, password){
    const e = (email||'').trim().toLowerCase();
    const user = this.users.find(u=>u.email.toLowerCase()===e && u.active!==false);
    if(!user || user.password !== password) throw new Error('Incorrect email or password.');
    return Object.assign({}, user);
  }
  async logout(){ /* no-op — demo mode holds no session */ }
  async createUser({name, email, phone, role, password, reportsTo}){
    const e = (email||'').trim().toLowerCase();
    if(this.users.find(u=>u.email.toLowerCase()===e)) throw new Error('A user with that email already exists.');
    const newUid = uid('USR');
    const newUser = { id:newUid, uid:newUid, name, email:(email||'').trim(), phone: phone||'', role, password, active:true, reportsTo: reportsTo||'' };
    this.users.push(newUser);
    return Object.assign({}, newUser);
  }
  async updateUser(userUid, patch){ const i=this.users.findIndex(u=>u.uid===userUid); if(i>-1) this.users[i]=Object.assign({}, this.users[i], patch); }
  async toggleUser(userUid){ const u=this.users.find(x=>x.uid===userUid); if(u) await this.updateUser(userUid, {active: !(u.active!==false)}); }
  async deleteUser(userUid){ this.users = this.users.filter(u=>u.uid!==userUid); }
  async changeUserPassword(userUid, newPassword){
    if(!newPassword || newPassword.length < 6) throw new Error('Password must be at least 6 characters.');
    const u = this.users.find(x=>x.uid===userUid);
    if(!u) throw new Error('User not found.');
    u.password = newPassword;
  }
}

class FirestoreDB {
  constructor(fsdb){
    this.fsdb = fsdb;
    this.leads = [];
    this.users = [];
    this._onChange = null;
    this._pending = new Set(['leads','users']);
    this._readyResolvers = [];
  }
  onChange(cb){ this._onChange = cb; }
  _markReady(tag){
    this._pending.delete(tag);
    if(this._pending.size===0){ this._readyResolvers.forEach(r=>r()); this._readyResolvers = []; }
  }
  ready(){ return this._pending.size===0 ? Promise.resolve() : new Promise(res=>this._readyResolvers.push(res)); }
  isLive(){ return true; }

  async init(){
    // One-time seed of sample leads if the `leads` collection is empty —
    // same collection name the prior, full-ERP version of this app used, so
    // any existing production leads are picked up unchanged (their extra,
    // now-unused fields are simply never read by this simplified UI).
    const leadSnap = await this.fsdb.collection('leads').limit(1).get();
    if(leadSnap.empty){
      const seed = seedLeads();
      const batch = this.fsdb.batch();
      seed.forEach(lead=>{
        const ref = this.fsdb.collection('leads').doc();
        batch.set(ref, Object.assign({}, lead, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
      });
      await batch.commit();
    }
    this.fsdb.collection('m_users').onSnapshot(snap=>{
      this.users = snap.docs.map(d=>Object.assign({ uid:d.id, id:d.id }, d.data()));
      this._markReady('users');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('users listener error', err); this._markReady('users'); });

    this.fsdb.collection('leads').orderBy('createdAt','desc').onSnapshot(snap=>{
      this.leads = snap.docs.map(d=>Object.assign({ id:d.id }, d.data()));
      this._markReady('leads');
      if(this._onChange) this._onChange();
    }, err=>{ console.error('leads listener error', err); this._markReady('leads'); });
  }
  getLeads(){ return this.leads; }
  getLead(id){ return this.leads.find(l=>l.id===id); }
  async addLead(lead){
    await this.fsdb.collection('leads').add(Object.assign({}, lead, {
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  async updateLead(id, patch){
    await this.fsdb.collection('leads').doc(id).update(Object.assign({}, patch, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  getUsers(){ return this.users.filter(u=>u.active!==false); }
  getAllUsers(){ return this.users; }
  // Creates the new account on a SECONDARY Firebase app instance so the
  // admin creating it stays signed in on the primary app — the standard
  // client-side workaround for admin-created users without a backend.
  async createUser({name, email, phone, role, password, reportsTo}){
    const secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'Secondary-' + Date.now());
    try{
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword((email||'').trim(), password);
      const newUid = cred.user.uid;
      await secondaryApp.auth().signOut();
      const doc = { name, email:(email||'').trim(), phone: phone||'', role, active:true, reportsTo: reportsTo||'', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      await this.fsdb.collection('m_users').doc(newUid).set(doc);
      return Object.assign({ uid:newUid, id:newUid }, doc);
    } finally {
      await secondaryApp.delete();
    }
  }
  async updateUser(userUid, patch){ await this.fsdb.collection('m_users').doc(userUid).update(patch); }
  async toggleUser(userUid){
    const u = this.users.find(x=>x.uid===userUid);
    await this.updateUser(userUid, { active: !(u && u.active!==false) });
  }
  async deleteUser(userUid){ await this.fsdb.collection('m_users').doc(userUid).delete(); }
  // Sets another user's real Firebase Auth sign-in password directly via the
  // adminSetUserPassword Cloud Function (deployed separately), which
  // independently re-checks that the CALLER is a Head/Admin server-side.
  async changeUserPassword(userUid, newPassword){
    if(!newPassword || newPassword.length < 6) throw new Error('Password must be at least 6 characters.');
    if(typeof firebase.functions !== 'function'){
      throw new Error('The Functions SDK didn\'t load, so this app can\'t reach the password-change function right now.');
    }
    try{
      await firebase.functions().httpsCallable('adminSetUserPassword')({ uid: userUid, newPassword });
    }catch(err){
      if(err && err.code === 'functions/not-found'){
        throw new Error('The adminSetUserPassword function isn\'t deployed yet on this Firebase project.');
      }
      throw new Error((err && err.message) || 'Could not change the password.');
    }
  }
}

async function boot(){
  const cfg = FIREBASE_CONFIG;
  const isPlaceholder = !cfg || !cfg.apiKey || cfg.apiKey.indexOf('REPLACE_ME') !== -1;
  const sdkLoaded = typeof firebase !== 'undefined';

  if(!isPlaceholder && sdkLoaded){
    try{
      firebase.initializeApp(cfg);
      if(typeof firebase.auth === 'function'){
        try{ await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
        catch(persistErr){ console.warn('Could not set Firebase Auth persistence to LOCAL — sessions may not survive a refresh in this browser mode.', persistErr); }
      }
      const fsdb = firebase.firestore();
      DB = new FirestoreDB(fsdb);
      DB.onChange(()=>{ if(currentUser){ applyRoleVisibility(); render(); } });
      // DB.init() is deliberately NOT called here — see ensureDbInit(),
      // called once right after sign-in succeeds (security rules require
      // request.auth != null for reads).
      showConnectionBadge(true);
      renderDemoBanner(false);
    }catch(err){
      console.error('Firebase init failed — falling back to demo mode.', err);
      DB = new MemoryDB();
      await DB.init();
      showConnectionBadge(false, err.message);
      renderDemoBanner(true, 'connection error: ' + err.message);
    }
  } else {
    DB = new MemoryDB();
    await DB.init();
    showConnectionBadge(false, isPlaceholder ? 'no Firebase config set yet' : 'SDK did not load');
    renderDemoBanner(true, isPlaceholder ? 'no Firebase config set yet' : 'the Firebase SDK did not load');
  }
  initAuth();
}

// =========================================================================
// AUTH / ACCESS — unchanged from the prior version: a real login gate in
// front of the whole app. Live mode uses Firebase Authentication; demo mode
// uses a lightweight in-memory mock so the whole flow works the same offline.
// =========================================================================
let currentUser = null;

let _dbInitPromise = null;
function ensureDbInit(){
  if(!DB.isLive()) return Promise.resolve();
  if(!_dbInitPromise) _dbInitPromise = DB.init().then(()=>DB.ready());
  return _dbInitPromise;
}

// ---- Auto sign-out after inactivity -------------------------------------
const IDLE_TIMEOUT_MS = 20 * 60 * 1000;
const IDLE_ACTIVITY_EVENTS = ['mousemove','mousedown','keydown','scroll','touchstart','click'];
let idleTimer = null;
let pendingLoginMessage = null;
function resetIdleTimer(){
  if(!currentUser) return;
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(onIdleTimeout, IDLE_TIMEOUT_MS);
}
function stopIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
}
async function onIdleTimeout(){
  if(!currentUser) return;
  await doLogout('You were signed out after 20 minutes of inactivity.');
}
(function wireIdleTimerListeners(){
  IDLE_ACTIVITY_EVENTS.forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive:true }));
})();

async function doLogout(reason){
  stopIdleTimer();
  if(DB.isLive()){
    pendingLoginMessage = reason || null;
    await firebase.auth().signOut();
  } else {
    await DB.logout();
    currentUser = null;
    showLoginScreen(reason);
  }
}

let suppressAuthListener = false;

function initAuth(){
  if(DB.isLive() && typeof firebase.auth === 'function'){
    firebase.auth().onAuthStateChanged(async fbUser => {
      if(suppressAuthListener) return;
      if(!fbUser){
        currentUser = null;
        stopIdleTimer();
        const msg = pendingLoginMessage; pendingLoginMessage = null;
        showLoginScreen(msg);
        return;
      }
      try{
        await ensureDbInit();
        const doc = await DB.fsdb.collection('m_users').doc(fbUser.uid).get();
        if(doc.exists && doc.data().active !== false){
          currentUser = Object.assign({ uid: fbUser.uid }, doc.data());
          enterApp();
        } else {
          await firebase.auth().signOut();
          showLoginScreen('Your account isn\'t set up for access yet. Ask your admin to add you under Manage Users.');
        }
      }catch(err){
        console.error('Could not load your user profile.', err);
        await firebase.auth().signOut();
        showLoginScreen('Could not verify your account: ' + err.message);
      }
    });
  } else {
    showLoginScreen();
  }
}

function friendlyAuthError(err){
  const code = (err && err.code) || '';
  if(/user-not-found|wrong-password|invalid-credential|invalid-login-credentials/.test(code)) return 'Incorrect email or password.';
  if(/too-many-requests/.test(code)) return 'Too many attempts — try again in a few minutes.';
  if(/invalid-email/.test(code)) return 'That email address looks invalid.';
  if(/email-already-in-use/.test(code)) return 'A user with that email already exists.';
  if(/weak-password/.test(code)) return 'Password must be at least 6 characters.';
  return (err && err.message) || 'Sign-in failed.';
}

function leadMatchesFilters(l, f){
  if(f.quick==='firstCall' && !l.firstCallMade) return false;
  if(f.quick==='siteVisited' && !l.siteVisited) return false;
  if(f.quick==='negotiation' && !(l.negotiation && l.negotiation.trim())) return false;
  if(f.quick==='purchased' && l.purchased!=='yes') return false;
  if(f.quick==='dropped' && !l.droppedReason) return false;
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [l.contact, l.mediatorOwner, l.location, l.village].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// Reads the shared form into a plain fields object. Returns null (and shows
// an alert) if required validation fails — kept to a single required field
// (Contact), per spec: "apply mandatory validation only where genuinely
// necessary, not on every field."
function readLeadFormFields(){
  const contact = document.getElementById('lf-contact').value.trim();
  if(!contact){ alert('Contact is required.'); return null; }
  const numOrNull = id => { const v = document.getElementById(id).value; return (v===''||v==null) ? null : Number(v); };
  const execSel = document.getElementById('lf-exec');
  const fields = {
    contact,
    mediatorOwner: document.getElementById('lf-mediator').value.trim(),
    location: document.getElementById('lf-location').value.trim(),
    village: document.getElementById('lf-village').value.trim(),
    extentValue: numOrNull('lf-extent-val'),
    extentUnit: document.getElementById('lf-extent-unit').value,
    orJv: document.getElementById('lf-orjv').value,
    orAndJv: document.getElementById('lf-or-and-jv').value.trim(),
    orPrice: numOrNull('lf-or-price'),
    jvRatio: document.getElementById('lf-jv-ratio').value.trim(),
    locationPin: document.getElementById('lf-pin').value.trim(),
    roadWidth: numOrNull('lf-roadwidth'),
    frontage: numOrNull('lf-frontage'),
    firstCallMade: document.getElementById('lf-first-call').value,
    siteVisited: document.getElementById('lf-site-visited').value,
    legal: document.getElementById('lf-legal').value.trim(),
    ownerMeeting: document.getElementById('lf-owner-meeting').value,
    technicalOpinion: document.getElementById('lf-tech-opinion').value.trim(),
    negotiation: document.getElementById('lf-negotiation').value.trim(),
    purchased: document.getElementById('lf-purchased').value,
    purchaseDate: document.getElementById('lf-purchased').value==='yes' ? document.getElementById('lf-purchase-date').value : '',
    droppedReason: document.getElementById('lf-dropped-reason').value,
    droppedRemarks: document.getElementById('lf-dropped-remarks').value.trim(),
  };
  if(execSel){ fields.assignedExecutive = execSel.value; }
  return fields;
}

function wireLeadDetailViewEvents(){
  const backBtn = document.getElementById('ld-back');
  if(backBtn) backBtn.onclick = closeLeadDetail;

  if(modifyBtn) modifyBtn.onclick = () => { leadEditMode = true; render(); };
  const cancelEditBtn = document.getElementById('ld-cancel-edit');
  if(cancelEditBtn) cancelEditBtn.onclick = () => { leadEditMode = false; render(); };
  wireLeadFormCommonEvents();
  const saveBtn = document.getElementById('ld-save');
  if(saveBtn) saveBtn.onclick = async () => {

// ---- Manage Users (unchanged from the prior version of this app) ----------
function reportsToCandidates(role){
  const items = DB.getAllUsers();
  if(role==='executive') return items.filter(u=>u.role==='manager' && u.active!==false);
  if(role==='manager') return items.filter(u=>u.role==='admin' && u.active!==false);
  return [];
}
function reportsToOptionsHtml(role, selectedUid){
  const list = reportsToCandidates(role);
  const empty = list.length ? '— unassigned —' : '— none available yet, add one first —';
  return `<option value="">${empty}</option>` + list.map(u=>`<option value="${u.uid}" ${selectedUid===u.uid?'selected':''}>${u.name}</option>`).join('');
}

      <div style="margin-top:10px;display:flex;gap:8px;">

function wireUsersEvents(){
  document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick = () => { editingUserId=b.dataset.userEdit; render(); });
  document.querySelectorAll('[data-user-toggle]').forEach(b=>b.onclick = async () => {
    await DB.toggleUser(b.dataset.userToggle);
    render();
  });
  document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick = async () => {
    const extra = DB.isLive() ? ' Their sign-in account itself must be removed separately in the Firebase Console if you want it fully deleted.' : '';
    if(!confirm('Remove this user\'s access record?' + extra + ' This cannot be undone.')) return;
    await DB.deleteUser(b.dataset.userDelete);
    if(editingUserId===b.dataset.userDelete) editingUserId=null;
    render();
  });
  const roleSelect = document.getElementById('uf-role');
  if(roleSelect) roleSelect.onchange = () => {
    const role = roleSelect.value;
    const wrap = document.getElementById('uf-reports-to-wrap');
    const sel = document.getElementById('uf-reports-to');
    if(role==='admin' || role==='sysadmin'){
      wrap.style.display = 'none';
    } else {
      wrap.style.display = '';
      sel.innerHTML = reportsToOptionsHtml(role, '');
    }
  };
  const saveBtn = document.getElementById('user-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const name = document.getElementById('uf-name').value.trim();
    const email = document.getElementById('uf-email').value.trim();
    const phone = document.getElementById('uf-phone').value.trim();
    const role = document.getElementById('uf-role').value;
    const reportsTo = (role==='admin' || role==='sysadmin') ? '' : (document.getElementById('uf-reports-to')?.value || '');
    if(!name){ alert('Name is required.'); return; }
    if(editingUserId){
      const newPassword = document.getElementById('uf-password').value;
      if(newPassword && newPassword.length < 6){ alert('New password must be at least 6 characters, or leave it blank to keep the current one.'); return; }
      try{
        await DB.updateUser(editingUserId, { name, phone, role, reportsTo });
        if(newPassword) await DB.changeUserPassword(editingUserId, newPassword);
      }catch(err){
        alert('Saved the profile, but could not change the password: ' + ((err && err.message) || err));
        editingUserId = null;
        render();
        return;
      }
      editingUserId = null;
    } else {
      const password = document.getElementById('uf-password').value;
      if(!email){ alert('Email is required.'); return; }
      if(!password || password.length < 6){ alert('Password must be at least 6 characters.'); return; }
      try{
        await DB.createUser({ name, email, phone, role, password, reportsTo });
      }catch(err){
        alert('Could not create user: ' + friendlyAuthError(err));
        return;
      }
    }
    render();
  };
  const cancelBtn = document.getElementById('user-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingUserId=null; render(); };
}

function wireViewEvents(){
  if(currentView==='leadDetail'){ wireLeadDetailViewEvents(); }
  if(currentView==='dashboard'){
    document.querySelectorAll('[data-drill]').forEach(el=>el.addEventListener('click', ()=>{
      const d = el.dataset.drill;
      goToLeadsList(d ? { quick: d } : {});
    }));
  }
  if(currentView==='list'){ wireListEvents(); }
  if(currentView==='newLead'){ wireNewLeadViewEvents(); }
  if(currentView==='users'){ wireUsersEvents(); }
}

function wireSidebarNav(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view==='list'){
        goToLeadsList({});
      } else {
        currentView = b.dataset.view;
        render();
      }
    };
  });
}
wireSidebarNav();

(function initHistory(){
  const initial = (location.hash || '').slice(1);
  if(KNOWN_VIEWS.includes(initial)) currentView = initial;
  history.replaceState({ view: currentView }, '', '#' + currentView);
  window.addEventListener('popstate', (e) => {
    const v = (e.state && e.state.view) || (location.hash || '').slice(1);
    currentView = KNOWN_VIEWS.includes(v) ? v : 'dashboard';
    suppressHistoryPush = true;
    render();
  });
})();

boot();
</script>
</body>
</html>
