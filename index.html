// ---- Derived calculations ----------------------------------------------
function leadExtentSqft(l){ return extentSqft(l.extentValue, l.extentUnit); }
function leadPricePerSqft(l){ return pricePerSqft(l.priceValue, l.priceUnit); }
function leadValue(l){ return leadExtentSqft(l) * leadPricePerSqft(l); }
// Final Price (set when a lead is closed as Acquired — see renderTransitionBlock()'s
// isClosing branch) is a per-unit rate in the SAME priceUnit as the lead's own
// Quoted Price, never a total — same unit-conversion pattern as leadValue()
// above, just reading finalPrice instead of priceValue, for MIS Analytics'
// "Acquired Value" (the actual closing rate, not the original ask).
function leadFinalValue(l){ return l.finalPrice==null ? null : leadExtentSqft(l) * pricePerSqft(l.finalPrice, l.priceUnit); }
// Lead Created By. Leads entered before this field existed fall back to
// whoever the "Lead created" history entry names (older versions recorded
// the assigned executive there, so treat those as best-effort).
function leadCreatorName(l){
  if(l && l.createdByName) return l.createdByName;
  const first = l && (l.stageHistory||[]).find(h=>/Lead created/i.test(h.note||''));
  return (first && first.by) || '—';
}
function isClosed(l){ return l.stage==='closed'; }
function isActive(l){ return !isClosed(l); }
function daysInStage(l){
  const last = l.stageHistory && l.stageHistory.length ? l.stageHistory[l.stageHistory.length-1] : null;
  const since = last ? new Date(last.at) : new Date(l.createdAt);
  return daysBetween(since, new Date());
}
function isOverdueStage(l){
  const st = STAGES.find(s=>s.key===l.stage);
  if(!st || st.sla==null) return false;
  return daysInStage(l) > st.sla;
}
function callBadgeInfo(l){
  if(!l.nextCallDate) return null;
  const d = new Date(l.nextCallDate); const t = new Date(todayStr());
  const diff = daysBetween(t, d);
  if(diff < 0) return {type:'danger', text:'Overdue ' + Math.abs(diff) + 'd'};
  if(diff === 0) return {type:'warn', text:'Due today'};
  return {type:'muted', text:'In ' + diff + 'd'};
}
function leadMatchesFilters(l, f){
  if(f.stage && l.stage !== f.stage) return false;
  if(f.excludeClosed && l.stage === 'closed') return false;
  if(f.source && l.leadSource !== f.source) return false;
  if(f.landClass && (l.landClassification||'') !== f.landClass) return false;
  if(f.mediator && (l.mediatorName||'') !== f.mediator) return false;
  if(f.createdBy && leadCreatorName(l) !== f.createdBy) return false;
  if(f.channelPartner && l.channelPartnerCode !== f.channelPartner) return false;
  if(f.exec && l.assignedExecutive !== f.exec) return false;
  if(f.dateFrom){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d < f.dateFrom) return false; }
  if(f.dateTo){ const d = (l.leadSourceDateTime||'').slice(0,10); if(!d || d > f.dateTo) return false; }
  if(f.onHold && !(l.onHold && l.onHold.active)) return false;
  if(f.callDueOrOverdue && !(l.nextCallDate && new Date(l.nextCallDate) <= new Date(todayStr()))) return false;
  if(f.letter){ const v=(l.village||'').trim().toUpperCase(); if(!v.startsWith(f.letter)) return false; }
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [l.leadId,l.village,l.siteLocation,l.landownerName,l.surveyNumber,l.contactNumber,l.landownerPhone].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

// ---- DASHBOARD -----------------------------------------------------------
function renderDashboard(){
  const leads = visibleLeads();
  const active = leads.filter(isActive);
  const overdueCalls = leads.filter(l=>isActive(l) && l.nextCallDate && new Date(l.nextCallDate) < new Date(todayStr()));
  const dueToday = leads.filter(l=>isActive(l) && l.nextCallDate === todayStr());
  const ageingAlerts = active.filter(isOverdueStage);
  const onHoldCount = active.filter(l=>l.onHold && l.onHold.active).length;

  // Pipeline Funnel — a donut chart (lead count by stage, a true part-to-
  // whole breakdown: every lead is in exactly one stage), matching the
  // "Stock Position" donut style from her Sales Dashboard: a colored ring
  // with a value on each big-enough segment, plus a swatch legend below.
  // Colors follow the current STAGES order (not hardcoded stage keys), so
  // this stays correct as stages are renamed/reordered/added on Status
  // Config; only wraps back to slot 1 in the unlikely case of >8 stages.
  const donutTotal = leads.length;
  const donutCX = 110, donutCY = 110, donutOuterR = 90, donutStroke = 36;
  const donutR = donutOuterR - donutStroke/2;
  const donutCircumference = 2 * Math.PI * donutR;
  let donutCumPct = 0;
  const donutSegs = STAGES.map((s,i)=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    const pct = donutTotal ? count/donutTotal : 0;
    const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
    const dashLen = pct * donutCircumference;
    const dashArray = `${dashLen} ${Math.max(0, donutCircumference - dashLen)}`;
    const dashOffset = -donutCumPct * donutCircumference;
    // Mid-angle of this segment, clockwise from 12 o'clock — matches the
    // rotate(-90) applied to every ring segment below, so labels land
    // centered in their own slice without needing to rotate the text itself.
    const midAngleRad = (-90 + (donutCumPct + pct/2) * 360) * Math.PI / 180;
    const labelX = donutCX + donutR * Math.cos(midAngleRad);
    const labelY = donutCY + donutR * Math.sin(midAngleRad);
    const showLabel = pct >= 0.04 && count > 0; // skip labeling slivers too thin to hold a number
    donutCumPct += pct;
    return { s, count, color, dashArray, dashOffset, labelX, labelY, showLabel };
  });
  const donutSegsSvg = donutSegs.map(d =>
    `<circle class="donut-seg" data-stage="${d.s.key}" cx="${donutCX}" cy="${donutCY}" r="${donutR}" fill="none" stroke="${d.color}" stroke-width="${donutStroke}" stroke-dasharray="${d.dashArray}" stroke-dashoffset="${d.dashOffset}" transform="rotate(-90 ${donutCX} ${donutCY})"><title>${d.s.label}: ${d.count} lead${d.count===1?'':'s'}</title></circle>`
  ).join('');
  const donutLabelsSvg = donutSegs.filter(d=>d.showLabel).map(d =>
    `<text class="donut-label" data-stage="${d.s.key}" x="${d.labelX.toFixed(1)}" y="${d.labelY.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="${readableTextOn(d.color)}">${d.count}</text>`
  ).join('');
  const donutSvg = donutTotal
    ? `<svg viewBox="0 0 220 220" width="220" height="220">${donutSegsSvg}${donutLabelsSvg}</svg>`
    : `<svg viewBox="0 0 220 220" width="220" height="220"><circle cx="${donutCX}" cy="${donutCY}" r="${donutR}" fill="none" stroke="#eceff3" stroke-width="${donutStroke}"/></svg>`;
  const donutLegend = STAGES.map((s,i)=>{
    const count = leads.filter(l=>l.stage===s.key).length;
    return `<span class="legend-item" data-stage="${s.key}"><span class="legend-swatch" style="background:${DONUT_PALETTE[i % DONUT_PALETTE.length]}"></span>${s.label} (${count})</span>`;
  }).join('');

  // "New Leads" — every lead still sitting in the very first stage, newest
  // first, with the date it was created. Clicking a row goes to the same
  // place as the dashboard's other drill-throughs — the All Leads page,
  // filtered to just these — rather than opening that one lead's detail.
  const newLeadsList = leads.filter(l=>l.stage==='new').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8).map(l=>
    `<div class="callitem" data-drill="newLeads" style="cursor:pointer;"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(by ${leadCreatorName(l)})</span></span>
      <span class="badge badge-navy">${fmtDate(l.createdAt)}</span></div>`
  ).join('') || '<div class="empty">No new leads yet</div>';

  // "Yet to be Site Visited" — just the count of leads sitting in whichever
  // stage immediately precedes "Site Visited" (Contacted, by default), not a
  // per-lead list — click it to drill into that filtered list on All Leads.
  // Resolved by key so it keeps working if that stage gets renamed or
  // reordered on Status Config.
  const siteVisitedIdx = STAGE_KEYS.indexOf('site_visited');
  const preSiteVisitKey = siteVisitedIdx > 0 ? STAGE_KEYS[siteVisitedIdx-1] : null;
  const yetToSiteVisitCount = preSiteVisitKey ? leads.filter(l=>l.stage===preSiteVisitKey).length : 0;
  const yetToSiteVisitList = !preSiteVisitKey ? '<div class="empty">No "Site Visited" stage configured</div>' :
    `<div class="callitem" data-drill="yetToSiteVisit" data-stage-key="${preSiteVisitKey}" style="cursor:pointer;"><span><b>${yetToSiteVisitCount}</b> lead${yetToSiteVisitCount===1?'':'s'} yet to be site visited</span><span class="badge badge-warn">View in All Leads</span></div>`;

  const bySource = {};
  leads.forEach(l=>{ bySource[l.leadSource||'—']=(bySource[l.leadSource||'—']||0)+1; });
  const sourceRows = Object.entries(bySource).sort((a,b)=>b[1]-a[1]).map(([src,c])=>
    `<tr class="clickable-row" data-source="${src}"><td>${src}</td><td>${c}</td><td>${leads.length?Math.round(c/leads.length*100):0}%</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No leads yet</td></tr>';

  const byCP = {};
  leads.filter(l=>l.channelPartnerCode).forEach(l=>{ byCP[l.channelPartnerCode]=(byCP[l.channelPartnerCode]||0)+1; });
  const cpRows = Object.entries(byCP).sort((a,b)=>b[1]-a[1]).map(([cp,c])=>
    `<tr class="clickable-row" data-cp="${cp}"><td>${cp}</td><td>${c}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">No channel partner leads yet</td></tr>';
  // Leads by the person who CREATED them (not the assigned lead owner).
  const byCreator = {};
  leads.forEach(l=>{ const n = leadCreatorName(l); byCreator[n] = byCreator[n] || { total:0, active:0 }; byCreator[n].total++; if(isActive(l)) byCreator[n].active++; });
  const creatorRows = Object.entries(byCreator).sort((a,b)=>b[1].total-a[1].total).map(([n,c])=>
    `<tr class="clickable-row" data-creator="${n.replace(/"/g,'&quot;')}"><td>${n}</td><td>${c.total}</td><td>${c.active}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No leads yet</td></tr>';

  const callList = leads.filter(l=>isActive(l) && l.nextCallDate).sort((a,b)=>new Date(a.nextCallDate)-new Date(b.nextCallDate)).slice(0,8).map(l=>{
    const info = callBadgeInfo(l);
    return `<div class="callitem" data-open-id="${l.id}"><span><b>${l.leadId}</b> — ${l.village} <span style="color:var(--muted)">(by ${leadCreatorName(l)})</span></span>
      <span class="badge badge-${info.type==='danger'?'danger':info.type==='warn'?'warn':'muted'}">${info.text} · ${fmtDate(l.nextCallDate)}</span></div>`;
  }).join('') || '<div class="empty">No upcoming calls scheduled</div>';

  const ageingList = ageingAlerts.slice(0,8).map(l=>{

// ---- Export helpers -------------------------------------------------------
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [headers.join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(','))).join('\n');
}
// ---- Generic row exporters (used by the Reports page) --------------------
function exportRowsExcel(rows, filename, sheetName){
  if(!rows.length){ alert('Nothing to export.'); return; }
  if(typeof XLSX !== 'undefined'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName||'Sheet1');
    XLSX.writeFile(wb, filename);
  } else {
    downloadBlob(toCSV(rows), filename.replace(/\.xlsx$/,'.csv'), 'text/csv;charset=utf-8;');
    alert('The Excel library did not load (likely offline) — downloaded a CSV instead, which opens fine in Excel.');
  }
}
function exportRowsPDF(rows, filename, title){
  if(!rows.length){ alert('Nothing to export.'); return; }
  const columns = Object.keys(rows[0]);
  if(typeof window.jspdf !== 'undefined'){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(14); doc.text(title, 14, 16);
    doc.setFontSize(9); doc.setTextColor(120); doc.text(new Date().toLocaleString('en-IN'), 14, 22); doc.setTextColor(0);
    doc.autoTable({ startY:28, head:[columns], body: rows.map(r=>columns.map(c=>r[c])), styles:{fontSize:8}, headStyles:{fillColor:[27,42,74]} });
    doc.save(filename);
  } else {
    alert("The PDF library did not load (likely offline) — using your browser's Print dialog instead. Choose \"Save as PDF\" as the destination.");
    window.print();
  }
}

// Distinct from Reports above: Reports exports raw per-record rows (one line
// per lead/payment/registration); this page is aggregated KPIs — per-
// Executive and per-source/per-Channel-Partner performance, stage aging,
// and a company-wide financial rollup. Same visibleLeads()/visibleExecutives()/
// visibleChannelPartners() scoping as everywhere else, so a Manager's
// numbers are their own branch's, never company-wide.
function executivePerformanceRows(){
  // Grouped by LEAD OWNER — the person who created the lead (Sara: the
  // creator is the lead owner, not whoever it's currently assigned to).
  // "Currently Assigned" shows how many leads are sitting with them now.
  const all = visibleLeads();
  return visibleExecutives().map(e=>{
    const leads = all.filter(l=>leadCreatorName(l)===e.name);
    const assignedNow = all.filter(l=>l.assignedExecutive===e.name && isActive(l)).length;
    const acquired = leads.filter(l=>l.outcome==='acquired');
    const dropped = leads.filter(l=>l.outcome==='dropped').length;
    const activeCount = leads.length - acquired.length - dropped;
    const overdue = leads.filter(l=>isActive(l) && isOverdueStage(l)).length;
    const closeDurations = acquired.filter(l=>l.finalDate).map(l=>daysBetween(new Date(l.createdAt), new Date(l.finalDate)));
    const avgDaysToClose = closeDurations.length ? Math.round(closeDurations.reduce((s,d)=>s+d,0)/closeDurations.length) : null;
    return {
      'Lead Owner': e.name, 'Leads Owned': leads.length, Active: activeCount, Acquired: acquired.length, Dropped: dropped,
      'Conversion %': leads.length ? Number((acquired.length/leads.length*100).toFixed(1)) : 0,
      'Avg Days to Close': avgDaysToClose!=null ? avgDaysToClose : '—',
      'Overdue (Past SLA)': overdue,
      'Currently Assigned (Active)': assignedNow,
    };
  });
}
function sourcePerformanceRows(){
  const sources = DB.getMasters('leadSources');
  return sources.map(s=>{
    const leads = visibleLeads().filter(l=>l.leadSource===s.label);
    const acquired = leads.filter(l=>l.outcome==='acquired').length;
    return {
      Source: s.label, 'Total Leads': leads.length, Acquired: acquired,
      'Conversion %': leads.length ? Number((acquired/leads.length*100).toFixed(1)) : 0,
    };

}
function channelPartnerPerformanceRows(){
  return visibleChannelPartners().map(c=>{

// Current dwell time, not a historical average across every lead that ever
// passed through a stage (stageHistory doesn't retain a per-visit exit
// timestamp for a stage a lead has since left) — same live-snapshot spirit
// as the Dashboard's own Ageing Alerts, just rolled up per stage instead of
// listed per lead.
function stageAgingRows(){
  const leads = visibleLeads().filter(isActive);
  return STAGES.filter(s=>s.key!=='closed').map(s=>{
    const inStage = leads.filter(l=>l.stage===s.key);
    const days = inStage.map(daysInStage);
    const avgDays = days.length ? Math.round(days.reduce((a,b)=>a+b,0)/days.length) : 0;
    const overdue = inStage.filter(isOverdueStage).length;
    return { Stage: s.label, 'Leads Currently In Stage': inStage.length, 'SLA (days)': s.sla!=null?s.sla:'—', 'Avg Days In Stage': days.length?avgDays:'—', 'Overdue (Past SLA)': overdue };
  });
}
// A single company/branch-wide financial rollup — kept as Metric/Value pairs
// (rather than one-row-per-lead like the other sections) since these are
// aggregate totals, not per-entity comparisons. Pipeline Value is the
// QUOTED value of everything still open (leadValue()); Acquired Value uses
// the actual closing rate (leadFinalValue()) rather than the original ask;
// Collected/Outstanding are summed straight from every visible lead's own
// paymentSummary() — never re-derived or stored separately, same
// "read live from the existing per-lead logs" discipline as Project-wise
// Summary on the Reports page.
function financialSummaryRows(){
  const leads = visibleLeads();
  const pipelineValue = leads.filter(isActive).reduce((s,l)=> s + leadValue(l), 0);
  const acquiredLeads = leads.filter(l=>l.outcome==='acquired');
  const acquiredValue = acquiredLeads.reduce((s,l)=> s + (leadFinalValue(l)||0), 0);
  // Landowner payments (Landowners page: Total Payment / Paid Till Date).
  const owners = DB.getLandowners ? DB.getLandowners() : [];
  const totalCommitted = owners.reduce((s,o)=> s + (Number(o.totalPayment)||0), 0);
  const totalCollected = owners.reduce((s,o)=> s + (Number(o.paidTillDate)||0), 0);
  const totalOutstanding = Math.max(0, totalCommitted - totalCollected);
  return [
    { Metric:'Pipeline Value (open leads, quoted)', Value: Number(pipelineValue.toFixed(2)) },
    { Metric:'Acquired Value (closing rate, '+acquiredLeads.length+' lead(s))', Value: Number(acquiredValue.toFixed(2)) },
    { Metric:'Landowner Payments — Total Payment', Value: Number(totalCommitted.toFixed(2)) },
    { Metric:'Landowner Payments — Paid Till Date', Value: Number(totalCollected.toFixed(2)) },
    { Metric:'Landowner Payments — Balance', Value: Number(totalOutstanding.toFixed(2)) },
  ];
}

// ---- MASTERS -------------------------------------------------------------
// Plain reference-data masters (lead sources, channel partners, villages,
// land classes, drop/hold reasons). Manage Users, Workflow Config and
// Status Config are their own standalone nav modules below, not tucked
// into this dropdown — simpler to find and less to scroll past.
// Auto-generates the next code for a master whose def declares `autoCode`
// (currently just Channel Partners, prefix 'CP') — scans every existing
// entry (active and inactive, so a deactivated/legacy one still reserves
// its number) for the highest "<prefix>-<number>" match and returns the
// next one, zero-padded to 3 digits (CP-007, CP-008, ... CP-999, CP-1000).
function nextMasterCode(prefix, items){
  const re = new RegExp('^' + prefix + '-(\\d+)$');
  const maxNum = (items||[]).reduce((max, it) => {
    const m = re.exec(String(it.code||'').trim());
    return m ? Math.max(max, parseInt(m[1], 10)) : max;
  }, 0);
  return prefix + '-' + String(maxNum + 1).padStart(3, '0');
}
function renderMasters(){
  // Channel Partners moved out to its own standalone page (Sara: "like a
  // single page not in masters" — see renderChannelPartnersView()) — it's
  // no longer offered in this page's "Master Table" dropdown below. It
  // stays in MASTER_DEFS itself, though (the DB layer, Configure page, and
  // Audit Trail labeling all still key off that array), so if stale state
  // ever leaves currentMasterKey pointed at it, fall back to the first
  // selectable master instead of rendering a dead end.
  const selectableDefs = MASTER_DEFS.filter(m=>m.key!=='channelPartners');
  const def = selectableDefs.find(m=>m.key===currentMasterKey) || selectableDefs[0];
  const items = DB.getAllMasters(def.key);
  const rows = items.map(it=>`<tr>
      ${def.fields.map(f=>`<td>${it[f]!=null && it[f]!=='' ? it[f] : '—'}</td>`).join('')}
      <td>${it.active!==false ? '<span class="badge badge-ok">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</td>
      <td class="master-actions">
        <button class="icon-btn icon-ok" data-toggle="${it.id}" title="${it.active!==false?'Deactivate':'Activate'}">${it.active!==false?'✓':'○'}</button>
        <button class="icon-btn icon-edit" data-edit="${it.id}" title="Edit">✎</button>
        <button class="icon-btn icon-del" data-delete="${it.id}" title="Delete permanently">🗑</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="${def.fields.length+2}" class="empty">No entries yet.</td></tr>`;

  const editing = editingMasterId ? items.find(i=>i.id===editingMasterId) : null;
  const singular = def.label.replace(/ies$/,'y').replace(/s$/,'');

  return `
    <div class="page-header"><h1>Masters</h1></div>
    <div class="card filter-panel">
      <div class="form-grid">
        <div><label>Master Table</label><select id="master-select">
          ${selectableDefs.map(m=>`<option value="${m.key}" ${m.key===def.key?'selected':''}>${m.label}</option>`).join('')}
        </select></div>
      </div>
      <div class="filter-actions"><button class="btn btn-sm btn-teal" id="master-go">Go</button></div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr>${def.fields.map(f=>`<th>${FIELD_LABELS[f]||f}</th>`).join('')}<th>Status</th><th>Actions</th></tr>
        ${rows}
      </table>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">${editing?('Edit '+singular):('Add '+singular)}</h2>
      <div class="form-grid">
        ${def.fields.map(f=>{
          if(def.autoCode && f==='code'){
            // Generated, never typed — shown read-only so it's still visible
            // on the form. Editing an existing entry keeps ITS code as-is
            // (never regenerated out from under it); adding a new one shows
            // the next code it'll get once saved.
            const codeVal = editing ? (editing.code||'') : nextMasterCode(def.autoCode, items);
            return `<div><label>${FIELD_LABELS[f]||f}</label><input type="text" id="mf-${f}" value="${codeVal}" disabled title="Generated automatically — not editable"></div>`;
          }
          const req = (f===def.fields[0]) || (def.autoCode && f==='name') || ((def.key==='channelPartners' || def.key==='mediators') && f==='phone');
          return `<div><label>${FIELD_LABELS[f]||f}${req?REQ:''}</label><input type="${f==='commissionPct'?'number':'text'}" id="mf-${f}" ${f==='commissionPct'?'step="0.01"':''} ${f==='phone'?PHONE_ATTRS:''} value="${editing && editing[f]!=null ? editing[f] : ''}"></div>`;
        }).join('')}
      </div>
      ${def.autoCode ? `<p style="font-size:11.5px;color:var(--muted);margin-top:8px;">Code is generated automatically — ${editing ? 'it stays as it was assigned and can\'t be changed here.' : 'the next one is shown above and is applied when you click Add.'}</p>` : ''}
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-sm btn-teal" id="master-save">${editing?'Update':'Add'}</button>
        ${editing?'<button class="btn btn-sm btn-ghost" id="master-cancel">Cancel</button>':''}
      </div>
    </div>
  `;
}

function wireMastersEvents(){
  const sel = document.getElementById('master-select');
  const switchMaster = () => { currentMasterKey = sel.value; editingMasterId=null; render(); };
  const goBtn = document.getElementById('master-go');
  if(goBtn) goBtn.onclick = switchMaster;
  if(sel) sel.addEventListener('change', switchMaster);

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.edit; render(); });
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const it = DB.getAllMasters(currentMasterKey).find(x=>x.id===b.dataset.toggle);
    const wasActive = it && it.active!==false;
    await DB.toggleMaster(currentMasterKey, b.dataset.toggle);
    await logAudit(wasActive?'Deactivated':'Activated', def.label.replace(/ies$/,'y').replace(/s$/,''), it ? masterItemLabel(def, it) : '');
    render();
  });
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this entry permanently? This cannot be undone.')) return;
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const it = DB.getAllMasters(currentMasterKey).find(x=>x.id===b.dataset.delete);
    await DB.deleteMaster(currentMasterKey, b.dataset.delete);
    await logAudit('Deleted', def.label.replace(/ies$/,'y').replace(/s$/,''), it ? masterItemLabel(def, it) : '');
    if(editingMasterId===b.dataset.delete) editingMasterId=null;
    render();
  });
  const saveBtn = document.getElementById('master-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const def = MASTER_DEFS.find(m=>m.key===currentMasterKey);
    const fields = {};
    let ok = true;
    def.fields.forEach(f=>{
      const el = document.getElementById('mf-'+f);
      let v = el.value.trim();
      if(f==='commissionPct') v = v==='' ? null : parseFloat(v);
      if((f===def.fields[0] || (def.autoCode && f==='name')) && v==='' ) ok = false;
      fields[f] = v;
    });
    if(!ok){ alert('Please fill in the fields marked with a red *.'); return; }
    if(def.key==='mediators'){
      if(!fields.phone){ alert('Phone is required.'); return; }
      if(!isPhone10(fields.phone)){ phoneAlert('Phone'); return; }
    }
    const singular = def.label.replace(/ies$/,'y').replace(/s$/,'');
    if(editingMasterId){
      await DB.updateMaster(currentMasterKey, editingMasterId, fields);
      await logAudit('Updated', singular, masterItemLabel(def, fields));
      editingMasterId=null;
    } else {
      await DB.addMaster(currentMasterKey, fields);
      await logAudit('Added', singular, masterItemLabel(def, fields));
    }
    render();
  };
  const cancelBtn = document.getElementById('master-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

function openCPDetail(id){

  // access, not just via the row click — same belt-and-suspenders
  // precedent as openLeadDetail().
  if(!visibleAllChannelPartners().some(c=>c.id===id)){
    alert('This Channel Partner could not be found, or is outside what you can access.');
    return;
  }
  cpDetailId = id;
  editingCPId = null;
  linkingCPOwnerId = null;
  cpDetailLoading = true;

  // this cache live via DB.onChange() above) — this short, deliberate
  // pause is what "display a loading indicator while fetching the
  // details" asked for, not a real network wait.
  setTimeout(() => { cpDetailLoading = false; render(); }, 180);

// ---- MANAGE USERS (own module — was folded into Masters, now standalone) --
// Real accounts (Firebase Authentication when live) replace the old
// free-text "Executives" master. Each user has a role — see ROLES above —
// that governs which pages they can see and, for Executives, which leads.
// A Manager's "Reports To" offers Heads; an Executive's offers Managers;
// a Head (role 'admin') has no Reports To — they're the top of their branch.
// Org tree: anyone except Admin (sysadmin) can report to anyone else in
// the tree — never to themselves or to someone below them (that would make
// a loop).
function reportsToCandidates(role, editingUid){
  if(role==='sysadmin') return [];
  const below = editingUid ? subtreeUids(editingUid) : new Set();
  return DB.getAllUsers().filter(u => u.role!=='sysadmin' && u.active!==false && !below.has(u.uid));
}
function reportsToOptionsHtml(role, selectedUid, editingUid){
  const list = reportsToCandidates(role, editingUid);
  return `<option value="">— top of tree (reports to no one) —</option>` + list.map(u=>`<option value="${u.uid}" ${selectedUid===u.uid?'selected':''}>${u.name}${u.designation?' — '+u.designation:''} (${ROLE_LABELS[u.role]||u.role})</option>`).join('');
}
// Org chart — every top-of-tree person with their full reporting tree below.
function renderOrgChart(){
  const users = DB.getAllUsers().filter(u=>u.role!=='sysadmin');
  const byParent = {};
  users.forEach(u=>{ const p = (u.reportsTo && users.some(x=>x.uid===u.reportsTo)) ? u.reportsTo : '_root'; (byParent[p] = byParent[p]||[]).push(u); });
  const leadCount = name => (DB.getLeads()||[]).filter(l=>l.assignedExecutive===name && l.stage!=='closed').length;
  const seen = new Set();
  const node = u => {
    if(seen.has(u.uid)) return '';
    seen.add(u.uid);
    const kids = (byParent[u.uid]||[]).sort((a,b)=>a.name.localeCompare(b.name));
    return `<li><span class="org-node role-${u.role} ${u.active===false?'inactive':''}">
        <span class="nm">${u.name}</span>
        <span class="meta">${u.designation?u.designation+' · ':''}${ROLE_LABELS[u.role]||u.role} · ${leadCount(u.name)} open lead(s)${u.active===false?' · inactive':''}</span>
        <button class="icon-btn icon-edit" data-user-edit="${u.uid}" title="Edit">✎</button>
      </span>${kids.length ? `<ul>${kids.map(node).join('')}</ul>` : ''}</li>`;
  };
  const roots = (byParent['_root']||[]).sort((a,b)=> (a.role==='admin'?0:1)-(b.role==='admin'?0:1) || a.name.localeCompare(b.name));
  const html = roots.map(node).join('');
  const admins = DB.getAllUsers().filter(u=>u.role==='sysadmin');
  return `<ul class="org-tree">${html || '<li class="empty">No users yet.</li>'}</ul>
    ${admins.length ? `<p style="font-size:12px;color:var(--muted);margin-top:10px;">Outside the tree (Admin — system configuration only): ${admins.map(a=>a.name).join(', ')}</p>` : ''}`;
}

function wireUsersEvents(){
  document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick = () => { editingMasterId=b.dataset.userEdit; render(); });
  document.querySelectorAll('[data-user-toggle]').forEach(b=>b.onclick = async () => {
    const u = DB.getAllUsers().find(x=>x.uid===b.dataset.userToggle);
    const wasActive = u && u.active!==false;
    await DB.toggleUser(b.dataset.userToggle);
    await logAudit(wasActive?'Deactivated':'Activated', 'User', u ? u.name : '');
    render();
  });
  document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick = async () => {
    const extra = DB.isLive() ? ' Their sign-in account itself must be removed separately in the Firebase Console if you want it fully deleted.' : '';
    if(!confirm('Remove this user\'s access record?' + extra + ' This cannot be undone.')) return;
    const u = DB.getAllUsers().find(x=>x.uid===b.dataset.userDelete);
    await DB.deleteUser(b.dataset.userDelete);
    await logAudit('Deleted', 'User', u ? u.name : '');
    if(editingMasterId===b.dataset.userDelete) editingMasterId=null;
    render();
  });
  const roleSelect = document.getElementById('uf-role');
  if(roleSelect) roleSelect.onchange = () => {
    const role = roleSelect.value;
    const wrap = document.getElementById('uf-reports-to-wrap');
    const sel = document.getElementById('uf-reports-to');
    if(role==='sysadmin'){
      wrap.style.display = 'none';
    } else {
      wrap.style.display = '';
      sel.innerHTML = reportsToOptionsHtml(role, sel.value, editingMasterId||'');
    }
  };
  const saveBtn = document.getElementById('user-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const name = document.getElementById('uf-name').value.trim();
    const email = document.getElementById('uf-email').value.trim();
    const phone = document.getElementById('uf-phone').value.trim();
    const role = document.getElementById('uf-role').value;
    const reportsTo = role==='sysadmin' ? '' : (document.getElementById('uf-reports-to')?.value || '');
    const designation = (document.getElementById('uf-designation')?.value || '').trim();
    if(editingMasterId && reportsTo && subtreeUids(editingMasterId).has(reportsTo)){ alert('That would create a loop — someone cannot report to a person below them.'); return; }
    if(!name){ alert('Name is required.'); return; }
    if(phone && !isPhone10(phone)){ phoneAlert('Phone'); return; }
    if(editingMasterId){
      const newPassword = document.getElementById('uf-password').value;
      if(newPassword && newPassword.length < 6){ alert('New password must be at least 6 characters, or leave it blank to keep the current one.'); return; }
      try{
        await DB.updateUser(editingMasterId, { name, phone, role, reportsTo, designation });
        await logAudit('Updated', 'User', name, newPassword ? 'Profile updated; password also changed.' : 'Profile updated.');
        if(newPassword) await DB.changeUserPassword(editingMasterId, newPassword);
      }catch(err){
        alert('Saved the profile, but could not change the password: ' + ((err && err.message) || err));
        editingMasterId = null;
        render();
        return;
      }
      editingMasterId = null;
    } else {
      const password = document.getElementById('uf-password').value;
      if(!email){ alert('Email is required.'); return; }
      if(!password || password.length < 6){ alert('Password must be at least 6 characters.'); return; }
      try{
        const created = await DB.createUser({ name, email, phone, role, password, reportsTo });
        if(designation && created && created.uid) await DB.updateUser(created.uid, { designation });
        await logAudit('Added', 'User', name, 'Role: ' + (ROLE_LABELS[role]||role));
      }catch(err){
        alert('Could not create user: ' + friendlyAuthError(err));
        return;
      }
    }
    render();
  };
  const cancelBtn = document.getElementById('user-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingMasterId=null; render(); };
}

      <table>
        <tr><th>Code</th><th>Full Name</th><th>Contact</th><th>Village</th><th>District</th><th style="text-align:right;">Total Payment</th><th style="text-align:right;">Paid Till Date</th><th style="text-align:right;">Balance</th><th>Status</th><th>Actions</th></tr>
        ${rows}

    <div class="card">
      <h2 class="section-title" style="margin-top:0;">${editing?'Edit Landowner':'Add Landowner'}</h2>
      <div class="form-grid">

        <div><label>Alternate Contact Number</label><input type="text" id="lo-alt-contact" ${PHONE_ATTRS} value="${editing?(editing.altContactNumber||''):''}"></div>
        <div><label>Email</label><input type="email" id="lo-email" value="${editing?(editing.email||''):''}"></div>
        <div><label>District</label><input type="text" id="lo-district" value="${editing?(editing.district||''):''}"></div>
        <div><label>Taluk</label><input type="text" id="lo-taluk" value="${editing?(editing.taluk||''):''}"></div>
        <div><label>Village</label><input type="text" id="lo-village" value="${editing?(editing.village||''):''}"></div>
        <div><label>Total Payment (₹)</label><input type="number" id="lo-total-pay" step="0.01" min="0" value="${editing&&editing.totalPayment!=null?editing.totalPayment:''}"></div>
        <div><label>Paid Till Date (₹)</label><input type="number" id="lo-paid" step="0.01" min="0" value="${editing&&editing.paidTillDate!=null?editing.paidTillDate:''}"></div>
        <div><label>Balance (₹)</label><input type="text" id="lo-balance" disabled value=""></div>
        <div><label>Preferred Communication</label><select id="lo-pref">${PREFERRED_CONTACT_METHODS.map(m=>`<option value="${m}" ${editing&&editing.preferredContact===m?'selected':''}>${m}</option>`).join('')}</select></div>
        <div><label>ID Document Reference</label><input type="text" id="lo-iddoc" value="${editing?(editing.idDocRef||''):''}" placeholder="e.g. Aadhaar/Passport reference"></div>

}

function wireLandownersEvents(){
  const tp = document.getElementById('lo-total-pay'), pd = document.getElementById('lo-paid'), bal = document.getElementById('lo-balance');
  const syncBal = () => { if(!bal) return; const t = parseFloat(tp.value), p = parseFloat(pd.value); bal.value = isNaN(t) ? '' : fmtINR(t - (isNaN(p)?0:p)); };
  if(tp && pd){ tp.addEventListener('input', syncBal); pd.addEventListener('input', syncBal); syncBal(); }
  document.querySelectorAll('[data-lo-edit],[data-lo-open]').forEach(b=>b.onclick = () => { editingLandownerId = b.dataset.loEdit || b.dataset.loOpen; render(); });
  document.querySelectorAll('[data-lo-toggle]').forEach(b=>b.onclick = async () => { await DB.toggleLandowner(b.dataset.loToggle); render(); });
  document.querySelectorAll('[data-lo-delete]').forEach(b=>b.onclick = async () => {
    if(!confirm('Delete this landowner permanently? This cannot be undone.')) return;
    await DB.deleteLandowner(b.dataset.loDelete);
    if(editingLandownerId===b.dataset.loDelete) editingLandownerId=null;
    render();
  });
  const saveBtn = document.getElementById('lo-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const fields = {
      landownerCode: document.getElementById('lo-code').value,
      fullName: document.getElementById('lo-name').value.trim(),
      contactNumber: document.getElementById('lo-contact').value.trim(),
      altContactNumber: document.getElementById('lo-alt-contact').value.trim(),
      email: document.getElementById('lo-email').value.trim(),
      district: document.getElementById('lo-district').value.trim(),
      taluk: document.getElementById('lo-taluk').value.trim(),
      village: document.getElementById('lo-village').value.trim(),
      preferredContact: document.getElementById('lo-pref').value,
      idDocRef: document.getElementById('lo-iddoc').value.trim(),
      address: document.getElementById('lo-address').value.trim(),
      notes: document.getElementById('lo-notes').value.trim(),
      totalPayment: (v => isNaN(v) ? null : v)(parseFloat(document.getElementById('lo-total-pay').value)),
      paidTillDate: (v => isNaN(v) ? null : v)(parseFloat(document.getElementById('lo-paid').value)),
    };
    if(fields.totalPayment!=null && fields.paidTillDate!=null && fields.paidTillDate > fields.totalPayment){
      if(!confirm('Paid Till Date is more than the Total Payment. Save anyway?')) return;
    }
    if(!fields.fullName){ alert('Full Name is required.'); return; }
    if(!fields.contactNumber){ alert('Contact Number is required.'); return; }
    const bpLo = badPhone([['Contact Number', fields.contactNumber], ['Alternate Contact Number', fields.altContactNumber]]);
    if(bpLo){ phoneAlert(bpLo); return; }
    const dupes = findDuplicateLandowners(fields, editingLandownerId);
    if(dupes.length){
      const list = dupes.map(d=>`${d.fullName} (${d.contactNumber||'no phone'}, ${d.village||'no village'})`).join('; ');
      if(!confirm('This looks like it might be a duplicate of an existing landowner: ' + list + '. Save it anyway as a separate record?')) return;
    }
    if(editingLandownerId){ await DB.updateLandowner(editingLandownerId, fields); editingLandownerId=null; }
    else { await DB.addLandowner(fields); }
    render();
  };
  const cancelBtn = document.getElementById('lo-cancel');
  if(cancelBtn) cancelBtn.onclick = () => { editingLandownerId=null; render(); };
}

// ---- WORKFLOW CONFIG (own module) -----------------------------------------
// Which role must approve a specific From Status -> To Status transition.
// Each gate applies only to that exact pair and direction — moving forward
// into a stage and moving back out of it are configured (and approved)
// separately. Only pairs one pipeline step apart are offered, since those
// are the only moves the app's Move-to/Move-back actions can perform. Pairs
// with no gate can be moved by anyone with edit access. Edits here are a
// local draft — nothing is saved until "Save Workflow Config" is clicked.
// Role-wise mapping table — same shape as the "Entity Wise Role And Status
// Mapping" reference: Delete | Application Role | From Status | To Status,
// with an "Add New" row and multiple rows allowed per From/To pair (one per
// role permitted to perform that move) or per role (branching to several
// To statuses from the same From status).
let workflowDraftRows = null;
function workflowDraft(){
  if(!workflowDraftRows) workflowDraftRows = WORKFLOW_CONFIG.map(w=>Object.assign({}, w));
  return workflowDraftRows;
}
// "Application Role", "From Status" and "To Status" are three independent
// selects in the Add New row (matching the reference layout), with To's
// options depending on whichever From is currently picked. All three
// re-render the whole view on change (so To can recompute) — which would
// otherwise reset the other two back to their defaults, so all three
// selections are held here and restored as the `selected` option on every
// render, not left to the DOM to remember on its own.
let workflowAddRole = null;
let workflowAddFrom = null;
let workflowAddTo = null;
function renderWorkflowView(){
  const draft = workflowDraft();
  // Any status can be a From, and any OTHER status can be its To — no
  // adjacency restriction (matches the reference: e.g. "To be inspected"
  // branching straight to "Drop Land" or "Finalised", not just next-in-line).
  const fromOptions = STAGE_KEYS.slice();
  if(!workflowAddFrom || !fromOptions.includes(workflowAddFrom)) workflowAddFrom = fromOptions[0];
  if(!workflowAddRole || !ROLES.includes(workflowAddRole)) workflowAddRole = ROLES[0];
  const toOptions = STAGE_KEYS.filter(k=>k!==workflowAddFrom);
  if(!workflowAddTo || !toOptions.includes(workflowAddTo)) workflowAddTo = toOptions[0];
  const rows = draft.map((w,i)=>`<tr>
      <td><button class="btn btn-sm btn-ghost" data-wf-remove="${i}" title="Delete">🗑</button></td>
      <td><select id="wf-role-${i}">${ROLES.map(r=>`<option value="${r}" ${w.role===r?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></td>
      <td>${stageLabel(w.from)}</td>
      <td>${stageLabel(w.to)}</td>
    </tr>`).join('');
  return `
    <div class="page-header"><h1>Workflow Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Role-wise From Status → To Status mapping — pick any From and any To status, including non-adjacent jumps. Each row grants one role permission to perform one specific move (see a lead's Stage &amp; Actions section on its Lead Details page): the immediate next/back stage stays available to everyone by default unless gated here, while any OTHER mapping shows up as an extra "Move to" option gated to just the role(s) listed. Head can always approve any move regardless of what's configured here.</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table><tr><th></th><th>Application Role</th><th>From Status</th><th>To Status</th></tr>${rows || '<tr><td colspan="4" style="color:var(--muted);padding:14px;">No mappings configured — anyone with edit access can move a lead to any adjacent stage.</td></tr>'}</table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>Application Role</label><select id="wf-add-role">${ROLES.map(r=>`<option value="${r}" ${r===workflowAddRole?'selected':''}>${ROLE_LABELS[r]}</option>`).join('')}</select></div>
      <div><label>From Status</label><select id="wf-add-from">${fromOptions.map(f=>`<option value="${f}" ${f===workflowAddFrom?'selected':''}>${stageLabel(f)}</option>`).join('')}</select></div>
      <div><label>To Status</label><select id="wf-add-to">${toOptions.map(t=>`<option value="${t}" ${t===workflowAddTo?'selected':''}>${stageLabel(t)}</option>`).join('')}</select></div>
      <button class="btn btn-sm btn-teal" id="wf-add-btn">+ Add New</button>
    </div>
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="workflow-save">Update</button></div>
  `;
}

function wireWorkflowEvents(){
  document.querySelectorAll('[data-wf-remove]').forEach(b=>b.onclick = () => {
    workflowDraft().splice(parseInt(b.dataset.wfRemove, 10), 1);
    render();
  });
  const roleSel = document.getElementById('wf-add-role');
  if(roleSel) roleSel.onchange = () => { workflowAddRole = roleSel.value; render(); };
  const fromSel = document.getElementById('wf-add-from');
  if(fromSel) fromSel.onchange = () => {
    workflowAddFrom = fromSel.value;
    workflowAddTo = null; // stale for the new From — renderWorkflowView() picks a fresh default
    render(); // re-render so "To Status" recomputes its options for the new From
  };
  const toSel = document.getElementById('wf-add-to');
  if(toSel) toSel.onchange = () => { workflowAddTo = toSel.value; render(); };
  const addBtn = document.getElementById('wf-add-btn');
  if(addBtn) addBtn.onclick = () => {
    const from = document.getElementById('wf-add-from').value;
    const to = document.getElementById('wf-add-to').value;
    const role = document.getElementById('wf-add-role').value;
    const draft = workflowDraft();
    if(draft.some(w=>w.from===from && w.to===to && w.role===role)){
      alert(ROLE_LABELS[role] + ' already has a mapping for ' + stageLabel(from) + ' → ' + stageLabel(to) + '.');
      return;
    }
    draft.push({ from, to, label: defaultGateLabel(from, to), role });
    render();
  };
  const saveBtn = document.getElementById('workflow-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const rows = workflowDraft().map((w,i)=>({
      from: w.from, to: w.to, label: w.label, role: document.getElementById('wf-role-'+i).value,
    }));
    await DB.saveWorkflow(rows);
    await logAudit('Saved', 'Workflow Config', '', rows.length + ' mapping(s) saved.');
    workflowDraftRows = null;
    refreshWorkflowFromDB();
    render();
  };
}

// ---- STATUS CONFIG (own module) --------------------------------------------
// New (the starting stage for every lead) and Closed (terminal — unlocks
// Final Price/Date, blocks back-navigation) stay pinned first/last since
// other code refers to those two keys specifically. Everything between them
// can be renamed, added, removed and reordered. Changes are staged in a
// draft (mirroring the Workflow Config editor) and only take effect on Save.
let statusDraftRows = null;
function statusDraft(){
  if(!statusDraftRows) statusDraftRows = STAGES.map(s=>Object.assign({}, s));
  return statusDraftRows;
}
function renderStatusConfigView(){
  const draft = statusDraft();
  const rows = draft.map((s,i)=>{
    const pinned = i===0 || i===draft.length-1; // New (first) / Closed (last)
    return `<tr>
      <td>${s.key}</td>
      <td><input type="text" id="stg-label-${i}" value="${s.label}"></td>
      <td><input type="number" id="stg-sla-${i}" value="${s.sla==null?'':s.sla}" placeholder="none" style="max-width:100px;"></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm btn-ghost" data-stg-up="${i}" ${i<=1?'disabled':''} title="Move up">↑</button>
        <button class="btn btn-sm btn-ghost" data-stg-down="${i}" ${i>=draft.length-2?'disabled':''} title="Move down">↓</button>
      </td>
      <td>${pinned ? '' : `<button class="btn btn-sm btn-ghost" data-stg-remove="${i}">Remove</button>`}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-header"><h1>Status Config</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-4px;">Rename any stage, adjust its SLA, add new stages, remove ones you don't need, or reorder them. "New" always stays the first stage and "Closed" always stays the last (the workflow rules and every lead's history rely on those two).</p>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <table>
        <tr><th>Key</th><th>Label</th><th>SLA (days)</th><th>Reorder</th><th></th></tr>
        ${rows}
      </table>
    </div>
    <div class="card" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;">
      <div><label>New Status Label</label><input type="text" id="stg-new-label" placeholder="e.g. Site Re-Visit"></div>
      <button class="btn btn-sm btn-teal" id="stg-add-btn">+ Add Status</button>
      <span style="font-size:12px;color:var(--muted);">Inserted just before Closed.</span>
    </div>
    ${PROCESS_STATUSES.some(p=>!draft.some(s=>s.key===p.key)) ? `
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;">
      <span style="font-size:12.5px;">Add the standard process statuses that are missing here: <b>${PROCESS_STATUSES.filter(p=>!draft.some(s=>s.key===p.key)).map(p=>p.label).join(', ')}</b></span>
      <button class="btn btn-sm btn-ghost" id="stg-add-process">+ Add standard process statuses</button>
    </div>` : ''}
    <div style="margin-top:12px;"><button class="btn btn-sm btn-teal" id="stages-save">Save Status Config</button></div>
  `;
}

function wireStatusConfigEvents(){
  document.querySelectorAll('[data-stg-remove]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgRemove, 10);
    const draft = statusDraft();
    const key = draft[i].key;
    const inUse = (DB.getLeads()||[]).some(l=>l.stage===key);
    if(inUse){ alert('Some leads are currently in "' + draft[i].label + '". Move those leads to another stage before removing it.'); return; }
    if(!confirm('Remove the "' + draft[i].label + '" status? This can\'t be undone.')) return;
    draft.splice(i, 1);
    render();
  });
  document.querySelectorAll('[data-stg-up]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgUp, 10);
    if(i<=1) return;
    const draft = statusDraft();
    [draft[i-1], draft[i]] = [draft[i], draft[i-1]];
    render();
  });
  document.querySelectorAll('[data-stg-down]').forEach(b=>b.onclick = () => {
    const i = parseInt(b.dataset.stgDown, 10);
    const draft = statusDraft();
    if(i>=draft.length-2) return;
    [draft[i+1], draft[i]] = [draft[i], draft[i+1]];
    render();
  });
  const addBtn = document.getElementById('stg-add-btn');
  if(addBtn) addBtn.onclick = () => {
    const label = (document.getElementById('stg-new-label').value || '').trim();
    if(!label){ alert('Enter a label for the new status.'); return; }
    const draft = statusDraft();
    const key = slugifyStageKey(label, draft.map(s=>s.key));
    draft.splice(draft.length-1, 0, { key, label, sla: null }); // just before Closed
    render();
  };
  const procBtn = document.getElementById('stg-add-process');
  if(procBtn) procBtn.onclick = () => {
    const draft = statusDraft();
    PROCESS_STATUSES.forEach(p=>{
      if(draft.some(s=>s.key===p.key)) return;
      const afterIdx = draft.findIndex(s=>s.key===p.after);
      const at = (afterIdx>=0 && afterIdx < draft.length-1) ? afterIdx+1 : draft.length-1; // never after Closed
      draft.splice(at, 0, { key:p.key, label:p.label, sla:p.sla });
    });
    render();
  };
  const saveBtn = document.getElementById('stages-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const draft = statusDraft();
    const rows = draft.map((s,i)=>({
      key: s.key,
      label: (document.getElementById('stg-label-'+i).value || s.label).trim(),
      sla: document.getElementById('stg-sla-'+i).value === '' ? null : parseInt(document.getElementById('stg-sla-'+i).value,10),
    }));
    await DB.saveStages(rows);
    await logAudit('Saved', 'Status Config', '', rows.length + ' stage(s) saved.');
    statusDraftRows = null;
    refreshStagesFromDB();
    refreshWorkflowFromDB(); // drop any gates whose pair no longer exists
    render();
  };
}

// ---- PAGE ACCESS (own module) ----------------------------------------------
// One shared, per-role checklist of which pages/nav items each role can
// open — this is a separate, independent layer from the Executive->Manager->
// Head lead-visibility tree (see visibleLeads()/reportsToCandidates() above):
// Page Access decides which PAGES a role can see; "Reports To" still decides
// which LEADS a Manager/Head sees once they're on a lead page. Edits here
// are a local draft — nothing is saved until "Save Page Access" is clicked,
// same pattern as Workflow/Status Config. Head's ('admin') checkboxes are
// always checked and disabled so Head can never accidentally lock itself
// out of Page Access (or anything else) — mirrors the "Head always allowed"
// rule already used for Workflow Config gates.
let pageAccessDraftRows = null;
function pageAccessDraft(){
  if(!pageAccessDraftRows){
    pageAccessDraftRows = KNOWN_VIEWS.map(view => ({
      view,
      roles: (VIEW_ACCESS[view] || DEFAULT_VIEW_ACCESS[view] || []).slice(),
    }));
  }
  return pageAccessDraftRows;
}
// Per-user overrides sit below the per-role grid: pick one person, tick/
// untick specific pages for them alone, on top of whatever their role
// defaults to above. Same local-draft-then-Save pattern; the draft resets
// whenever the selected user changes (see wirePageAccessEvents()'s
// pa-user-select handler and the sidebar-nav reset near wireSidebarNav()).
// Head ('admin') accounts are excluded from the user dropdown entirely —
// they already always have full access (see canAccessView()) and can't be
// overridden.
let pageAccessSelectedUserUid = '';
let userOverrideDraftRows = null;
function userOverrideDraft(uidVal){
  if(!userOverrideDraftRows){
    const user = userByUid(uidVal);
    const overrides = USER_PAGE_OVERRIDES[uidVal] || {};
    userOverrideDraftRows = KNOWN_VIEWS.map(view => ({
      view,
      allowed: Object.prototype.hasOwnProperty.call(overrides, view)
        ? overrides[view]
        : !!(user && VIEW_ACCESS[view] && VIEW_ACCESS[view].includes(user.role)),
    }));
  }
  return userOverrideDraftRows;
}
function renderPageAccessView(){
  const draft = pageAccessDraft();
  const rows = draft.map((r,i)=>`<tr>
      <td>${PAGE_TITLES[r.view] || r.view}</td>
      ${ROLES.map(role=>`<td style="text-align:center;">
        <input type="checkbox" data-pa-idx="${i}" data-pa-role="${role}" ${r.roles.includes(role) ? 'checked' : ''} ${role==='admin' ? 'disabled title="Head always has access"' : ''}>
      </td>`).join('')}
    </tr>`).join('');

  const nonHeadUsers = (DB.getUsers()||[]).filter(u=>u.role!=='admin');
  const selUser = pageAccessSelectedUserUid ? userByUid(pageAccessSelectedUserUid) : null;
  let userTableHtml = '';
  if(selUser){
    const oDraft = userOverrideDraft(selUser.uid);
    const overrides = USER_PAGE_OVERRIDES[selUser.uid] || {};
    const userRows = oDraft.map((r,i)=>{
      const isOverridden = Object.prototype.hasOwnProperty.call(overrides, r.view);
      const roleDefault = !!(VIEW_ACCESS[r.view] && VIEW_ACCESS[r.view].includes(selUser.role));
      const status = isOverridden
        ? `Overridden: ${r.allowed ? 'allowed' : 'blocked'}`
        : `Default for ${ROLE_LABELS[selUser.role]} (${roleDefault ? 'allowed' : 'blocked'})`;
      return `<tr>
          <td>${PAGE_TITLES[r.view] || r.view}</td>
          <td style="text-align:center;"><input type="checkbox" data-pu-idx="${i}" ${r.allowed ? 'checked' : ''}></td>
          <td style="font-size:12px;color:var(--muted);">${status}</td>
        </tr>`;
    }).join('');
    userTableHtml = `
      <div style="overflow-x:auto;margin-top:10px;">
        <table><tr><th>Page</th><th>Allowed</th><th>Status</th></tr>${userRows}</table>
      </div>

        <select id="pa-user-select">
          <option value="">— select a user —</option>
          ${nonHeadUsers.map(u=>`<option value="${u.uid}" ${u.uid===pageAccessSelectedUserUid ? 'selected' : ''}>${u.name} (${ROLE_LABELS[u.role]})</option>`).join('')}
        </select>
      </label>
      ${userTableHtml}
    </div>
  `;
}
function wirePageAccessEvents(){
  document.querySelectorAll('[data-pa-idx]').forEach(cb=>cb.addEventListener('change', () => {
    const i = parseInt(cb.dataset.paIdx, 10);
    const role = cb.dataset.paRole;
    const draft = pageAccessDraft();
    const set = new Set(draft[i].roles);
    if(cb.checked) set.add(role); else set.delete(role);
    set.add('admin'); // Head can never be unchecked, even by tampering with the DOM
    draft[i].roles = Array.from(set);
  }));
  const saveBtn = document.getElementById('page-access-save');
  if(saveBtn) saveBtn.onclick = async () => {
    const rows = pageAccessDraft().map(r=>({ view:r.view, roles:r.roles.slice() }));
    await DB.savePageAccess(rows);
    await logAudit('Saved', 'Page Access', '', 'Role-level page access grid saved.');
    pageAccessDraftRows = null;
    refreshViewAccessFromDB();
    applyRoleVisibility();
    render();
  };

  const userSelect = document.getElementById('pa-user-select');
  if(userSelect) userSelect.onchange = () => {
    pageAccessSelectedUserUid = userSelect.value;
    userOverrideDraftRows = null;
    render();
  };

  document.querySelectorAll('[data-pu-idx]').forEach(cb=>cb.addEventListener('change', () => {
    const i = parseInt(cb.dataset.puIdx, 10);
    const draft = userOverrideDraft(pageAccessSelectedUserUid);
    draft[i].allowed = cb.checked;
  }));

  const userSaveBtn = document.getElementById('page-access-user-save');
  if(userSaveBtn) userSaveBtn.onclick = async () => {
    const uidSel = pageAccessSelectedUserUid;
    const user = userByUid(uidSel);
    if(!user) return;
    const draft = userOverrideDraft(uidSel);
    // Diff each checkbox against that user's live role default at save
    // time — only the pages that actually differ get stored as override
    // rows, so a checkbox that happens to match the role default self-
    // cleans instead of piling up as a redundant stored row.
    const diffRows = draft
      .filter(r => r.allowed !== !!(VIEW_ACCESS[r.view] && VIEW_ACCESS[r.view].includes(user.role)))
      .map(r => ({ uid: uidSel, view: r.view, allowed: r.allowed }));
    const existing = (DB.getUserPageAccess()||[]).filter(r=>r.uid!==uidSel);
    await DB.saveUserPageAccess(existing.concat(diffRows));
    await logAudit('Saved', 'Page Access', 'Per-user override: ' + user.name, diffRows.length + ' page(s) overridden.');
    userOverrideDraftRows = null;
    refreshUserPageOverridesFromDB();
    applyRoleVisibility();
    render();
  };

  const userClearBtn = document.getElementById('page-access-user-clear');
  if(userClearBtn) userClearBtn.onclick = async () => {
    const uidSel = pageAccessSelectedUserUid;
    const user = userByUid(uidSel);
    if(!confirm(`Clear all page-access overrides for ${user ? user.name : 'this user'}? They will go back to their role's default access.`)) return;
    const existing = (DB.getUserPageAccess()||[]).filter(r=>r.uid!==uidSel);
    await DB.saveUserPageAccess(existing);
    await logAudit('Updated', 'Page Access', 'Per-user override: ' + (user ? user.name : ''), 'Overrides cleared — back to role default.');
    userOverrideDraftRows = null;
    refreshUserPageOverridesFromDB();
    applyRoleVisibility();
    render();
  };
}

// ---- AUDIT TRAIL ------------------------------------------------------------
// Read-only — nothing here is ever edited or deleted, same append-only
// discipline as every other log in this file. Shows the most recent 500
// config-change entries (DB.getAuditLog() already caps it there), newest
// first, with a filter panel (Entity Type / Actor / Date range) and the
// same generic Excel/PDF export the Reports page uses.
// Shared by the on-screen table AND the Excel/PDF export, so an export
// taken while filters are active matches exactly what's on screen — unlike
// the Reports page's exports (which have no filters of their own to match).
function filteredAuditLog(){
  const log = (DB.getAuditLog()||[]).slice().reverse(); // newest first
  const f = auditTrailFilters;
  return log.filter(e=>{
    if(f.entityType && e.entityType!==f.entityType) return false;
    if(f.actor && e.actor!==f.actor) return false;
    if(f.dateFrom){ const d=(e.at||'').toString().slice(0,10); if(!d || d<f.dateFrom) return false; }
    if(f.dateTo){ const d=(e.at||'').toString().slice(0,10); if(!d || d>f.dateTo) return false; }
    return true;
  });
}
function auditTrailReportRows(){
  return filteredAuditLog().map(e=>({
    'Date/Time': fmtDate(e.at), Actor: e.actor||'', Role: e.actorRole||'',
    Action: e.action||'', 'Entity Type': e.entityType||'', Entity: e.entityLabel||'', Notes: e.notes||'',
  }));
}
function renderAuditTrailView(){
  const log = (DB.getAuditLog()||[]);
  const entityTypes = [...new Set(log.map(e=>e.entityType).filter(Boolean))].sort();
  const actors = [...new Set(log.map(e=>e.actor).filter(Boolean))].sort();
  const f = auditTrailFilters;
  const filtered = filteredAuditLog();
  const rows = filtered.map(e=>`<tr>
      <td>${fmtDate(e.at)}</td><td>${e.actor||'—'}</td><td>${e.actorRole||'—'}</td>
      <td><span class="badge badge-navy">${e.action||'—'}</span></td><td>${e.entityType||'—'}</td>
      <td>${e.entityLabel||'—'}</td><td>${e.notes||''}</td>
    </tr>`).join('') || `<tr><td colspan="7" class="empty">${log.length ? 'No audit entries match these filters.' : 'No configuration changes recorded yet.'}</td></tr>`;
  return `
    <div class="page-header"><h1>Audit Trail</h1></div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Who changed the SYSTEM — Masters, Manage Users, Workflow Config, Status Config, Page Access, and Lead Field Configuration. Each lead already keeps its own detailed history on its own tabs (Negotiation, Approvals, Payments, etc.) — this page doesn't duplicate that, it's for configuration changes only. Showing the most recent ${log.length} entr${log.length===1?'y':'ies'}.</p>
    <div class="card filter-panel">
      <div class="form-grid">
        <div><label>Entity Type</label><select id="at-type"><option value="">All types</option>${entityTypes.map(t=>`<option value="${t}" ${f.entityType===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Actor</label><select id="at-actor"><option value="">All users</option>${actors.map(a=>`<option value="${a}" ${f.actor===a?'selected':''}>${a}</option>`).join('')}</select></div>
        <div><label>Date From</label><input type="date" id="at-datefrom" value="${f.dateFrom}"></div>
        <div><label>Date To</label><input type="date" id="at-dateto" value="${f.dateTo}"></div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-sm btn-ghost" id="at-clear">Clear Filters</button>
        <button class="btn btn-sm btn-teal" id="at-go">Go</button>
      </div>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;margin-bottom:14px;">
      <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px;">
        <button class="btn btn-sm btn-ghost" id="at-excel">⬇ Export Excel</button>
        <button class="btn btn-sm btn-ghost" id="at-pdf">⬇ Export PDF</button>
      </div>
      <table><tr><th>Date/Time</th><th>Actor</th><th>Role</th><th>Action</th><th>Entity Type</th><th>Entity</th><th>Notes</th></tr>${rows}</table>
    </div>
  `;
}
function wireAuditTrailEvents(){
  const val = id => (document.getElementById(id)?.value || '').trim();
  const goBtn = document.getElementById('at-go');
  if(goBtn) goBtn.onclick = () => {
    auditTrailFilters = { entityType: val('at-type'), actor: val('at-actor'), dateFrom: val('at-datefrom'), dateTo: val('at-dateto') };
    render();
  };
  const clearBtn = document.getElementById('at-clear');

  const xe = document.getElementById('at-excel'); if(xe) xe.onclick = () => exportRowsExcel(auditTrailReportRows(), 'Audit_Trail.xlsx', 'Audit Trail');
  const xp = document.getElementById('at-pdf');   if(xp) xp.onclick = () => exportRowsPDF(auditTrailReportRows(), 'Audit_Trail.pdf', 'Audit Trail');

function openLeadDetail(id){
  const l = DB.getLead(id);
  // Guards every role uniformly against opening a lead outside their branch
  // of the visibility tree (not just Executives) — belt-and-suspenders in
  // case a lead is ever reachable outside an already-filtered list.
  if(currentUser && l && !visibleLeads().some(v=>v.id===id)){
    alert('This lead is outside the leads you can access.'); return;
  }
  leadEditMode = false; // opening a (possibly different) lead always starts in read-only view
  changeStatusMode = false;
  reassignMode = false;
  currentDetailLeadId = id;
  if(currentView !== 'leadDetail') previousView = currentView;
  currentView = 'leadDetail';
  render();
}

function closeLeadDetail(){
  currentDetailLeadId = null;
  leadEditMode = false;
  reassignMode = false;
  currentView = previousView || 'list';
  previousView = null;
  render();
}

// Picker: prefix-map / prefix-lat / prefix-lng / prefix-pin / prefix-locate.
function locationPickerHtml(prefix, pinVal, g){
  return `
    <div class="full" data-field="googlePin">
      <label>Location Pin &amp; Map</label>
      <div class="form-grid" style="margin-bottom:6px;">
        <div><label>Location Pin</label><input type="text" id="${prefix}-pin" value="${(pinVal||'').replace(/"/g,'&quot;')}" placeholder="lat, long or Google Maps link"></div>
        <div><label>Latitude</label><input type="number" step="any" id="${prefix}-lat" value="${g?g.lat:''}"></div>
        <div><label>Longitude</label><input type="number" step="any" id="${prefix}-lng" value="${g?g.lng:''}"></div>
      </div>
      <div id="${prefix}-map" class="map-box"></div>
      <div class="map-actions"><button type="button" class="btn btn-sm btn-ghost" id="${prefix}-locate">📍 Use my current location</button><button type="button" class="btn btn-sm btn-ghost" id="${prefix}-clearpin">Clear pin</button><span>Click anywhere on the map to drop the pin on the exact spot.</span></div>
    </div>`;
}
function mountPickerMap(prefix, g){
  const el = document.getElementById(prefix+'-map');
  if(!el) return;
  const latEl = document.getElementById(prefix+'-lat'), lngEl = document.getElementById(prefix+'-lng'), pinEl = document.getElementById(prefix+'-pin');
  if(typeof L === 'undefined'){ el.innerHTML = '<div class="empty" style="padding:12px;">Map library didn\'t load — type the coordinates instead.</div>'; return; }
  const start = g || DEFAULT_MAP_CENTER;
  const map = L.map(el).setView([start.lat, start.lng], g ? 16 : 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
  let marker = g ? L.marker([g.lat, g.lng]).addTo(map) : null;
  const place = (lat, lng, pan) => {
    lat = Number(lat); lng = Number(lng);
    if(isNaN(lat) || isNaN(lng)) return;
    if(marker) marker.setLatLng([lat,lng]); else marker = L.marker([lat,lng]).addTo(map);
    latEl.value = lat.toFixed(6); lngEl.value = lng.toFixed(6);
    if(pan) map.setView([lat,lng], Math.max(map.getZoom(), 16));
  };
  map.on('click', e => place(e.latlng.lat, e.latlng.lng, false));
  [latEl, lngEl].forEach(inp => inp.addEventListener('change', () => { if(latEl.value && lngEl.value) place(latEl.value, lngEl.value, true); }));
  pinEl.addEventListener('change', () => { const p = parseLatLng(pinEl.value); if(p) place(p.lat, p.lng, true); });
  const loc = document.getElementById(prefix+'-locate');
  if(loc) loc.onclick = () => {
    if(!navigator.geolocation){ alert('This browser can\'t share its location.'); return; }
    navigator.geolocation.getCurrentPosition(pos => place(pos.coords.latitude, pos.coords.longitude, true), err => alert('Could not get your location: ' + err.message), { enableHighAccuracy:true, timeout:15000 });
  };
  const clr = document.getElementById(prefix+'-clearpin');
  if(clr) clr.onclick = () => { if(marker){ map.removeLayer(marker); marker = null; } latEl.value=''; lngEl.value=''; };
  _activeMaps.push(map);
  setTimeout(()=>map.invalidateSize(), 50);
}

  return parseLatLng(document.getElementById(prefix+'-pin')?.value);
}

// Renders either the forward "Move to X" block or the backward "Move back
// to X" block for renderStageTab, honoring a from->to gate if one exists
// for that exact pair (see the Workflow Config module).
// slot identifies WHICH move block this is on the tab — 'fwd' (the built-in
// move into the next pipeline stage), 'back' (the built-in move into the
// previous stage), or 'extra-N' (an extra, non-adjacent destination that
// exists purely because Workflow Config has a row for it). Field ids for
// fwd/back are kept exactly as before (unchanged by this extra-destinations
// feature); extra slots get their own suffixed ids so several can coexist.
// Any Workflow Config row whose From is this lead's current stage and whose
// To ISN'T the built-in next/prev stage is an extra, non-adjacent move (e.g.
// a straight "drop to Closed" from partway through the pipeline). Closed is
// terminal, so it never offers any move — including these extras.
function extraTransitionTargets(l, next, prev){
  if(l.stage==='closed') return [];
  const skip = new Set([l.stage, next && next.key, prev && prev.key].filter(Boolean));
  const tos = [...new Set(WORKFLOW_CONFIG.filter(w=>w.from===l.stage && !skip.has(w.to)).map(w=>w.to))];
  return tos.map(k=>STAGES.find(s=>s.key===k)).filter(Boolean);
}

// ---- Status — IN4Suite-style "Change Status" ------------------------------
// Shows the current status with a "Change Status" link (Sara's reference:
// IN4Suite Land → Status: Signoff  Change Status → [Select One] → Approver
// Remarks → Update Status). The dropdown lists every status this lead can
// move to from here: the next and previous status, any extra destinations
// Workflow Config adds, and "Dropped". A status that needs an approval this
// user can't give is shown but disabled. Every change is recorded in the
// Audit Trail at the bottom of the page with who/when/remarks/documents.
let changeStatusMode = false;
function statusTargets(l){
  if(l.stage==='closed') return [];
  const idx = STAGE_INDEX[l.stage];
  const next = STAGES[idx+1];
  const prev = idx > 0 ? STAGES[idx-1] : null;
  const list = [];
  if(next) list.push({ key: next.key, label: next.key==='closed' ? 'Closed — Acquired' : next.label, dir:'Advanced' });
  if(prev) list.push({ key: prev.key, label: prev.label + ' (move back)', dir:'Moved back a stage' });
  extraTransitionTargets(l, next, prev).forEach(t => list.push({ key: t.key, label: t.key==='closed' ? 'Closed — Acquired' : t.label, dir:'Moved' }));
  list.forEach(t => {
    t.gated = isGatedTransition(l.stage, t.key);
    t.allowed = !t.gated || !currentUser || roleAllowedForGate(currentUser.role, l.stage, t.key);
  });
  list.push({ key:'__drop', label:'Dropped (close this lead)', dir:'Dropped', gated:false, allowed:true });
  return list;
}

            <div><label>Final Price (per ${EXTENT_UNITS[l.priceUnit]?.label||'unit'})${REQ}</label><input type="number" id="cs-final-price" step="0.01" value="${l.priceValue||''}"></div>
            <div><label>Final Date</label><input type="date" id="cs-final-date" value="${todayStr()}"></div>
          </div>

          <div class="form-grid">
            <div><label>Drop Reason${REQ}</label><select id="cs-drop-reason">${dropReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
          </div>

        <div class="full"><label>Approver Remarks<span id="cs-remarks-req" style="display:none;">${REQ}</span></label><textarea id="cs-remarks" rows="3" placeholder="Remarks for this status change (shown in the Audit Trail)"></textarea></div>
        <div class="full"><label>Documents for the new status (optional)</label>

      <div style="margin-top:10px;display:flex;gap:8px;">

  const holdBlock = l.stage==='closed' ? '' : `
    <fieldset>
      <legend>On Hold</legend>
      ${l.onHold && l.onHold.active ? `
        <p style="font-size:13px;">Currently on hold since ${fmtDate(l.onHold.since)} — <b>${l.onHold.reasonCode}</b>${l.onHold.notes?': '+l.onHold.notes:''}</p>
        <button class="btn btn-sm btn-teal" id="resume-btn">Resume (clear hold)</button>
      ` : `
        <div class="form-grid">
          <div><label>Reason</label><select id="hold-reason">${holdReasons.map(r=>`<option>${r.label}</option>`).join('')}</select></div>
          <div><label>Notes</label><input type="text" id="hold-notes"></div>
        </div>
        <button class="btn btn-sm btn-ghost" id="hold-btn" style="margin-top:8px;">Put On Hold</button>
