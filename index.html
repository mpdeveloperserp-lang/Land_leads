  return `${statusRow}${changeForm}${holdBlock}`;
}

// ---- Documents (by status) -------------------------------------------------
// Replaces the old per-process sections. Documents are uploaded against a
// STATUS: either right when the lead is moved into a new status (the move
// form has its own optional upload) or later, here, against the lead's
// current status. Grouped by status so it's clear which papers belong to
// which step (e.g. Patta/EC under Documentation & Legal, Sale Deed under
// Registration). Older documents recorded before this round, which carry no
// status, show under "General".
function docUploadFieldsHtml(prefix){
  const liveUpload = DB.isLive() && DB.hasStorage && DB.hasStorage();
  const categories = DB.getMasters('docCategories');
  return `<div class="form-grid">
      <div><label>Document Name</label><input type="text" id="${prefix}-name" placeholder="e.g. Patta, EC, FMB Sketch"></div>
      <div><label>Category</label><select id="${prefix}-category"><option value="">— optional —</option>${categories.map(c=>`<option value="${c.label}">${c.label}</option>`).join('')}</select></div>
      ${liveUpload
        ? `<div><label>File(s)</label><input type="file" id="${prefix}-file" multiple></div>`
        : `<div><label>Reference / URL</label><input type="text" id="${prefix}-url" placeholder="Link or file reference"></div>`}
    </div>
    <div id="${prefix}-status" style="font-size:11.5px;color:var(--muted);margin-top:4px;"></div>`;
}
// Reads a docUploadFieldsHtml() block and returns the document records to
// append (uploading to Firebase Storage first when live). Returns [] when
// nothing was entered, so it's safe to call on every status move.
async function collectDocUploads(prefix, lead, stageKey){
  const name = (document.getElementById(prefix+'-name')?.value || '').trim();
  const category = document.getElementById(prefix+'-category')?.value || '';
  const fileEl = document.getElementById(prefix+'-file');
  const urlEl = document.getElementById(prefix+'-url');
  const base = { category, stage: stageKey, uploadedBy: currentUser ? currentUser.name : '', addedAt: new Date().toISOString(), verificationStatus:'Pending' };
  const out = [];
  if(fileEl && fileEl.files && fileEl.files.length){
    const statusEl = document.getElementById(prefix+'-status');
    if(statusEl) statusEl.textContent = 'Uploading…';
    for(const file of Array.from(fileEl.files)){
      const path = 'leads/'+lead.id+'/'+stageKey+'/'+Date.now()+'_'+file.name;
      const ref = DB.storageRef(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      out.push(Object.assign({ name: (fileEl.files.length===1 && name) ? name : (name ? name+' — '+file.name : file.name), url, storagePath: path }, base));
    }
  } else if(urlEl && (urlEl.value.trim() || name)){
    out.push(Object.assign({ name: name || urlEl.value.trim(), url: urlEl.value.trim() || '(no reference given)' }, base));
  }
  return out;
}
function renderDocumentsSection(l){
  const docs = l.documents || [];
  const order = STAGES.map(s=>s.key);
  const groups = {};
  docs.forEach((d,i)=>{ const k = d.stage || '_general'; (groups[k] = groups[k] || []).push(Object.assign({ _i:i }, d)); });
  const keys = Object.keys(groups).sort((a,b)=>{
    const ia = a==='_general' ? -1 : (order.indexOf(a)<0 ? 999 : order.indexOf(a));
    const ib = b==='_general' ? -1 : (order.indexOf(b)<0 ? 999 : order.indexOf(b));
    return ia - ib;
  });
  const listHtml = keys.map(k=>`<div class="doc-group">
      <h4>${k==='_general' ? 'General' : stageLabel(k)} <span class="badge badge-muted">${groups[k].length}</span></h4>
      ${groups[k].map(d=>`<div class="doc-row" style="flex-wrap:wrap;gap:4px 12px;">
        <span><b>${d.name}</b> ${d.url && /^https?:/.test(d.url) ? `<a href="${d.url}" target="_blank" rel="noopener">(view)</a>` : (d.url?`<span style="color:var(--muted)">— ${d.url}</span>`:'')}</span>
        <span style="color:var(--muted)">${d.category||''}</span>
        <span style="color:var(--muted)">${fmtDate(d.addedAt)}${d.uploadedBy?(' · '+d.uploadedBy):''}</span>
      </div>`).join('')}
    </div>`).join('') || '<div class="empty">No documents uploaded yet.</div>';
  return `
    ${listHtml}
    <fieldset style="margin-top:10px;"><legend>Upload for current status — ${stageLabel(l.stage)}</legend>
      ${docUploadFieldsHtml('doc')}
      <button class="btn btn-sm btn-teal" id="doc-add" style="margin-top:8px;">Upload Document</button>
    </fieldset>`;
}

// Audit Trail — shown at the END of the Lead Details page (Sara's reference:
// IN4Suite's Audit Trail table — Status / By / Date / Remarks). Every status
// change, hold/resume and reassignment, newest first.
function renderHistoryTab(l){
  const rows = [];
  (l.stageHistory||[]).forEach(h => rows.push({
    at: h.at, status: stageLabel(h.stage) + (h.stage==='closed' && h.note && /Dropped/.test(h.note) ? ' (Dropped)' : (h.stage==='closed' && /Acquired/.test(h.note||'') ? ' (Acquired)' : '')),
    by: h.by || '', remarks: h.remarks || h.note || '', docs: h.docNames || [],
  }));
  (l.holdHistory||[]).forEach(h => rows.push({ at:h.at, status: h.action, by:h.by||'', remarks: [h.reason, h.notes].filter(Boolean).join(' — '), docs:[] }));
  (l.reassignmentHistory||[]).forEach(r => rows.push({
    at: r.reassignedAt, status:'Reassigned', by: r.reassignedBy||'',
    remarks: `${r.fromExecutive||'—'} → ${r.toExecutive||'—'}${r.remarks?' · '+r.remarks:''}`, docs:[],
  }));
  rows.sort((a,b)=> new Date(b.at||0) - new Date(a.at||0));
  const fmtDT = d => { const dt = new Date((d && d.toDate) ? d.toDate() : d); return isNaN(dt) ? '—' : dt.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); };
  const body = rows.map(r=>`<tr><td><b>${r.status}</b></td><td>${r.by||'—'}</td><td style="white-space:nowrap;">${fmtDT(r.at)}</td><td>${r.remarks||'—'}</td><td>${r.docs.length ? r.docs.join(', ') : '—'}</td></tr>`).join('')
    || '<tr><td colspan="5" class="empty">No history recorded.</td></tr>';
  return `<div style="overflow-x:auto;"><table><tr><th>Status</th><th>By</th><th>Date</th><th>Remarks</th><th>Documents</th></tr>${body}</table></div>`;
}

function wireDetailTabEvents(l){
  {
    const btn = document.getElementById('ov-save-call');
    if(btn) btn.onclick = async () => {
      await DB.updateLead(l.id, { nextCallDate: document.getElementById('ov-nextcall').value });
      render();
    };
  }
  {
    const editBtn = document.getElementById('ov-edit-details');
    if(editBtn) editBtn.onclick = () => { leadEditMode = true; render(); };
    const cancelBtn = document.getElementById('ov-cancel-details');
    if(cancelBtn) cancelBtn.onclick = () => { leadEditMode = false; render(); };
    const saveBtn = document.getElementById('ov-save-details');
    if(saveBtn) saveBtn.onclick = async () => {
      const missing = missingModifyMandatory();
      if(missing){ alert(missing + ' is required (fields marked with a red *).'); return; }
      const bp = badPhone([['Contact Number', document.getElementById('ov-e-contact')?.value], ['Landowner Phone', document.getElementById('ov-e-owner-phone')?.value]]);
      if(bp){ phoneAlert(bp); return; }
      const val = id => document.getElementById(id)?.value;
      const numOrNull = id => { const v = parseFloat(val(id)); return isNaN(v) ? null : v; };
      const geo = readPickerGeo('ov-e');
      const patch = Object.assign({
        leadSource: (val('ov-e-source')||'').trim(),
        leadSourceDateTime: val('ov-e-datetime') || l.leadSourceDateTime || '',
        channelPartnerCode: (val('ov-e-cp')||'').trim(),
        village: (val('ov-e-village')||'').trim(),
        siteLocation: (val('ov-e-loc')||'').trim(),
        contactNumber: (val('ov-e-contact')||'').trim(),
        surveyNumber: (val('ov-e-survey')||'').trim(),
        googlePin: (val('ov-e-pin')||'').trim(),
        geo: geo || null,
        landClassification: (val('ov-e-class')||'').trim(),
        extentValue: parseFloat(val('ov-e-extent-val')) || 0,
        extentUnit: val('ov-e-extent-unit') || l.extentUnit,
        priceValue: parseFloat(val('ov-e-price-val')) || 0,
        priceUnit: val('ov-e-price-unit') || l.priceUnit,
        roadWidth: numOrNull('ov-e-road'),
        frontage: numOrNull('ov-e-frontage'),
        landownerName: (val('ov-e-owner-name')||'').trim(),
        landownerPhone: (val('ov-e-owner-phone')||'').trim(),
        firstCallDate: val('ov-e-firstcall') || '',
        siteVisitDate: val('ov-e-sitevisit') || '',
        nextCallDate: val('ov-e-nextcall') || '',
      }, readClassFields('ov-e'), mediatorFromSelect('ov-e-med', l));
      if(patch.landClassification && landClassKind(patch.landClassification)==='jv' && patch.jvLandownerPct!=null && (patch.jvLandownerPct<0 || patch.jvLandownerPct>100)){
        alert('JV Ratio must be between 0 and 100 for the landowner share.'); return;
      }
      const newExec = val('ov-e-exec');
      try{
        await DB.updateLead(l.id, patch);
        if(newExec && newExec !== l.assignedExecutive){
          await DB.reassignLead(l.id, newExec, (val('ov-e-exec-remarks')||'').trim());
        }
      }catch(err){ alert(err.message || 'Could not save.'); return; }
      leadEditMode = false;
      render();
    };
  }
  {
    const open = document.getElementById('cs-open');
    if(open) open.onclick = (e) => { e.preventDefault(); changeStatusMode = true; render(); };
    const cancel = document.getElementById('cs-cancel');
    if(cancel) cancel.onclick = () => { changeStatusMode = false; render(); };
    const sel = document.getElementById('cs-target');
    const syncSel = () => {
      if(!sel) return;
      document.getElementById('cs-closing').style.display = sel.value==='closed' ? '' : 'none';
      document.getElementById('cs-drop').style.display = sel.value==='__drop' ? '' : 'none';
      const t = statusTargets(l).find(x=>x.key===sel.value);
      const rq = document.getElementById('cs-remarks-req'); if(rq) rq.style.display = (t && t.gated) ? '' : 'none';
    };
    if(sel){ sel.addEventListener('change', syncSel); syncSel(); }
    const upd = document.getElementById('cs-update');
    if(upd) upd.onclick = async () => {
      const key = sel.value;
      if(!key){ alert('Select the new status.'); return; }
      const t = statusTargets(l).find(x=>x.key===key);
      if(!t){ alert('That status is not available from here.'); return; }
      if(!t.allowed){ alert('Only ' + gateRoleLabels(l.stage, key) + ' (or Head) can approve this change.'); return; }
      const remarks = document.getElementById('cs-remarks').value.trim();
      if(t.gated && !remarks){ alert('This change needs approval — enter Approver Remarks.'); return; }
      if(key==='__drop' && !remarks && !confirm('Drop this lead without remarks?')) return;
      const stageKey = key==='__drop' ? 'closed' : key;
      upd.disabled = true;
      let newDocs = [];
      try{ newDocs = await collectDocUploads('mv', l, stageKey); }
      catch(err){ upd.disabled = false; alert('Document upload failed: ' + err.message + ' — the status was not changed.'); return; }
      const me = (currentUser && currentUser.name) || '';
      let note;
      const patch = { stage: stageKey };
      if(key==='__drop'){
        const reason = document.getElementById('cs-drop-reason').value;
        Object.assign(patch, { outcome:'dropped', reasonCode: reason, reasonNotes: remarks });
        note = 'Dropped — ' + reason;
      } else if(key==='closed'){
        Object.assign(patch, { outcome:'acquired',
          finalPrice: parseFloat(document.getElementById('cs-final-price').value) || l.priceValue || null,
          finalDate: document.getElementById('cs-final-date').value || todayStr() });
        note = 'Closed as Acquired';
      } else {
        note = t.gated ? ('Approved move to ' + stageLabel(key)) : t.dir;
      }
      if(t.gated) patch.approval = { approver: me, date: todayStr(), remarks };
      if(key==='site_visited' && !l.siteVisitDate) patch.siteVisitDate = todayStr();
      patch.stageHistory = (l.stageHistory||[]).concat([{ stage: stageKey, at: new Date().toISOString(), by: me || l.assignedExecutive, note, remarks, docNames: newDocs.map(d=>d.name) }]);
      if(newDocs.length) patch.documents = (l.documents||[]).concat(newDocs);
      await DB.updateLead(l.id, patch);
      changeStatusMode = false;
      render();
    };
    const holdBtn = document.getElementById('hold-btn');
    if(holdBtn) holdBtn.onclick = async () => {
      const reason = document.getElementById('hold-reason').value, notes = document.getElementById('hold-notes').value.trim();
      await DB.updateLead(l.id, { onHold: { active:true, reasonCode: reason, notes, since:new Date().toISOString() },
        holdHistory: (l.holdHistory||[]).concat([{ action:'Put On Hold', reason, notes, at:new Date().toISOString(), by:(currentUser&&currentUser.name)||'' }]) });
      render();
    };
    const resumeBtn = document.getElementById('resume-btn');
    if(resumeBtn) resumeBtn.onclick = async () => {
      await DB.updateLead(l.id, { onHold: { active:false, reasonCode:'', notes:'', since:'' },
        holdHistory: (l.holdHistory||[]).concat([{ action:'Resumed (hold cleared)', reason:'', notes:'', at:new Date().toISOString(), by:(currentUser&&currentUser.name)||'' }]) });
      render();
    };
  }
  {
    const btn = document.getElementById('doc-add');
    if(btn) btn.onclick = async () => {
      let newDocs = [];
      try{ newDocs = await collectDocUploads('doc', l, l.stage); }
      catch(err){ const st = document.getElementById('doc-status'); if(st) st.textContent = 'Upload failed: ' + err.message; return; }
      if(!newDocs.length){ alert('Choose a file (or enter a name/reference) to upload.'); return; }
      await DB.updateLead(l.id, { documents: (l.documents||[]).concat(newDocs) });
      render();
    };
  }
}

// ---- shared view wiring ---------------------------------------------------
function wireViewEvents(){
  if(currentView==='leadDetail'){ wireLeadDetailViewEvents(); }
  if(currentView==='dashboard'){
    document.querySelectorAll('[data-drill]').forEach(el=>el.addEventListener('click', ()=>{
      const d = el.dataset.drill;
      if(d==='active') goToLeadsList({ excludeClosed:true });
      if(d==='onHold') goToLeadsList({ onHold:true });
      if(d==='calls') goToLeadsList({ excludeClosed:true, callDueOrOverdue:true });
      if(d==='newLeads') goToLeadsList({ stage:'new' });
      if(d==='yetToSiteVisit') goToLeadsList({ stage: el.dataset.stageKey });
    }));
    document.querySelectorAll('[data-stage]').forEach(el=>el.addEventListener('click', ()=>goToProgress(el.dataset.stage)));
    document.querySelectorAll('[data-source]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ source: el.dataset.source })));
    document.querySelectorAll('[data-cp]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ channelPartner: el.dataset.cp })));
    document.querySelectorAll('[data-creator]').forEach(el=>el.addEventListener('click', ()=>goToLeadsList({ createdBy: el.dataset.creator })));
    document.querySelectorAll('[data-open-id]').forEach(el=>el.addEventListener('click', ()=>openLeadDetail(el.dataset.openId)));
  }

  if(currentView==='list'){ wireListEvents(); }
  if(currentView==='newLead'){ wireNewLeadViewEvents(); }
  if(currentView==='reports'){ wireReportsEvents(); }
  if(currentView==='analytics'){ wireAnalyticsEvents(); }
  if(currentView==='configure'){ wireConfigureEvents(); }
  if(currentView==='masters'){ wireMastersEvents(); }
  if(currentView==='channelPartners'){ wireChannelPartnersEvents(); }
  if(currentView==='landowners'){ wireLandownersEvents(); }
  if(currentView==='users'){ wireUsersEvents(); }
  if(currentView==='workflow'){ wireWorkflowEvents(); }
  if(currentView==='statusConfig'){ wireStatusConfigEvents(); }
  if(currentView==='pageAccess'){ wirePageAccessEvents(); }
  if(currentView==='auditTrail'){ wireAuditTrailEvents(); }
}

// ---- Sidebar navigation ---------------------------------------------------
function wireSidebarNav(){
  document.querySelectorAll('#tabs > button[data-view]').forEach(b=>{
    b.onclick = () => {
      if(b.dataset.view==='list'){
        // Always reset to the unfiltered All Leads view.
        goToLeadsList({});
      } else {
        if(b.dataset.view==='workflow'){ workflowDraftRows = null; workflowAddRole = null; workflowAddFrom = null; workflowAddTo = null; } // discard any unsaved draft on fresh entry
        if(b.dataset.view==='statusConfig') statusDraftRows = null;
        if(b.dataset.view==='pageAccess'){ pageAccessDraftRows = null; pageAccessSelectedUserUid = ''; userOverrideDraftRows = null; }
        if(b.dataset.view==='landowners'){ editingLandownerId = null; }
        currentView = b.dataset.view;
        render();
      }
    };
  });
}
wireSidebarNav();

// Restore whichever view is named in the URL hash on load/refresh (deep
// link / reload support), then normalize the history entry so the very
// first back-press doesn't feel like a no-op.
(function initHistory(){
  const initial = (location.hash || '').slice(1);
  if(KNOWN_VIEWS.includes(initial)) currentView = initial;
  history.replaceState({ view: currentView }, '', '#' + currentView);
  window.addEventListener('popstate', (e) => {
    // Lead Details isn't in KNOWN_VIEWS (it's a universal drill-through, not
    // a navigable page — see canAccessView()), so Back/Forward landing on
    // its old hash falls through to Dashboard below, same as any other
    // unrecognized hash already does.
    const v = (e.state && e.state.view) || (location.hash || '').slice(1);
    currentView = KNOWN_VIEWS.includes(v) ? v : 'dashboard';
    suppressHistoryPush = true;
    render();
  });
})();
